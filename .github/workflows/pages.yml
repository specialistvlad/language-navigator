# Publishes the site to GitHub Pages from the latest tag (highest version).
# Pushing a tag deploys it when it is the latest; Run workflow redeploys the latest tag.
name: Publish

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.tag.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the latest tag
        id: tag
        run: |
          latest=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then echo "::error::No tags to publish"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$latest" ]; then
            echo "::notice::$GITHUB_REF_NAME is older than $latest; the site stays on $latest"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --quiet "refs/tags/$latest"
          echo "::notice::Publishing $latest"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.tag.outputs.deploy == 'true'

      - name: Install
        if: steps.tag.outputs.deploy == 'true'
        run: bun install --frozen-lockfile

      - name: Verify code and content
        if: steps.tag.outputs.deploy == 'true'
        run: bun run verify

      - uses: actions/configure-pages@v6
        id: pages
        if: steps.tag.outputs.deploy == 'true'

      - name: Build
        if: steps.tag.outputs.deploy == 'true'
        run: bun run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        if: steps.tag.outputs.deploy == 'true'
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
