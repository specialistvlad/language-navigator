# yaml-language-server: $schema=../../../schema/topic.schema.json
# Copy to languages/{lang}/{NN-section}/{topic}/topic.yaml and replace every {placeholder}.
# Every row, bullet and text block carries its level; sections and the topic take their range from them.
id: "{lang}.{section}.{topic}"
lang: "{en|es}"
kind: grammar
tags: []
concepts: []
related: []
status: { en: draft }

title: { en: "{Title}" }
summary:
  en: "{Lead: the forms and what they do, at most 160 characters.} {The rule to get right, with a **bold** example.}"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form }, merge: true, center: true }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: "{A1}", form: { en: "{form}" }, rule: { en: "{rule}" }, example: "{example with **target** in bold}" }
        - { level: "{A2}", form: { en: "{form}" }, rule: { en: "{rule}" }, example: "{example}" }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - { level: "{A1}", text: { en: "{Rule.}" } }

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: "{A1}", use: { en: "{use}" }, example: "{example}" }
          - { level: "{A2}", use: { en: "{use}" }, example: "{example}" }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: "{A1}", wrong: "{wrong}", right: "{right with **fix** in bold}", rule: { en: "{rule}" } }
