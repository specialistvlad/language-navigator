    en: Giving and asking for advice and opinions.

possibility:
  title: { en: Possibility }
  description:
    en: How sure we are that something is true or will happen.

conditional-mood:
  title: { en: Conditional mood }
  description:
    en: "Imagined situations, polite requests and offers: would."

word-order:
  title: { en: Word order }
  description:
    en: The order of subject, verb, object and other parts of the sentence.

questions-negatives:
  title: { en: Questions and negatives }
  description:
    en: How to make questions and negative sentences.

linkers:
  title: { en: Linkers }
  description:
    en: "Words that join ideas: and, but, because, so, although."

