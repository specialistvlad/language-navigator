# yaml-language-server: $schema=schema/interface.schema.json
# Interface wording every app shares, in each explanation language.
# Placeholders take values from the app: {name}, {n}, {total}; {name:lower} lowercases the value.

text:
  # Home
  homeTitle: { en: "{site} — {languages}, {from} to {to}" }
  homeDescription:
    en: "Reference guides and cheatsheets for learners of {languages} from {from} to {to}, explained {explain}."
  tagline: { en: "{languages}, {from}–{to}, explained {explain}." }
  explainedIn: { en: "in {name}" }
  written: { en: "{n} of {total} topics written" }

  # A track: one language being learned, explained in one language
  track: { en: "Learn {name}" }
  explained: { en: "explained in {name}" }
  index: { en: Index }
  chooseLanguage: { en: Choose language }
  trackIntro:
    en: Topics by category. Choose your level to hide what comes later.
  pathIntro:
    en: Topics in study order, level by level; a topic comes back at each level where it grows. Choose your level to hide what comes later.

  # Controls
  grouping: { en: Grouping }
  byLevel: { en: By level }
  categories: { en: Categories }
  read: { en: Read in }
  level: { en: Level }
  view: { en: View }
  extended: { en: Extended }
  upTo: { en: Up to }

  # A topic
  onThisPage: { en: On this page }
  filterEmpty:
    en: "No information at the current level. This view starts at {level}: choose {level} or a higher level."
  showLevel: { en: "Show {level}" }
  upNext: { en: Up next }
  previous: { en: Previous }
  next: { en: Next }
  startOver: { en: Start over }
  ruleColumn: { en: Rule }

  # Topic content: names the renderer writes from the data (CONVENTIONS.md §12)
  varietyUs: { en: US }
  varietyGb: { en: British }
  slotAux: { en: Helper }
  slotSubj: { en: Subject }
  slotVerb: { en: Verb }
  slotRest: { en: Rest }
  groupQuestion: { en: Question }
  groupStatement: { en: Statement }
  groupNegative: { en: Negative }

  # Cheatsheets
  sheets: { en: Cheatsheets }
  sheet: { en: Cheatsheet }
  sheetsIntro:
    en: A level sheet holds the cheatsheets of that level's topics; a progressive sheet holds every topic up to its level.
  levels: { en: Levels }
  progressive: { en: Progressive }
  sections: { en: Sections }
  topics: { en: Topics }

  # Missing page
  notFound: { en: Page not found }
  backHome: { en: Go to the home page }

  # Credits: one page, linked from every page's top bar
  credits: { en: Credits }
  creditsDescription: { en: "Who writes {site}, the licences of its content and code, and how to credit it." }
  creditsAuthors: { en: "The content of {site} is written by {credit}." }
  licences: { en: Licences }
  contentLicence: { en: "The content (topics, cheatsheets, curriculum and wording)" }
  codeLicence: { en: The code }
  howToCredit: { en: How to credit }
  creditIntro: { en: "Anyone may copy, adapt and sell the content, in print, on the web and in apps, with this credit:" }
  creditChanges: { en: "A changed version names its changes, for example “adapted from {site}”." }
  contribute: { en: Contribute }
  sourceLink: { en: The content and code on GitHub }
  reportMistake: { en: Report a mistake }
  contributing: { en: How to contribute }
  nameNote: { en: "The name {site} and its logo stay with the project, outside both licences." }
