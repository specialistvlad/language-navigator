# yaml-language-server: $schema=schema/interface.schema.json
# Interface wording every app shares, in each explanation language.
# Placeholders take values from the app: {name}, {n}, {total}; {name:lower} lowercases the value.

text:
  # Home
  homeTitle: { en: "{site} — {languages}, {from} to {to}", es: "{site} — {languages}, de {from} a {to}" }
  homeDescription:
    en: "Reference guides and cheatsheets for learners of {languages} from {from} to {to}, explained {explain}."
    es: "Guías de referencia y chuletas para estudiantes de {languages} de {from} a {to}, explicadas {explain}."
  tagline: { en: "{languages}, {from}–{to}, explained {explain}.", es: "{languages}, {from}–{to}, explicado {explain}." }
  explainedIn: { en: "in {name}", es: "en {name:lower}" }
  written: { en: "{n} of {total} topics written", es: "{n} de {total} temas escritos" }

  # A track: one language being learned, explained in one language
  track: { en: "Learn {name}", es: "Aprende {name:lower}" }
  explained: { en: "explained in {name}", es: "explicado en {name:lower}" }
  index: { en: Index, es: Índice }
  chooseLanguage: { en: Choose language, es: Elegir idioma }
  trackIntro:
    en: Topics in study order. Choose your level to hide what comes later.
    es: Temas en orden de estudio. Elige tu nivel para ocultar lo que viene después.

  # Controls
  read: { en: Read in, es: Leer en }
  level: { en: Level, es: Nivel }
  view: { en: View, es: Vista }
  full: { en: Full, es: Completo }
  keyPoints: { en: Key points, es: Puntos clave }
  upTo: { en: Up to, es: Hasta }

  # A topic
  onThisPage: { en: On this page, es: En esta página }
  upNext: { en: Up next, es: A continuación }
  essentials: { en: Essentials, es: Lo esencial }
  reminder: { en: Reminder, es: Recordatorio }
  levelColumn: { en: Level, es: Nivel }
  ruleColumn: { en: Rule, es: Regla }

  # Cheatsheets
  sheets: { en: Cheatsheets, es: Chuletas }
  sheet: { en: Cheatsheet, es: Chuleta }
  sheetsIntro:
    en: Level sheets hold one level; progressive sheets add the reminders of every level below.
    es: Las chuletas por nivel recogen un nivel; las progresivas añaden los recordatorios de los niveles anteriores.
  levels: { en: Levels, es: Niveles }
  progressive: { en: Progressive, es: Progresivas }
  sections: { en: Sections, es: Secciones }
  topics: { en: Topics, es: Temas }

  # Missing page
  notFound: { en: Page not found, es: Página no encontrada }
  backHome: { en: Go to the home page, es: Ir a la página principal }

# The line above a Typical errors table, by explanation language, then by language being learned:
# who makes these errors.
errorsAudience:
  en: { es: "Errors common among English speakers:" }
  es: { en: "Errores frecuentes de hispanohablantes:" }
