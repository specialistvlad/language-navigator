# yaml-language-server: $schema=schema/levels.schema.json
# The level scale, lowest first. Every app names, describes and colours levels from this file.
# A level's colour is its hue on the OKLCH colour wheel: the levels run through the rainbow, red to
# violet. The tones (lightness and saturation) belong to the theme (apps/web/level-colours.ts), so a
# level keeps its hue in the light and the dark theme.

levels:
  - code: A0
    name: { en: Starter }
    description:
      en: recognise letters, numbers and a few fixed phrases
    hue: 25 # red
  - code: A1
    name: { en: Beginner }
    description:
      en: introduce themselves, ask and answer simple everyday questions
    hue: 60 # orange
  - code: A2
    name: { en: Elementary }
    description:
      en: describe routines, past events and immediate needs
    hue: 88 # yellow
  - code: B1
    name: { en: Intermediate }
    description:
      en: handle travel situations, describe experiences, give reasons and opinions
    hue: 150 # green
  - code: B2
    name: { en: Upper intermediate }
    description:
      en: follow complex texts, talk fluently with native speakers and argue a point of view
    hue: 235 # blue
  - code: C1
    name: { en: Advanced }
    description:
      en: understand long, demanding texts and use the language flexibly at work and in study
    hue: 275 # indigo
  - code: C2
    name: { en: Proficiency }
    description:
      en: understand virtually everything and express fine shades of meaning
    hue: 315 # violet
