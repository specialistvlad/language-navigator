# yaml-language-server: $schema=schema/levels.schema.json
# The level scale, lowest first. Every app names, describes and colours levels from this file.
# A level's colour is its hue on the OKLCH colour wheel: the levels run through the rainbow, red to
# violet. The tone (lightness and chroma) belongs to the theme (apps/web/styles/base.css), so a level
# keeps its hue in the light and the dark theme.

levels:
  - code: A0
    name: { en: Starter, es: Inicial }
    description:
      en: recognise letters, numbers and a few fixed phrases
      es: reconoce letras, números y unas pocas frases hechas
    hue: 25 # red
  - code: A1
    name: { en: Beginner, es: Principiante }
    description:
      en: introduce themselves, ask and answer simple everyday questions
      es: se presenta y hace y responde preguntas sencillas del día a día
    hue: 60 # orange
  - code: A2
    name: { en: Elementary, es: Elemental }
    description:
      en: describe routines, past events and immediate needs
      es: describe rutinas, hechos pasados y necesidades inmediatas
    hue: 95 # yellow
  - code: B1
    name: { en: Intermediate, es: Intermedio }
    description:
      en: handle travel situations, describe experiences, give reasons and opinions
      es: se desenvuelve en viajes, describe experiencias y da razones y opiniones
    hue: 150 # green
  - code: B2
    name: { en: Upper intermediate, es: Intermedio alto }
    description:
      en: follow complex texts, talk fluently with native speakers and argue a point of view
      es: sigue textos complejos, habla con fluidez con nativos y defiende un punto de vista
    hue: 235 # blue
  - code: C1
    name: { en: Advanced, es: Avanzado }
    description:
      en: understand long, demanding texts and use the language flexibly at work and in study
      es: entiende textos largos y exigentes y usa el idioma con flexibilidad en el trabajo y los estudios
    hue: 275 # indigo
  - code: C2
    name: { en: Proficiency, es: Maestría }
    description:
      en: understand virtually everything and express fine shades of meaning
      es: entiende prácticamente todo y expresa matices sutiles de significado
    hue: 315 # violet
