# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.adjectives-adverbs.adverbs-frequency-manner
lang: en
kind: grammar
tags: [adverbs, frequency, manner]
concepts: [adverbs]
related: [en.tenses.simple-tenses, en.adjectives-adverbs.adjective-order, en.verbs.to-be, en.sentence-building.word-order]
status: { en: draft }

title: { en: Adverbs of frequency and manner }
summary:
  lead: { en: "Frequency adverbs say how often things happen (always, never); manner adverbs say how they happen (slowly, well)." }
  rule: { en: "Frequency adverbs go before the main verb but after be:" }
  ex: { examples: [["I ", { target: always }, " go."], ["I am ", { target: always }, " tired."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: type, label: { en: Type } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A1, type: { en: "frequency: how often" }, ex: ["I ", { target: always }, " walk to work."] }
        - { level: A2, type: { en: "manner: how" }, ex: ["She drives ", { target: carefully }, "."] }

sections:
  - title: { en: "Form: frequency adverbs" }
    role: form
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb } }
          - { key: often, label: { en: How often } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, adverb: always, often: "100%", ex: ["I ", { target: always }, " walk to work."] }
          - { level: A1, adverb: usually, often: ≈ 90%, ex: ["She ", { target: usually }, " has toast."] }
          - { level: A1, adverb: often, often: ≈ 70%, ex: ["We ", { target: often }, " eat out."] }
          - { level: A1, adverb: sometimes, often: ≈ 50%, ex: ["They ", { target: sometimes }, " call me."] }
          - { level: A1, adverb: rarely, often: ≈ 10%, ex: ["He ", { target: rarely }, " drives."] }
          - { level: A1, adverb: never, often: "0%", ex: ["I ", { target: never }, " drink coffee."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: hardly ever }, " (≈ 5%) is close to never:"]
            ex: ["We ", { target: hardly ever }, " go out."]

  - title: { en: "Form: position of frequency adverbs" }
    role: form
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, position: { en: before the main verb }, ex: ["I ", { target: often }, " walk."] }
          - { level: A1, position: { en: after be }, ex: ["She is ", { target: always }, " late."] }
          - { level: A2, position: { en: between auxiliary and main verb }, ex: ["I can ", { target: never }, " find my keys."] }
          - { level: A2, position: { en: { alternatives: [after don't, doesn't] } }, ex: ["He doesn't ", { target: always }, " call."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: sometimes }, " also goes at the start:"]
            ex: [{ target: Sometimes }, " I work from home."]

  - title: { en: "Form: how often?" }
    role: form
    content:
      - type: usage
        columns:
          - { key: question, label: { en: Question } }
          - { key: answer, label: { en: Answer } }
        rows:
          - { level: A1, question: How often do you swim?, answer: ["I swim ", { target: every day }, "."] }
          - { level: A1, question: How often does she cook?, answer: ["She cooks ", { target: once a week }, "."] }
          - { level: A1, question: How often do they visit you?, answer: ["They visit ", { target: twice a month }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Frequency expressions go at the end: every day, once a week, three times a year."

  - title: { en: "Form: manner adverbs" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: adjective, label: { en: Adjective } }
          - { key: adverb, label: { en: Adverb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, adjective: slow, adverb: slowly, ex: ["He walks ", { target: slowly }, "."] }
          - { level: A2, adjective: careful, adverb: carefully, ex: ["Drive ", { target: carefully }, "."] }
          - { level: A2, adjective: quiet, adverb: quietly, ex: ["They talk ", { target: quietly }, "."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A manner adverb says how someone does something. Most are ", { pattern: [{ slot: adjective }, { term: "-ly" }] }, "."]

  - title: { en: "Spelling: -ly" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: ending, label: { en: Ending } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A2, ending: { en: { pattern: [{ slot: consonant }, "y"] } }, rule: { mapping: ["y", ily] }, ex: { examples: [{ mapping: [happy, happily] }, { mapping: [easy, easily] }] } }
          - { level: A2, ending: "-le", rule: { mapping: ["-le", ly] }, ex: { examples: [{ mapping: [simple, simply] }, { mapping: [terrible, terribly] }] } }
          - { level: A2, ending: "-ic", rule: { pattern: [{ ending: ally }], follows: true }, ex: { mapping: [basic, basically] } }
          - { level: A2, ending: "-ue", rule: { mapping: ["-ue", uly] }, ex: { mapping: ["true", truly] } }

  - title: { en: "Form: irregular manner adverbs" }
    role: form
    content:
      - type: comparison
        columns:
          - { key: adjective, label: { en: Adjective } }
          - { key: adverb, label: { en: Adverb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, adjective: good, adverb: well, ex: ["She sings ", { target: well }, "."] }
          - { level: A2, adjective: fast, adverb: fast, ex: ["He runs ", { target: fast }, "."] }
          - { level: A2, adjective: hard, adverb: hard, ex: ["They work ", { target: hard }, "."] }
          - { level: A2, adjective: late, adverb: late, ex: ["I arrived ", { target: late }, "."] }
          - { level: A2, adjective: early, adverb: early, ex: ["We got up ", { target: early }, "."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: hardly }, " means almost not, and ", { term: lately }, " means recently:"]
            ex: ["She ", { target: hardly }, " speaks."]

  - title: { en: "Form: position of manner adverbs" }
    role: form
    content:
      - type: usage
        columns:
          - { key: position, label: { en: Position } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, position: { en: after the verb }, ex: ["She sings ", { target: beautifully }, "."] }
          - { level: A2, position: { en: after the object }, ex: ["He opened the door ", { target: slowly }, "."] }

  - title: { en: "Compare: good and well" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: good, label: { en: good (adjective) } }
          - { key: well, label: { en: well (adverb) } }
        rows:
          - { level: A2, good: { en: describes a noun }, well: { en: describes a verb } }
          - { level: A2, good: ["She is a ", { target: good }, " singer."], well: ["She sings ", { target: well }, "."] }
          - { level: A2, good: ["The food is ", { target: good }, "."], well: ["He speaks English ", { target: well }, "."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: She sings good., right: ["She sings ", { target: well }, "."], rule: { en: [{ pattern: [good, { slot: noun }] }, ", ", { pattern: [well, { slot: verb }] }] } }
          - { level: A2, wrong: He walks careful., right: ["He walks ", { target: carefully }, "."], rule: { en: { pattern: [manner adverb = adjective, "-ly"] } } }
          - { level: A2, wrong: They work hardly., right: ["They work ", { target: hard }, "."], rule: { en: hard = hard; hardly = almost not } }
