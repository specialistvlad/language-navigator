# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.adjectives-adverbs.adverbs-frequency-manner
lang: en
kind: grammar
tags: [adverbs, frequency, manner]
concepts: [adverbs]
related: [en.tenses.simple-tenses, en.adjectives-adverbs.adjective-order, en.verbs.to-be, en.sentence-building.word-order]
status: { en: draft }

title: { en: "Adverbs of frequency and manner" }
summary:
  en: "Frequency adverbs say how often things happen (always, never); manner adverbs say how they happen (slowly, well). Frequency adverbs go before the main verb but after be: I **always** go. I am **always** tired."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: type, label: { en: Type } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A1, type: { en: "frequency: how often" }, example: "I **always** walk to work." }
        - { level: A2, type: { en: "manner: how" }, example: "She drives **carefully**." }

sections:
  - title: { en: "Form: frequency adverbs" }
    content:
      - type: table
        columns:
          - { key: adverb, label: { en: Adverb } }
          - { key: often, label: { en: How often } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, adverb: always, often: 100%, example: "I **always** walk to work." }
          - { level: A1, adverb: usually, often: ≈ 90%, example: "She **usually** has toast." }
          - { level: A1, adverb: often, often: ≈ 70%, example: "We **often** eat out." }
          - { level: A1, adverb: sometimes, often: ≈ 50%, example: "They **sometimes** call me." }
          - { level: A1, adverb: rarely, often: ≈ 10%, example: "He **rarely** drives." }
          - { level: A1, adverb: never, often: 0%, example: "I **never** drink coffee." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**hardly ever** (≈ 5%) is close to never:"
            ex: "We **hardly ever** go out."

  - title: { en: "Form: position of frequency adverbs" }
    content:
      - type: table
        columns:
          - { key: position, label: { en: Position } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, position: { en: "before the main verb" }, example: "I **often** walk." }
          - { level: A1, position: { en: "after be" }, example: "She is **always** late." }
          - { level: A2, position: { en: "between auxiliary and main verb" }, example: "I can **never** find my keys." }
          - { level: A2, position: { en: "after don't / doesn't" }, example: "He doesn't **always** call." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**sometimes** also goes at the start:"
            ex: "**Sometimes** I work from home."

  - title: { en: "Form: how often?" }
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question } }
          - { key: answer, label: { en: Answer } }
        rows:
          - { level: A1, question: "How often do you swim?", answer: "I swim **every day**." }
          - { level: A1, question: "How often does she cook?", answer: "She cooks **once a week**." }
          - { level: A1, question: "How often do they visit you?", answer: "They visit **twice a month**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Frequency expressions go at the end: every day, once a week, three times a year."

  - title: { en: "Form: manner adverbs" }
    content:
      - type: table
        columns:
          - { key: adjective, label: { en: Adjective } }
          - { key: adverb, label: { en: Adverb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, adjective: slow, adverb: slowly, example: "He walks **slowly**." }
          - { level: A2, adjective: careful, adverb: carefully, example: "Drive **carefully**." }
          - { level: A2, adjective: quiet, adverb: quietly, example: "They talk **quietly**." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "A manner adverb says how someone does something. Most are adjective + **-ly**."

  - title: { en: "Spelling: -ly" }
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Ending } }
          - { key: rule, label: { en: Rule } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A2, ending: { en: consonant + y }, rule: "y → ily", examples: "happy → happily / easy → easily" }
          - { level: A2, ending: "-le", rule: "-le → ly", examples: "simple → simply / terrible → terribly" }
          - { level: A2, ending: "-ic", rule: "+ ally", examples: "basic → basically" }
          - { level: A2, ending: "-ue", rule: "-ue → uly", examples: "true → truly" }

  - title: { en: "Form: irregular manner adverbs" }
    content:
      - type: table
        columns:
          - { key: adjective, label: { en: Adjective } }
          - { key: adverb, label: { en: Adverb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, adjective: good, adverb: well, example: "She sings **well**." }
          - { level: A2, adjective: fast, adverb: fast, example: "He runs **fast**." }
          - { level: A2, adjective: hard, adverb: hard, example: "They work **hard**." }
          - { level: A2, adjective: late, adverb: late, example: "I arrived **late**." }
          - { level: A2, adjective: early, adverb: early, example: "We got up **early**." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**hardly** means almost not, and **lately** means recently: She **hardly** speaks."

  - title: { en: "Form: position of manner adverbs" }
    content:
      - type: table
        columns:
          - { key: position, label: { en: Position } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, position: { en: "after the verb" }, example: "She sings **beautifully**." }
          - { level: A2, position: { en: "after the object" }, example: "He opened the door **slowly**." }

  - title: { en: "Compare: good and well" }
    content:
      - type: table
        columns:
          - { key: good, label: { en: "good (adjective)" } }
          - { key: well, label: { en: "well (adverb)" } }
        rows:
          - { level: A2, good: { en: "describes a noun" }, well: { en: "describes a verb" } }
          - { level: A2, good: { ex: "She is a **good** singer." }, well: { ex: "She sings **well**." } }
          - { level: A2, good: { ex: "The food is **good**." }, well: { ex: "He speaks English **well**." } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: She sings good., right: "She sings **well**.", rule: { en: "good + noun, well + verb" } }
          - { level: A2, wrong: He walks careful., right: "He walks **carefully**.", rule: { en: "manner adverb = adjective + -ly" } }
          - { level: A2, wrong: They work hardly., right: "They work **hard**.", rule: { en: "hard = hard; hardly = almost not" } }
