# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.adjectives-adverbs.too-enough-so-such
lang: en
kind: grammar
tags: [adjectives, adverbs, degree]
concepts: [degree]
related: [en.adjectives-adverbs.comparatives-superlatives, en.adjectives-adverbs.adjective-order, en.nouns-determiners.quantifiers-some-any-much-many]
status: { en: draft }

title: { en: "Too, Enough, So and Such" }
summary:
  lead: { en: "Too, enough, so and such say how much of a quality: too hot, hot enough, so hot, such a hot day." }
  rule: { en: "Enough follows the adjective, so goes with an adjective and such with a noun:" }
  ex: ["big ", { target: enough }, ", ", { target: so }, " nice, ", { target: such a }, " nice day."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: word, label: { en: Word } }
        - { key: pattern, label: { en: Pattern } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: B1, word: too, pattern: [{ pattern: [too, { alternatives: [adjective, adverb] }] }, " ", { optional: { pattern: [to, { slot: V }], follows: true } }], ex: ["It's ", { target: too }, " hot to walk."] }
        - { level: B1, word: enough, pattern: { alternatives: [{ pattern: [{ slot: adjective }, enough] }, { pattern: [enough, { slot: noun }] }] }, ex: { examples: [["It's warm ", { target: enough }, "."], ["We have ", { target: enough }, " time."]] } }
        - { level: B1, word: so, pattern: [{ pattern: [so, { alternatives: [adjective, adverb] }] }, " ", { optional: { pattern: [that], follows: true } }], ex: ["It's ", { target: so }, " hot that I can't sleep."] }
        - { level: B1, word: such, pattern: [{ pattern: [["such ", { optional: a }], { slot: adjective }, { slot: noun }] }, " ", { optional: { pattern: [that], follows: true } }], ex: ["It's ", { target: such }, " a hot day."] }

sections:
  - title: { en: "Form: too and enough" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, pattern: { pattern: [too, { alternatives: [adjective, adverb] }] }, ex: ["This coffee is ", { target: too }, " hot."] }
          - { level: B1, pattern: { pattern: [too, { slot: adjective }, { optional: for person }, to, { slot: V }] }, ex: ["The box is ", { target: too }, " heavy ", { target: for me to }, " lift."] }
          - { level: B1, pattern: { pattern: [{ alternatives: [too much, too many] }, { slot: noun }] }, ex: ["There are ", { target: too many }, " people."] }
          - { level: B1, pattern: { pattern: [{ alternatives: [adjective, adverb] }, enough] }, ex: ["She is old ", { target: enough }, " to drive."] }
          - { level: B1, pattern: { pattern: [enough, { slot: noun }] }, ex: ["We have ", { target: enough }, " chairs."] }
          - { level: B1, pattern: { pattern: [not, { slot: adjective }, enough] }, ex: ["The room isn't big ", { target: enough }, "."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: too }, " means more than is good. It has a negative result."]
          - type: rule
            level: B1
            text:
              en: [{ term: enough }, " follows an adjective or adverb and comes before a noun."]

  - title: { en: "Form: so and such" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, pattern: { pattern: [so, { slot: adjective }] }, ex: ["The film is ", { target: so }, " good."] }
          - { level: B1, pattern: { pattern: [so, { slot: adverb }] }, ex: ["He speaks ", { target: so }, " quickly."] }
          - { level: B1, pattern: { pattern: [{ alternatives: [so many, so much] }, { slot: noun }] }, ex: ["I have ", { target: so many }, " friends."] }
          - { level: B1, pattern: { pattern: [{ alternatives: [such a, an] }, { slot: adjective }, { slot: singular noun }] }, ex: ["It's ", { target: such a }, " good film."] }
          - { level: B1, pattern: { pattern: [such, { slot: adjective }, [{ alternatives: [plural, uncountable] }, "  noun"]] }, ex: ["They are ", { target: such }, " nice people."] }
          - { level: B1, pattern: { pattern: [{ alternatives: [so, ["such ", { gap: true }, " that"]] }, { slot: result }] }, ex: ["I was ", { target: so }, " tired ", { target: that }, " I fell asleep."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: such }, " goes with a noun: such a day. ", { term: so }, " goes with an adjective or adverb: so hot."]
          - type: rule
            level: B1
            text:
              en: [{ alternatives: [{ term: a }, { term: an }] }, " comes after such: such ", { term: a }, " big house."]

  - title: { en: "Compare: very and too" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: very, label: very }
          - { key: too, label: too }
        rows:
          - { level: B1, very: { en: "a high degree, no problem" }, too: { en: "more than is good, a problem" } }
          - { level: B1, very: ["It's ", { target: very }, " hot, but I like it."], too: ["It's ", { target: too }, " hot. I can't sit outside."] }
          - { level: B1, very: ["The bag is ", { target: very }, " heavy, but I can lift it."], too: ["The bag is ", { target: too }, " heavy to lift."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: The room is not enough big., right: ["The room is ", { target: not big enough }, "."], rule: { en: { pattern: [not, { slot: adjective }, enough] } } }
          - { level: B1, wrong: I have so much friends., right: ["I have ", { target: so many }, " friends."], rule: { en: { pattern: [many, { slot: plural noun }] } } }
