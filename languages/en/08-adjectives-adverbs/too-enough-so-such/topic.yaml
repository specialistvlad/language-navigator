# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.adjectives-adverbs.too-enough-so-such
lang: en
kind: grammar
tags: [adjectives, adverbs, degree]
concepts: [degree]
related: [en.adjectives-adverbs.comparatives-superlatives, en.adjectives-adverbs.adjective-order, en.nouns-determiners.quantifiers-some-any-much-many]
status: { en: draft }

title: { en: "Too, Enough, So and Such" }
summary:
  en: "Too, enough, so and such say how much of a quality: too hot, hot enough, so hot, such a hot day. Enough follows the adjective, so goes with an adjective and such with a noun: big **enough**, **so** nice, **such a** nice day."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: word, label: { en: Word } }
        - { key: pattern, label: { en: Pattern } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: B1, word: too, pattern: "too + adjective / adverb (+ to + V)", example: "It's **too** hot to walk." }
        - { level: B1, word: enough, pattern: "adjective + enough / enough + noun", example: "It's warm **enough**. / We have **enough** time." }
        - { level: B1, word: so, pattern: "so + adjective / adverb (+ that)", example: "It's **so** hot that I can't sleep." }
        - { level: B1, word: such, pattern: "such (a) + adjective + noun (+ that)", example: "It's **such** a hot day." }

sections:
  - title: { en: "Form: too and enough" }
    content:
      - type: table
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, pattern: "too + adjective / adverb", example: "This coffee is **too** hot." }
          - { level: B1, pattern: "too + adjective + (for person) + to + V", example: "The box is **too** heavy **for me to** lift." }
          - { level: B1, pattern: "too much / too many + noun", example: "There are **too many** people." }
          - { level: B1, pattern: "adjective / adverb + enough", example: "She is old **enough** to drive." }
          - { level: B1, pattern: "enough + noun", example: "We have **enough** chairs." }
          - { level: B1, pattern: "not + adjective + enough", example: "The room isn't big **enough**." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**too** means more than is good. It has a negative result."
          - level: B1
            text:
              en: "**enough** follows an adjective or adverb and comes before a noun."

  - title: { en: "Form: so and such" }
    content:
      - type: table
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, pattern: "so + adjective", example: "The film is **so** good." }
          - { level: B1, pattern: "so + adverb", example: "He speaks **so** quickly." }
          - { level: B1, pattern: "so many / so much + noun", example: "I have **so many** friends." }
          - { level: B1, pattern: "such a / an + adjective + singular noun", example: "It's **such a** good film." }
          - { level: B1, pattern: "such + adjective + plural / uncountable noun", example: "They are **such** nice people." }
          - { level: B1, pattern: "so / such … that + result", example: "I was **so** tired **that** I fell asleep." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**such** goes with a noun: such a day. **so** goes with an adjective or adverb: so hot."
          - level: B1
            text:
              en: "**a / an** comes after such: such **a** big house."

  - title: { en: "Compare: very and too" }
    content:
      - type: table
        columns:
          - { key: very, label: very }
          - { key: too, label: too }
        rows:
          - { level: B1, very: { en: "a high degree, no problem" }, too: { en: "more than is good, a problem" } }
          - { level: B1, very: { ex: "It's **very** hot, but I like it." }, too: { ex: "It's **too** hot. I can't sit outside." } }
          - { level: B1, very: { ex: "The bag is **very** heavy, but I can lift it." }, too: { ex: "The bag is **too** heavy to lift." } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: B1, wrong: The room is not enough big., right: "The room is **not big enough**.", rule: { en: "not + adjective + enough" } }
          - { level: B1, wrong: I have so much friends., right: "I have **so many** friends.", rule: { en: "many + plural noun" } }
