# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.there-is-are
lang: en
kind: grammar
tags: [verbs, there-is, existence]
concepts: [existence]
related: [en.verbs.to-be, en.nouns-determiners.countable-uncountable, en.nouns-determiners.quantifiers-some-any-much-many, en.prepositions.place-movement, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: There Is and There Are }
summary:
  en: "There is and there are say that something exists or is in a place, with a / some / any / numbers. There is goes with singular and uncountable nouns, there are with plural nouns: **There is** a park. **There are** two beds."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: singular, label: { en: Singular } }
        - { key: plural, label: { en: Plural } }
      rows:
        - { level: A1, form: { en: Affirmative }, singular: "There **is** a park.", plural: "There **are** two parks." }
        - { level: A1, form: { en: Negative }, singular: "There **isn't** a park.", plural: "There **aren't** any parks." }
        - { level: A1, form: { en: Question }, singular: "**Is there** a park?", plural: "**Are there** any parks?" }
        - { level: A1, form: { en: Short answer }, singular: "Yes, there **is**. / No, there **isn't**.", plural: "Yes, there **are**. / No, there **aren't**." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "**there** is the subject. The verb **be** agrees with the noun that follows."

  - title: { en: "Form: affirmative" }
    content:
      - type: table
        columns:
          - { key: noun, label: { en: Noun } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, noun: { en: singular countable }, form: there is / there's + a / an, example: "There'**s** a cat in the garden." }
          - { level: A1, noun: { en: plural }, form: there are + some / number, example: "There **are** three chairs." }
          - { level: A1, noun: { en: uncountable }, form: there is + some, example: "There **is** some milk." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Speech and messages use the short form **there's**. **there are** has no short form."
          - level: A1
            text:
              en: "A list takes the verb of the first noun: There **is** a bed and two chairs."

  - title: { en: "Form: negative" }
    content:
      - type: table
        columns:
          - { key: noun, label: { en: Noun } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, noun: { en: singular countable }, form: there isn't + a / an, example: "There **isn't** a bank here." }
          - { level: A1, noun: { en: plural }, form: there aren't + any, example: "There **aren't any** shops." }
          - { level: A1, noun: { en: uncountable }, form: there isn't + any, example: "There **isn't any** water." }

  - title: { en: "Form: questions" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, form: "Is there + a / any", example: "**Is there** a bank near here?" }
          - { level: A1, form: "Are there + any", example: "**Are there any** shops?" }
          - { level: A1, form: "How many … are there?", example: "How many people **are there**?" }
          - { level: A1, form: "How much … is there?", example: "How much milk **is there**?" }
          - { level: A1, form: "What is there …?", example: "What'**s there** in the fridge?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A question puts **be** before **there**: There is → **Is there**…?"
          - level: A1
            text:
              en: "**How many** goes with plural nouns, **how much** with uncountable nouns."
          - level: A1
            text:
              en: "A how many / how much question ends with **there**: How many people are **there**?"

  - title: { en: "Form: short answers" }
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question } }
          - { key: "yes", label: { en: "Yes" } }
          - { key: "no", label: { en: "No" } }
        rows:
          - { level: A1, question: Is there a bank here?, "yes": "Yes, there **is**.", "no": "No, there **isn't**." }
          - { level: A1, question: Are there any shops?, "yes": "Yes, there **are**.", "no": "No, there **aren't**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A positive short answer has the full form: Yes, there **is**."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "Say that something exists" }, example: "There **is** a cinema in my town." }
          - { level: A1, use: { en: "Say what is in a place" }, example: "There **are** two beds in the room." }
          - { level: A1, use: { en: "Describe a room or a town" }, example: "There **is** a big park near the station." }
          - { level: A1, use: { en: "Ask about places and things" }, example: "**Is there** a toilet here?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A place phrase follows, or opens, the sentence: There is a cat **on the sofa**."
          - level: A1
            text:
              en: "For place words see [Place and Movement](id:en.prepositions.place-movement)."

  - title: { en: "With a, some, any and numbers" }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Word } }
          - { key: rule, label: { en: Rule } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, word: a / an, rule: { en: "singular countable, + and ?" }, example: "There'**s a** bus stop." }
          - { level: A1, word: some, rule: { en: "plural or uncountable, +" }, example: "There are **some** apples." }
          - { level: A1, word: any, rule: { en: "plural or uncountable, − and ?" }, example: "Are there **any** apples?" }
          - { level: A1, word: { en: number }, rule: { en: "plural, + − ?" }, example: "There are **four** apples." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "See [Quantifiers: some, any, much, many](id:en.nouns-determiners.quantifiers-some-any-much-many) and [Countable and Uncountable Nouns](id:en.nouns-determiners.countable-uncountable)."

  - title: { en: "Compare: there is and it is" }
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point } }
          - { key: there, label: there is / are }
          - { key: it, label: it is }
        rows:
          - { level: A1, point: { en: Job }, there: { en: "introduces something new" }, it: { en: "talks about something known" } }
          - { level: A1, point: { en: Example }, there: { ex: "**There is** a dog in the garden." }, it: { ex: "**It is** a big dog." } }
          - { level: A1, point: { en: Question }, there: { ex: "**Is there** a shop near here?" }, it: { ex: "**Is it** open?" } }
      - type: bullets
        items:
          - level: A1
            text:
              en: "See [To be](id:en.verbs.to-be)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: There is two cats., right: "There **are** two cats.", rule: { en: "plural noun → there are" } }
          - { level: A1, wrong: There are a cat., right: "There **is** a cat.", rule: { en: "singular noun → there is" } }
          - { level: A1, wrong: There isn't some milk., right: "There isn't **any** milk.", rule: { en: "negatives take any" } }
