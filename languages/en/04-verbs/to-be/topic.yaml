sections:
  - title: { en: Overview }
    content:
      - type: text
        level: A0
        text:
          en: "**be** has its own form in each tense: **will be** for the future, **am / is / are** for the present, **was / were** for the past."
      - type: bullets
        items:
          - level: A0
            text:
              en: "be needs no helper: in questions it goes before the subject, in negatives it takes **not**."
          - level: A0
            text:
              en: "Present and past forms change with the person; **will be** is the same for everyone."
          - level: A0
            text:
              en: "**you** takes **are** and **were**, for one person and for many."

  - title: { en: "Present: short forms" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: full, label: { en: Full form } }
          - { key: short, label: { en: Short form } }
        rows:
          - { level: A0, subject: I, full: "I **am** a student.", short: "I'**m** a student." }
          - { level: A0, subject: you, full: "You **are** late.", short: "You'**re** late." }
          - { level: A0, subject: he, full: "He **is** at home.", short: "He'**s** at home." }
          - { level: A0, subject: she, full: "She **is** happy.", short: "She'**s** happy." }
          - { level: A0, subject: it, full: "It **is** cold.", short: "It'**s** cold." }
          - { level: A0, subject: we, full: "We **are** friends.", short: "We'**re** friends." }
          - { level: A0, subject: they, full: "They **are** teachers.", short: "They'**re** teachers." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Speech and messages use the short forms."
          - level: A0
            text:
              en: "Negatives: **isn't** and **aren't** are usual; **I'm not** is the only short form with I."
          - level: A0
            text:
              en: "A noun subject takes **is** (singular) or **are** (plural): My parents **are** doctors."

  - title: { en: "Present: questions and short answers" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, form: "be + subject", example: "**Are** you a student?" }
          - { level: A0, form: "wh-word + be + subject", example: "Where **are** you from?" }
          - { level: A0, form: "wh-word + be + subject", example: "What **is** your name?" }
          - { level: A0, form: "wh-word + be + subject", example: "How old **are** you?" }
          - { level: A0, form: "wh-word + be + subject", example: "How **are** you?" }
      - type: bullets
        items:
          - level: A0
            text:
              en: "A short answer repeats be; the positive answer takes the full form:"
            ex: "Are you tired? — Yes, I **am**. / No, I'**m not**."

  - title: { en: "Past: was and were" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: singular, label: I / he / she / it }
          - { key: plural, label: you / we / they }
        rows:
          - { level: A1, form: +, singular: { ex: "I **was** at home." }, plural: { ex: "We **were** at home." } }
          - { level: A1, form: −, singular: { ex: "She **wasn't** at home." }, plural: { ex: "They **weren't** at home." } }
          - { level: A1, form: "?", singular: { ex: "**Was** he at home?" }, plural: { ex: "**Were** you at home?" } }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A short answer repeats was / were:"
            ex: "Were you there? — Yes, I **was**. / No, I **wasn't**."
          - level: A1
            text:
              en: "Birth takes **was / were born**:"
            ex: "I **was born** in 1995."
          - level: A1
            text:
              en: "Time words: yesterday, last night, last week, in 2010."

  - title: { en: "Future: will be" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: A future state or place }, example: "I'**ll be** at home tomorrow." }
          - { level: A2, use: { en: Predictions }, example: "It **will be** sunny at the weekend." }
          - { level: A2, use: { en: Questions about the future }, example: "**Will** you **be** there?" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "Short forms: I'll be, she'll be, won't be."
          - level: A2
            text:
              en: "More about will: [Simple Tenses](id:en.tenses.simple-tenses)."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, use: { en: Name }, example: "My name **is** Anna." }
          - { level: A0, use: { en: Age }, example: "I'**m** 20. / He **is** 30 years old." }
          - { level: A0, use: { en: Nationality and origin }, example: "She'**s** Spanish. / We'**re** from Madrid." }
          - { level: A0, use: { en: Job }, example: "He'**s** a teacher." }
          - { level: A0, use: { en: Description }, example: "The house **is** big." }
          - { level: A0, use: { en: Feelings and states }, example: "I'**m** hungry. / They'**re** tired." }
          - { level: A0, use: { en: Place }, example: "The keys **are** on the table." }
          - { level: A0, use: { en: "Weather, time, dates" }, example: "It'**s** sunny. / It'**s** 5 o'clock." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "A job takes **a / an**: He is **a** teacher. See [Articles](id:en.nouns-determiners.articles-a-an-the)."
          - level: A0
            text:
              en: "Weather and time use the subject **it**: **It** is cold. For *there is*, see [There is / there are](id:en.verbs.there-is-are)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Do you be a student?, right: "**Are** you a student?", rule: { en: "be makes questions by itself" } }
          - { level: A0, wrong: She are happy., right: "She **is** happy.", rule: { en: "he / she / it → is" } }
          - { level: A1, wrong: We was at home., right: "We **were** at home.", rule: { en: "you / we / they → were" } }
          - { level: A1, wrong: Did you be at home?, right: "**Were** you at home?", rule: { en: "be makes past questions by itself" } }
          - { level: A2, wrong: I will at home tomorrow., right: "I **will be** at home tomorrow.", rule: { en: "will + be" } }
