title: { en: "To be", es: "To be (ser / estar)" }
summary:
  en: "Am, is, are, was, were and will be: the verb for name, age, nationality, job, feelings and place. Be needs no helper and the subject is always in the sentence: **Are** you a student? **It is** cold."
  es: "Am, is, are, was, were y will be: el verbo para nombre, edad, nacionalidad, profesión, sentimientos y lugar. Ser, estar y tener (con la edad) son be, y el sujeto siempre aparece: I **am** 20. **It is** cold today."

