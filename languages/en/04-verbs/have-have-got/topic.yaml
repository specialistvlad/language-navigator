# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.have-have-got
lang: en
kind: grammar
tags: [verbs, have, possession]
concepts: [have]
related: [en.verbs.to-be, en.tenses.simple-tenses, en.verbs.there-is-are, en.nouns-determiners.possessive-s, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Have and Have Got }
summary:
  en: "Have and have got for possession, family and features; have alone for everyday actions. Have takes do / does and have got takes have / has: I **don't have** a car. I **haven't got** a car."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: have, label: have }
        - { key: got, label: have got }
      rows:
        - { level: A1, form: { en: Affirmative }, have: "I **have** a car.", got: "I'**ve got** a car." }
        - { level: A1, form: { en: Negative }, have: "I **don't have** a car.", got: "I **haven't got** a car." }
        - { level: A1, form: { en: Question }, have: "**Do** you **have** a car?", got: "**Have** you **got** a car?" }
        - { level: A1, form: { en: Short answer }, have: "Yes, I **do**. / No, I **don't**.", got: "Yes, I **have**. / No, I **haven't**." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "**have** and **have got** have the same meaning for possession, family and features."
          - level: A1
            text:
              en: "Actions (have breakfast, have a shower) take only **have**."

  - title: { en: "Form: affirmative" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, subject: I / you / we / they, have: "They **have** two children.", got: "They'**ve got** two children." }
          - { level: A1, subject: he / she / it, have: "She **has** a brother.", got: "She'**s got** a brother." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "he / she / it takes **has**: She **has** a dog."
          - level: A1
            text:
              en: "Speech and messages use the short forms **'ve got** and **'s got**."

  - title: { en: "Form: negative" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, subject: I / you / we / they, have: "I **don't have** a car.", got: "I **haven't got** a car." }
          - { level: A1, subject: he / she / it, have: "He **doesn't have** a car.", got: "He **hasn't got** a car." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**have** makes the negative with **don't / doesn't** and the base form: He doesn't **have**."
          - level: A1
            text:
              en: "**have got** makes the negative with **haven't / hasn't** before **got**."

  - title: { en: "Form: questions" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, subject: I / you / we / they, have: "**Do** you **have** a pen?", got: "**Have** you **got** a pen?" }
          - { level: A1, subject: he / she / it, have: "**Does** she **have** a pen?", got: "**Has** she **got** a pen?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Wh-questions put the wh-word first: How many brothers **do** you **have**? / What **have** you **got**?"

  - title: { en: "Form: short answers" }
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question } }
          - { key: "yes", label: { en: "Yes" } }
          - { key: "no", label: { en: "No" } }
        rows:
          - { level: A1, question: Do you have a bike?, "yes": "Yes, I **do**.", "no": "No, I **don't**." }
          - { level: A1, question: Does she have a bike?, "yes": "Yes, she **does**.", "no": "No, she **doesn't**." }
          - { level: A1, question: Have you got a bike?, "yes": "Yes, I **have**.", "no": "No, I **haven't**." }
          - { level: A1, question: Has she got a bike?, "yes": "Yes, she **has**.", "no": "No, she **hasn't**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A short answer ends with the auxiliary from the question: do / does or have / has."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Possession }, example: "I **have** a new phone." }
          - { level: A1, use: { en: Family and friends }, example: "She'**s got** two sisters." }
          - { level: A1, use: { en: "Features, appearance" }, example: "He **has** blue eyes. / My flat **has** a balcony." }
          - { level: A1, use: { en: "Illness, pain" }, example: "I'**ve got** a headache." }
          - { level: A1, use: { en: "Work, appointments" }, example: "I'**ve got** a meeting at 3." }

  - title: { en: "Have for actions" }
    content:
      - type: table
        columns:
          - { key: group, label: { en: Group } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, group: { en: Meals and drinks }, example: "I **have** breakfast at 8. / Let's **have** a coffee." }
          - { level: A1, group: { en: Washing }, example: "She **has** a shower every morning." }
          - { level: A1, group: { en: "Rest, fun" }, example: "We **have** a rest. / They **have** a party." }
          - { level: A1, group: { en: Talking }, example: "I **have** a chat with Tom." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "In this use **have** is a main verb, so questions and negatives take **do / does**:"
            ex: "What time **do** you **have** lunch? / I **don't have** breakfast."

  - title: { en: "Compare: have and have got" }
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, point: { en: Style }, have: { en: "neutral, also in writing" }, got: { en: "informal, mostly speech" } }
          - { level: A1, point: { en: Region }, have: { en: "US: the usual form" }, got: { en: "common in British English" } }
          - { level: A1, point: { en: Example }, have: { ex: "Do you **have** a pen?" }, got: { ex: "**Have** you **got** a pen?" } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: She have a dog., right: "She **has** a dog.", rule: { en: he / she / it → has } }
          - { level: A1, wrong: Do you have got a car?, right: "**Do** you **have** a car? / **Have** you **got** a car?", rule: { en: "do goes with have, not with have got" } }
          - { level: A1, wrong: I don't have got a car., right: "I **haven't got** a car. / I **don't have** a car.", rule: { en: "choose one pattern: have or have got" } }
          - { level: A1, wrong: Does she has a car?, right: "Does she **have** a car?", rule: { en: does + base verb } }
          - { level: A1, wrong: She don't have a car., right: "She **doesn't have** a car.", rule: { en: he / she / it → doesn't } }
          - { level: A1, wrong: I have got breakfast at 8., right: "I **have** breakfast at 8.", rule: { en: "actions take have only" } }
