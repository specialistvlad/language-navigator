# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.have-have-got
lang: en
kind: grammar
tags: [verbs, have, possession]
concepts: [have]
related: [en.verbs.to-be, en.tenses.simple-tenses, en.verbs.there-is-are, en.nouns-determiners.possessive-s, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Have and Have Got }
summary:
  lead: { en: "Have and have got for possession, family and features; have alone for everyday actions." }
  rule: { en: ["Have takes ", { alternatives: [do, does] }, " and have got takes ", { alternatives: [have, has] }, ":"] }
  ex: { examples: [["I ", { target: don't have }, " a car."], ["I ", { target: haven't got }, " a car."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: form, label: { en: Form } }
        - { key: have, label: have }
        - { key: got, label: have got }
      rows:
        - { level: A1, features: { polarity: pos, interrogativity: decl }, form: { en: ["Affirmative: ", { alternatives: [I, you, we, they] }] }, have: ["I ", { target: have }, " a car."], got: [I', { target: ve got }, " a car."] }
        - { level: A1, features: { polarity: pos, interrogativity: decl, person: 3, number: sg }, form: { en: ["Affirmative: ", { alternatives: [he, she, it] }] }, have: ["She ", { target: has }, " a car."], got: [She', { target: s got }, " a car."] }
        - { level: A1, features: { polarity: neg, interrogativity: decl }, form: { en: ["Negative: ", { alternatives: [I, you, we, they] }] }, have: ["I ", { target: don't have }, " a car."], got: ["I ", { target: haven't got }, " a car."] }
        - { level: A1, features: { polarity: neg, interrogativity: decl, person: 3, number: sg }, form: { en: ["Negative: ", { alternatives: [he, she, it] }] }, have: ["He ", { target: doesn't have }, " a car."], got: ["He ", { target: hasn't got }, " a car."] }
        - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: ["Question: ", { alternatives: [I, you, we, they] }] }, have: [{ target: Do }, " you ", { target: have }, " a car?"], got: [{ target: Have }, " you ", { target: got }, " a car?"] }
        - { level: A1, features: { polarity: pos, interrogativity: int, person: 3, number: sg }, form: { en: ["Question: ", { alternatives: [he, she, it] }] }, have: [{ target: Does }, " she ", { target: have }, " a car?"], got: [{ target: Has }, " she ", { target: got }, " a car?"] }
        - { level: A1, features: { interrogativity: decl, polarity: [pos, neg] }, form: { en: Short answer }, have: { alternatives: [["Yes, I ", { target: do }, "."], ["No, I ", { target: don't }, "."]] }, got: { alternatives: [["Yes, I ", { target: have }, "."], ["No, I ", { target: haven't }, "."]] } }
        - { level: A1, features: { interrogativity: decl, polarity: pos }, form: { en: "Actions: only have" }, have: ["I ", { target: have }, " breakfast at 8."] }
        - { level: A1, features: { interrogativity: decl, polarity: pos }, form: { en: Style }, have: { en: "neutral, also in writing" }, got: { en: "informal, mostly speech" } }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: have }, " and ", { term: have got }, " have the same meaning for possession, family and features."]
          - type: rule
            level: A1
            text:
              en: ["Actions (have breakfast, have a shower) take only ", { term: have }, "."]

  - title: { en: "Form: affirmative" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, features: [{ person: 1, number: sg }, { person: 2 }, { person: 1, number: pl }, { person: 3, number: pl }], subject: { alternatives: [I, you, we, they] }, have: ["They ", { target: have }, " two children."], got: [They', { target: ve got }, " two children."] }
          - { level: A1, features: { person: 3, number: sg }, subject: { alternatives: [he, she, it] }, have: ["She ", { target: has }, " a car."], got: [She', { target: s got }, " a car."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ alternatives: [he, she, it] }, " takes ", { term: has }, ":"]
            ex: ["She ", { target: has }, " a dog."]
          - type: rule
            level: A1
            text:
              en: ["Speech and messages use the short forms ", { term: "'ve got" }, " and ", { term: "'s got" }, "."]

  - title: { en: "Form: negative" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, features: [{ person: 1, number: sg }, { person: 2 }, { person: 1, number: pl }, { person: 3, number: pl }], subject: { alternatives: [I, you, we, they] }, have: ["I ", { target: don't have }, " a car."], got: ["I ", { target: haven't got }, " a car."] }
          - { level: A1, features: { person: 3, number: sg }, subject: { alternatives: [he, she, it] }, have: ["He ", { target: doesn't have }, " a car."], got: ["He ", { target: hasn't got }, " a car."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: have }, " makes the negative with ", { alternatives: [{ term: don't }, { term: doesn't }] }, " and the base form:"]
            ex: ["He doesn't ", { target: have }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: have got }, " makes the negative with ", { alternatives: [{ term: haven't }, { term: hasn't }] }, " before ", { term: got }, "."]

  - title: { en: "Form: questions" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, features: [{ person: 1, number: sg }, { person: 2 }, { person: 1, number: pl }, { person: 3, number: pl }], subject: { alternatives: [I, you, we, they] }, have: [{ target: Do }, " you ", { target: have }, " a car?"], got: [{ target: Have }, " you ", { target: got }, " a car?"] }
          - { level: A1, features: { person: 3, number: sg }, subject: { alternatives: [he, she, it] }, have: [{ target: Does }, " she ", { target: have }, " a car?"], got: [{ target: Has }, " she ", { target: got }, " a car?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Wh-questions put the wh-word first:"
            ex: { examples: [["How many brothers ", { target: do }, " you ", { target: have }, "?"], ["What ", { target: have }, " you ", { target: got }, "?"]] }

  - title: { en: "Form: short answers" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: question, label: { en: Question } }
          - { key: "yes", label: { en: "Yes" }, features: { polarity: pos } }
          - { key: "no", label: { en: "No" }, features: { polarity: neg } }
        rows:
          - { level: A1, question: Do you have a bike?, "yes": ["Yes, I ", { target: do }, "."], "no": ["No, I ", { target: don't }, "."] }
          - { level: A1, question: Does she have a bike?, "yes": ["Yes, she ", { target: does }, "."], "no": ["No, she ", { target: doesn't }, "."] }
          - { level: A1, question: Have you got a bike?, "yes": ["Yes, I ", { target: have }, "."], "no": ["No, I ", { target: haven't }, "."] }
          - { level: A1, question: Has she got a bike?, "yes": ["Yes, she ", { target: has }, "."], "no": ["No, she ", { target: hasn't }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A short answer ends with the auxiliary from the question: ", { alternatives: [do, does] }, " or ", { alternatives: [have, has] }, "."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Possession }, ex: ["I ", { target: have }, " a new phone."] }
          - { level: A1, use: { en: Family and friends }, ex: [She', { target: s got }, " two sisters."] }
          - { level: A1, use: { en: "Features, appearance" }, ex: { examples: [["He ", { target: has }, " blue eyes."], ["My flat ", { target: has }, " a balcony."]] } }
          - { level: A1, use: { en: "Illness, pain" }, ex: [I', { target: ve got }, " a headache."] }
          - { level: A1, use: { en: "Work, appointments" }, ex: [I', { target: ve got }, " a meeting at 3."] }

  - title: { en: Have for actions }
    role: own
    content:
      - type: usage
        columns:
          - { key: group, label: { en: Group } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, group: { en: Meals and drinks }, ex: { examples: [["I ", { target: have }, " breakfast at 8."], ["Let's ", { target: have }, " a coffee."]] } }
          - { level: A1, group: { en: Washing }, ex: ["She ", { target: has }, " a shower every morning."] }
          - { level: A1, group: { en: "Rest, fun" }, ex: { examples: [["We ", { target: have }, " a rest."], ["They ", { target: have }, " a party."]] } }
          - { level: A1, group: { en: Talking }, ex: ["I ", { target: have }, " a chat with Tom."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["In this use ", { term: have }, " is a main verb, so questions and negatives take ", { alternatives: [{ term: do }, { term: does }] }, ":"]
            ex: { examples: [["What time ", { target: do }, " you ", { target: have }, " lunch?"], ["I ", { target: don't have }, " breakfast."]] }

  - title: { en: "Compare: have and have got" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: point, label: { en: Point } }
          - { key: have, label: have }
          - { key: got, label: have got }
        rows:
          - { level: A1, point: { en: Style }, have: { en: "neutral, also in writing" }, got: { en: "informal, mostly speech" } }
          - { level: A1, point: { en: Region }, have: { en: { variant: the usual form, variety: en-US } }, got: { en: common in British English } }
          - { level: A1, point: { en: Example }, have: ["Do you ", { target: have }, " a pen?"], got: [{ target: Have }, " you ", { target: got }, " a pen?"] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: She have a dog., right: ["She ", { target: has }, " a dog."], rule: { en: { takes: [{ alternatives: [he, she, it] }, has] } } }
          - { level: A1, wrong: Do you have got a car?, right: { alternatives: [[{ target: Do }, " you ", { target: have }, " a car?"], [{ target: Have }, " you ", { target: got }, " a car?"]] }, rule: { en: "do goes with have, not with have got" } }
          - { level: A1, wrong: I don't have got a car., right: { alternatives: [["I ", { target: haven't got }, " a car."], ["I ", { target: don't have }, " a car."]] }, rule: { en: "choose one pattern: have or have got" } }
          - { level: A1, wrong: Does she has a car?, right: ["Does she ", { target: have }, " a car?"], rule: { en: { pattern: [does, { slot: base verb }] } } }
          - { level: A1, wrong: She don't have a car., right: ["She ", { target: doesn't have }, " a car."], rule: { en: { takes: [{ alternatives: [he, she, it] }, doesn't] } } }
          - { level: A1, wrong: I have got breakfast at 8., right: ["I ", { target: have }, " breakfast at 8."], rule: { en: actions take have only } }
