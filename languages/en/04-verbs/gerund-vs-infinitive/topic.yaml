# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.gerund-vs-infinitive
lang: en
kind: grammar
tags: [verb-patterns, gerund, infinitive]
concepts: [verb-patterns]
related: [en.sentence-building.reported-speech, en.sentence-building.questions-negatives, en.tenses.future-forms]
status: { en: draft }

title: { en: Gerund vs Infinitive }
summary:
  en: "Verbs followed by -ing, verbs followed by to + infinitive, and verbs that take both with a change of meaning. The verb before decides the form: I **enjoy cooking**, I **want to cook**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: pattern, label: { en: Pattern } }
        - { key: verbs, label: { en: Verbs } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: B1, pattern: verb + -ing, verbs: "enjoy, finish, mind, avoid, suggest, keep", example: "I **enjoy cooking**." }
        - { level: B1, pattern: verb + to + V, verbs: "want, decide, hope, plan, need, would like", example: "They **decided to move**." }
        - { level: B1, pattern: want / need / would like + person + to + V, verbs: "want, need, would like", example: "I **want you to come**." }
        - { level: B1, pattern: preposition + -ing, verbs: "interested in, before, without", example: "Wash your hands **before eating**." }
        - { level: B1, pattern: -ing as subject, verbs: "—", example: "**Swimming** is good for you." }
        - { level: B1, pattern: look forward to + -ing, verbs: "to is a preposition", example: "I look forward to **seeing** you." }
        - { level: B1, pattern: stop + -ing / to + V, verbs: stop, example: "He **stopped smoking**. / He **stopped to smoke**." }
        - { level: B1, pattern: remember + -ing / to + V, verbs: remember, example: "I **remember locking** it. / **Remember to lock** it." }
        - { level: B1, pattern: try + -ing / to + V, verbs: try, example: "**Try adding** salt. / I **tried to open** it." }
        - { level: B1, pattern: either form, verbs: "like, love, hate, prefer", example: "I **like** swimming. / I **like** to swim." }

sections:
  - title: { en: "Form: verb + -ing" }
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, verb: enjoy, example: "I **enjoy cooking**." }
          - { level: B1, verb: finish, example: "She **finished reading** the book." }
          - { level: B1, verb: mind, example: "Do you **mind waiting**?" }
          - { level: B1, verb: avoid, example: "He **avoids driving** at night." }
          - { level: B1, verb: suggest, example: "I **suggest taking** a taxi." }
          - { level: B1, verb: keep, example: "She **keeps asking** questions." }
          - { level: B1, verb: "practise, consider, can't stand", example: "I **can't stand waiting**." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "These verbs are followed by **-ing**: I enjoy **cooking**."

  - title: { en: "Form: verb + to + infinitive" }
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, verb: want, example: "I **want to go** home." }
          - { level: B1, verb: decide, example: "They **decided to move**." }
          - { level: B1, verb: hope, example: "We **hope to see** you soon." }
          - { level: B1, verb: plan, example: "He **plans to study** abroad." }
          - { level: B1, verb: need, example: "You **need to rest**." }
          - { level: B1, verb: would like / would love, example: "I'**d like to book** a table." }
          - { level: B1, verb: "learn, agree, promise, manage", example: "She **learned to swim**." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "These verbs are followed by **to** + base verb."
          - level: B1
            text:
              en: "With **want**, **need** and **would like**, a person can come before **to**:"
            ex: "I **want you to come**."

  - title: { en: "Form: after prepositions and as subject" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Position } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, use: { en: "after a preposition" }, example: "I'm interested **in learning** Spanish." }
          - { level: B1, use: { en: "after a preposition" }, example: "Wash your hands **before eating**." }
          - { level: B1, use: { en: "after a preposition" }, example: "She left **without saying** goodbye." }
          - { level: B1, use: { en: "as the subject" }, example: "**Swimming** is good for you." }
          - { level: B1, use: { en: "after look forward to" }, example: "I look forward to **seeing** you." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "A verb after a preposition takes **-ing**."
          - level: B1
            text:
              en: "In **look forward to**, **to** is a preposition, so **-ing** follows."
          - level: B1
            text:
              en: "The -ing form works as a noun and can be the subject."

  - title: { en: "Verbs with both forms" }
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: ing, label: { en: "+ -ing" } }
          - { key: to, label: { en: "+ to + infinitive" } }
        rows:
          - { level: B1, verb: stop, ing: { ex: "He **stopped smoking**. (He quit.)" }, to: { ex: "He **stopped to smoke**. (He paused in order to smoke.)" } }
          - { level: B1, verb: remember, ing: { ex: "I **remember locking** the door. (I recall the action.)" }, to: { ex: "**Remember to lock** the door. (Do not forget.)" } }
          - { level: B1, verb: try, ing: { ex: "**Try adding** salt. (Test it.)" }, to: { ex: "I **tried to open** it. (I made an effort.)" } }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**like**, **love**, **hate** and **prefer** take either form, with almost the same meaning."
          - { level: B1, text: { en: "I **like** swimming. / I **like** to swim." } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: B1, wrong: I enjoy to cook., right: "I enjoy **cooking**.", rule: { en: "enjoy, finish, mind, avoid, suggest, keep → -ing" } }
          - { level: B1, wrong: She decided going home., right: "She decided **to go** home.", rule: { en: "want, decide, hope, plan, need → to + infinitive" } }
          - { level: B1, wrong: I'm interested in learn Spanish., right: "I'm interested in **learning** Spanish.", rule: { en: "after a preposition → -ing" } }
          - { level: B1, wrong: He suggested to go by train., right: "He suggested **going** by train.", rule: { en: "suggest + -ing" } }
          - { level: B1, wrong: I look forward to see you., right: "I look forward to **seeing** you.", rule: { en: "to is a preposition here → -ing" } }
