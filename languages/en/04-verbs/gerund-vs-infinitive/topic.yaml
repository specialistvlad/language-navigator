# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.gerund-vs-infinitive
lang: en
kind: grammar
tags: [verb-patterns, gerund, infinitive]
concepts: [verb-patterns]
related: [en.sentence-building.reported-speech, en.sentence-building.questions-negatives, en.tenses.future-forms]
status: { en: draft }

title: { en: Gerund vs Infinitive }
summary:
  lead: { en: ["Verbs followed by -ing, verbs followed by ", { pattern: [to, { slot: infinitive }] }, ", and verbs that take both with a change of meaning."] }
  rule: { en: "The verb before decides the form:" }
  ex: { examples: [["I ", { target: enjoy cooking }], ["I ", { target: want to cook }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: form, label: { en: Form } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: B1, form: { pattern: [{ slot: verb }, { slot: "-ing" }] }, rule: { en: "after enjoy, finish, mind, avoid, suggest" }, ex: ["I ", { target: enjoy cooking }, "."] }
        - { level: B1, form: { pattern: [{ slot: verb }, to, { slot: V }] }, rule: { en: "after want, decide, hope, plan, need" }, ex: ["They ", { target: decided to move }, "."] }
        - { level: B1, form: { pattern: [{ alternatives: [want, need, would like] }, { slot: person }, to, { slot: V }] }, rule: { en: a person can come before to }, ex: ["I ", { target: want you to come }, "."] }
        - { level: B1, form: { pattern: [{ slot: { en: preposition } }, { slot: "-ing" }] }, rule: { en: "after a preposition: interested in, before, without" }, ex: ["Wash your hands ", { target: before eating }, "."] }
        - { level: B1, form: { en: [{ term: "-ing" }, " as the subject"] }, rule: { en: the -ing form works as a noun }, ex: [{ target: Swimming }, " is good for you."] }
        - { level: B1, form: { pattern: [look forward to, { slot: "-ing" }] }, rule: { en: [{ term: to }, " is a preposition here"] }, ex: ["I look forward to ", { target: seeing }, " you."] }
        - { level: B1, form: { pattern: [stop, { alternatives: [{ slot: "-ing" }, { pattern: [to, { slot: V }] }] }] }, rule: { en: [{ term: "-ing" }, " means he quit; ", { term: to }, " means he paused in order to smoke"] }, ex: { examples: [["He ", { target: stopped smoking }, "."], ["He ", { target: stopped to smoke }, "."]] } }
        - { level: B1, form: { pattern: [remember, { alternatives: [{ slot: "-ing" }, { pattern: [to, { slot: V }] }] }] }, rule: { en: [{ term: "-ing" }, " recalls the action; ", { term: to }, " means do not forget"] }, ex: { examples: [["I ", { target: remember locking }, " it."], [{ target: Remember to lock }, " it."]] } }
        - { level: B1, form: { pattern: [try, { alternatives: [{ slot: "-ing" }, { pattern: [to, { slot: V }] }] }] }, rule: { en: [{ term: "-ing" }, " tests it; ", { term: to }, " makes an effort"] }, ex: { examples: [[{ target: Try adding }, " salt."], ["I ", { target: tried to open }, " it."]] } }
        - { level: B1, form: { en: Either form }, rule: { en: "like, love, hate, prefer: almost the same meaning" }, ex: { examples: [["I ", { target: like }, " swimming."], ["I ", { target: like }, " to swim."]] } }

sections:
  - title: { en: ["Form: ", { pattern: [{ slot: verb }, { slot: "-ing" }] }] }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, verb: enjoy, ex: ["I ", { target: enjoy cooking }, "."] }
          - { level: B1, verb: finish, ex: ["She ", { target: finished reading }, " the book."] }
          - { level: B1, verb: mind, ex: ["Do you ", { target: mind waiting }, "?"] }
          - { level: B1, verb: avoid, ex: ["He ", { target: avoids driving }, " at night."] }
          - { level: B1, verb: suggest, ex: ["I ", { target: suggest taking }, " a taxi."] }
          - { level: B1, verb: keep, ex: ["She ", { target: keeps asking }, " questions."] }
          - { level: B1, verb: "practise, consider, can't stand", ex: ["I ", { target: can't stand waiting }, "."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["These verbs are followed by ", { term: "-ing" }, ":"]
            ex: ["I enjoy ", { target: cooking }, "."]

  - title: { en: ["Form: ", { pattern: [{ slot: verb }, to, { slot: infinitive }] }] }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, verb: want, ex: ["I ", { target: want to go }, " home."] }
          - { level: B1, verb: decide, ex: ["They ", { target: decided to move }, "."] }
          - { level: B1, verb: hope, ex: ["We ", { target: hope to see }, " you soon."] }
          - { level: B1, verb: plan, ex: ["He ", { target: plans to study }, " abroad."] }
          - { level: B1, verb: need, ex: ["You ", { target: need to rest }, "."] }
          - { level: B1, verb: { alternatives: [would like, would love] }, ex: [I', { target: d like to book }, " a table."] }
          - { level: B1, verb: "learn, agree, promise, manage", ex: ["She ", { target: learned to swim }, "."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["These verbs are followed by ", { pattern: [{ term: to }, { slot: base verb }] }, "."]
          - type: rule
            level: B1
            text:
              en: ["With ", { term: want }, ", ", { term: need }, " and ", { term: would like }, ", a person can come before ", { term: to }, ":"]
            ex: ["I ", { target: want you to come }, "."]

  - title: { en: "Form: after prepositions and as subject" }
    role: form
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Position } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, use: { en: after a preposition }, ex: ["I'm interested ", { target: in learning }, " Spanish."] }
          - { level: B1, use: { en: after a preposition }, ex: ["Wash your hands ", { target: before eating }, "."] }
          - { level: B1, use: { en: after a preposition }, ex: ["She left ", { target: without saying }, " goodbye."] }
          - { level: B1, use: { en: as the subject }, ex: [{ target: Swimming }, " is good for you."] }
          - { level: B1, use: { en: after look forward to }, ex: ["I look forward to ", { target: seeing }, " you."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A verb after a preposition takes ", { term: "-ing" }, "."]
          - type: rule
            level: B1
            text:
              en: ["In ", { term: look forward to }, ", ", { term: to }, " is a preposition, so ", { term: "-ing" }, " follows."]
          - type: rule
            level: B1
            text:
              en: The -ing form works as a noun and can be the subject.

  - title: { en: Verbs with both forms }
    role: own
    content:
      - type: comparison
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: ing, label: { en: { pattern: [{ slot: "-ing" }], follows: true } }, features: { verbform: ger } }
          - { key: to, label: { en: { pattern: [to, { slot: infinitive }], follows: true } }, features: { verbform: inf } }
        rows:
          - { level: B1, verb: stop, ing: ["He ", { target: stopped smoking }, ". ", { gloss: { en: He quit. } }], to: ["He ", { target: stopped to smoke }, ". ", { gloss: { en: He paused in order to smoke. } }] }
          - { level: B1, verb: remember, ing: ["I ", { target: remember locking }, " the door. ", { gloss: { en: I recall the action. } }], to: [{ target: Remember to lock }, " the door. ", { gloss: { en: Do not forget. } }] }
          - { level: B1, verb: try, ing: [{ target: Try adding }, " salt. ", { gloss: { en: Test it. } }], to: ["I ", { target: tried to open }, " it. ", { gloss: { en: I made an effort. } }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: like }, ", ", { term: love }, ", ", { term: hate }, " and ", { term: prefer }, " take either form, with almost the same meaning."]
          - type: rule
            level: B1
            text:
              en: { examples: [["I ", { target: like }, " swimming."], ["I ", { target: like }, " to swim."]] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: I enjoy to cook., right: ["I enjoy ", { target: cooking }, "."], rule: { en: { takes: ["enjoy, finish, mind, avoid, suggest, keep", "-ing"] } } }
          - { level: B1, wrong: She decided going home., right: ["She decided ", { target: to go }, " home."], rule: { en: { takes: ["want, decide, hope, plan, need", { pattern: [to, { slot: infinitive }] }] } } }
          - { level: B1, wrong: I'm interested in learn Spanish., right: ["I'm interested in ", { target: learning }, " Spanish."], rule: { en: { takes: [after a preposition, "-ing"] } } }
          - { level: B1, wrong: He suggested to go by train., right: ["He suggested ", { target: going }, " by train."], rule: { en: { pattern: [suggest, { slot: "-ing" }] } } }
          - { level: B1, wrong: I look forward to see you., right: ["I look forward to ", { target: seeing }, " you."], rule: { en: { takes: [to is a preposition here, "-ing"] } } }
