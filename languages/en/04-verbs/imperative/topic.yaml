# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.imperative
lang: en
kind: grammar
tags: [verbs, imperative, instructions]
concepts: [imperative]
related: [en.verbs.to-be, en.tenses.simple-tenses, en.modals.can-could, en.sentence-building.questions-negatives, en.prepositions.place-movement]
status: { en: draft }

title: { en: Imperative }
summary:
  lead: { en: "The imperative gives instructions, directions, invitations and warnings with the base verb, Don't and Let's." }
  rule: { en: "The verb is the bare base form with no subject and no to:" }
  ex: { examples: [[{ target: Open }, " the door."], [{ target: Don't open }, " it."], { target: Let's go. }] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A1, point: { en: Affirmative }, rule: { en: "the base verb for every person, with no subject and no -s" }, ex: [{ target: Open }, " the door."] }
        - { level: A1, point: { en: Negative }, rule: { en: [{ pattern: [Don't, { slot: V }] }, ", also before ", { term: be }] }, ex: [{ target: Don't be }, " late."] }
        - { level: A1, point: { en: Suggestion }, rule: { en: [{ pattern: [Let's, { slot: V }] }, ": includes the speaker, invites others to join"] }, ex: [{ target: Let's go }, " to the beach."] }
        - { level: A1, point: { en: Negative suggestion }, rule: { en: { pattern: [Let's not, { slot: V }] } }, ex: { target: Let's not wait. } }
        - { level: A1, point: { en: Use }, rule: { en: "instructions, directions, orders" }, ex: [{ target: Turn }, " left and ", { target: go straight on }, "."] }
        - { level: A1, point: { en: Use }, rule: { en: "invitations, offers, warnings" }, ex: { examples: [[{ target: Come }, " in."], { target: Look out! }] } }
        - { level: A1, point: { en: Politeness }, rule: { en: [{ term: please }, " at the start or the end makes a request friendly"] }, ex: [{ target: Please }, " sit down."] }
        - { level: A1, point: { en: Trap }, rule: { en: ["after ", { term: Don't }, " and ", { term: Let's }, ": the base verb, no ", { term: to }] }, ex: { examples: [["Don't ", { target: open }, " it."], ["Let's ", { target: go }, "."]] } }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: The imperative has no subject and no tense. The verb is in the base form.

  - title: { en: "Form: affirmative" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, verb: { en: action verb }, ex: { examples: [[{ target: Sit }, " down."], [{ target: Close }, " your books."]] } }
          - { level: A1, verb: be, ex: { examples: [[{ target: Be }, " quiet."], [{ target: Be }, " careful."]] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "The imperative is the base verb for every person:"
            ex: { examples: [[{ target: Come }, " in."], [{ target: Be }, " quiet."]] }
          - type: rule
            level: A1
            text:
              en: ["A name or ", { term: everybody }, " opens the sentence to say who is spoken to:"]
            ex: { examples: [[{ target: "Tom, come" }, " here."], { target: "Everybody, listen." }] }

  - title: { en: "Form: negative" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, pattern: { pattern: [Don't, { slot: V }] }, ex: [{ target: Don't touch }, " it."] }
          - { level: A1, pattern: { pattern: [Don't be, { slot: adjective }] }, ex: [{ target: Don't be }, " late."] }
          - { level: A1, pattern: { pattern: [Do not, { slot: V }] }, ex: { target: Do not enter. } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: Don't }, " goes before the base verb, also before ", { term: be }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: Do not }, " is the full form. Signs and notices use it."]

  - title: { en: "Form: Let's" }
    role: form
    content:
      - type: usage
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, pattern: { pattern: [Let's, { slot: V }] }, ex: [{ target: Let's go }, " to the beach."] }
          - { level: A1, pattern: { pattern: [Let's not, { slot: V }] }, ex: { target: Let's not wait. } }
          - { level: A1, pattern: { pattern: [Shall we, [{ slot: V }, "?"]] }, ex: [{ target: Shall we eat }, " now?"] }
      - type: usage
        columns:
          - { key: answer, label: { en: Answer } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, answer: { en: agree }, ex: { examples: [["Yes, ", { target: let's }, "."], Good idea.] } }
          - { level: A1, answer: { en: refuse }, ex: { examples: [["No, ", { target: let's not }, "."], "Sorry, I can't."] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: Let's }, " = ", { term: let us }, . It includes the speaker and invites others to join.]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Instructions }, ex: [{ target: Add }, " two eggs and ", { target: mix }, " well."] }
          - { level: A1, use: { en: Directions }, ex: [{ target: Turn }, " left and ", { target: go straight on }, ". ", { variant: { target: go straight }, variety: en-US }] }
          - { level: A1, use: { en: Invitations and offers }, ex: [{ target: Come }, " in. ", { target: Have }, " a seat."] }
          - { level: A1, use: { en: Warnings }, ex: { examples: [{ target: Look out! }, [{ target: Be }, " careful!"]] } }
          - { level: A1, use: { en: Orders }, ex: { examples: [{ target: Stop! }, [{ target: Listen }, ", please."]] } }
          - { level: A1, use: { en: "Signs, notices" }, ex: [{ target: Keep }, " off the grass."] }
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: ["For directions with place words see ", { link: Place and Movement, to: en.prepositions.place-movement }, "."]

  - title: { en: Politeness }
    role: own
    content:
      - type: usage
        columns:
          - { key: way, label: { en: Way } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, way: { en: please at the start }, ex: [{ target: Please }, " sit down."] }
          - { level: A1, way: { en: please at the end }, ex: ["Sit down, ", { target: please }, "."] }
          - { level: A1, way: { en: a question with Could you… }, ex: [{ target: Could you }, " open the window, ", { target: please }, "?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["A bare imperative sounds direct. ", { term: please }, " makes a request friendly."]
          - type: note
            level: A1
            text:
              en: ["Requests to strangers and in formal situations use ", { term: [Could you, { gap: true }, "?"] }, " See ", { link: Can and Could, to: en.modals.can-could }, "."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Not open the door., right: [{ target: Don't open }, " the door."], rule: { en: { takes: [negative imperative, { pattern: [Don't, { slot: V }] }] } } }
          - { level: A1, wrong: Don't to open the door., right: ["Don't ", { target: open }, " the door."], rule: { en: { pattern: [Don't, "base verb, no to"] } } }
          - { level: A1, wrong: Opens the door., right: [{ target: Open }, " the door."], rule: { en: the imperative has no -s } }
          - { level: A1, wrong: Let's to go., right: ["Let's ", { target: go }, "."], rule: { en: { pattern: [Let's, "base verb, no to"] } } }
