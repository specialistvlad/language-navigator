# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.verbs.imperative
lang: en
kind: grammar
tags: [verbs, imperative, instructions]
concepts: [imperative]
related: [en.verbs.to-be, en.tenses.simple-tenses, en.modals.can-could, en.sentence-building.questions-negatives, en.prepositions.place-movement]
status: { en: draft }

title: { en: Imperative }
summary:
  en: "The imperative gives instructions, directions, invitations and warnings with the base verb, Don't and Let's. The verb is the bare base form with no subject and no to: **Open** the door. **Don't open** it. **Let's go.**"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: pattern, label: { en: Pattern } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A1, form: { en: Affirmative }, pattern: V, example: "**Open** the door." }
        - { level: A1, form: { en: Negative }, pattern: Don't + V, example: "**Don't open** the door." }
        - { level: A1, form: { en: Suggestion }, pattern: Let's + V, example: "**Let's open** the door." }
        - { level: A1, form: { en: Negative suggestion }, pattern: Let's not + V, example: "**Let's not open** the door." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "The imperative has no subject and no tense. The verb is in the base form."

  - title: { en: "Form: affirmative" }
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, verb: { en: action verb }, example: "**Sit** down. / **Close** your books." }
          - { level: A1, verb: be, example: "**Be** quiet. / **Be** careful." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "The imperative is the base verb for every person: **Come** in. / **Be** quiet."
          - level: A1
            text:
              en: "A name or **everybody** opens the sentence to say who is spoken to:"
            ex: "**Tom, come** here. / **Everybody, listen.**"

  - title: { en: "Form: negative" }
    content:
      - type: table
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, pattern: Don't + V, example: "**Don't touch** it." }
          - { level: A1, pattern: Don't be + adjective, example: "**Don't be** late." }
          - { level: A1, pattern: Do not + V, example: "**Do not enter.**" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**Don't** goes before the base verb, also before **be**."
          - level: A1
            text:
              en: "**Do not** is the full form. Signs and notices use it."

  - title: { en: "Form: Let's" }
    content:
      - type: table
        columns:
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, pattern: Let's + V, example: "**Let's go** to the beach." }
          - { level: A1, pattern: Let's not + V, example: "**Let's not wait.**" }
          - { level: A1, pattern: "Shall we + V?", example: "**Shall we eat** now?" }
      - type: table
        columns:
          - { key: answer, label: { en: Answer } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, answer: { en: agree }, example: "Yes, **let's**. / Good idea." }
          - { level: A1, answer: { en: refuse }, example: "No, **let's not**. / Sorry, I can't." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**Let's** = *let us*. It includes the speaker and invites others to join."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Instructions }, example: "**Add** two eggs and **mix** well." }
          - { level: A1, use: { en: Directions }, example: "**Turn** left and **go straight on**. (US: **go straight**)" }
          - { level: A1, use: { en: Invitations and offers }, example: "**Come** in. **Have** a seat." }
          - { level: A1, use: { en: Warnings }, example: "**Look out!** / **Be** careful!" }
          - { level: A1, use: { en: Orders }, example: "**Stop!** / **Listen**, please." }
          - { level: A1, use: { en: "Signs, notices" }, example: "**Keep** off the grass." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "For directions with place words see [Place and Movement](id:en.prepositions.place-movement)."

  - title: { en: Politeness }
    content:
      - type: table
        columns:
          - { key: way, label: { en: Way } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, way: { en: please at the start }, example: "**Please** sit down." }
          - { level: A1, way: { en: please at the end }, example: "Sit down, **please**." }
          - { level: A1, way: { en: "a question with Could you…" }, example: "**Could you** open the window, **please**?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A bare imperative sounds direct. **please** makes a request friendly."
          - level: A1
            text:
              en: "Requests to strangers and in formal situations use **Could you…?** See [Can and Could](id:en.modals.can-could)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Not open the door., right: "**Don't open** the door.", rule: { en: "negative imperative → Don't + V" } }
          - { level: A1, wrong: Don't to open the door., right: "Don't **open** the door.", rule: { en: "Don't + base verb, no to" } }
          - { level: A1, wrong: Opens the door., right: "**Open** the door.", rule: { en: "the imperative has no -s" } }
          - { level: A1, wrong: Let's to go., right: "Let's **go**.", rule: { en: "Let's + base verb, no to" } }
