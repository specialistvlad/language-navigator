# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.prepositions.time-in-on-at
lang: en
kind: grammar
tags: [prepositions, time, at, on, in]
concepts: [prepositions-time]
related: [en.foundations.telling-time, en.foundations.days-months-dates, en.prepositions.place-movement]
status: { en: draft, es: draft }

title: { en: "Time: In, On, At", es: "Tiempo: in, on, at" }
summary:
  en: "At goes with clock times, on with days and dates, and in with months, years and seasons. The period gets longer from at to on to in, and next, last, this and every take no preposition: **at** 7 o'clock, **on** Monday, **in** July, **next** Friday."
  es: "At va con horas, on con días y fechas, e in con meses, años y estaciones. En inglés, **on** Monday y **on** Mondays (*el lunes*, *los lunes*) no llevan artículo: I work **on** Mondays."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: prep, label: { en: Preposition, es: Preposición } }
        - { key: goes, label: { en: Goes with, es: Va con } }
        - { key: example, label: { en: Example, es: Ejemplo } }
      rows:
        - { level: A1, prep: at, goes: { en: "clock times and points in time", es: "horas y momentos concretos" }, example: "**at** 7 o'clock", tr: { es: a las 7 } }
        - { level: A1, prep: on, goes: { en: "days and dates", es: "días y fechas" }, example: "**on** Monday", tr: { es: el lunes } }
        - { level: A1, prep: in, goes: { en: "months, years, seasons and longer periods", es: "meses, años, estaciones y periodos largos" }, example: "**in** July", tr: { es: en julio } }

sections:
  - title: { en: Overview, es: Resumen }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "The period gets longer from at, to on, to in."
              es: "El periodo se alarga de at a on y a in."
          - { level: A1, for: [es], text: { es: "El español dice *a las 7*, *el lunes*, *en julio*; el inglés usa at, on o in según el tiempo." } }

  - title: { en: Use, es: Uso }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: "at + clock time", example: "The class starts **at** 9:30.", tr: { es: La clase empieza a las 9:30. } }
          - { level: A1, use: "at + night, midday, midnight", example: "I sleep badly **at night**.", tr: { es: Duermo mal por la noche. } }
          - { level: A1, use: "at + the weekend", example: "We relax **at the weekend**. (US: **on the weekend**)", tr: { es: Descansamos el fin de semana. } }
          - { level: A1, use: "at + Christmas, Easter", example: "We visit my gran **at Christmas**.", tr: { es: Visitamos a mi abuela en Navidad. } }
          - { level: A1, use: "on + day", example: "I work **on Mondays**.", tr: { es: Trabajo los lunes. } }
          - { level: A1, use: "on + day + part of the day", example: "See you **on Monday morning**.", tr: { es: Nos vemos el lunes por la mañana. } }
          - { level: A1, use: "on + date", example: "My birthday is **on 5 May**.", tr: { es: Mi cumpleaños es el 5 de mayo. } }
          - { level: A1, use: "on + a special day", example: "We have a party **on New Year's Day**.", tr: { es: Hacemos una fiesta el día de Año Nuevo. } }
          - { level: A1, use: "in + morning, afternoon, evening", example: "I study **in the evening**.", tr: { es: Estudio por la tarde. } }
          - { level: A1, use: "in + month", example: "It's cold **in January**.", tr: { es: Hace frío en enero. } }
          - { level: A1, use: "in + season", example: "We go to the beach **in summer**.", tr: { es: Vamos a la playa en verano. } }
          - { level: A1, use: "in + year", example: "She was born **in 1998**.", tr: { es: Nació en 1998. } }
      - type: bullets
        items:
          - { level: A1, for: [es], text: { es: "*El lunes* y *los lunes* → **on Monday** / **on Mondays**, sin artículo." } }
          - { level: A1, for: [es], text: { es: "*Por la mañana* → **in the morning**; *por la noche* → **at night**." } }

  - title: { en: No preposition, es: Sin preposición }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Word, es: Palabra } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, word: "this + morning, week, year", example: "I'm busy **this week**.", tr: { es: Esta semana estoy ocupado. } }
          - { level: A1, word: "next / last + day, week, month", example: "We meet **next Monday**. / He called **last night**.", tr: { es: Nos vemos el próximo lunes. / Llamó anoche. } }
          - { level: A1, word: "every + day, week, year", example: "I walk **every morning**.", tr: { es: Camino todas las mañanas. } }
          - { level: A1, word: "today, tonight, tomorrow, yesterday", example: "Call me **tomorrow morning**.", tr: { es: Llámame mañana por la mañana. } }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Before this, next, last, every, today and tomorrow, the time word stands alone."
              es: "Con this, next, last, every, today y tomorrow la expresión de tiempo va sola."

  - title: { en: Typical errors, es: Errores típicos }
    content:
      - type: errors
        audience: true
        rows:
          - { level: A1, wrong: The film starts on 8 o'clock., right: "The film starts **at** 8 o'clock.", rule: { en: clock times → at, es: "las horas → at" } }
          - { level: A1, for: [es], wrong: I work in Mondays., right: "I work **on** Mondays.", rule: { es: "los días → on" } }
          - { level: A1, for: [es], wrong: I work the Mondays., right: "I work **on** Mondays.", rule: { es: "*los lunes* = on Mondays, sin the" } }
          - { level: A1, wrong: My birthday is in 5 May., right: "My birthday is **on** 5 May.", rule: { en: dates → on, es: "las fechas → on" } }
          - { level: A1, for: [es], wrong: I study at the morning., right: "I study **in** the morning.", rule: { es: "*por la mañana* = in the morning" } }
          - { level: A1, for: [es], wrong: See you in Monday morning., right: "See you **on** Monday morning.", rule: { es: "*el lunes por la mañana* = on Monday morning" } }
          - { level: A1, wrong: We relax in the weekend., right: "We relax **at** the weekend.", rule: { en: "at the weekend (US: on the weekend)", es: "at the weekend (US: on the weekend)" } }
          - { level: A1, for: [en], wrong: It's cold on January., right: "It's cold **in** January.", rule: { en: months → in } }
          - { level: A1, for: [es], wrong: I'll see you in next Friday., right: "I'll see you **next** Friday.", rule: { es: "next + día, sin preposición" } }
          - { level: A1, for: [es], wrong: I walk in every morning., right: "I walk **every** morning.", rule: { es: "every + tiempo, sin preposición" } }
