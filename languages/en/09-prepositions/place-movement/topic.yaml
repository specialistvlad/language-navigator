# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.prepositions.place-movement
lang: en
kind: grammar
tags: [prepositions, place, movement, transport]
concepts: [prepositions-place]
related: [en.prepositions.time-in-on-at, en.verbs.phrasal-verbs-core, en.verbs.there-is-are]
status: { en: draft }

title: { en: "Place and Movement" }
summary:
  en: "In, on, at and under say where something is; to, into, out of and through say where it goes. In is inside a space, on touches a surface and at is a point: **in** the bag, **on** the table, **at** the door."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A1, point: in, rule: { en: "inside a space, town, country" }, example: "**in** the bag / **in** Madrid" }
        - { level: A1, point: on, rule: { en: "touching a surface" }, example: "**on** the table / **on** the wall" }
        - { level: A1, point: at, rule: { en: "a point or a place for its purpose" }, example: "**at** the door / **at** home" }
        - { level: A1, point: { en: fixed phrases }, rule: { en: "at home, at work, at school, in bed: no the" }, example: "She's **at** work." }
        - { level: A1, point: "behind, near", rule: { en: "no of" }, example: "I live **near** the park." }
        - { level: A1, point: "next to, in front of", rule: { en: "keep to and of" }, example: "**next to** the café / **in front of** the school" }
        - { level: A1, point: "to / from", rule: { en: "movement to and from a place" }, example: "We go **to** the beach." }
        - { level: A1, point: home, rule: { en: "go home: no to" }, example: "I go **home**." }
        - { level: A2, point: "in → into · on → onto · at → to", rule: { en: "place becomes movement" }, example: "She goes **into** the kitchen." }
        - { level: A2, point: opposite, rule: { en: "facing, no of" }, example: "The hotel is **opposite** the station." }
        - { level: A2, point: arrive, rule: { en: "in a city or country · at a building" }, example: "We arrive **in** Paris." }
        - { level: A2, point: { en: transport }, rule: { en: "bus, train, plane, bike → on · car, taxi → in" }, example: "I get **on** the bus." }

sections:
  - title: { en: "Place: where something is" }
    content:
      - type: table
        columns:
          - { key: prep, label: { en: Preposition } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, prep: in, example: "The keys are **in** the bag." }
          - { level: A1, prep: on, example: "The phone is **on** the table." }
          - { level: A1, prep: at, example: "She is **at** the door." }
          - { level: A1, prep: under, example: "The cat is **under** the chair." }
          - { level: A1, prep: next to, example: "The bank is **next to** the café." }
          - { level: A1, prep: between, example: "The shop is **between** the bank and the café." }
          - { level: A1, prep: behind, example: "The garden is **behind** the house." }
          - { level: A1, prep: in front of, example: "The bus stop is **in front of** the school." }
          - { level: A2, prep: opposite, example: "The hotel is **opposite** the station." }
          - { level: A1, prep: near, example: "I live **near** the park." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**behind**, **opposite** and **near** go straight before the noun: near the park."

  - title: { en: "In, on, at: place" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: "in + room, building, town, country", example: "He lives **in** Madrid. / It's **in** the kitchen." }
          - { level: A1, use: "in + bed, hospital", example: "I'm **in** bed. (US: **in the hospital**)" }
          - { level: A1, use: "on + surface, wall, floor", example: "The picture is **on** the wall." }
          - { level: A1, use: "at + home, work, school, university", example: "She's **at** home. / He's **at** work." }
          - { level: A1, use: "at + point or event", example: "I'm **at** the bus stop. / We're **at** a party." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**at home**, **at work**, **at school** and **in bed** are fixed phrases without *the*."
          - level: A1
            text:
              en: "**in** = inside a space. **on** = touching a surface. **at** = a point or a place for its purpose."

  - title: { en: "Movement: where something goes" }
    content:
      - type: table
        columns:
          - { key: prep, label: { en: Preposition } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, prep: to, example: "We go **to** the beach." }
          - { level: A1, prep: from, example: "She comes **from** Italy." }
          - { level: A2, prep: into, example: "He walks **into** the room." }
          - { level: A2, prep: out of, example: "She gets **out of** the car." }
          - { level: A2, prep: onto, example: "The cat jumps **onto** the sofa." }
          - { level: A2, prep: up, example: "We walk **up** the hill." }
          - { level: A2, prep: down, example: "He runs **down** the stairs." }
          - { level: A2, prep: along, example: "Walk **along** the river." }
          - { level: A2, prep: across, example: "We walk **across** the bridge." }
          - { level: A2, prep: through, example: "The train goes **through** a tunnel." }
          - { level: A2, prep: past, example: "Walk **past** the bank." }
          - { level: A2, prep: towards, example: "The dog runs **towards** me." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**home** follows go, come and get directly: go **home**."
          - level: A1
            text:
              en: "**to school**, **to work** and **to bed** are fixed phrases without *the*: I go **to work**."
          - level: A1
            text:
              en: "**towards** /təˈwɔːdz/ (US: **toward**)."

  - title: { en: "Arriving and transport" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: "arrive in + city, country", example: "We arrive **in** Paris at noon." }
          - { level: A2, use: "arrive at + building, station, event", example: "I arrive **at** the office at nine." }
          - { level: A2, use: "arrive home", example: "She arrives **home** late." }
          - { level: A2, use: "get on / off + bus, train, plane, bike", example: "I get **on** the bus here. / He gets **off** the train." }
          - { level: A2, use: "get in / out of + car, taxi", example: "She gets **in** the taxi. / He gets **out of** the car." }
          - { level: A2, use: "by + transport", example: "I go to school **by bus**. / We go **on foot**." }
          - { level: A2, use: "on + bus, train, plane, bike · in + car, taxi", example: "I'm **on** the train. / She's **in** the car." }

  - title: { en: "Compare: place and movement" }
    content:
      - type: table
        columns:
          - { key: place, label: { en: Place } }
          - { key: movement, label: { en: Movement } }
        rows:
          - { level: A2, place: { ex: "She is **in** the kitchen." }, movement: { ex: "She goes **into** the kitchen." } }
          - { level: A2, place: { ex: "The cat is **on** the sofa." }, movement: { ex: "The cat jumps **onto** the sofa." } }
          - { level: A2, place: { ex: "He is **at** school." }, movement: { ex: "He goes **to** school." } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: The school is in front the park., right: "The school is **in front of** the park.", rule: { en: in front of needs of } }
          - { level: A1, wrong: I live at London., right: "I live **in** London.", rule: { en: towns and countries → in } }
          - { level: A2, wrong: I get in the bus., right: "I get **on** the bus.", rule: { en: "bus, train, plane → get on" } }
          - { level: A2, wrong: She gets on the taxi., right: "She gets **in** the taxi.", rule: { en: "car, taxi → get in / out of" } }
