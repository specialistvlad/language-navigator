# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.word-order
lang: en
kind: grammar
tags: [word-order, sentences, syntax]
concepts: [word-order]
related: [en.sentence-building.questions-negatives, en.adjectives-adverbs.adjective-order, en.adjectives-adverbs.adverbs-frequency-manner, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Word Order }
summary:
  lead: { en: "The order of subject, verb, object, adjectives and adverbs in an English sentence." }
  rule: { en: "The subject is always present and the adjective comes before the noun:" }
  ex: { examples: [[{ target: It }, " is cold."], ["I have a ", { target: red car }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: part, label: { en: Part } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A0, part: { en: "1. Subject" }, ex: [{ target: My sister }, " buys bread in the shop every day."] }
        - { level: A0, part: { en: "2. Verb" }, ex: ["My sister ", { target: buys }, " bread in the shop every day."] }
        - { level: A0, part: { en: "3. Object" }, ex: ["My sister buys ", { target: bread }, " in the shop every day."] }
        - { level: A1, part: { en: "4. Place" }, ex: ["My sister buys bread ", { target: in the shop }, " every day."] }
        - { level: A1, part: { en: "5. Time" }, ex: ["My sister buys bread in the shop ", { target: every day }, "."] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "The order is subject, verb, object (SVO), then place, then time."
          - type: note
            level: A0
            text:
              en: ["Questions change the order. See ", { link: Questions and negatives, to: en.sentence-building.questions-negatives }, "."]

  - title: { en: "Form: statements" }
    role: form
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, rule: { en: The subject is always present. }, ex: { examples: [[{ target: It }, " is cold."], [{ target: She }, " lives in Madrid."]] } }
          - { level: A0, rule: { en: The verb comes right after the subject. }, ex: ["My friend ", { target: came }, " early."] }
          - { level: A0, rule: { en: The object comes right after the verb. }, ex: ["I ", { target: drink tea }, " at night."] }
          - { level: A0, rule: { en: An adjective comes before the noun. }, ex: ["I have a ", { target: red car }, "."] }
      - type: list
        items:
          - type: note
            level: A0
            text:
              en: ["For two or more adjectives, see ", { link: Adjective order, to: en.adjectives-adverbs.adjective-order }, "."]

  - title: { en: Place and time }
    role: own
    content:
      - type: usage
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, rule: { en: Place comes before time. }, ex: ["I went ", { target: to London }, " ", { target: last year }, "."] }
          - { level: A1, rule: { en: A time word can also start the sentence. }, ex: [{ target: Last year }, " I went to London."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A time phrase at the start often takes a comma:"
            ex: [{ target: Last summer }, ", we went to Italy."]
          - type: rule
            level: A1
            text:
              en: "A place or time word follows the object:"
            ex: ["I met ", { target: Ana }, " in the park."]

  - title: { en: Adverbs }
    role: own
    content:
      - type: usage
        columns:
          - { key: adverb, label: { en: Adverb } }
          - { key: position, label: { en: Position } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, adverb: always, position: { en: "before the main verb, after be" }, ex: { examples: [["I ", { target: always }, " eat breakfast."], ["She is ", { target: always }, " late."]] } }
          - { level: A1, adverb: really, position: { en: before the main verb }, ex: ["I ", { target: really }, " like jazz."] }
          - { level: A1, adverb: { alternatives: [very much, a lot] }, position: { en: "at the end, after the object" }, ex: ["I like coffee ", { target: very much }, "."] }
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: ["More on frequency adverbs: ", { link: Adverbs of frequency and manner, to: en.adjectives-adverbs.adverbs-frequency-manner }, "."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: I went yesterday to London., right: ["I went ", { target: to London yesterday }, "."], rule: { en: place before time } }
          - { level: A1, wrong: I eat always breakfast., right: ["I ", { target: always eat }, " breakfast."], rule: { en: frequency adverbs go before the main verb } }
          - { level: A1, wrong: She always is late., right: ["She ", { target: is always }, " late."], rule: { en: frequency adverbs go after be } }
