# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.word-order
lang: en
kind: grammar
tags: [word-order, sentences, syntax]
concepts: [word-order]
related: [en.sentence-building.questions-negatives, en.adjectives-adverbs.adjective-order, en.adjectives-adverbs.adverbs-frequency-manner, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Word Order }
summary:
  en: "The order of subject, verb, object, adjectives and adverbs in an English sentence. The subject is always present and the adjective comes before the noun: **It** is cold. I have a **red car**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: part, label: { en: Part } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A0, part: { en: 1. Subject }, example: "**My sister** buys bread in the shop every day." }
        - { level: A0, part: { en: 2. Verb }, example: "My sister **buys** bread in the shop every day." }
        - { level: A0, part: { en: 3. Object }, example: "My sister buys **bread** in the shop every day." }
        - { level: A1, part: { en: 4. Place }, example: "My sister buys bread **in the shop** every day." }
        - { level: A1, part: { en: 5. Time }, example: "My sister buys bread in the shop **every day**." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A0
            text:
              en: "The order is subject, verb, object (SVO), then place, then time."
          - level: A0
            text:
              en: "Questions change the order. See [Questions and negatives](id:en.sentence-building.questions-negatives)."

  - title: { en: "Form: statements" }
    content:
      - type: table
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, rule: { en: "The subject is always present." }, example: "**It** is cold. / **She** lives in Madrid." }
          - { level: A0, rule: { en: "The verb comes right after the subject." }, example: "My friend **came** early." }
          - { level: A0, rule: { en: "The object comes right after the verb." }, example: "I **drink tea** at night." }
          - { level: A0, rule: { en: "An adjective comes before the noun." }, example: "I have a **red car**." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "For two or more adjectives, see [Adjective order](id:en.adjectives-adverbs.adjective-order)."

  - title: { en: Place and time }
    content:
      - type: table
        columns:
          - { key: rule, label: { en: Rule } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, rule: { en: "Place comes before time." }, example: "I went **to London** **last year**." }
          - { level: A1, rule: { en: "A time word can also start the sentence." }, example: "**Last year** I went to London." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A time phrase at the start often takes a comma: **Last summer**, we went to Italy."
          - level: A1
            text:
              en: "A place or time word follows the object: I met **Ana** in the park."

  - title: { en: Adverbs }
    content:
      - type: table
        columns:
          - { key: adverb, label: { en: Adverb } }
          - { key: position, label: { en: Position } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, adverb: always, position: { en: "before the main verb, after be" }, example: "I **always** eat breakfast. / She is **always** late." }
          - { level: A1, adverb: really, position: { en: "before the main verb" }, example: "I **really** like jazz." }
          - { level: A1, adverb: "very much / a lot", position: { en: "at the end, after the object" }, example: "I like coffee **very much**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "More on frequency adverbs: [Adverbs of frequency and manner](id:en.adjectives-adverbs.adverbs-frequency-manner)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: I went yesterday to London., right: "I went **to London yesterday**.", rule: { en: place before time } }
          - { level: A1, wrong: I eat always breakfast., right: "I **always eat** breakfast.", rule: { en: frequency adverbs go before the main verb } }
          - { level: A1, wrong: She always is late., right: "She **is always** late.", rule: { en: frequency adverbs go after be } }
