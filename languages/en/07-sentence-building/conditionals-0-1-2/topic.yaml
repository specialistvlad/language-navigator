# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.conditionals-0-1-2
lang: en
kind: grammar
tags: [conditionals, if, unless]
concepts: [conditionals]
related: [en.sentence-building.conjunctions-linkers, en.tenses.simple-tenses, en.tenses.future-forms, en.modals.would]
status: { en: draft }

title: { en: "Conditionals: Zero, First and Second" }
summary:
  en: "If-sentences for facts (zero), real possibilities (first) and imagined situations (second). After if the verb is in the present simple, even for the future: If it **rains**, we'll stay in."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: type, label: { en: Type } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A2, type: "Zero: if + present, present", example: "If you **heat** ice, it **melts**." }
        - { level: A2, type: "First: if + present, will + V", example: "If it **rains**, we'**ll stay** in." }
        - { level: B1, type: "Second: if + past, would + V", example: "If I **had** more time, I'**d learn** Spanish." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A2
            text:
              en: "Zero and first conditionals talk about real situations. The second talks about imagined ones."

  - title: { en: "Form: zero and first" }
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, type: { en: Zero }, pattern: "if + present, present", example: "If you **mix** blue and yellow, you **get** green." }
          - { level: A2, type: { en: First }, pattern: "if + present, will + V", example: "If you **study**, you'**ll pass**." }
          - { level: A2, type: { en: First (negative) }, pattern: "if + don't / doesn't + V, will + V", example: "If you **don't hurry**, you'**ll miss** the bus." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The if-clause uses the present simple, also for the future."
          - level: A2
            text:
              en: "The first conditional main clause can also use can, may or an imperative: If you feel ill, **call** me."

  - title: { en: "Form: second" }
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, type: { en: Second }, pattern: "if + past simple, would + V", example: "If I **won** the lottery, I'**d buy** a house." }
          - { level: B1, type: { en: Second (negative) }, pattern: "if + didn't + V, would + V", example: "If I **didn't have** to work, I'**d travel**." }
          - { level: B1, type: { en: "Second with be" }, pattern: "if + were, would + V", example: "If it **were** sunny, we'**d go** out." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "The past simple in the if-clause refers to the present or the future."
          - level: B1
            text:
              en: "**were** works for every person: If he **were** here, he'd help. **was** is common in informal speech."
          - level: B1
            text:
              en: "The main clause can also use could or might: If I had time, I **could** help."

  - title: { en: Order of the clauses }
    content:
      - type: table
        columns:
          - { key: order, label: { en: Order } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, order: { en: "if-clause first: comma" }, example: "**If it rains**, we'll stay in." }
          - { level: A2, order: { en: "if-clause second: no comma" }, example: "We'll stay in **if it rains**." }

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Facts and general truths (zero)" }, example: "If you **press** this button, the door **opens**." }
          - { level: A2, use: { en: "Real possibilities in the future (first)" }, example: "If I **see** Ana, I'**ll tell** her." }
          - { level: B1, use: { en: "Unreal or unlikely situations (second)" }, example: "If I **were** a bird, I'**d fly** to Spain." }
          - { level: B1, use: { en: "Advice: If I were you (second)" }, example: "If I **were** you, I'**d take** the train." }

  - title: { en: Unless }
    content:
      - type: bullets
        items:
          - level: B1
            text:
              en: "**unless** means **if … not**. It takes an affirmative verb:"
            ex: "**Unless** you hurry, you'll miss the bus. = If you **don't** hurry, you'll miss the bus."
          - level: B1
            text:
              en: "**unless** goes with the zero and first conditionals. See [Conjunctions and Linkers](id:en.sentence-building.conjunctions-linkers)."

  - title: { en: "Compare: first and second conditional" }
    content:
      - type: table
        columns:
          - { key: first, label: First conditional }
          - { key: second, label: Second conditional }
        rows:
          - { level: B1, first: { en: "real, possible" }, second: { en: "imagined, unlikely" } }
          - { level: B1, first: { ex: "If I **win**, I'**ll buy** a car." }, second: { ex: "If I **won**, I'**d buy** a car." } }
          - { level: B1, first: { ex: "If we **have** time, we'**ll visit** you." }, second: { ex: "If we **had** time, we'**d visit** you." } }
      - type: bullets
        items:
          - level: B1
            text:
              en: "The speaker chooses by how likely the situation seems."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "If I am you, I would go.", right: "If I **were** you, I'd go.", rule: { en: advice uses If I were you } }
          - { level: B1, wrong: "If I win the lottery, I would buy a house.", right: "If I **won** the lottery, I **would** buy a house.", rule: { en: "match the pair: present + will or past + would" } }
          - { level: A2, wrong: If it rains we'll stay in., right: "**If it rains,** we'll stay in.", rule: { en: comma after an if-clause at the start } }
          - { level: B1, wrong: "Unless you don't hurry, you'll miss the bus.", right: "**Unless** you hurry, you'll miss the bus.", rule: { en: unless already means if … not } }
          - { level: A2, wrong: "If she come, I'll call you.", right: "If she **comes**, I'll call you.", rule: { en: she / he / it → V-s in the if-clause } }
