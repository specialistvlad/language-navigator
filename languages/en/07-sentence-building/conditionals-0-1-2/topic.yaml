# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.conditionals-0-1-2
lang: en
kind: grammar
levels: [A2, B1]
tags: [conditionals, if, unless]
concepts: [conditionals]
related: [en.sentence-building.conjunctions-linkers, en.tenses.present-simple, en.tenses.future-forms, en.tenses.past-simple, en.modals.would]
status: { en: draft, es: draft }

title: { en: "Conditionals: Zero, First and Second", es: "Condicionales 0, 1 y 2 (conditionals)" }
summary:
  en: "if-sentences for facts, real possibilities and imagined situations."
  es: "Frases con if para hechos, posibilidades reales y situaciones imaginadas."

sections:
  - title: { en: Overview, es: Resumen }
    level: A2-B1
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type, es: Tipo } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, type: "Zero: if + present, present", example: "If you **heat** ice, it **melts**.", tr: { es: "Si calientas hielo, se derrite." } }
          - { level: A2, type: "First: if + present, will + V", example: "If it **rains**, we'**ll stay** in.", tr: { es: "Si llueve, nos quedaremos en casa." } }
          - { level: B1, type: "Second: if + past, would + V", example: "If I **had** more time, I'**d learn** Spanish.", tr: { es: "Si tuviera más tiempo, aprendería español." } }
      - type: bullets
        items:
          - en: "Zero and first conditionals talk about real situations. The second talks about imagined ones."
            es: "El condicional cero y el primero hablan de situaciones reales. El segundo habla de situaciones imaginadas."
          - for: [es]
            text: { es: "*Si* + presente → **if** + present simple. Tras **if** va el presente simple, también para el futuro." }

  - title: { en: "Form: zero and first", es: "Forma: cero y primero" }
    level: A2
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type, es: Tipo } }
          - { key: pattern, label: { en: Pattern, es: Patrón } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { type: { en: Zero, es: Cero }, pattern: "if + present, present", example: "If you **mix** blue and yellow, you **get** green.", tr: { es: "Si mezclas azul y amarillo, sale verde." } }
          - { type: { en: First, es: Primero }, pattern: "if + present, will + V", example: "If you **study**, you'**ll pass**.", tr: { es: "Si estudias, aprobarás." } }
          - { type: { en: First (negative), es: Primero (negativo) }, pattern: "if + don't / doesn't + V, will + V", example: "If you **don't hurry**, you'**ll miss** the bus.", tr: { es: "Si no te das prisa, perderás el autobús." } }
      - type: bullets
        items:
          - en: "The if-clause uses the present simple, also for the future."
            es: "La oración con if usa el presente simple, también para el futuro."
          - en: "The first conditional main clause can also use can, may or an imperative: If you feel ill, **call** me."
            es: "La oración principal del primero también puede llevar can, may o un imperativo: If you feel ill, **call** me."
          - for: [es]
            text: { es: "*Si llueve, nos quedaremos* → If it **rains**, we'll stay." }

  - title: { en: "Form: second", es: "Forma: segundo" }
    level: B1
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type, es: Tipo } }
          - { key: pattern, label: { en: Pattern, es: Patrón } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { type: { en: Second, es: Segundo }, pattern: "if + past simple, would + V", example: "If I **won** the lottery, I'**d buy** a house.", tr: { es: "Si me tocara la lotería, me compraría una casa." } }
          - { type: { en: Second (negative), es: Segundo (negativo) }, pattern: "if + didn't + V, would + V", example: "If I **didn't have** to work, I'**d travel**.", tr: { es: "Si no tuviera que trabajar, viajaría." } }
          - { type: { en: "Second with be", es: "Segundo con be" }, pattern: "if + were, would + V", example: "If it **were** sunny, we'**d go** out.", tr: { es: "Si hiciera sol, saldríamos." } }
      - type: bullets
        items:
          - en: "The past simple in the if-clause refers to the present or the future."
            es: "El pasado simple de la oración con if se refiere al presente o al futuro."
          - en: "**were** works for every person: If he **were** here, he'd help. **was** is common in informal speech."
            es: "**were** sirve para todas las personas: If he **were** here, he'd help. **was** es frecuente en el habla informal."
          - en: "The main clause can also use could or might: If I had time, I **could** help."
            es: "La oración principal también puede llevar could o might: If I had time, I **could** help."
          - for: [es]
            text: { es: "*Si tuviera* (imperfecto de subjuntivo) → if I **had** (pasado simple). *Aprendería* (condicional) → I **would** learn." }

  - title: { en: Order of the clauses, es: Orden de las oraciones }
    level: A2
    content:
      - type: table
        columns:
          - { key: order, label: { en: Order, es: Orden } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { order: { en: "if-clause first: comma", es: "if primero: con coma" }, example: "**If it rains**, we'll stay in.", tr: { es: "Si llueve, nos quedaremos en casa." } }
          - { order: { en: "if-clause second: no comma", es: "if después: sin coma" }, example: "We'll stay in **if it rains**.", tr: { es: Nos quedaremos en casa si llueve. } }

  - title: { en: Use, es: Uso }
    level: A2-B1
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, use: { en: "Facts and general truths (zero)", es: "Hechos y verdades generales (cero)" }, example: "If you **press** this button, the door **opens**.", tr: { es: "Si pulsas este botón, la puerta se abre." } }
          - { level: A2, use: { en: "Real possibilities in the future (first)", es: "Posibilidades reales en el futuro (primero)" }, example: "If I **see** Ana, I'**ll tell** her.", tr: { es: "Si veo a Ana, se lo diré." } }
          - { level: B1, use: { en: "Unreal or unlikely situations (second)", es: "Situaciones irreales o poco probables (segundo)" }, example: "If I **were** a bird, I'**d fly** to Spain.", tr: { es: "Si fuera un pájaro, volaría a España." } }
          - { level: B1, use: { en: "Advice: If I were you (second)", es: "Consejos: If I were you (segundo)" }, example: "If I **were** you, I'**d take** the train.", tr: { es: "Yo que tú, cogería el tren." } }

  - title: { en: Unless, es: Unless }
    level: B1
    content:
      - type: bullets
        items:
          - text:
              en: "**unless** means **if … not**. It takes an affirmative verb:"
              es: "**unless** significa **if … not**. Lleva el verbo en afirmativa:"
            ex: "**Unless** you hurry, you'll miss the bus. = If you **don't** hurry, you'll miss the bus."
            tr: { es: "A menos que te des prisa, perderás el autobús." }
          - en: "**unless** goes with the zero and first conditionals. See [Conjunctions and Linkers](id:en.sentence-building.conjunctions-linkers)."
            es: "**unless** se usa con el condicional cero y el primero. Ver [Conjunciones y conectores](id:en.sentence-building.conjunctions-linkers)."

  - title: { en: "Compare: first and second conditional", es: "Comparación: first y second conditional" }
    level: B1
    content:
      - type: table
        columns:
          - { key: first, label: First conditional }
          - { key: second, label: Second conditional }
        rows:
          - { first: { en: "real, possible", es: "real, posible" }, second: { en: "imagined, unlikely", es: "imaginado, improbable" } }
          - { first: { ex: "If I **win**, I'**ll buy** a car.", tr: { es: "Si gano, me compraré un coche." } }, second: { ex: "If I **won**, I'**d buy** a car.", tr: { es: "Si ganara, me compraría un coche." } } }
          - { first: { ex: "If we **have** time, we'**ll visit** you.", tr: { es: "Si tenemos tiempo, os visitaremos." } }, second: { ex: "If we **had** time, we'**d visit** you.", tr: { es: "Si tuviéramos tiempo, os visitaríamos." } } }
      - type: bullets
        items:
          - en: "The speaker chooses by how likely the situation seems."
            es: "El hablante elige según lo probable que le parece la situación."

  - title: { en: Typical errors, es: Errores típicos }
    level: A2-B1
    content:
      - type: errors
        audience: true
        rows:
          - { for: [es], wrong: "If it will rain, we'll stay in.", right: "If it **rains**, we'll stay in.", rule: { es: "tras if va presente simple" } }
          - { for: [es], wrong: "If I would have time, I would help.", right: "If I **had** time, I'd help.", rule: { es: "tras if va pasado simple" } }
          - { wrong: "If I am you, I would go.", right: "If I **were** you, I'd go.", rule: { en: advice uses If I were you, es: el consejo usa If I were you } }
          - { wrong: "If I win the lottery, I would buy a house.", right: "If I **won** the lottery, I **would** buy a house.", rule: { en: "match the pair: present + will or past + would", es: "empareja bien: presente + will o pasado + would" } }
          - { wrong: If it rains we'll stay in., right: "If it rains**,** we'll stay in.", rule: { en: comma after an if-clause at the start, es: coma tras la oración con if al principio } }
          - { wrong: "Unless you don't hurry, you'll miss the bus.", right: "**Unless** you hurry, you'll miss the bus.", rule: { en: unless already means if … not, es: unless ya significa if … not } }
          - { for: [en], wrong: "If she come, I'll call you.", right: "If she **comes**, I'll call you.", rule: { en: she / he / it → V-s in the if-clause } }

essentials:
  - level: A2
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: type, label: { en: Type, es: Tipo } }
              - { key: pattern, label: { en: Pattern, es: Patrón } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { type: { en: Zero, es: Cero }, pattern: "if + present, present", example: "If you **heat** ice, it **melts**." }
              - { type: { en: First, es: Primero }, pattern: "if + present, will + V", example: "If it **rains**, we'**ll stay** in." }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - en: "After **if** the verb is in the present simple, also for the future."
                es: "Tras **if** el verbo va en presente simple, también para el futuro."
              - en: "If-clause first: comma. If-clause second: no comma."
                es: "Oración con if primero: coma. Oración con if después: sin coma."
      - title: { en: Use, es: Uso }
        content:
          - type: table
            columns:
              - { key: use, label: { en: Use, es: Uso } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { use: { en: "facts (zero)", es: "hechos (cero)" }, example: "If you **press** this button, the door **opens**." }
              - { use: { en: "real possibility (first)", es: "posibilidad real (primero)" }, example: "If I **see** Ana, I'**ll tell** her." }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { for: [es], wrong: "If it will rain, we'll stay in.", right: "If it **rains**, we'll stay in." }
  - level: B1
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: { en: Second conditional, es: Segundo condicional }, rule: "if + past simple, would + V", example: "If I **won**, I'**d buy** a house." }
          - { point: If I were you, rule: { en: "were for every person; gives advice", es: "were para todas las personas; da consejos" }, example: "If I **were** you, I'**d go**." }
          - { point: { en: First or second, es: Primero o segundo }, rule: { en: "possible → will; unlikely → would", es: "posible → will; improbable → would" }, example: "If I **win**, I'**ll** … / If I **won**, I'**d** …" }
          - { point: unless, rule: "= if … not", example: "**Unless** you hurry, you'll miss it." }

reminders:
  - level: A2
    items:
      - en: "After **if** the present simple stands for the future: If it **rains**, we'll stay in."
        es: "Tras **if** el presente simple expresa el futuro: If it **rains**, we'll stay in."
  - level: B1
    items:
      - en: "After **if** the past simple stands for the imagined present: If I **had** time, I'd help."
        es: "Tras **if** el pasado simple expresa el presente imaginado: If I **had** time, I'd help."
      - en: "**unless** = if … not: **Unless** it rains."
        es: "**unless** = if … not: **Unless** it rains."
