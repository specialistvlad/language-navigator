# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.question-tags
lang: en
kind: grammar
tags: [questions, tags, intonation]
concepts: [question-tags]
related: [en.sentence-building.questions-negatives, en.tenses.simple-tenses, en.tenses.perfect-tenses]
status: { en: draft }

title: { en: Question Tags }
summary:
  en: "Question tags are short questions added to a statement to check or confirm it. A positive statement takes a negative tag and a negative statement a positive tag, with the same auxiliary: It's cold, **isn't it**?"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Tag } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: B1, point: { en: Positive statement }, rule: { en: negative tag }, example: "It's cold, **isn't it**?" }
        - { level: B1, point: { en: Negative statement }, rule: { en: positive tag }, example: "It isn't cold, **is it**?" }
        - { level: B1, point: be, rule: "isn't / aren't / wasn't / weren't", example: "They **were** late, **weren't they**?" }
        - { level: B1, point: Present simple, rule: don't / doesn't, example: "She **works** here, **doesn't she**?" }
        - { level: B1, point: Past simple, rule: didn't, example: "He **left** early, **didn't he**?" }
        - { level: B1, point: { en: "have, modals" }, rule: { en: "repeat the auxiliary or modal" }, example: "You **can** swim, **can't you**?" }
        - { level: B1, point: { en: Pronoun }, rule: { en: "the tag ends with a pronoun that replaces the subject" }, example: "Tom is late, **isn't he**?" }
        - { level: B1, point: I am, rule: aren't I, example: "I'**m** right, **aren't I**?" }
        - { level: B1, point: Let's, rule: shall we, example: "**Let's** go, **shall we**?" }
        - { level: B1, point: { en: Command }, rule: will you, example: "**Open** the door, **will you**?" }
        - { level: B1, point: "nobody, nothing, never", rule: { en: "the statement is negative, so the tag is positive" }, example: "**Nobody** called, **did they**?" }
        - { level: B1, point: { en: Intonation }, rule: { en: "falling ↘ = you are sure; rising ↗ = a real question" }, example: "You haven't seen my keys, **have you**? ↗" }

sections:
  - title: { en: "Form: auxiliary and pronoun" }
    content:
      - type: table
        columns:
          - { key: statement, label: { en: Statement } }
          - { key: tag, label: { en: Tag } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, statement: { en: positive }, tag: { en: negative }, example: "It's cold, **isn't it**?" }
          - { level: B1, statement: { en: negative }, tag: { en: positive }, example: "It isn't cold, **is it**?" }
      - type: bullets
        items:
          - level: B1
            text:
              en: "The tag is an auxiliary + a pronoun: isn't **it**, doesn't **she**."
          - level: B1
            text:
              en: "The pronoun replaces the subject: Tom is late, isn't **he**?"
          - level: B1
            text:
              en: "The negative tag uses the short form: isn't, doesn't, can't."

  - title: { en: "Form: the auxiliary matches the verb" }
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb in the statement } }
          - { key: tag, label: { en: Tag } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, verb: be, tag: "isn't / aren't / wasn't / weren't", example: "They **were** late, **weren't they**?" }
          - { level: B1, verb: present simple (other verbs), tag: don't / doesn't, example: "She **works** here, **doesn't she**?" }
          - { level: B1, verb: past simple (other verbs), tag: didn't, example: "He **left** early, **didn't he**?" }
          - { level: B1, verb: "have / has / had + participle", tag: "haven't / hasn't / hadn't", example: "You've **finished**, **haven't you**?" }
          - { level: B1, verb: "will, can, must, should…", tag: "the same modal", example: "You **can** swim, **can't you**?" }
      - type: bullets
        items:
          - level: B1
            text:
              en: "When the statement has an auxiliary or a modal, the tag repeats it."
          - level: B1
            text:
              en: "When it has no auxiliary, the tag uses **do / does / did**."

  - title: { en: "Form: special cases" }
    content:
      - type: table
        columns:
          - { key: start, label: { en: Statement } }
          - { key: tag, label: { en: Tag } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, start: I am, tag: aren't I, example: "I'**m** right, **aren't I**?" }
          - { level: B1, start: Let's, tag: shall we, example: "**Let's** go, **shall we**?" }
          - { level: B1, start: { en: command }, tag: will you, example: "**Open** the door, **will you**?" }
          - { level: B1, start: { en: negative command }, tag: will you, example: "**Don't** be late, **will you**?" }
          - { level: B1, start: There is / are, tag: isn't / aren't there, example: "**There's** a bus, **isn't there**?" }
          - { level: B1, start: "everybody, somebody, nobody", tag: they, example: "**Everybody** came, **didn't they**?" }
          - { level: B1, start: "nobody, nothing, never", tag: { en: positive tag }, example: "**Nobody** called, **did they**?" }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**Nobody**, **nothing** and **never** make the statement negative, so the tag is positive."
          - level: B1
            text:
              en: "A tag after a command is a polite request. **won't you** is more friendly: Come in, won't you?"

  - title: { en: "Pronunciation: intonation" }
    content:
      - type: table
        columns:
          - { key: tone, label: { en: Tone } }
          - { key: meaning, label: { en: Meaning } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, tone: { en: "falling ↘" }, meaning: { en: "you are sure and want agreement" }, example: "It's a lovely day, **isn't it**? ↘" }
          - { level: B1, tone: { en: "rising ↗" }, meaning: { en: "you are not sure and ask a real question" }, example: "You haven't seen my keys, **have you**? ↗" }
      - type: bullets
        items:
          - level: B1
            text:
              en: "The voice falls or rises on the tag."
          - level: B1
            text:
              en: "A rising tag expects the answer **yes** or **no**."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, use: { en: "Checking something you think is true" }, example: "You're from Madrid, **aren't you**?" }
          - { level: B1, use: { en: "Making conversation" }, example: "Lovely weather, **isn't it**?" }
          - { level: B1, use: { en: "Asking politely for help" }, example: "You couldn't lend me a pen, **could you**?" }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "You like tea, aren't you?", right: "You like tea, **don't you**?", rule: { en: "the tag matches the verb: like → don't" } }
          - { level: B1, wrong: "She works here, isn't she?", right: "She works here, **doesn't she**?", rule: { en: "present simple, he / she / it → doesn't" } }
          - { level: B1, wrong: "He doesn't like it, doesn't he?", right: "He doesn't like it, **does he**?", rule: { en: "negative statement → positive tag" } }
          - { level: B1, wrong: "Let's go, will we?", right: "Let's go, **shall we**?", rule: { en: "Let's → shall we" } }
          - { level: B1, wrong: "Open the door, don't you?", right: "Open the door, **will you**?", rule: { en: "command → will you" } }
          - { level: B1, wrong: "Tom is late, isn't Tom?", right: "Tom is late, isn't **he**?", rule: { en: "the tag uses a pronoun" } }
          - { level: B1, wrong: "Nobody called, didn't they?", right: "Nobody called, **did they**?", rule: { en: "nobody is negative → positive tag" } }
