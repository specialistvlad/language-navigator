# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.question-tags
lang: en
kind: grammar
tags: [questions, tags, intonation]
concepts: [question-tags]
related: [en.sentence-building.questions-negatives, en.tenses.simple-tenses, en.tenses.perfect-tenses]
status: { en: draft }

title: { en: Question Tags }
summary:
  lead: { en: Question tags are short questions added to a statement to check or confirm it. }
  rule: { en: "A positive statement takes a negative tag and a negative statement a positive tag, with the same auxiliary:" }
  ex: { examples: [It's cold, [{ target: isn't it }, "?"]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Tag } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: B1, point: { en: Positive statement }, rule: { en: negative tag }, ex: ["It's cold, ", { target: isn't it }, "?"] }
        - { level: B1, point: { en: Negative statement }, rule: { en: positive tag }, ex: ["It isn't cold, ", { target: is it }, "?"] }
        - { level: B1, point: be, rule: { alternatives: [isn't, aren't, wasn't, weren't] }, ex: ["They ", { target: were }, " late, ", { target: weren't they }, "?"] }
        - { level: B1, point: Present simple, rule: { alternatives: [don't, doesn't] }, ex: ["She ", { target: works }, " here, ", { target: doesn't she }, "?"] }
        - { level: B1, point: Past simple, rule: didn't, ex: ["He ", { target: left }, " early, ", { target: didn't he }, "?"] }
        - { level: B1, point: { en: "have, modals" }, rule: { en: repeat the auxiliary or modal }, ex: ["You ", { target: can }, " swim, ", { target: can't you }, "?"] }
        - { level: B1, point: { en: Pronoun }, rule: { en: the tag ends with a pronoun that replaces the subject }, ex: ["Tom is late, ", { target: isn't he }, "?"] }
        - { level: B1, point: I am, rule: aren't I, ex: [I', { target: m }, " right, ", { target: aren't I }, "?"] }
        - { level: B1, point: Let's, rule: shall we, ex: [{ target: Let's }, " go, ", { target: shall we }, "?"] }
        - { level: B1, point: { en: Command }, rule: will you, ex: [{ target: Open }, " the door, ", { target: will you }, "?"] }
        - { level: B1, point: "nobody, nothing, never", rule: { en: "the statement is negative, so the tag is positive" }, ex: [{ target: Nobody }, " called, ", { target: did they }, "?"] }
        - { level: B1, point: { en: Intonation }, rule: { en: ["falling ", { intonation: fall }, " = you are sure; rising ", { intonation: rise }, " = a real question"] }, ex: ["You haven't seen my keys, ", { target: have you }, "? ", { intonation: rise }] }

sections:
  - title: { en: "Form: auxiliary and pronoun" }
    role: form
    content:
      - type: usage
        columns:
          - { key: statement, label: { en: Statement } }
          - { key: tag, label: { en: Tag } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, statement: { en: positive }, tag: { en: negative }, ex: ["It's cold, ", { target: isn't it }, "?"] }
          - { level: B1, statement: { en: negative }, tag: { en: positive }, ex: ["It isn't cold, ", { target: is it }, "?"] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["The tag is an ", { pattern: [auxiliary, a pronoun] }, ": isn't ", { term: it }, ", doesn't ", { term: she }, "."]
          - type: rule
            level: B1
            text:
              en: "The pronoun replaces the subject:"
            ex: ["Tom is late, isn't ", { target: he }, "?"]
          - type: rule
            level: B1
            text:
              en: "The negative tag uses the short form: isn't, doesn't, can't."

  - title: { en: "Form: the auxiliary matches the verb" }
    role: form
    content:
      - type: usage
        columns:
          - { key: verb, label: { en: Verb in the statement } }
          - { key: tag, label: { en: Tag } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, verb: be, tag: { alternatives: [isn't, aren't, wasn't, weren't] }, ex: ["They ", { target: were }, " late, ", { target: weren't they }, "?"] }
          - { level: B1, verb: { en: present simple (other verbs) }, tag: { alternatives: [don't, doesn't] }, ex: ["She ", { target: works }, " here, ", { target: doesn't she }, "?"] }
          - { level: B1, verb: { en: past simple (other verbs) }, tag: didn't, ex: ["He ", { target: left }, " early, ", { target: didn't he }, "?"] }
          - { level: B1, verb: { pattern: [{ alternatives: [have, has, had] }, { slot: { en: participle } }] }, tag: { alternatives: [haven't, hasn't, hadn't] }, ex: ["You've ", { target: finished }, ", ", { target: haven't you }, "?"] }
          - { level: B1, verb: ["will, can, must, should", { gap: true }], tag: the same modal, ex: ["You ", { target: can }, " swim, ", { target: can't you }, "?"] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "When the statement has an auxiliary or a modal, the tag repeats it."
          - type: rule
            level: B1
            text:
              en: ["When it has no auxiliary, the tag uses ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]

  - title: { en: "Form: special cases" }
    role: form
    content:
      - type: usage
        columns:
          - { key: start, label: { en: Statement } }
          - { key: tag, label: { en: Tag } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, start: I am, tag: aren't I, ex: [I', { target: m }, " right, ", { target: aren't I }, "?"] }
          - { level: B1, start: Let's, tag: shall we, ex: [{ target: Let's }, " go, ", { target: shall we }, "?"] }
          - { level: B1, start: { en: command }, tag: will you, ex: [{ target: Open }, " the door, ", { target: will you }, "?"] }
          - { level: B1, start: { en: negative command }, tag: will you, ex: [{ target: Don't }, " be late, ", { target: will you }, "?"] }
          - { level: B1, start: { alternatives: [There is, are] }, tag: [{ alternatives: [isn't, aren't] }, " there"], ex: [{ target: There's }, " a bus, ", { target: isn't there }, "?"] }
          - { level: B1, start: "everybody, somebody, nobody", tag: they, ex: [{ target: Everybody }, " came, ", { target: didn't they }, "?"] }
          - { level: B1, start: "nobody, nothing, never", tag: { en: positive tag }, ex: [{ target: Nobody }, " called, ", { target: did they }, "?"] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: [{ term: Nobody }, ", ", { term: nothing }, " and ", { term: never }, " make the statement negative, so the tag is positive."]
          - type: rule
            level: B1
            text:
              en: ["A tag after a command is a polite request. ", { term: won't you }, " is more friendly: Come in, won't you?"]

  - title: { en: "Pronunciation: intonation" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: tone, label: { en: Tone } }
          - { key: meaning, label: { en: Meaning } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, tone: { en: ["falling ", { intonation: fall }] }, meaning: { en: you are sure and want agreement }, ex: ["It's a lovely day, ", { target: isn't it }, "? ", { intonation: fall }] }
          - { level: B1, tone: { en: ["rising ", { intonation: rise }] }, meaning: { en: you are not sure and ask a real question }, ex: ["You haven't seen my keys, ", { target: have you }, "? ", { intonation: rise }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: The voice falls or rises on the tag.
          - type: rule
            level: B1
            text:
              en: ["A rising tag expects the answer ", { term: "yes" }, " or ", { term: "no" }, "."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, use: { en: Checking something you think is true }, ex: ["You're from Madrid, ", { target: aren't you }, "?"] }
          - { level: B1, use: { en: Making conversation }, ex: ["Lovely weather, ", { target: isn't it }, "?"] }
          - { level: B1, use: { en: Asking politely for help }, ex: ["You couldn't lend me a pen, ", { target: could you }, "?"] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "You like tea, aren't you?", right: ["You like tea, ", { target: don't you }, "?"], rule: { en: ["the tag matches the verb: ", { mapping: [like, don't] }] } }
          - { level: B1, wrong: "She works here, isn't she?", right: ["She works here, ", { target: doesn't she }, "?"], rule: { en: { takes: [["present simple, ", { alternatives: [he, she, it] }], doesn't] } } }
          - { level: B1, wrong: "He doesn't like it, doesn't he?", right: ["He doesn't like it, ", { target: does he }, "?"], rule: { en: { takes: [negative statement, positive tag] } } }
          - { level: B1, wrong: "Let's go, will we?", right: ["Let's go, ", { target: shall we }, "?"], rule: { en: { takes: [Let's, shall we] } } }
          - { level: B1, wrong: "Open the door, don't you?", right: ["Open the door, ", { target: will you }, "?"], rule: { en: { takes: [command, will you] } } }
          - { level: B1, wrong: "Tom is late, isn't Tom?", right: ["Tom is late, isn't ", { target: he }, "?"], rule: { en: the tag uses a pronoun } }
          - { level: B1, wrong: "Nobody called, didn't they?", right: ["Nobody called, ", { target: did they }, "?"], rule: { en: { takes: [nobody is negative, positive tag] } } }
