# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.questions-negatives
lang: en
kind: grammar
tags: [questions, negatives, wh-questions, auxiliaries]
concepts: [questions-negatives]
related: [en.sentence-building.word-order, en.tenses.simple-tenses, en.verbs.to-be, en.modals.can-could, en.sentence-building.question-tags]
status: { en: draft }

title: { en: "Questions and negatives" }
summary:
  en: "Yes/no questions, wh-questions, short answers and negatives, with be, modals and every other verb. Be and modals invert or take not; other verbs use do, does or did with the base verb: **Do** you **like** tea?"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: be, label: { en: "be and modals" } }
        - { key: other, label: { en: Other verbs } }
      rows:
        - level: A1
          form: { en: Affirmative }
          be: { ex: "She **is** here. / She **can** swim." }
          other: { ex: "She **likes** tea." }
        - level: A1
          form: { en: Negative }
          be: { ex: "She **isn't** here. / She **can't** swim." }
          other: { ex: "She **doesn't like** tea." }
        - level: A1
          form: { en: Question }
          be: { ex: "**Is** she here? / **Can** she swim?" }
          other: { ex: "**Does** she **like** tea?" }
        - level: A1
          form: { en: Short answer }
          be: { ex: "Yes, she **is**. / No, she **can't**." }
          other: { ex: "Yes, she **does**. / No, she **doesn't**." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "**be** and modal verbs invert with the subject or take **not**. Other verbs use **do / does / did**."
          - level: A1
            text:
              en: "Every question and negative sentence has a subject."

  - title: { en: "Form: be and modals" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, form: { en: Negative }, pattern: "subject + be / modal + not", example: "They **are not** at home. / He **can't** drive." }
          - { level: A1, form: { en: Question }, pattern: "be / modal + subject", example: "**Are** they at home? / **Can** he drive?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**be** and **can**, **will**, **should**, **must** need no do / does / did."
          - level: A1
            text:
              en: "**am not** has the short form **I'm not**: I'm not ready."
          - level: A1
            text:
              en: "**have got** inverts too: **Have** you **got** a pen?"

  - title: { en: "Form: do, does and did" }
    content:
      - type: table
        columns:
          - { key: aux, label: { en: Auxiliary } }
          - { key: use, label: { en: Subject and tense } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, aux: do / don't, use: { en: "I / you / we / they, present" }, example: "**Do** you **like** jazz?" }
          - { level: A1, aux: does / doesn't, use: { en: "he / she / it, present" }, example: "He **doesn't like** jazz." }
          - { level: A1, aux: did / didn't, use: { en: "every subject, past" }, example: "**Did** you **call** her?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "After **do / does / did** the verb is in the base form: Did you **call**?"
          - level: A1
            text:
              en: "The auxiliary carries the tense and the person; the main verb stays unchanged."
          - level: A1
            text:
              en: "Present tables: [Present Simple](id:en.tenses.simple-tenses). Past: [Past simple](id:en.tenses.simple-tenses)."
          - level: A1
            text:
              en: "A negative sentence takes one negative word: I **don't** know **anything**. / I know **nothing**."

  - title: { en: "Form: negative contractions" }
    content:
      - type: table
        columns:
          - { key: full, label: { en: Full form } }
          - { key: short, label: { en: Short form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, full: is not, short: isn't, example: "It **isn't** cold." }
          - { level: A1, full: are not, short: aren't, example: "They **aren't** here." }
          - { level: A1, full: was / were not, short: "wasn't / weren't", example: "We **weren't** late." }
          - { level: A1, full: do / does / did not, short: "don't / doesn't / didn't", example: "She **doesn't** know." }
          - { level: A1, full: cannot, short: can't, example: "I **can't** see." }
          - { level: A1, full: will not, short: won't, example: "It **won't** work." }
          - { level: A1, full: "should / must / could / would not", short: "shouldn't / mustn't / couldn't / wouldn't", example: "You **shouldn't** go." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Speech and messages use the short forms. The full forms add emphasis: I do **not** agree."

  - title: { en: "Form: wh-questions" }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Wh-word } }
          - { key: asks, label: { en: Asks about } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, word: what, asks: { en: a thing }, example: "**What** do you want?" }
          - { level: A1, word: where, asks: { en: a place }, example: "**Where** does he live?" }
          - { level: A1, word: when, asks: { en: a time }, example: "**When** is the party?" }
          - { level: A1, word: who, asks: { en: a person }, example: "**Who** did you meet?" }
          - { level: A1, word: why, asks: { en: a reason }, example: "**Why** are you late?" }
          - { level: A1, word: how, asks: { en: a way }, example: "**How** do you get to work?" }
          - { level: A1, word: which, asks: { en: a choice }, example: "**Which** bag is yours?" }
          - { level: A1, word: whose, asks: { en: an owner }, example: "**Whose** keys are these?" }
          - { level: A1, word: how much, asks: { en: "an amount or a price" }, example: "**How much** is this?" }
          - { level: A1, word: how many, asks: { en: a number }, example: "**How many** brothers have you got?" }
          - { level: A1, word: how often, asks: { en: frequency }, example: "**How often** do you swim?" }
          - { level: A1, word: how old, asks: { en: age }, example: "**How old** is your sister?" }
          - { level: A1, word: how long, asks: { en: "a length of time" }, example: "**How long** is the film?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "The order is wh-word + auxiliary + subject + base verb: **Where do** you **live**?"
          - level: A1
            text:
              en: "With **be** the order is wh-word + be + subject: **Where are** you from?"
          - level: A1
            text:
              en: "**which** and **whose** can take a noun: **Which colour** do you like?"
          - level: A1
            text:
              en: "**how many** takes a plural noun, **how much** an uncountable noun: How many eggs? / How much milk?"

  - title: { en: "Form: subject questions" }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Question word } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, word: who, pattern: "who + verb", example: "**Who called** you?" }
          - { level: A1, word: what, pattern: "what + verb", example: "**What happens** next?" }
          - { level: A1, word: "which / how many", pattern: "which / how many + noun + verb", example: "**How many people came**?" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "When the question word is the subject, the question has no do / does / did."
          - level: A1
            text:
              en: "The verb takes the tense directly: **Who lives** here? / **Who lived** here?"

  - title: { en: "Form: short answers" }
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question } }
          - { key: "yes", label: { en: "Yes" } }
          - { key: "no", label: { en: "No" } }
        rows:
          - { level: A1, question: Are you tired?, "yes": "Yes, I **am**.", "no": "No, I'**m not**." }
          - { level: A1, question: Can she swim?, "yes": "Yes, she **can**.", "no": "No, she **can't**." }
          - { level: A1, question: Did he call?, "yes": "Yes, he **did**.", "no": "No, he **didn't**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A short answer repeats the be, modal or auxiliary verb from the question."
          - level: A1
            text:
              en: "A positive short answer keeps the full form: Yes, I **am**."
          - level: A1
            text:
              en: "For **do / does** see [Present Simple](id:en.tenses.simple-tenses)."

  - title: { en: "Pronunciation: question intonation" }
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question } }
          - { key: tune, label: { en: Voice } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, question: yes / no, tune: { en: rises at the end }, example: "Do you like tea? ↗" }
          - { level: A1, question: wh-, tune: { en: falls at the end }, example: "Where do you live? ↘" }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Did you went?, right: "Did you **go**?", rule: { en: after did the verb is in the base form } }
          - { level: A1, wrong: Who did call you?, right: "**Who called** you?", rule: { en: a subject question has no did } }
          - { level: A1, wrong: Do she like tea?, right: "**Does** she like tea?", rule: { en: he / she / it → does } }
