# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.questions-negatives
lang: en
kind: grammar
tags: [questions, negatives, wh-questions, auxiliaries]
concepts: [questions-negatives]
related: [en.sentence-building.word-order, en.tenses.simple-tenses, en.verbs.to-be, en.modals.can-could, en.sentence-building.question-tags]
status: { en: draft }

title: { en: Questions and negatives }
summary:
  lead: { en: "Yes/no questions, wh-questions, short answers and negatives, with be, modals and every other verb." }
  rule: { en: "Be and modals invert or take not; other verbs use do, does or did with the base verb:" }
  ex: [{ target: Do }, " you ", { target: like }, " tea?"]

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: form, label: { en: Form } }
        - { key: be, label: { en: be and modals } }
        - { key: other, label: { en: Other verbs } }
      rows:
        - { level: A1, features: { polarity: pos, interrogativity: decl }, form: { en: Affirmative }, be: { examples: [["She ", { target: is }, " here."], ["She ", { target: can }, " swim."]] }, other: ["She ", { target: likes }, " tea."] }
        - { level: A1, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, be: { examples: [["She ", { target: isn't }, " here."], ["She ", { target: can't }, " swim."]] }, other: ["She ", { target: doesn't like }, " tea."] }
        - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: Question }, be: { examples: [[{ target: Is }, " she here?"], [{ target: Can }, " she swim?"]] }, other: [{ target: Does }, " she ", { target: like }, " tea?"] }
        - { level: A1, features: { interrogativity: decl, polarity: [pos, neg] }, form: { en: Short answer }, be: { examples: [["Yes, she ", { target: is }, "."], ["No, she ", { target: can't }, "."]] }, other: { examples: [["Yes, she ", { target: does }, "."], ["No, she ", { target: doesn't }, "."]] } }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: be }, " and modal verbs invert with the subject or take ", { term: not }, ". Other verbs use ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, "."]
          - type: rule
            level: A1
            text:
              en: Every question and negative sentence has a subject.

  - title: { en: "Form: be and modals" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, pattern: { pattern: [{ slot: subject }, { alternatives: [be, modal] }, not] }, ex: { examples: [["They ", { target: are not }, " at home."], ["He ", { target: can't }, " drive."]] } }
          - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: Question }, pattern: { pattern: [{ alternatives: [be, modal] }, { slot: subject }] }, ex: { examples: [[{ target: Are }, " they at home?"], [{ target: Can }, " he drive?"]] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: be }, " and ", { term: can }, ", ", { term: will }, ", ", { term: should }, ", ", { term: must }, " need no ", { alternatives: [do, does, did] }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: am not }, " has the short form ", { term: I'm not }, ": I'm not ready."]
          - type: rule
            level: A1
            text:
              en: [{ term: have got }, " inverts too:"]
            ex: [{ target: Have }, " you ", { target: got }, " a pen?"]

  - title: { en: "Form: do, does and did" }
    role: form
    content:
      - type: usage
        columns:
          - { key: aux, label: { en: Auxiliary } }
          - { key: use, label: { en: Subject and tense } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, aux: { alternatives: [do, don't] }, use: { en: [{ alternatives: [I, you, we, they] }, ", present"] }, ex: [{ target: Do }, " you ", { target: like }, " jazz?"] }
          - { level: A1, aux: { alternatives: [does, doesn't] }, use: { en: [{ alternatives: [he, she, it] }, ", present"] }, ex: ["He ", { target: doesn't like }, " jazz."] }
          - { level: A1, aux: { alternatives: [did, didn't] }, use: { en: "every subject, past" }, ex: [{ target: Did }, " you ", { target: call }, " her?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["After ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " the verb is in the base form:"]
            ex: ["Did you ", { target: call }, "?"]
          - type: rule
            level: A1
            text:
              en: The auxiliary carries the tense and the person; the main verb stays unchanged.
          - type: note
            level: A1
            text:
              en: ["Present tables: ", { link: Present Simple, to: en.tenses.simple-tenses }, ". Past: ", { link: Past simple, to: en.tenses.simple-tenses }, "."]
          - type: rule
            level: A1
            text:
              en: "A negative sentence takes one negative word:"
            ex: { examples: [["I ", { target: don't }, " know ", { target: anything }, "."], ["I know ", { target: nothing }, "."]] }

  - title: { en: "Form: negative contractions" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: full, label: { en: Full form }, features: { contraction: full } }
          - { key: short, label: { en: Short form }, features: { contraction: short } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, full: is not, short: isn't, ex: ["It ", { target: isn't }, " cold."] }
          - { level: A1, full: are not, short: aren't, ex: ["They ", { target: aren't }, " here."] }
          - { level: A1, full: [{ alternatives: [was, were] }, "  not"], short: { alternatives: [wasn't, weren't] }, ex: ["We ", { target: weren't }, " late."] }
          - { level: A1, full: [{ alternatives: [do, does, did] }, "  not"], short: { alternatives: [don't, doesn't, didn't] }, ex: ["She ", { target: doesn't }, " know."] }
          - { level: A1, full: cannot, short: can't, ex: ["I ", { target: can't }, " see."] }
          - { level: A1, full: will not, short: won't, ex: ["It ", { target: won't }, " work."] }
          - { level: A1, full: [{ alternatives: [should, must, could, would] }, "  not"], short: { alternatives: [shouldn't, mustn't, couldn't, wouldn't] }, ex: ["You ", { target: shouldn't }, " go."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Speech and messages use the short forms. The full forms add emphasis:"
            ex: ["I do ", { target: not }, " agree."]

  - title: { en: "Form: wh-questions" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Wh-word } }
          - { key: asks, label: { en: Asks about } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, word: what, asks: { en: a thing }, ex: [{ target: What }, " do you want?"] }
          - { level: A1, word: where, asks: { en: a place }, ex: [{ target: Where }, " does he live?"] }
          - { level: A1, word: when, asks: { en: a time }, ex: [{ target: When }, " is the party?"] }
          - { level: A1, word: who, asks: { en: a person }, ex: [{ target: Who }, " did you meet?"] }
          - { level: A1, word: why, asks: { en: a reason }, ex: [{ target: Why }, " are you late?"] }
          - { level: A1, word: how, asks: { en: a way }, ex: [{ target: How }, " do you get to work?"] }
          - { level: A1, word: which, asks: { en: a choice }, ex: [{ target: Which }, " bag is yours?"] }
          - { level: A1, word: whose, asks: { en: an owner }, ex: [{ target: Whose }, " keys are these?"] }
          - { level: A1, word: how much, asks: { en: an amount or a price }, ex: [{ target: How much }, " is this?"] }
          - { level: A1, word: how many, asks: { en: a number }, ex: [{ target: How many }, " brothers have you got?"] }
          - { level: A1, word: how often, asks: { en: frequency }, ex: [{ target: How often }, " do you swim?"] }
          - { level: A1, word: how old, asks: { en: age }, ex: [{ target: How old }, " is your sister?"] }
          - { level: A1, word: how long, asks: { en: a length of time }, ex: [{ target: How long }, " is the film?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The order is ", { pattern: [{ slot: wh-word }, auxiliary, { slot: subject }, { slot: base verb }] }, ":"]
            ex: [{ target: Where do }, " you ", { target: live }, "?"]
          - type: rule
            level: A1
            text:
              en: ["With ", { term: be }, " the order is ", { pattern: [{ slot: wh-word }, be, { slot: subject }] }, ":"]
            ex: [{ target: Where are }, " you from?"]
          - type: rule
            level: A1
            text:
              en: [{ term: which }, " and ", { term: whose }, " can take a noun:"]
            ex: [{ target: Which colour }, " do you like?"]
          - type: rule
            level: A1
            text:
              en: [{ term: how many }, " takes a plural noun, ", { term: how much }, " an uncountable noun: ", { examples: [How many eggs?, How much milk?] }]

  - title: { en: "Form: subject questions" }
    role: form
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Question word } }
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, word: who, pattern: { pattern: [who, { slot: verb }] }, ex: [{ target: Who called }, " you?"] }
          - { level: A1, word: what, pattern: { pattern: [what, { slot: verb }] }, ex: [{ target: What happens }, " next?"] }
          - { level: A1, word: { alternatives: [which, how many] }, pattern: { pattern: [{ alternatives: [which, how many] }, { slot: noun }, { slot: verb }] }, ex: [{ target: How many people came }, "?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["When the question word is the subject, the question has no ", { alternatives: [do, does, did] }, "."]
          - type: rule
            level: A1
            text:
              en: "The verb takes the tense directly:"
            ex: { examples: [[{ target: Who lives }, " here?"], [{ target: Who lived }, " here?"]] }

  - title: { en: "Form: short answers" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: question, label: { en: Question } }
          - { key: "yes", label: { en: "Yes" }, features: { polarity: pos } }
          - { key: "no", label: { en: "No" }, features: { polarity: neg } }
        rows:
          - { level: A1, question: Are you tired?, "yes": ["Yes, I ", { target: am }, "."], "no": ["No, I'", { target: m not }, "."] }
          - { level: A1, question: Can she swim?, "yes": ["Yes, she ", { target: can }, "."], "no": ["No, she ", { target: can't }, "."] }
          - { level: A1, question: Did he call?, "yes": ["Yes, he ", { target: did }, "."], "no": ["No, he ", { target: didn't }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A short answer repeats the be, modal or auxiliary verb from the question."
          - type: rule
            level: A1
            text:
              en: "A positive short answer keeps the full form:"
            ex: ["Yes, I ", { target: am }, "."]
          - type: note
            level: A1
            text:
              en: ["For ", { alternatives: [{ term: do }, { term: does }] }, " see ", { link: Present Simple, to: en.tenses.simple-tenses }, "."]

  - title: { en: "Pronunciation: question intonation" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: question, label: { en: Question } }
          - { key: tune, label: { en: Voice } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, question: { alternatives: ["yes", "no"] }, tune: { en: rises at the end }, ex: ["Do you like tea? ", { intonation: rise }] }
          - { level: A1, question: wh-, tune: { en: falls at the end }, ex: ["Where do you live? ", { intonation: fall }] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: Did you went?, right: ["Did you ", { target: go }, "?"], rule: { en: after did the verb is in the base form } }
          - { level: A1, wrong: Who did call you?, right: [{ target: Who called }, " you?"], rule: { en: a subject question has no did } }
          - { level: A1, wrong: Do she like tea?, right: [{ target: Does }, " she like tea?"], rule: { en: { takes: [{ alternatives: [he, she, it] }, does] } } }
