# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.reported-speech
lang: en
kind: grammar
tags: [reported-speech, backshift, say, tell]
concepts: [reported-speech]
related: [en.sentence-building.questions-negatives, en.sentence-building.word-order, en.tenses.perfect-tenses, en.verbs.gerund-vs-infinitive]
status: { en: draft }

title: { en: Reported Speech }
summary:
  en: "Reported speech tells what someone said without quoting it, with say, tell and ask. After a past verb the tense moves one step back and questions take statement order: She asked where I **lived**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: B1, point: say, rule: { en: "say + (that) + clause; no person, or to + person" }, example: "She **said** (that) she was tired." }
        - { level: B1, point: tell, rule: { en: "tell + person + (that) + clause" }, example: "She **told me** (that) she was tired." }
        - { level: B1, point: present simple, rule: → past simple, example: "He said he **worked** there." }
        - { level: B1, point: present continuous, rule: → past continuous, example: "She said she **was waiting**." }
        - { level: B1, point: past simple / present perfect, rule: → past perfect, example: "He said he **had left**." }
        - { level: B1, point: will / can / must, rule: → would / could / had to, example: "He said he **would call**." }
        - { level: B1, point: { en: No change }, rule: { en: "would, could, should, might; a fact still true; after says (present)" }, example: "She says she **is** tired." }
        - { level: B1, point: { en: Pronouns and time }, rule: { en: "pronouns follow the speaker; today → that day, tomorrow → the next day, yesterday → the day before" }, example: "Anna said **she** was tired." }
        - { level: B1, point: { en: Questions }, rule: { en: "if / whether or a wh-word + statement order; no do / does / did" }, example: "She asked **where** I **lived**." }
        - { level: B1, point: { en: Commands }, rule: told / asked + person + (not) to + V, example: "He **told us not to be** late." }

sections:
  - title: { en: "Form: say and tell" }
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, verb: say, pattern: say + (that) + clause, example: "She **said** (that) she was tired." }
          - { level: B1, verb: tell, pattern: tell + person + (that) + clause, example: "She **told me** (that) she was tired." }
          - { level: B1, verb: say, pattern: say + to + person, example: "She **said to me** that she was tired." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**tell** always has a person after it. **say** has no person, or **to** + person."

  - title: { en: "Form: backshift" }
    content:
      - type: text
        level: B1
        text:
          en: "After a past reporting verb (said, told, asked), the tense usually moves one step back."
      - type: table
        columns:
          - { key: direct, label: { en: Direct speech } }
          - { key: reported, label: { en: Reported speech } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, direct: present simple, reported: past simple, example: { ex: "“I **work** here.” → He said he **worked** there." } }
          - { level: B1, direct: present continuous, reported: past continuous, example: { ex: "“I'**m waiting**.” → She said she **was waiting**." } }
          - { level: B1, direct: past simple, reported: past perfect, example: { ex: "“I **left**.” → He said he **had left**." } }
          - { level: B1, direct: present perfect, reported: past perfect, example: { ex: "“I'**ve finished**.” → She said she **had finished**." } }
          - { level: B1, direct: will, reported: would, example: { ex: "“I'**ll call**.” → He said he **would call**." } }
          - { level: B1, direct: must, reported: had to, example: { ex: "“I **must** go.” → She said she **had to** go." } }
          - { level: B1, direct: can, reported: could, example: { ex: "“I **can** swim.” → She said she **could** swim." } }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**would**, **could**, **should** and **might** stay the same."
          - level: B1
            text:
              en: "The tense can stay when the fact is still true: She said she **lives** in Paris."
          - level: B1
            text:
              en: "After **says** (present) the tense stays: She says she **is** tired."

  - title: { en: "Form: pronouns and time words" }
    content:
      - type: table
        columns:
          - { key: direct, label: { en: Direct } }
          - { key: reported, label: { en: Reported } }
        rows:
          - { level: B1, direct: I / my, reported: he / she / his / her }
          - { level: B1, direct: we / our, reported: they / their }
          - { level: B1, direct: this / these, reported: that / those }
          - { level: B1, direct: here, reported: there }
          - { level: B1, direct: now, reported: then }
          - { level: B1, direct: today, reported: that day }
          - { level: B1, direct: tomorrow, reported: the next day / the following day }
          - { level: B1, direct: yesterday, reported: the day before / the previous day }
          - { level: B1, direct: last week, reported: the week before }
          - { level: B1, direct: next week, reported: the week after / the following week }
          - { level: B1, direct: ago, reported: before }
      - type: bullets
        items:
          - level: B1
            text:
              en: "Pronouns follow the speaker: “I'm tired,” said Anna → Anna said **she** was tired."
          - level: B1
            text:
              en: "Time words stay the same when the report is made on the same day."

  - title: { en: "Form: reported questions" }
    content:
      - type: table
        columns:
          - { key: type, label: { en: Question } }
          - { key: direct, label: { en: Direct } }
          - { key: reported, label: { en: Reported } }
        rows:
          - { level: B1, type: Yes / no, direct: { ex: "“Do you like tea?”" }, reported: { ex: "She asked **if** I **liked** tea." } }
          - { level: B1, type: Wh-, direct: { ex: "“Where do you live?”" }, reported: { ex: "She asked **where** I **lived**." } }
          - { level: B1, type: Wh-, direct: { ex: "“What is your name?”" }, reported: { ex: "She asked **what** my name **was**." } }
      - type: bullets
        items:
          - level: B1
            text:
              en: "A reported question has statement order: subject + verb, with no do / does / did."
          - level: B1
            text:
              en: "Yes / no questions take **if** or **whether**. The sentence ends with a full stop."
          - level: B1
            text:
              en: "Tenses and pronouns change as in statements."

  - title: { en: "Form: reported commands" }
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, type: { en: Command }, pattern: told + person + to + V, example: "“Sit down.” → He **told me to sit** down." }
          - { level: B1, type: { en: Request }, pattern: asked + person + to + V, example: "“Please help.” → She **asked me to help**." }
          - { level: B1, type: { en: Negative }, pattern: told + person + not to + V, example: "“Don't be late.” → He **told us not to be** late." }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: B1, wrong: She said me that she was tired., right: "She **told** me that she was tired. / She **said** that she was tired.", rule: { en: "say has no person; tell needs one" } }
          - { level: B1, wrong: He told that he was late., right: "He **said** that he was late.", rule: { en: "tell needs a person" } }
          - { level: B1, wrong: She asked me where did I live., right: "She asked me where I **lived**.", rule: { en: "reported questions use statement order" } }
          - { level: B1, wrong: He asked me do I like tea., right: "He asked me **if** I liked tea.", rule: { en: "yes / no questions → if / whether" } }
          - { level: B1, wrong: He said me to sit down., right: "He **told** me **to sit** down.", rule: { en: "told + person + to + V" } }
          - { level: B1, wrong: He said he will come., right: "He said he **would** come.", rule: { en: "will → would after a past verb" } }
