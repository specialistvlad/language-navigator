# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.reported-speech
lang: en
kind: grammar
levels: [B1]
tags: [reported-speech, backshift, say, tell]
concepts: [reported-speech]
related: [en.sentence-building.questions-negatives, en.sentence-building.word-order, en.tenses.perfect-tenses, en.verbs.gerund-vs-infinitive]
status: { en: draft, es: draft }

title: { en: Reported Speech, es: Estilo indirecto }
summary:
  en: "Reported speech tells what someone said without quoting it, with say, tell and ask. After a past verb the tense moves one step back and questions take statement order: She asked where I **lived**."
  es: "El estilo indirecto cuenta lo que alguien dijo, con say, tell y ask. Tras un verbo en pasado el tiempo retrocede un paso, y tell lleva persona: me dijo que vendría es He **told** me he **would** come."

cheatsheet:
  level: B1
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point, es: Punto } }
        - { key: rule, label: { en: Rule, es: Regla } }
        - { key: example, label: { en: Example, es: Ejemplo } }
      rows:
        - { point: say, rule: { en: "say + (that) + clause; no person, or to + person", es: "say + (that) + oración; sin persona, o to + persona" }, example: "She **said** (that) she was tired.", tr: { es: Dijo que estaba cansada. } }
        - { point: tell, rule: { en: "tell + person + (that) + clause", es: "tell + persona + (that) + oración" }, example: "She **told me** (that) she was tired.", tr: { es: Me dijo que estaba cansada. } }
        - { point: present simple, rule: → past simple, example: "He said he **worked** there.", tr: { es: Dijo que trabajaba allí. } }
        - { point: present continuous, rule: → past continuous, example: "She said she **was waiting**.", tr: { es: Dijo que estaba esperando. } }
        - { point: past simple / present perfect, rule: → past perfect, example: "He said he **had left**.", tr: { es: Dijo que se había ido. } }
        - { point: will / can / must, rule: → would / could / had to, example: "He said he **would call**.", tr: { es: Dijo que llamaría. } }
        - { point: { en: No change, es: Sin cambio }, rule: { en: "would, could, should, might; a fact still true; after says (present)", es: "would, could, should, might; un hecho que sigue siendo cierto; tras says (presente)" }, example: "She says she **is** tired.", tr: { es: Dice que está cansada. } }
        - { point: { en: Pronouns and time, es: Pronombres y tiempo }, rule: { en: "pronouns follow the speaker; today → that day, tomorrow → the next day, yesterday → the day before", es: "los pronombres siguen a quien habla; today → that day, tomorrow → the next day, yesterday → the day before" }, example: "Anna said **she** was tired.", tr: { es: Anna dijo que estaba cansada. } }
        - { point: { en: Questions, es: Preguntas }, rule: { en: "if / whether or a wh-word + statement order; no do / does / did", es: "if / whether o una palabra wh- + orden de frase afirmativa; sin do / does / did" }, example: "She asked **where** I **lived**.", tr: { es: Me preguntó dónde vivía. } }
        - { point: { en: Commands, es: Órdenes }, rule: told / asked + person + (not) to + V, example: "He **told us not to be** late.", tr: { es: Nos dijo que no llegáramos tarde. } }

sections:
  - title: { en: "Form: say and tell", es: "Forma: say y tell" }
    level: B1
    content:
      - type: table
        columns:
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: pattern, label: { en: Pattern, es: Estructura } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { verb: say, pattern: say + (that) + clause, example: "She **said** (that) she was tired.", tr: { es: Dijo que estaba cansada. } }
          - { verb: tell, pattern: tell + person + (that) + clause, example: "She **told me** (that) she was tired.", tr: { es: Me dijo que estaba cansada. } }
          - { verb: say, pattern: say + to + person, example: "She **said to me** that she was tired.", tr: { es: Me dijo que estaba cansada. } }
      - type: bullets
        items:
          - en: "**tell** always has a person after it. **say** has no person, or **to** + person."
            es: "**tell** siempre lleva una persona detrás. **say** no la lleva, o lleva **to** + persona."
          - { for: [es], text: { es: "*decir* se traduce por say o tell: *me dijo* → she **told** me." } }

  - title: { en: "Form: backshift", es: "Forma: cambio de tiempo" }
    level: B1
    content:
      - type: text
        text:
          en: "After a past reporting verb (said, told, asked), the tense usually moves one step back."
          es: "Después de un verbo de comunicación en pasado (said, told, asked), el tiempo suele retroceder un paso."
      - type: table
        columns:
          - { key: direct, label: { en: Direct speech, es: Estilo directo } }
          - { key: reported, label: { en: Reported speech, es: Estilo indirecto } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { direct: present simple, reported: past simple, example: { ex: "“I **work** here.” → He said he **worked** there.", tr: { es: Dijo que trabajaba allí. } } }
          - { direct: present continuous, reported: past continuous, example: { ex: "“I'**m waiting**.” → She said she **was waiting**.", tr: { es: Dijo que estaba esperando. } } }
          - { direct: past simple, reported: past perfect, example: { ex: "“I **left**.” → He said he **had left**.", tr: { es: Dijo que se había ido. } } }
          - { direct: present perfect, reported: past perfect, example: { ex: "“I'**ve finished**.” → She said she **had finished**.", tr: { es: Dijo que había terminado. } } }
          - { direct: will, reported: would, example: { ex: "“I'**ll call**.” → He said he **would call**.", tr: { es: Dijo que llamaría. } } }
          - { direct: must, reported: had to, example: { ex: "“I **must** go.” → She said she **had to** go.", tr: { es: Dijo que tenía que irse. } } }
          - { direct: can, reported: could, example: { ex: "“I **can** swim.” → She said she **could** swim.", tr: { es: Dijo que sabía nadar. } } }
      - type: bullets
        items:
          - en: "**would**, **could**, **should** and **might** stay the same."
            es: "**would**, **could**, **should** y **might** no cambian."
          - en: "The tense can stay when the fact is still true: She said she **lives** in Paris."
            es: "El tiempo puede quedarse igual si el hecho sigue siendo cierto: She said she **lives** in Paris."
          - en: "After **says** (present) the tense stays: She says she **is** tired."
            es: "Después de **says** (presente) el tiempo se mantiene: She says she **is** tired."
          - { for: [es], text: { es: "El español hace el mismo retroceso: *dijo que trabajaba* → he said he **worked**." } }

  - title: { en: "Form: pronouns and time words", es: "Forma: pronombres y expresiones de tiempo" }
    level: B1
    content:
      - type: table
        columns:
          - { key: direct, label: { en: Direct, es: Directo } }
          - { key: reported, label: { en: Reported, es: Indirecto } }
        rows:
          - { direct: I / my, reported: he / she / his / her }
          - { direct: we / our, reported: they / their }
          - { direct: this / these, reported: that / those }
          - { direct: here, reported: there }
          - { direct: now, reported: then }
          - { direct: today, reported: that day }
          - { direct: tomorrow, reported: the next day / the following day }
          - { direct: yesterday, reported: the day before / the previous day }
          - { direct: last week, reported: the week before }
          - { direct: next week, reported: the week after / the following week }
          - { direct: ago, reported: before }
      - type: bullets
        items:
          - en: "Pronouns follow the speaker: “I'm tired,” said Anna → Anna said **she** was tired."
            es: "Los pronombres siguen a quien habla: “I'm tired,” said Anna → Anna said **she** was tired."
          - en: "Time words stay the same when the report is made on the same day."
            es: "Las expresiones de tiempo no cambian si se cuenta el mismo día."

  - title: { en: "Form: reported questions", es: "Forma: preguntas indirectas" }
    level: B1
    content:
      - type: table
        columns:
          - { key: type, label: { en: Question, es: Pregunta } }
          - { key: direct, label: { en: Direct, es: Directa } }
          - { key: reported, label: { en: Reported, es: Indirecta } }
        rows:
          - { type: Yes / no, direct: { ex: "“Do you like tea?”", tr: { es: ¿Te gusta el té? } }, reported: { ex: "She asked **if** I **liked** tea.", tr: { es: Me preguntó si me gustaba el té. } } }
          - { type: Wh-, direct: { ex: "“Where do you live?”", tr: { es: ¿Dónde vives? } }, reported: { ex: "She asked **where** I **lived**.", tr: { es: Me preguntó dónde vivía. } } }
          - { type: Wh-, direct: { ex: "“What is your name?”", tr: { es: ¿Cómo te llamas? } }, reported: { ex: "She asked **what** my name **was**.", tr: { es: Me preguntó cómo me llamaba. } } }
      - type: bullets
        items:
          - en: "A reported question has statement order: subject + verb, with no do / does / did."
            es: "La pregunta indirecta tiene orden de frase afirmativa: sujeto + verbo, sin do / does / did."
          - en: "Yes / no questions take **if** or **whether**. The sentence ends with a full stop."
            es: "Las preguntas de sí o no llevan **if** o **whether**. La frase termina en punto."
          - en: "Tenses and pronouns change as in statements."
            es: "Los tiempos y los pronombres cambian igual que en las afirmaciones."

  - title: { en: "Form: reported commands", es: "Forma: órdenes indirectas" }
    level: B1
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type, es: Tipo } }
          - { key: pattern, label: { en: Pattern, es: Estructura } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { type: { en: Command, es: Orden }, pattern: told + person + to + V, example: "“Sit down.” → He **told me to sit** down.", tr: { es: Me dijo que me sentara. } }
          - { type: { en: Request, es: Petición }, pattern: asked + person + to + V, example: "“Please help.” → She **asked me to help**.", tr: { es: Me pidió que ayudara. } }
          - { type: { en: Negative, es: Negativa }, pattern: told + person + not to + V, example: "“Don't be late.” → He **told us not to be** late.", tr: { es: Nos dijo que no llegáramos tarde. } }
      - type: bullets
        items:
          - { for: [es], text: { es: "En español va una oración con subjuntivo (*que me sentara*). En inglés va **to** + infinitivo." } }

  - title: { en: Typical errors, es: Errores típicos }
    level: B1
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: She said me that she was tired., right: "She **told** me that she was tired. / She **said** that she was tired.", rule: { en: "say has no person; tell needs one", es: "say no lleva persona; tell sí" } }
          - { wrong: He told that he was late., right: "He **said** that he was late.", rule: { en: "tell needs a person", es: "tell necesita una persona" } }
          - { wrong: She asked me where did I live., right: "She asked me where I **lived**.", rule: { en: "reported questions use statement order", es: "la pregunta indirecta usa el orden de la frase afirmativa" } }
          - { wrong: He asked me do I like tea., right: "He asked me **if** I liked tea.", rule: { en: "yes / no questions → if / whether", es: "preguntas de sí o no → if / whether" } }
          - { wrong: He said me to sit down., right: "He **told** me **to sit** down.", rule: { en: "told + person + to + V", es: "told + persona + to + V" } }
          - { for: [es], wrong: He told me that I sit down., right: "He told me **to sit** down.", rule: { es: "*me dijo que me sentara* → told me to + V" } }
          - { wrong: He said he will come., right: "He said he **would** come.", rule: { en: "will → would after a past verb", es: "will → would tras un verbo en pasado" } }
          - { for: [es], wrong: She asked me if did I like it., right: "She asked me if I **liked** it.", rule: { es: "tras if va el orden de la frase afirmativa" } }
