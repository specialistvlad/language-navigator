# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.sentence-building.conjunctions-linkers
lang: en
kind: grammar
levels: [A1, A2, B1]
tags: [conjunctions, linkers, connectors, punctuation]
concepts: [linkers]
related: [en.sentence-building.conditionals-0-1-2, en.sentence-building.word-order, en.tenses.future-forms, en.sentence-building.questions-negatives]
status: { en: draft, es: draft }

title: { en: Conjunctions and Linkers, es: Conjunciones y conectores (conjunctions and linkers) }
summary:
  en: "Words that join ideas: addition, contrast, reason, result, time and purpose."
  es: "Palabras que unen ideas: adición, contraste, causa, resultado, tiempo y finalidad."

sections:
  - title: { en: Overview, es: Resumen }
    level: A1-B1
    content:
      - type: table
        columns:
          - { key: function, label: { en: Function, es: Función } }
          - { key: a1, label: A1 }
          - { key: a2, label: A2 }
          - { key: b1, label: B1 }
        rows:
          - { function: { en: Addition, es: Adición }, a1: and, a2: "also, too", b1: "as well as, in addition" }
          - { function: { en: Contrast, es: Contraste }, a1: but, a2: "—", b1: "although, however, while" }
          - { function: { en: Reason, es: Causa }, a1: because, a2: because of, b1: "—" }
          - { function: { en: Result, es: Resultado }, a1: so, a2: "—", b1: "—" }
          - { function: { en: Choice, es: Elección }, a1: or, a2: "—", b1: "—" }
          - { function: { en: Time, es: Tiempo }, a1: "—", a2: "when, before, after, then", b1: "—" }
          - { function: { en: Purpose, es: Finalidad }, a1: "—", a2: "—", b1: so that }
          - { function: { en: Condition, es: Condición }, a1: "—", a2: "—", b1: unless }

  - title: { en: "Basic linkers: and, but, or, because, so", es: "Conectores básicos: and, but, or, because, so" }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker, es: Conector } }
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { linker: and, use: { en: adds an idea, es: añade una idea }, example: "I like tea **and** coffee.", tr: { es: Me gustan el té y el café. } }
          - { linker: but, use: { en: shows a contrast, es: muestra un contraste }, example: "I like tea, **but** I don't like coffee.", tr: { es: Me gusta el té pero no el café. } }
          - { linker: or, use: { en: gives a choice, es: ofrece una elección }, example: "Do you want tea **or** coffee?", tr: { es: "¿Quieres té o café?" } }
          - { linker: because, use: { en: gives the reason, es: da la causa }, example: "I'm tired **because** I work late.", tr: { es: Estoy cansado porque trabajo hasta tarde. } }
          - { linker: so, use: { en: gives the result, es: da el resultado }, example: "I'm tired, **so** I go to bed.", tr: { es: "Estoy cansado, así que me voy a la cama." } }
      - type: bullets
        items:
          - en: "Between two full clauses, **but** and **so** usually take a comma before them: I was tired, **so** I left."
            es: "Entre dos oraciones completas, **but** y **so** suelen llevar coma delante: I was tired, **so** I left."
          - en: "**and**, **or** and **because** usually have no comma before them."
            es: "**and**, **or** y **because** suelen ir sin coma delante."
          - en: "**because** is followed by a clause: a subject and a verb."
            es: "**because** va seguido de una oración: sujeto y verbo."
          - level: A2
            text:
              en: "**because of** is followed by a noun:"
              es: "**because of** va seguido de un sustantivo:"
            ex: "We stayed in **because of** the rain."
            tr: { es: Nos quedamos en casa por la lluvia. }
          - for: [es]
            text: { es: "*Porque* + verbo = **because** + sujeto + verbo. *Por / a causa de* + sustantivo = **because of**." }
          - for: [es]
            text: { es: "*Así que* = **so** (resultado). *Porque* = **because** (causa)." }

  - title: { en: "Time linkers: when, before, after, then", es: "Conectores de tiempo: when, before, after, then" }
    level: A2
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker, es: Conector } }
          - { key: pattern, label: { en: Pattern, es: Patrón } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { linker: when, pattern: "when + clause", example: "**When** I get home, I cook.", tr: { es: "Cuando llego a casa, cocino." } }
          - { linker: before, pattern: "before + clause", example: "I wash my hands **before** I eat.", tr: { es: Me lavo las manos antes de comer. } }
          - { linker: after, pattern: "after + clause", example: "We go home **after** the film ends.", tr: { es: Nos vamos a casa después de que acabe la película. } }
          - { linker: then, pattern: "clause, then + clause", example: "I had lunch, **then** I went home.", tr: { es: Comí y luego me fui a casa. } }
      - type: bullets
        items:
          - en: "A time clause that starts the sentence takes a comma after it: **When** it rains, we stay in."
            es: "Una oración de tiempo al principio lleva coma detrás: **When** it rains, we stay in."
          - en: "After **when**, **before** and **after** the present simple talks about the future: **When** I arrive, I'll call you."
            es: "Tras **when**, **before** y **after** el presente simple habla del futuro: **When** I arrive, I'll call you."
          - for: [es]
            text: { es: "*Cuando llegue* (subjuntivo) = when I **arrive** (presente simple). Tras when va el presente simple." }

  - title: { en: "Adding: also, too, as well as, in addition", es: "Adición: also, too, as well as, in addition" }
    level: A2-B1
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker, es: Conector } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A2, linker: also, example: "I **also** speak French. / She is **also** a nurse.", tr: { es: También hablo francés. / Ella también es enfermera. } }
          - { level: A2, linker: too, example: "I speak French **too**.", tr: { es: Yo también hablo francés. } }
          - { level: B1, linker: as well as, example: "She speaks French **as well as** Spanish.", tr: { es: Habla francés además de español. } }
          - { level: B1, linker: in addition, example: "**In addition**, the hotel has a pool.", tr: { es: "Además, el hotel tiene piscina." } }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**also** goes before the main verb and after be. **too** goes at the end."
              es: "**also** va antes del verbo principal y después de be. **too** va al final."
          - level: B1
            text:
              en: "**as well as** is followed by a noun or an -ing form."
              es: "**as well as** va seguido de un sustantivo o de una forma en -ing."
          - level: B1
            text:
              en: "**in addition** starts a sentence and is followed by a comma."
              es: "**in addition** empieza una frase y va seguido de coma."

  - title: { en: "Contrast: although, however, while", es: "Contraste: although, however, while" }
    level: B1
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker, es: Conector } }
          - { key: pattern, label: { en: Pattern, es: Patrón } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { linker: although, pattern: "although + clause, clause", example: "**Although** it was raining, we went out.", tr: { es: "Aunque llovía, salimos." } }
          - { linker: however, pattern: "sentence. However, sentence", example: "It was raining. **However**, we went out.", tr: { es: "Llovía. Sin embargo, salimos." } }
          - { linker: while, pattern: "while + clause, clause", example: "**While** I like tea, my wife prefers coffee.", tr: { es: "Mientras que a mí me gusta el té, mi mujer prefiere el café." } }
      - type: bullets
        items:
          - en: "**although** joins two clauses in one sentence and replaces **but**."
            es: "**although** une dos oraciones en una sola frase y sustituye a **but**."
          - en: "**even though** is a stronger **although**: **Even though** I was tired, I went out."
            es: "**even though** es un **although** más fuerte: **Even though** I was tired, I went out."
          - en: "**however** usually starts a new sentence and is followed by a comma."
            es: "**however** suele empezar una frase nueva y va seguido de coma."
          - en: "**while** also means *at the same time*: I read **while** I eat."
            es: "**while** también significa *al mismo tiempo*: I read **while** I eat."
          - for: [es]
            text: { es: "*Aunque* = **although** o **even though**. *Sin embargo* = **however**." }

  - title: { en: "Purpose and condition: so that, unless", es: "Finalidad y condición: so that, unless" }
    level: B1
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker, es: Conector } }
          - { key: pattern, label: { en: Pattern, es: Patrón } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { linker: so that, pattern: "so that + clause", example: "I left early **so that** I could catch the bus.", tr: { es: Salí pronto para poder coger el autobús. } }
          - { linker: unless, pattern: "unless = if … not", example: "We stay in **unless** it stops raining.", tr: { es: Nos quedamos en casa a menos que deje de llover. } }
      - type: bullets
        items:
          - en: "More on **unless**: [Conditionals: Zero, First and Second](id:en.sentence-building.conditionals-0-1-2)."
            es: "Más sobre **unless**: [Condicionales 0, 1 y 2](id:en.sentence-building.conditionals-0-1-2)."
          - for: [es]
            text: { es: "*Para que* + subjuntivo = **so that** + clause, con can / could / will / would." }

  - title: { en: Typical errors, es: Errores típicos }
    level: A1-B1
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: "Although it was raining, but we went out.", right: "Although it was raining, we went out.", rule: { en: although replaces but, es: although sustituye a but } }
          - { wrong: We stayed in because the rain., right: "We stayed in **because of** the rain.", rule: { en: "because + clause, because of + noun", es: "because + oración, because of + sustantivo" } }
          - { wrong: We stayed in because of it was raining., right: "We stayed in **because** it was raining.", rule: { en: because of + noun only, es: because of solo lleva sustantivo } }
          - { wrong: "It was cold, however we went out.", right: "It was cold. **However**, we went out.", rule: { en: however starts a new sentence and takes a comma, es: however empieza frase nueva y lleva coma } }
          - { wrong: I speak French also., right: "I **also** speak French. / I speak French **too**.", rule: { en: "also goes before the main verb, too at the end", es: "also va antes del verbo principal, too al final" } }
          - { for: [es], wrong: "When I will arrive, I'll call you.", right: "**When** I arrive, I'll call you.", rule: { es: tras when el presente simple habla del futuro } }
          - { for: [es], wrong: I left early so that I catch the bus., right: "I left early so that I **could** catch the bus.", rule: { es: "*para que* = so that; en pasado, could / would" } }
          - { for: [es], wrong: We'll go out unless it doesn't rain., right: "We'll go out **unless** it rains.", rule: { es: unless ya significa if … not } }

essentials:
  - level: A1
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: linker, label: { en: Linker, es: Conector } }
              - { key: use, label: { en: Use, es: Uso } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { linker: and, use: { en: adds, es: añade }, example: "tea **and** coffee" }
              - { linker: but, use: { en: contrast, es: contraste }, example: "I like tea **but** not coffee." }
              - { linker: or, use: { en: choice, es: elección }, example: "Tea **or** coffee?" }
              - { linker: because, use: { en: reason, es: causa }, example: "I'm tired **because** I work late." }
              - { linker: so, use: { en: result, es: resultado }, example: "I'm tired, **so** I go to bed." }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - en: "Comma before **but** and **so** between two clauses."
                es: "Coma delante de **but** y **so** entre dos oraciones."
              - en: "**because** + subject + verb."
                es: "**because** + sujeto + verbo."
  - level: A2
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: because of, rule: { en: + noun, es: + sustantivo }, example: "We stayed in **because of** the rain." }
          - { point: "when, before, after", rule: { en: "+ clause; present simple for the future", es: "+ oración; presente simple para el futuro" }, example: "**When** I arrive, I'll call." }
          - { point: then, rule: { en: "comes after a comma, before the second action", es: "va tras una coma, antes de la segunda acción" }, example: "I had lunch, **then** I left." }
          - { point: "also / too", rule: { en: "also before the main verb, too at the end", es: "also antes del verbo principal, too al final" }, example: "I **also** speak French. / …French **too**." }
  - level: B1
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: although, rule: { en: "+ clause, no but after it", es: "+ oración, sin but después" }, example: "**Although** it rained, we went out." }
          - { point: however, rule: { en: "new sentence, then a comma", es: "frase nueva, luego coma" }, example: "It rained. **However**, we went out." }
          - { point: while, rule: { en: "contrast or at the same time", es: "contraste o al mismo tiempo" }, example: "I read **while** I eat." }
          - { point: "as well as / in addition", rule: { en: "as well as + noun or -ing; in addition + comma", es: "as well as + sustantivo o -ing; in addition + coma" }, example: "**In addition**, it has a pool." }
          - { point: so that, rule: { en: "+ clause of purpose", es: "+ oración de finalidad" }, example: "I left early **so that** I could catch it." }
          - { point: unless, rule: { en: "= if … not", es: "= if … not" }, example: "**Unless** it rains, we'll go." }

reminders:
  - level: A1
    items:
      - en: "A comma comes before **but** and **so** between two clauses: I was tired**,** so I left."
        es: "Coma delante de **but** y **so** entre dos oraciones: I was tired**,** so I left."
  - level: A2
    items:
      - en: "**because** + clause, **because of** + noun."
        es: "**because** + oración, **because of** + sustantivo."
      - { for: [es], text: { es: "Tras when el presente simple habla del futuro: **When** I arrive, I'll call." } }
  - level: B1
    items:
      - en: "**although** replaces **but**: Although it rained, we went out. **however** takes a comma."
        es: "**although** sustituye a **but**: Although it rained, we went out. **however** lleva coma."
      - { for: [es], text: { es: "unless ya es negativo: **unless** it rains." } }
