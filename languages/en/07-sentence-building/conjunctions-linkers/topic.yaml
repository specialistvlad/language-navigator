id: en.sentence-building.conjunctions-linkers
lang: en
kind: grammar
tags: [conjunctions, linkers, connectors, punctuation]
concepts: [linkers]
related: [en.sentence-building.conditionals-0-1-2, en.sentence-building.word-order, en.tenses.future-forms, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Conjunctions and Linkers }
summary:
  en: "Linkers join ideas: and adds, but contrasts, or offers a choice, because gives a reason and so gives a result. A comma comes before but and so between two clauses: I was tired, **so** I left."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: function, label: { en: Function } }
        - { key: a1, label: A1 }
        - { key: a2, label: A2 }
        - { key: b1, label: B1 }
      rows:
        - { level: A1, function: { en: Addition }, a1: and, a2: "also, too", b1: "as well as, in addition" }
        - { level: A1, function: { en: Contrast }, a1: but, a2: "—", b1: "although, however, while" }
        - { level: A1, function: { en: Reason }, a1: because, a2: because of, b1: "—" }
        - { level: A1, function: { en: Result }, a1: so, a2: "—", b1: "—" }
        - { level: A1, function: { en: Choice }, a1: or, a2: "—", b1: "—" }
        - { level: A2, function: { en: Time }, a1: "—", a2: "when, before, after, then", b1: "—" }
        - { level: B1, function: { en: Purpose }, a1: "—", a2: "—", b1: so that }
        - { level: B1, function: { en: Condition }, a1: "—", a2: "—", b1: unless }

sections:
  - title: { en: "Basic linkers: and, but, or, because, so" }
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker } }
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, linker: and, use: { en: adds an idea }, example: "I like tea **and** coffee." }
          - { level: A1, linker: but, use: { en: shows a contrast }, example: "I like tea, **but** I don't like coffee." }
          - { level: A1, linker: or, use: { en: gives a choice }, example: "Do you want tea **or** coffee?" }
          - { level: A1, linker: because, use: { en: gives the reason }, example: "I'm tired **because** I work late." }
          - { level: A1, linker: so, use: { en: gives the result }, example: "I'm tired, **so** I go to bed." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Between two full clauses, **but** and **so** usually take a comma before them: I was tired, **so** I left."
          - level: A1
            text:
              en: "**and**, **or** and **because** usually have no comma before them."
          - level: A1
            text:
              en: "**because** is followed by a clause: a subject and a verb."
          - level: A2
            text:
              en: "**because of** is followed by a noun:"
            ex: "We stayed in **because of** the rain."

  - title: { en: "Time linkers: when, before, after, then" }
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, linker: when, pattern: "when + clause", example: "**When** I get home, I cook." }
          - { level: A2, linker: before, pattern: "before + clause", example: "I wash my hands **before** I eat." }
          - { level: A2, linker: after, pattern: "after + clause", example: "We go home **after** the film ends." }
          - { level: A2, linker: then, pattern: "clause, then + clause", example: "I had lunch, **then** I went home." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "A time clause that starts the sentence takes a comma after it: **When** it rains, we stay in."
          - level: A2
            text:
              en: "After **when**, **before** and **after** the present simple talks about the future: **When** I arrive, I'll call you."

  - title: { en: "Adding: also, too, as well as, in addition" }
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, linker: also, example: "I **also** speak French. / She is **also** a nurse." }
          - { level: A2, linker: too, example: "I speak French **too**." }
          - { level: B1, linker: as well as, example: "She speaks French **as well as** Spanish." }
          - { level: B1, linker: in addition, example: "**In addition**, the hotel has a pool." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**also** goes before the main verb and after be. **too** goes at the end."
          - level: B1
            text:
              en: "**as well as** is followed by a noun or an -ing form."
          - level: B1
            text:
              en: "**in addition** starts a sentence and is followed by a comma."

  - title: { en: "Contrast: although, however, while" }
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, linker: although, pattern: "although + clause, clause", example: "**Although** it was raining, we went out." }
          - { level: B1, linker: however, pattern: "sentence. However, sentence", example: "It was raining. **However**, we went out." }
          - { level: B1, linker: while, pattern: "while + clause, clause", example: "**While** I like tea, my wife prefers coffee." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**although** joins two clauses in one sentence and replaces **but**."
          - level: B1
            text:
              en: "**even though** is a stronger **although**: **Even though** I was tired, I went out."
          - level: B1
            text:
              en: "**however** usually starts a new sentence and is followed by a comma."
          - level: B1
            text:
              en: "**while** also means *at the same time*: I read **while** I eat."

  - title: { en: "Purpose and condition: so that, unless" }
    content:
      - type: table
        columns:
          - { key: linker, label: { en: Linker } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, linker: so that, pattern: "so that + clause", example: "I left early **so that** I could catch the bus." }
          - { level: B1, linker: unless, pattern: "unless = if … not", example: "We stay in **unless** it stops raining." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "More on **unless**: [Conditionals: Zero, First and Second](id:en.sentence-building.conditionals-0-1-2)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: B1, wrong: "Although it was raining, but we went out.", right: "Although it was raining, we went out.", rule: { en: although replaces but } }
          - { level: A2, wrong: We stayed in because the rain., right: "We stayed in **because of** the rain.", rule: { en: "because + clause, because of + noun" } }
          - { level: A2, wrong: We stayed in because of it was raining., right: "We stayed in **because** it was raining.", rule: { en: because of + noun only } }
          - { level: B1, wrong: "It was cold, however we went out.", right: "It was cold. **However**, we went out.", rule: { en: however starts a new sentence and takes a comma } }
          - { level: A2, wrong: I speak French also., right: "I **also** speak French. / I speak French **too**.", rule: { en: "also goes before the main verb, too at the end" } }
