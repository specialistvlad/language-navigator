# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.can-could
lang: en
kind: grammar
tags: [verbs, modals, ability, permission, requests]
concepts: [ability]
related: [en.modals.must-have-to, en.modals.should, en.modals.may-might, en.modals.would, en.sentence-building.questions-negatives, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Can and Could }
summary:
  lead: { en: "Can for ability, permission and requests; could for past ability, polite requests and possibility." }
  rule: { en: "Can and could never change and take the base verb without to:" }
  ex: ["She ", { target: can }, " swim. ", { target: Can }, " she swim?"]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A1, point: { en: Form }, rule: { en: [{ pattern: [{ slot: subject }, can, { slot: base verb }] }, "; one form for every subject"] }, ex: ["She ", { target: can }, " swim."] }
        - { level: A1, point: { en: Negative }, rule: { en: [{ term: can't }, "; the full form is ", { term: cannot }, ", one word"] }, ex: ["I ", { target: can't }, " swim."] }
        - { level: A1, point: { en: Question }, rule: { en: [{ pattern: [Can, { slot: subject }, { slot: base verb }] }, "; no ", { term: do }] }, ex: [{ target: Can }, " you swim?"] }
        - { level: A1, point: { en: Ability }, rule: { en: [{ term: can }, " for skills"] }, ex: ["I ", { target: can }, " cook pasta."] }
        - { level: A1, point: { en: Permission }, rule: { en: [{ term: can }, " allows, ", { term: can't }, " forbids; ask with ", { term: [Can I, { gap: true }, "?"] }] }, ex: { examples: [["You ", { target: can }, " park here."], [{ target: Can }, " I open the window?"]] } }
        - { level: A1, point: { en: Request }, rule: { en: [{ term: [Can you, { gap: true }, "?"] }, " asks for help"] }, ex: [{ target: Can }, " you help me, please?"] }
        - { level: A2, point: { en: Past ability }, rule: { en: [{ term: could }, " for general ability in the past"] }, ex: ["I ", { target: could }, " run fast when I was young."] }
        - { level: A2, point: { en: Polite request }, rule: { en: [{ term: Could }, " is more polite than ", { term: can }] }, ex: [{ target: Could }, " you open the door, please?"] }
        - { level: A2, point: { en: Possibility }, rule: { en: [{ term: could }, " says what may happen"] }, ex: ["It ", { target: could }, " rain later."] }
        - { level: A2, point: { en: Other tenses }, rule: { en: [{ term: be able to }, " takes the place of ", { term: can }] }, ex: ["I'll ", { target: be able to }, " help you tomorrow."] }
        - { level: A2, point: { en: Trap }, rule: { en: ["a single success in the past takes ", { alternatives: [{ term: was }, { term: were }] }, " ", { term: able to }] }, ex: ["The fire was big, but we ", { target: were able to }, " escape."] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: can }, " and ", { term: could }, " have one form for every subject: I can, she can."]
          - type: rule
            level: A1
            text:
              en: ["The verb after ", { term: can }, " or ", { term: could }, " is in the base form:"]
            ex: ["She can ", { target: swim }, "."]
          - type: rule
            level: A1
            text:
              en: ["Questions and negatives need no ", { term: do }, ":"]
            ex: { examples: [[{ target: Can }, " you swim?"], ["I ", { target: can't }, " swim."]] }
          - type: rule
            level: A1
            text:
              en: ["The written negative is ", { term: can't }, "; the full form is ", { term: cannot }, ", one word."]

  - title: { en: "Pronunciation: can and can't" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, form: { en: "can (weak, in a sentence)" }, sound: { ipa: kən }, ex: ["I ", { target: can }, " swim. ", { ipa: aɪ kən ˈswɪm }] }
          - { level: A1, form: { en: "can (strong, at the end or for emphasis)" }, sound: { ipa: kæn }, ex: ["Yes, I ", { target: can }, ". ", { ipa: jes aɪ ˈkæn }] }
          - { level: A1, form: can't, sound: [{ ipa: kɑːnt }, " ", { variant: { ipa: kænt }, variety: en-US }], ex: ["I ", { target: can't }, " swim. ", { ipa: aɪ ˈkɑːnt swɪm }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["In a statement the stress falls on the main verb, so ", { term: can }, " is short."]
          - type: rule
            level: A1
            text:
              en: [{ term: can't }, " is always stressed and has a long vowel in British English."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "Ability: skills (can)" }, ex: ["I ", { target: can }, " cook pasta."] }
          - { level: A1, use: { en: "Permission: what is allowed (can)" }, ex: ["You ", { target: can }, " park here."] }
          - { level: A1, use: { en: Not allowed (can't) }, ex: ["You ", { target: can't }, " smoke here."] }
          - { level: A1, use: { en: Asking for permission (Can I…?) }, ex: [{ target: Can }, " I open the window?"] }
          - { level: A1, use: { en: Requests (Can you…?) }, ex: [{ target: Can }, " you help me, please?"] }
          - { level: A2, use: { en: "Senses: see, hear, smell" }, ex: ["I ", { target: can }, " hear music."] }
          - { level: A2, use: { en: General ability in the past (could) }, ex: ["I ", { target: could }, " run fast when I was young."] }
          - { level: A2, use: { en: Polite requests (Could you…?) }, ex: [{ target: Could }, " you open the door, please?"] }
          - { level: A2, use: { en: Polite permission (Could I…?) }, ex: [{ target: Could }, " I use your phone?"] }
          - { level: A2, use: { en: Possibility }, ex: ["It ", { target: could }, " rain later."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: Could }, " is more polite than ", { term: can }, " in a request. The answer uses ", { term: can }, ":"]
            ex: { exchange: [[{ target: Could }, " I sit here?"], ["Yes, of course you ", { target: can }, "."]] }
          - type: rule
            level: A2
            text:
              en: [{ term: be able to }, " takes the place of ", { term: can }, " in other tenses:"]
            ex: ["I'll ", { target: be able to }, " help you tomorrow."]
          - type: rule
            level: A2
            text:
              en: ["A single success in the past takes ", { alternatives: [{ term: was }, { term: were }] }, " ", { term: able to }, ":"]
            ex: ["The fire was big, but we ", { target: were able to }, " escape."]
          - type: note
            level: A2
            text:
              en: ["For other possibility words see ", { link: May and Might, to: en.modals.may-might }, "."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: She cans swim., right: ["She ", { target: can }, " swim."], rule: { en: can has no -s } }
          - { level: A1, wrong: I can to swim., right: ["I can ", { target: swim }, "."], rule: { en: [{ pattern: [can, { slot: base verb }] }, ; no to] } }
          - { level: A1, wrong: Do you can swim?, right: [{ target: Can }, " you swim?"], rule: { en: questions with can need no do } }
          - { level: A1, wrong: I don't can swim., right: ["I ", { target: can't }, " swim."], rule: { en: negative = can't } }
          - { level: A2, wrong: I can swim when I was five., right: ["I ", { target: could }, " swim when I was five."], rule: { en: { takes: [past ability, could] } } }
          - { level: A1, wrong: She can swims., right: ["She can ", { target: swim }, "."], rule: { en: { pattern: [can, { slot: base verb }] } } }
