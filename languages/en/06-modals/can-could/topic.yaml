# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.can-could
lang: en
kind: grammar
tags: [verbs, modals, ability, permission, requests]
concepts: [ability]
related: [en.modals.must-have-to, en.modals.should, en.modals.may-might, en.modals.would, en.sentence-building.questions-negatives, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Can and Could }
summary:
  en: "Can for ability, permission and requests; could for past ability, polite requests and possibility. Can and could never change and take the base verb without to: She **can** swim. **Can** she swim?"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A1, form: { en: Affirmative }, example: "She **can** swim." }
        - { level: A1, form: { en: Negative }, example: "She **can't** swim." }
        - { level: A1, form: { en: Question }, example: "**Can** she swim?" }
        - { level: A1, form: { en: Short answer }, example: "Yes, she **can**. / No, she **can't**." }
        - { level: A2, form: { en: Past }, example: "I **could** swim at five. / I **couldn't** swim at four." }
        - { level: A2, form: { en: Past question }, example: "**Could** you swim at five?" }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "**can** and **could** have one form for every subject: I can, she can."
          - level: A1
            text:
              en: "The verb after **can** or **could** is in the base form: She can **swim**."
          - level: A1
            text:
              en: "Questions and negatives need no **do**: **Can** you swim? / I **can't** swim."
          - level: A1
            text:
              en: "The written negative is **can't**; the full form is **cannot**, one word."

  - title: { en: "Pronunciation: can and can't" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, form: { en: "can (weak, in a sentence)" }, sound: /kən/, example: "I **can** swim. /aɪ kən ˈswɪm/" }
          - { level: A1, form: { en: "can (strong, at the end or for emphasis)" }, sound: /kæn/, example: "Yes, I **can**. /jes aɪ ˈkæn/" }
          - { level: A1, form: can't, sound: "/kɑːnt/ (US: /kænt/)", example: "I **can't** swim. /aɪ ˈkɑːnt swɪm/" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "In a statement the stress falls on the main verb, so **can** is short."
          - level: A1
            text:
              en: "**can't** is always stressed and has a long vowel in British English."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "Ability: skills (can)" }, example: "I **can** cook pasta." }
          - { level: A1, use: { en: "Permission: what is allowed (can)" }, example: "You **can** park here." }
          - { level: A1, use: { en: "Not allowed (can't)" }, example: "You **can't** smoke here." }
          - { level: A1, use: { en: "Asking for permission (Can I…?)" }, example: "**Can** I open the window?" }
          - { level: A1, use: { en: "Requests (Can you…?)" }, example: "**Can** you help me, please?" }
          - { level: A2, use: { en: "Senses: see, hear, smell" }, example: "I **can** hear music." }
          - { level: A2, use: { en: "General ability in the past (could)" }, example: "I **could** run fast when I was young." }
          - { level: A2, use: { en: "Polite requests (Could you…?)" }, example: "**Could** you open the door, please?" }
          - { level: A2, use: { en: "Polite permission (Could I…?)" }, example: "**Could** I use your phone?" }
          - { level: A2, use: { en: "Possibility" }, example: "It **could** rain later." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**Could** is more polite than **can** in a request. The answer uses **can**:"
            ex: "**Could** I sit here? — Yes, of course you **can**."
          - level: A2
            text:
              en: "**be able to** takes the place of **can** in other tenses:"
            ex: "I'll **be able to** help you tomorrow."
          - level: A2
            text:
              en: "A single success in the past takes **was / were able to**:"
            ex: "The fire was big, but we **were able to** escape."
          - level: A2
            text:
              en: "For other possibility words see [May and Might](id:en.modals.may-might)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: "She cans swim.", right: "She **can** swim.", rule: { en: "can has no -s" } }
          - { level: A1, wrong: "I can to swim.", right: "I can **swim**.", rule: { en: "can + base verb; no to" } }
          - { level: A1, wrong: "Do you can swim?", right: "**Can** you swim?", rule: { en: "questions with can need no do" } }
          - { level: A1, wrong: "I don't can swim.", right: "I **can't** swim.", rule: { en: "negative = can't" } }
          - { level: A2, wrong: "I can swim when I was five.", right: "I **could** swim when I was five.", rule: { en: "past ability → could" } }
          - { level: A1, wrong: "She can swims.", right: "She can **swim**.", rule: { en: "can + base verb" } }
