# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.should
lang: en
kind: grammar
levels: [A2]
tags: [verbs, modals, advice, opinions]
concepts: [advice]
related: [en.modals.must-have-to, en.modals.can-could, en.modals.would, en.sentence-building.conditionals-0-1-2, en.sentence-building.questions-negatives]
status: { en: draft, es: draft }

title: { en: Should, es: Should }
summary:
  en: Advice and opinions with should and shouldn't.
  es: Consejos y opiniones con should y shouldn't.

sections:
  - title: { en: Overview, es: Resumen }
    level: A2
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { form: { en: Affirmative, es: Afirmativa }, example: "You **should** see a doctor.", tr: { es: Deberías ir al médico. } }
          - { form: { en: Negative, es: Negativa }, example: "You **shouldn't** work so late.", tr: { es: No deberías trabajar tan tarde. } }
          - { form: { en: Question, es: Pregunta }, example: "**Should** I take the bus?", tr: { es: "¿Debería coger el autobús?" } }
          - { form: { en: Short answer, es: Respuesta corta }, example: "Yes, you **should**. / No, you **shouldn't**.", tr: { es: Sí. / No. } }
          - { form: { en: Opinion, es: Opinión }, example: "I **think** you **should** call her.", tr: { es: Creo que deberías llamarla. } }
          - { form: { en: Negative opinion, es: Opinión negativa }, example: "I **don't think** you **should** go.", tr: { es: No creo que debas ir. } }
      - type: bullets
        items:
          - en: "**should** has one form for every subject: I should, she should."
            es: "**should** tiene una sola forma para todos los sujetos: I should, she should."
          - en: "The verb after **should** is in the base form: You should **rest**."
            es: "El verbo después de **should** va en forma base: You should **rest**."
          - en: "Questions and negatives need no **do**: **Should** I go? / You **shouldn't** go."
            es: "Las preguntas y las negativas no llevan **do**: **Should** I go? / You **shouldn't** go."
          - en: "The negative opinion puts **don't** on **think**: I **don't think** you should go."
            es: "En la opinión negativa **don't** va con **think**: I **don't think** you should go."
          - { for: [es], text: { es: "*Deberías* = you should. *Debes* = you must (obligación más fuerte)." } }

  - title: { en: "Pronunciation: should and shouldn't", es: "Pronunciación: should y shouldn't" }
    level: A2
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: sound, label: { en: Sound, es: Sonido } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { form: { en: "should (weak, in a sentence)", es: "should (débil, dentro de la frase)" }, sound: /ʃəd/, example: "You **should** rest. /juː ʃəd ˈrest/", tr: { es: Deberías descansar. } }
          - { form: { en: "should (strong, at the end)", es: "should (fuerte, al final)" }, sound: /ʃʊd/, example: "Yes, you **should**. /jes juː ˈʃʊd/", tr: { es: "Sí, deberías." } }
          - { form: shouldn't, sound: /ˈʃʊdnt/, example: "You **shouldn't** go. /juː ˈʃʊdnt ɡəʊ/", tr: { es: No deberías ir. } }
      - type: bullets
        items:
          - en: "The **l** in should and shouldn't is silent: should is /ʃʊd/ when strong."
            es: "La **l** de should y shouldn't no se pronuncia: should suena /ʃʊd/ en su forma fuerte."

  - title: { en: Use, es: Uso }
    level: A2
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { use: { en: "Advice: a good idea", es: "Consejo: una buena idea" }, example: "You **should** drink more water.", tr: { es: Deberías beber más agua. } }
          - { use: { en: "Advice against: a bad idea", es: "Consejo en contra: una mala idea" }, example: "You **shouldn't** eat so much sugar.", tr: { es: No deberías comer tanto azúcar. } }
          - { use: { en: "Asking for advice", es: "Pedir consejo" }, example: "What **should** I do?", tr: { es: "¿Qué debería hacer?" } }
          - { use: { en: "Giving an opinion", es: "Dar una opinión" }, example: "I think the government **should** build more parks.", tr: { es: Creo que el gobierno debería construir más parques. } }
          - { use: { en: "A mild duty", es: "Una obligación suave" }, example: "We **should** leave now. It's late.", tr: { es: Deberíamos irnos ya. Es tarde. } }
      - type: bullets
        items:
          - en: "**should** gives advice and opinions; the listener decides whether to follow them."
            es: "**should** da consejos y opiniones; el oyente decide si los sigue."

  - title: { en: "Compare: should and must", es: "Comparación: should y must" }
    level: A2
    content:
      - type: table
        columns:
          - { key: row, label: { en: Point, es: Punto } }
          - { key: should, label: should }
          - { key: must, label: must }
        rows:
          - row: { en: Meaning, es: Significado }
            should: { en: "advice, a good idea", es: "consejo, una buena idea" }
            must: { en: "strong obligation, a rule", es: "obligación fuerte, una norma" }
          - row: { en: Example, es: Ejemplo }
            should: { ex: "You **should** wear a coat.", tr: { es: Deberías ponerte un abrigo. } }
            must: { ex: "You **must** wear a seat belt.", tr: { es: Debes llevar puesto el cinturón de seguridad. } }
      - type: bullets
        items:
          - en: "See [Must and Have To](id:en.modals.must-have-to)."
            es: "Ver [Must y have to](id:en.modals.must-have-to)."

  - title: { en: Typical errors, es: Errores típicos }
    level: A2
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: "She shoulds go.", right: "She **should** go.", rule: { en: "should has no -s", es: "should no lleva -s" } }
          - { wrong: "You should to see a doctor.", right: "You should **see** a doctor.", rule: { en: "should + base verb; no to", es: "should + forma base, sin to" } }
          - { wrong: "Do I should go?", right: "**Should** I go?", rule: { en: "questions with should need no do", es: "la pregunta con should no lleva do" } }
          - { wrong: "I think you don't should go.", right: "I **don't think** you should go.", rule: { en: "negative opinion: I don't think + should", es: "opinión negativa: I don't think + should" } }
          - { for: [es], wrong: "What I should do?", right: "What **should** I do?", rule: { es: "should va delante del sujeto en la pregunta" } }
          - { for: [en], wrong: "Should he goes?", right: "Should he **go**?", rule: { en: "should + base verb" } }

essentials:
  - level: A2
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: form, label: { en: Form, es: Forma } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { form: +, example: "You **should** see a doctor." }
              - { form: −, example: "You **shouldn't** work so late." }
              - { form: "?", example: "**Should** I take the bus?" }
              - { form: { en: Opinion, es: Opinión }, example: "I **think** you **should** call her." }
              - { form: { en: Negative opinion, es: Opinión negativa }, example: "I **don't think** you **should** go." }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - en: "One form for every subject; base verb after should; no do."
                es: "Una sola forma para todos los sujetos; forma base después de should; sin do."
              - en: "Negative opinion: **don't think** + should."
                es: "Opinión negativa: **don't think** + should."
              - en: "should /ʃəd/ is weak in a sentence; the l is silent."
                es: "should /ʃəd/ es débil dentro de la frase; la l no se pronuncia."
      - title: { en: Use, es: Uso }
        content:
          - type: table
            columns:
              - { key: use, label: { en: Use, es: Uso } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { use: { en: advice, es: consejo }, example: "You **should** drink more water.", tr: { es: Deberías beber más agua. } }
              - { use: { en: asking for advice, es: pedir consejo }, example: "What **should** I do?", tr: { es: "¿Qué debería hacer?" } }
              - { use: { en: opinion, es: opinión }, example: "I think we **should** leave.", tr: { es: Creo que deberíamos irnos. } }
              - { use: { en: "advice, not a rule", es: "consejo, no norma" }, example: "You **should** wear a coat. (must = rule)", tr: { es: Deberías ponerte un abrigo. (must = norma) } }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { wrong: "You should to see a doctor.", right: "You should **see** a doctor." }
              - { wrong: "Do I should go?", right: "**Should** I go?" }
              - { wrong: "I think you don't should go.", right: "I **don't think** you should go." }
              - { for: [es], wrong: "What I should do?", right: "What **should** I do?" }

reminders:
  - level: A2
    items:
      - en: "should + base verb; no do, no to: **Should** I go?"
        es: "should + forma base; sin do ni to: **Should** I go?"
      - en: "Negative opinion: I **don't think** you should go."
        es: "Opinión negativa: I **don't think** you should go."
