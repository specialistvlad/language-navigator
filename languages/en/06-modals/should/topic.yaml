# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.should
lang: en
kind: grammar
tags: [verbs, modals, advice, opinions]
concepts: [advice]
related: [en.modals.must-have-to, en.modals.can-could, en.modals.would, en.sentence-building.conditionals-0-1-2, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Should }
summary:
  en: "Should and shouldn't for advice and opinions. Should takes the base verb with every subject and needs no do in questions: You **should** go. **Should** I go?"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A2, form: { en: Affirmative }, example: "You **should** see a doctor." }
        - { level: A2, form: { en: Negative }, example: "You **shouldn't** work so late." }
        - { level: A2, form: { en: Question }, example: "**Should** I take the bus?" }
        - { level: A2, form: { en: Short answer }, example: "Yes, you **should**. / No, you **shouldn't**." }
        - { level: A2, form: { en: Opinion }, example: "I **think** you **should** call her." }
        - { level: A2, form: { en: Negative opinion }, example: "I **don't think** you **should** go." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A2
            text:
              en: "**should** has one form for every subject: I should, she should."
          - level: A2
            text:
              en: "The verb after **should** is in the base form: You should **rest**."
          - level: A2
            text:
              en: "Questions and negatives need no **do**: **Should** I go? / You **shouldn't** go."
          - level: A2
            text:
              en: "The negative opinion puts **don't** on **think**: I **don't think** you should go."

  - title: { en: "Pronunciation: should and shouldn't" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: { en: "should (weak, in a sentence)" }, sound: /ʃəd/, example: "You **should** rest. /juː ʃəd ˈrest/" }
          - { level: A2, form: { en: "should (strong, at the end)" }, sound: /ʃʊd/, example: "Yes, you **should**. /jes juː ˈʃʊd/" }
          - { level: A2, form: shouldn't, sound: /ˈʃʊdnt/, example: "You **shouldn't** go. /juː ˈʃʊdnt ɡəʊ/" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The **l** in should and shouldn't is silent: should is /ʃʊd/ when strong."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Advice: a good idea" }, example: "You **should** drink more water." }
          - { level: A2, use: { en: "Advice against: a bad idea" }, example: "You **shouldn't** eat so much sugar." }
          - { level: A2, use: { en: "Asking for advice" }, example: "What **should** I do?" }
          - { level: A2, use: { en: "Giving an opinion" }, example: "I think the government **should** build more parks." }
          - { level: A2, use: { en: "A mild duty" }, example: "We **should** leave now. It's late." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**should** gives advice and opinions; the listener decides whether to follow them."

  - title: { en: "Compare: should and must" }
    content:
      - type: table
        columns:
          - { key: row, label: { en: Point } }
          - { key: should, label: should }
          - { key: must, label: must }
        rows:
          - level: A2
            row: { en: Meaning }
            should: { en: "advice, a good idea" }
            must: { en: "strong obligation, a rule" }
          - level: A2
            row: { en: Example }
            should: { ex: "You **should** wear a coat." }
            must: { ex: "You **must** wear a seat belt." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "See [Must and Have To](id:en.modals.must-have-to)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: "She shoulds go.", right: "She **should** go.", rule: { en: "should has no -s" } }
          - { level: A2, wrong: "You should to see a doctor.", right: "You should **see** a doctor.", rule: { en: "should + base verb; no to" } }
          - { level: A2, wrong: "Do I should go?", right: "**Should** I go?", rule: { en: "questions with should need no do" } }
          - { level: A2, wrong: "I think you don't should go.", right: "I **don't think** you should go.", rule: { en: "negative opinion: I don't think + should" } }
          - { level: A2, wrong: "Should he goes?", right: "Should he **go**?", rule: { en: "should + base verb" } }
