# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.must-have-to
lang: en
kind: grammar
tags: [verbs, modals, obligation]
concepts: [obligation]
related: [en.modals.should, en.modals.can-could, en.modals.may-might, en.tenses.simple-tenses, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Must and Have To }
summary:
  lead: { en: Must and have to for obligation; mustn't for prohibition; don't have to for no obligation. }
  rule: { en: "Mustn't forbids and don't have to means it is not necessary:" }
  ex: { examples: [["You ", { target: mustn't }, " park here."], ["You ", { target: don't have to }, " pay."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A2, point: { en: "Form: must" }, rule: { en: [{ pattern: [{ slot: subject }, must, { slot: V }] }, "; one form for every subject"] }, ex: ["She ", { target: must }, " study."] }
        - { level: A2, point: { en: "Form: have to" }, rule: { en: [{ term: have to }, ", but ", { term: has to }, " with he, she, it"] }, ex: { examples: [["We ", { target: have to }, " leave."], ["He ", { target: has to }, " leave."]] } }
        - { level: A2, point: { en: "Question, negative" }, rule: { en: [{ term: have to }, " takes ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " and then the base form"] }, ex: { examples: [[{ target: Do }, " you ", { target: have to }, " leave?"], ["She ", { target: doesn't have to }, " leave."]] } }
        - { level: A2, point: must, rule: { en: "the speaker's own view or a written rule" }, ex: { examples: [["I ", { target: must }, " save more money."], ["Visitors ", { target: must }, " sign in."]] } }
        - { level: A2, point: have to, rule: { en: "the situation or another person decides; common in speech" }, ex: ["I ", { target: have to }, " get up at six for work."] }
        - { level: A2, point: mustn't, rule: { en: forbidden }, ex: ["You ", { target: mustn't }, " use your phone here."] }
        - { level: A2, point: don't have to, rule: { en: "not necessary: you can choose" }, ex: ["You ", { target: don't have to }, " come."] }
        - { level: A2, point: { en: Trap }, rule: { en: [{ term: had to }, " is the past of ", { term: must }] }, ex: ["I ", { target: had to }, " work on ", { weekday: Saturday, value: 6 }, "."] }

sections:
  - title: { en: "Form: must" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, features: { polarity: pos, interrogativity: decl }, form: { en: Affirmative }, pattern: { pattern: [{ slot: subject }, must, { slot: V }] }, ex: ["She ", { target: must }, " study."] }
          - { level: A2, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, pattern: { pattern: [{ slot: subject }, mustn't, { slot: V }] }, ex: ["You ", { target: mustn't }, " touch it."] }
          - { level: A2, features: { polarity: pos, interrogativity: int }, form: { en: Question }, pattern: { pattern: [Must, { slot: subject }, { slot: V }] }, ex: [{ target: Must }, " I go now?"] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: must }, " has one form for every subject and takes the base verb:"]
            ex: ["She must ", { target: study }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: must }, " has no past form. The past is ", { term: had to }, "."]
          - type: rule
            level: A2
            text:
              en: ["Questions with ", { term: must }, " are formal and rare. Speech prefers ", { term: [Do I have to, { gap: true }, "?"] }]

  - title: { en: "Form: have to" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, features: [{ polarity: pos, interrogativity: decl, person: 1, number: sg }, { polarity: pos, interrogativity: decl, person: 2 }, { polarity: pos, interrogativity: decl, person: 1, number: pl }, { polarity: pos, interrogativity: decl, person: 3, number: pl }], form: { en: [Affirmative (, { alternatives: [I, you, we, they] }, ")"] }, pattern: { pattern: [have to, { slot: V }] }, ex: ["We ", { target: have to }, " leave."] }
          - { level: A2, features: { polarity: pos, interrogativity: decl, person: 3, number: sg }, form: { en: [Affirmative (, { alternatives: [he, she, it] }, ")"] }, pattern: { pattern: [has to, { slot: V }] }, ex: ["He ", { target: has to }, " leave."] }
          - { level: A2, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, pattern: { pattern: [[{ alternatives: [don't, doesn't] }, " have to"], { slot: V }] }, ex: ["She ", { target: doesn't have to }, " leave."] }
          - { level: A2, features: { polarity: pos, interrogativity: int }, form: { en: Question }, pattern: { pattern: [{ alternatives: [Do, Does] }, { slot: subject }, have to, { slot: V }] }, ex: [{ target: Do }, " you ", { target: have to }, " leave?"] }
          - { level: A2, features: { tense: pst }, form: { en: Past }, pattern: { pattern: [had to, { slot: V }] }, ex: ["I ", { target: had to }, " leave."] }
          - { level: A2, features: [{ tense: pst, polarity: neg, interrogativity: decl }, { tense: pst, polarity: pos, interrogativity: int }], form: { en: Past negative and question }, pattern: { alternatives: [didn't have to, ["Did ", { gap: true }, " have to"]] }, ex: [{ target: Did }, " you ", { target: have to }, " pay?"] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: have to }, " works like a main verb: it takes ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " in questions and negatives."]
          - type: rule
            level: A2
            text:
              en: ["After ", { alternatives: [{ term: do }, { term: does }, { term: did }] }, " the verb is in the base form:"]
            ex: ["Does she ", { target: have }, " to leave?"]

  - title: { en: "Pronunciation: have to and must" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, form: have to, sound: { ipa: ˈhæf tə }, ex: ["I ", { target: have to }, " go. ", { ipa: aɪ ˈhæf tə ɡəʊ }] }
          - { level: A2, form: has to, sound: { ipa: ˈhæs tə }, ex: ["She ", { target: has to }, " go. ", { ipa: ʃi ˈhæs tə ɡəʊ }] }
          - { level: A2, form: had to, sound: { ipa: ˈhæd tə }, ex: ["We ", { target: had to }, " go. ", { ipa: wi ˈhæd tə ɡəʊ }] }
          - { level: A2, form: mustn't, sound: { ipa: ˈmʌsnt }, ex: ["You ", { target: mustn't }, " go. ", { ipa: juː ˈmʌsnt ɡəʊ }] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Before ", { term: to }, " the final sound of ", { term: have }, " changes to ", { ipa: f }, ", ", { term: has }, " to ", { ipa: s }, " and ", { term: had }, " stays ", { ipa: d }, "."]
          - type: rule
            level: A2
            text:
              en: ["The first ", { letter: t }, " of ", { term: mustn't }, " is silent."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Personal obligation: the speaker decides (must)" }, ex: ["I ", { target: must }, " save more money."] }
          - { level: A2, use: { en: Written rules and signs (must) }, ex: ["Visitors ", { target: must }, " sign in."] }
          - { level: A2, use: { en: Strong recommendation (must) }, ex: ["You ", { target: must }, " try this cake!"] }
          - { level: A2, use: { en: Obligation from the situation or another person (have to) }, ex: ["I ", { target: have to }, " get up at six for work."] }
          - { level: A2, use: { en: Prohibition (mustn't) }, ex: ["You ", { target: mustn't }, " use your phone here."] }
          - { level: A2, use: { en: "No obligation: it is not necessary (don't have to)" }, ex: ["You ", { target: don't have to }, " come."] }
          - { level: A2, use: { en: Past obligation (had to) }, ex: ["I ", { target: had to }, " work on ", { weekday: Saturday, value: 6 }, "."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: must }, " expresses the speaker's own view or a written rule; ", { term: have to }, " expresses facts outside the speaker."]
          - type: rule
            level: A2
            text:
              en: ["In everyday speech ", { term: have to }, " is more common than ", { term: must }, "."]
          - type: note
            level: A2
            text:
              en: ["For advice that is not an obligation see ", { link: Should, to: en.modals.should }, "."]

  - title: { en: "Compare: mustn't and don't have to" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: row, label: { en: Point } }
          - { key: mustnt, label: mustn't }
          - { key: dont, label: don't have to }
        rows:
          - { level: A2, row: { en: Meaning }, mustnt: { en: forbidden }, dont: { en: "not necessary: you can choose" } }
          - { level: A2, row: { en: Example }, mustnt: ["You ", { target: mustn't }, " tell Ana. It's a secret."], dont: ["You ", { target: don't have to }, " tell Ana. I can do it."] }
          - { level: A2, row: { en: Example }, mustnt: ["Children ", { target: mustn't }, " cross alone."], dont: ["Children ", { target: don't have to }, " wear a uniform."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: You don't must smoke here., right: ["You ", { target: mustn't }, " smoke here."], rule: { en: negative of must = mustn't } }
          - { level: A2, wrong: She musts go., right: ["She ", { target: must }, " go."], rule: { en: must has no -s } }
          - { level: A2, wrong: She must to go., right: ["She must ", { target: go }, "."], rule: { en: [{ pattern: [must, { slot: base verb }] }, ; no to] } }
          - { level: A2, wrong: He have to work., right: ["He ", { target: has to }, " work."], rule: { en: { takes: [{ alternatives: [he, she, it] }, has to] } } }
          - { level: A2, wrong: Do I must go?, right: { alternatives: [[{ target: Do }, " I ", { target: have to }, " go?"], [{ target: Must }, " I go?"]] }, rule: { en: have to takes do; must forms its own question } }
          - { level: A2, wrong: She doesn't has to work., right: ["She doesn't ", { target: have to }, " work."], rule: { en: { pattern: [doesn't, base form] } } }
          - { level: A2, wrong: I must work yesterday., right: ["I ", { target: had to }, " work yesterday."], rule: { en: { takes: [past of must, had to] } } }
