# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.must-have-to
lang: en
kind: grammar
tags: [verbs, modals, obligation]
concepts: [obligation]
related: [en.modals.should, en.modals.can-could, en.modals.may-might, en.tenses.simple-tenses, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Must and Have To }
summary:
  en: "Must and have to for obligation; mustn't for prohibition; don't have to for no obligation. Mustn't forbids and don't have to means it is not necessary: You **mustn't** park here. You **don't have to** pay."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: meaning, label: { en: Meaning } }
        - { key: form, label: { en: Form } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A2, meaning: { en: "strong personal obligation, rules" }, form: must + V, example: "I **must** call my mum." }
        - { level: A2, meaning: { en: "obligation from outside" }, form: have to + V, example: "I **have to** wear a uniform." }
        - { level: A2, meaning: { en: prohibition }, form: mustn't + V, example: "You **mustn't** park here." }
        - { level: A2, meaning: { en: "no obligation" }, form: don't have to + V, example: "You **don't have to** pay." }
        - { level: A2, meaning: { en: "past obligation" }, form: had to + V, example: "I **had to** work late." }

sections:

  - title: { en: "Form: must" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: { en: Affirmative }, pattern: subject + must + V, example: "She **must** study." }
          - { level: A2, form: { en: Negative }, pattern: subject + mustn't + V, example: "You **mustn't** touch it." }
          - { level: A2, form: { en: Question }, pattern: Must + subject + V, example: "**Must** I go now?" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**must** has one form for every subject and takes the base verb: She must **study**."
          - level: A2
            text:
              en: "**must** has no past form. The past is **had to**."
          - level: A2
            text:
              en: "Questions with **must** are formal and rare. Speech prefers **Do I have to…?**"

  - title: { en: "Form: have to" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: { en: "Affirmative (I / you / we / they)" }, pattern: have to + V, example: "We **have to** leave." }
          - { level: A2, form: { en: "Affirmative (he / she / it)" }, pattern: has to + V, example: "He **has to** leave." }
          - { level: A2, form: { en: Negative }, pattern: don't / doesn't have to + V, example: "She **doesn't have to** leave." }
          - { level: A2, form: { en: Question }, pattern: Do / Does + subject + have to + V, example: "**Do** you **have to** leave?" }
          - { level: A2, form: { en: Past }, pattern: had to + V, example: "I **had to** leave." }
          - { level: A2, form: { en: "Past negative and question" }, pattern: didn't have to / Did … have to, example: "**Did** you **have to** pay?" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**have to** works like a main verb: it takes **do / does / did** in questions and negatives."
          - level: A2
            text:
              en: "After **do / does / did** the verb is in the base form: Does she **have** to leave?"

  - title: { en: "Pronunciation: have to and must" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: have to, sound: /ˈhæf tə/, example: "I **have to** go. /aɪ ˈhæf tə ɡəʊ/" }
          - { level: A2, form: has to, sound: /ˈhæs tə/, example: "She **has to** go. /ʃi ˈhæs tə ɡəʊ/" }
          - { level: A2, form: had to, sound: /ˈhæd tə/, example: "We **had to** go. /wi ˈhæd tə ɡəʊ/" }
          - { level: A2, form: mustn't, sound: /ˈmʌsnt/, example: "You **mustn't** go. /juː ˈmʌsnt ɡəʊ/" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "Before **to** the final sound of **have** changes to /f/, **has** to /s/ and **had** stays /d/."
          - level: A2
            text:
              en: "The first **t** of **mustn't** is silent."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Personal obligation: the speaker decides (must)" }, example: "I **must** save more money." }
          - { level: A2, use: { en: "Written rules and signs (must)" }, example: "Visitors **must** sign in." }
          - { level: A2, use: { en: "Strong recommendation (must)" }, example: "You **must** try this cake!" }
          - { level: A2, use: { en: "Obligation from the situation or another person (have to)" }, example: "I **have to** get up at six for work." }
          - { level: A2, use: { en: "Prohibition (mustn't)" }, example: "You **mustn't** use your phone here." }
          - { level: A2, use: { en: "No obligation: it is not necessary (don't have to)" }, example: "You **don't have to** come." }
          - { level: A2, use: { en: "Past obligation (had to)" }, example: "I **had to** work on Saturday." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**must** expresses the speaker's own view or a written rule; **have to** expresses facts outside the speaker."
          - level: A2
            text:
              en: "In everyday speech **have to** is more common than **must**."
          - level: A2
            text:
              en: "For advice that is not an obligation see [Should](id:en.modals.should)."

  - title: { en: "Compare: mustn't and don't have to" }
    content:
      - type: table
        columns:
          - { key: row, label: { en: Point } }
          - { key: mustnt, label: mustn't }
          - { key: dont, label: don't have to }
        rows:
          - level: A2
            row: { en: Meaning }
            mustnt: { en: "forbidden" }
            dont: { en: "not necessary: you can choose" }
          - level: A2
            row: { en: Example }
            mustnt: { ex: "You **mustn't** tell Ana. It's a secret." }
            dont: { ex: "You **don't have to** tell Ana. I can do it." }
          - level: A2
            row: { en: Example }
            mustnt: { ex: "Children **mustn't** cross alone." }
            dont: { ex: "Children **don't have to** wear a uniform." }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: "You don't must smoke here.", right: "You **mustn't** smoke here.", rule: { en: "negative of must = mustn't" } }
          - { level: A2, wrong: "She musts go.", right: "She **must** go.", rule: { en: "must has no -s" } }
          - { level: A2, wrong: "She must to go.", right: "She must **go**.", rule: { en: "must + base verb; no to" } }
          - { level: A2, wrong: "He have to work.", right: "He **has to** work.", rule: { en: "he / she / it → has to" } }
          - { level: A2, wrong: "Do I must go?", right: "**Do** I **have to** go? / **Must** I go?", rule: { en: "have to takes do; must forms its own question" } }
          - { level: A2, wrong: "She doesn't has to work.", right: "She doesn't **have to** work.", rule: { en: "doesn't + base form" } }
          - { level: A2, wrong: "I must work yesterday.", right: "I **had to** work yesterday.", rule: { en: "past of must → had to" } }
