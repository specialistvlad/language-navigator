# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.would
lang: en
kind: grammar
tags: [verbs, modals, politeness, conditionals]
concepts: [conditional-mood, past-habits]
related: [en.sentence-building.conditionals-0-1-2, en.tenses.used-to, en.modals.can-could, en.modals.should, en.tenses.perfect-tenses]
status: { en: draft }

title: { en: Would }
summary:
  en: "Would like for offers and wants; would for polite requests, imagined situations and past habits. Would has one form for every subject and takes the base verb: **Would** you like a coffee? I **would** like tea."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: use, label: { en: Use } }
        - { key: pattern, label: { en: Pattern } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A1, use: { en: "wants and offers" }, pattern: would like, example: "I'**d like** a coffee." }
        - { level: B1, use: { en: "polite requests" }, pattern: Would you + V…?, example: "**Would** you **help** me?" }
        - { level: B1, use: { en: "imagined situations" }, pattern: would + V, example: "I **would** travel more." }
        - { level: B1, use: { en: "past habits" }, pattern: would + V, example: "We **would** swim every summer." }

sections:
  - title: { en: "Form: would" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: pattern, label: { en: Pattern } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, form: { en: Affirmative }, pattern: subject + would / 'd + V, example: "She **would** help." }
          - { level: B1, form: { en: Negative }, pattern: subject + wouldn't + V, example: "I **wouldn't** go." }
          - { level: A1, form: { en: Question }, pattern: Would + subject + V, example: "**Would** you like tea?" }
          - { level: B1, form: { en: Short answer }, pattern: "Yes, … would. / No, … wouldn't.", example: "Yes, I **would**. / No, I **wouldn't**." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**would** has one form for every subject: I would, she would."
          - level: B1
            text:
              en: "The verb after **would** is in the base form: She would **help**."
          - level: B1
            text:
              en: "Questions and negatives need no **do**: **Would** you go? / I **wouldn't** go."

  - title: { en: "Form: short forms" }
    content:
      - type: table
        columns:
          - { key: full, label: { en: Full form } }
          - { key: short, label: { en: Short form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, full: I would, short: I'd, example: "I'**d** like a tea." }
          - { level: B1, full: you would, short: you'd, example: "You'**d** like her." }
          - { level: B1, full: he / she / it would, short: he'd / she'd / it'd, example: "She'**d** love it." }
          - { level: B1, full: we / they would, short: we'd / they'd, example: "We'**d** go." }
          - { level: B1, full: would not, short: wouldn't, example: "They **wouldn't** mind." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**'d** + base verb = **would**. **'d** + past participle = **had**:"
            ex: "I'**d** go. (= I would go) / I'**d** gone. (= I had gone)"
          - level: B1
            text:
              en: "See [Past perfect](id:en.tenses.perfect-tenses)."

  - title: { en: "Pronunciation: would and 'd" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, form: { en: "would (weak, in a sentence)" }, sound: /wəd/, example: "**Would** you help? /wəd juː ˈhelp/" }
          - { level: B1, form: { en: "would (strong, at the end)" }, sound: /wʊd/, example: "Yes, I **would**. /jes aɪ ˈwʊd/" }
          - { level: A1, form: I'd, sound: /aɪd/, example: "I'**d** like tea. /aɪd ˈlaɪk tiː/" }
          - { level: B1, form: wouldn't, sound: /ˈwʊdnt/, example: "I **wouldn't** go. /aɪ ˈwʊdnt ɡəʊ/" }
      - type: bullets
        items:
          - level: B1
            text:
              en: "The **l** in would and wouldn't is silent: would is /wʊd/ when strong."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "A polite want: would like + noun" }, example: "I'**d like** a coffee, please." }
          - { level: A1, use: { en: "A polite want: would like + to V" }, example: "I'**d like to** book a table." }
          - { level: A1, use: { en: "Offers and invitations" }, example: "**Would** you **like** some cake?" }
          - { level: B1, use: { en: "Offering to do something (would like me to)" }, example: "**Would** you **like me to** carry that?" }
          - { level: B1, use: { en: "Polite requests" }, example: "**Would** you pass the salt, please?" }
          - { level: B1, use: { en: "Imagined situations" }, example: "I **would** buy a boat." }
          - { level: B1, use: { en: "Imagined situations with if" }, example: "If I had more time, I **would** learn Italian." }
          - { level: B1, use: { en: "Past habits: repeated actions" }, example: "When I was a child, we **would** play outside every day." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**would like** is a polite form of **want**: I'd like tea."
          - level: A1
            text:
              en: "**would like** takes **to** + base verb: I'd like **to go**."
          - level: B1
            text:
              en: "An imagined situation with **if** takes **if** + past simple, **would** + base verb. See [Conditionals](id:en.sentence-building.conditionals-0-1-2)."
          - level: B1
            text:
              en: "A past habit with **would** needs a past time frame: When I was young, I would…"

  - title: { en: "Compare: would and used to" }
    content:
      - type: table
        columns:
          - { key: row, label: { en: Point } }
          - { key: would, label: would }
          - { key: used, label: used to }
        rows:
          - level: B1
            row: { en: Meaning }
            would: { en: "repeated past actions" }
            used: { en: "repeated past actions and past states" }
          - level: B1
            row: { en: Action }
            would: { ex: "We **would** swim every summer." }
            used: { ex: "We **used to** swim every summer." }
          - level: B1
            row: { en: State }
            would: "—"
            used: { ex: "I **used to** live in Leeds." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "A past state (live, be, have, know) takes **used to**. See [Used to](id:en.tenses.used-to)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: "Do you would like a coffee?", right: "**Would** you like a coffee?", rule: { en: "questions with would need no do" } }
          - { level: A1, wrong: "I would like going.", right: "I'd like **to go**.", rule: { en: "would like + to + base verb" } }
          - { level: B1, wrong: "She would likes tea.", right: "She would **like** tea.", rule: { en: "would + base verb" } }
          - { level: B1, wrong: "When I was young, I would live in Paris.", right: "When I was young, I **used to** live in Paris.", rule: { en: "past states take used to" } }
