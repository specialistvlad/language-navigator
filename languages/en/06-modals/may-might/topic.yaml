# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.modals.may-might
lang: en
kind: grammar
tags: [verbs, modals, possibility, permission]
concepts: [possibility]
related: [en.modals.can-could, en.modals.must-have-to, en.modals.would, en.tenses.future-forms, en.sentence-building.conditionals-0-1-2]
status: { en: draft }

title: { en: May and Might }
summary:
  en: "Might and may for possibility; may for formal permission. Might and may take no -s, no to and no do, and the negative is might not: She **might** come. He **might not** come."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A2, form: { en: Affirmative }, example: "It **might** rain. / It **may** rain." }
        - { level: A2, form: { en: Negative }, example: "It **might not** rain. / It **may not** rain." }
        - { level: B1, form: { en: "Question (permission)" }, example: "**May** I come in?" }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A2
            text:
              en: "**might** and **may** have one form for every subject: she might, she may."
          - level: A2
            text:
              en: "The verb after **might** or **may** is in the base form: It might **rain**."
          - level: A2
            text:
              en: "The negative is **might not** / **may not**."
          - level: B1
            text:
              en: "Questions with **may** ask for permission, with **may** before the subject:"
            ex: "**May** I sit here?"
          - level: A2
            text:
              en: "A question about possibility uses **think** + **will**:"
            ex: "Do you think it **will** rain?"

  - title: { en: "Pronunciation: may and might" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: sound, label: { en: Sound } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: might, sound: /maɪt/, example: "It **might** rain. /ɪt maɪt reɪn/" }
          - { level: A2, form: may, sound: /meɪ/, example: "It **may** rain. /ɪt meɪ reɪn/" }
          - { level: A2, form: maybe, sound: /ˈmeɪbi/, example: "**Maybe** later. /ˈmeɪbi ˈleɪtə/" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The **gh** in might is silent: /maɪt/."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Possibility now" }, example: "She **might** be at home." }
          - { level: A2, use: { en: "Possibility in the future" }, example: "We **might** go to the beach." }
          - { level: A2, use: { en: "Possibility that something is not true" }, example: "He **might not** know." }
          - { level: B1, use: { en: "Formal permission (May I…?)" }, example: "**May** I use your phone?" }
          - { level: B1, use: { en: "Formal rules: what is allowed" }, example: "Guests **may** use the pool until 10." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**might** and **may** are close in meaning; **might** sounds a little less sure."
          - level: A2
            text:
              en: "**could** also expresses possibility: It **could** rain. See [Can and Could](id:en.modals.can-could)."

  - title: { en: Signal words }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Word } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, word: maybe, example: "**Maybe** she is busy." }
          - { level: A2, word: perhaps, example: "**Perhaps** we can meet later." }
          - { level: A2, word: probably, example: "She'll **probably** come." }
          - { level: A2, word: "I'm not sure", example: "**I'm not sure.** It might rain." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**maybe** is one word and starts a clause: **Maybe** he is late."
          - level: A2
            text:
              en: "**may be** is two words and follows the subject: He **may be** late."

  - title: { en: Degrees of certainty }
    content:
      - type: table
        columns:
          - { key: degree, label: { en: Certainty } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, degree: { en: "sure" }, example: "She **will** come. / She **won't** come." }
          - { level: B1, degree: { en: "very likely" }, example: "She'll **probably** come." }
          - { level: B1, degree: { en: "possible" }, example: "She **may** come. / She **might** come." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "Use **will** when you are sure and **may / might** when you are not."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: "It mights rain.", right: "It **might** rain.", rule: { en: "might has no -s" } }
          - { level: A2, wrong: "It might to rain.", right: "It might **rain**.", rule: { en: "might + base verb; no to" } }
          - { level: A2, wrong: "I don't might go.", right: "I **might not** go.", rule: { en: "negative = might not" } }
          - { level: A2, wrong: "He maybe at home.", right: "He **may be** at home. / **Maybe** he is at home.", rule: { en: "may be after the subject; maybe at the start" } }
          - { level: A2, wrong: "She might will come.", right: "She **might** come.", rule: { en: "a modal verb takes no second modal" } }
