# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.plurals
lang: en
kind: grammar
tags: [nouns, plural, spelling]
concepts: [number]
related: [en.nouns-determiners.countable-uncountable, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.possessive-s, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Plurals }
summary:
  en: "Most nouns add -s (books), nouns ending in s, sh, ch or x add -es, and consonant + y becomes -ies. Irregular plurals take no -s and people takes a plural verb: three **children**, The **people are** nice."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A0, point: { en: most nouns }, rule: + s, example: "two **books**" }
        - { level: A0, point: "-s, -ss, -sh, -ch, -x, -z", rule: + es, example: "bus → **buses** / box → **boxes**" }
        - { level: A0, point: { en: consonant + y }, rule: y → ies, example: "city → **cities**" }
        - { level: A0, point: { en: vowel + y }, rule: + s, example: "boy → **boys**" }
        - { level: A0, point: { en: irregular }, rule: { en: "no -s: man, woman, child, person" }, example: "three **children**" }
        - { level: A0, point: people, rule: { en: "plural, takes a plural verb" }, example: "The people **are** nice." }
        - { level: A0, point: { en: adjectives }, rule: { en: stay the same }, example: "two **red** cars" }
        - { level: A1, point: { en: "-o, -f / -fe" }, rule: { en: "some + es; -f / -fe → ves" }, example: "potato → **potatoes** / knife → **knives**" }
        - { level: A1, point: { en: "foot, tooth, mouse" }, rule: { en: irregular }, example: "**feet** / **teeth** / **mice**" }
        - { level: A1, point: { en: "sheep, fish" }, rule: { en: same form }, example: "two **sheep**" }
        - { level: A1, point: "jeans, trousers, glasses", rule: { en: "plural only, plural verb" }, example: "My jeans **are** new." }

sections:
  - title: { en: "Form: regular plurals" }
    content:
      - type: table
        columns:
          - { key: singular, label: { en: Singular } }
          - { key: plural, label: { en: Plural } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, singular: a book, plural: "two book**s**", example: "I have two **books**." }
          - { level: A0, singular: a car, plural: "three car**s**", example: "There are three **cars** here." }
          - { level: A0, singular: an apple, plural: "apple**s**", example: "I like **apples**." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Most nouns add **-s** in the plural."
          - level: A0
            text:
              en: "Adjectives stay the same: a **red** car → two **red** cars."
          - level: A0
            text:
              en: "A plural subject takes a plural verb: The books **are** new."
          - level: A0
            text:
              en: "Uncountable nouns have no plural: see [Countable and uncountable nouns](id:en.nouns-determiners.countable-uncountable)."

  - title: { en: "Spelling: -s and -es" }
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Noun ending } }
          - { key: rule, label: { en: Rule } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A0, ending: { en: most nouns }, rule: + s, examples: book → books / day → days }
          - { level: A0, ending: "-s, -ss, -sh, -ch, -x, -z", rule: + es, examples: bus → buses / glass → glasses / dish → dishes / watch → watches / box → boxes }
          - { level: A0, ending: { en: consonant + y }, rule: y → ies, examples: city → cities / baby → babies }
          - { level: A0, ending: { en: vowel + y }, rule: + s, examples: boy → boys / key → keys }
          - { level: A1, ending: { en: "consonant + o: some nouns" }, rule: + es, examples: potato → potatoes / tomato → tomatoes }
          - { level: A1, ending: "-f, -fe", rule: → ves, examples: leaf → leaves / knife → knives / wife → wives / half → halves }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Other nouns in -o add only -s: photo → photos, piano → pianos, kilo → kilos."
          - level: A1
            text:
              en: "Some nouns in -f add only -s: roof → roofs, chef → chefs."

  - title: { en: "Pronunciation: the -s ending" }
    content:
      - type: table
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: after, label: { en: After } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A1, sound: /s/, after: { en: voiceless sounds /p t k f θ/ }, examples: cups /kʌps/ / books /bʊks/ / months /mʌnθs/ }
          - { level: A1, sound: /z/, after: { en: voiced sounds and vowels }, examples: dogs /dɒɡz/ / pens /penz/ / days /deɪz/ }
          - { level: A1, sound: /ɪz/, after: /s z ʃ tʃ dʒ/, examples: buses /ˈbʌsɪz/ / dishes /ˈdɪʃɪz/ / pages /ˈpeɪdʒɪz/ }
      - type: bullets
        items:
          - level: A1
            text:
              en: "In **houses** /ˈhaʊzɪz/, the s of house becomes /z/."
          - level: A1
            text:
              en: "The same rule gives the sound of the verb ending: see [Present simple](id:en.tenses.simple-tenses)."

  - title: { en: Irregular plurals }
    content:
      - type: table
        columns:
          - { key: singular, label: { en: Singular } }
          - { key: plural, label: { en: Plural } }
          - { key: ipa, label: { en: Pronunciation } }
        rows:
          - { level: A0, singular: { ex: man }, plural: "**men**", ipa: /men/ }
          - { level: A0, singular: { ex: woman }, plural: "**women**", ipa: /ˈwɪmɪn/ }
          - { level: A0, singular: { ex: child }, plural: "**children**", ipa: /ˈtʃɪldrən/ }
          - { level: A0, singular: { ex: person }, plural: "**people**", ipa: /ˈpiːpl/ }
          - { level: A1, singular: { ex: foot }, plural: "**feet**", ipa: /fiːt/ }
          - { level: A1, singular: { ex: tooth }, plural: "**teeth**", ipa: /tiːθ/ }
          - { level: A1, singular: { ex: mouse }, plural: "**mice**", ipa: /maɪs/ }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Irregular plurals take no -s: two **children**, three **men**."
          - level: A0
            text:
              en: "**people** is plural and takes a plural verb:"
            ex: "The people here **are** friendly."

  - title: { en: Same form and plural-only nouns }
    content:
      - type: table
        columns:
          - { key: group, label: { en: Group } }
          - { key: nouns, label: { en: Nouns } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, group: { en: same singular and plural }, nouns: "sheep, fish", example: "one sheep, two **sheep**" }
          - { level: A1, group: { en: "plural only: things with two parts" }, nouns: "trousers, jeans, glasses, scissors", example: "My jeans **are** new." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Count plural-only nouns with **a pair of**: a pair of jeans, two pairs of glasses."
          - level: A1
            text:
              en: "US: trousers are *pants*."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A0, wrong: three childs, right: "three **children**", rule: { en: irregular plural } }
          - { level: A0, wrong: The people is nice., right: "The people **are** nice.", rule: { en: people + plural verb } }
          - { level: A0, wrong: two babys · two boxs, right: "two **babies** · two **boxes**", rule: { en: "consonant + y → ies · -x → -es" } }
          - { level: A1, wrong: two sheeps, right: "two **sheep**", rule: { en: sheep has the same form } }
