# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.plurals
lang: en
kind: grammar
tags: [nouns, plural, spelling]
concepts: [number]
related: [en.nouns-determiners.countable-uncountable, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.possessive-s, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Plurals }
summary:
  lead: { en: ["Most nouns add -s (books), nouns ending in s, sh, ch or x add -es, and ", { pattern: [{ slot: consonant }, "y"] }, " becomes -ies."] }
  rule: { en: "Irregular plurals take no -s and people takes a plural verb:" }
  ex: ["three ", { target: children }, ", The ", { target: people are }, " nice."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A0, point: { en: most nouns }, rule: { pattern: [{ ending: s }], follows: true }, ex: ["two ", { target: books }] }
        - { level: A0, point: "-s, -ss, -sh, -ch, -x, -z", rule: { pattern: [{ ending: es }], follows: true }, ex: { examples: [{ mapping: [bus, { target: buses }] }, { mapping: [box, { target: boxes }] }] } }
        - { level: A0, point: { en: { pattern: [{ slot: consonant }, "y"] } }, rule: { mapping: ["y", ies] }, ex: { mapping: [city, { target: cities }] } }
        - { level: A0, point: { en: { pattern: [{ slot: vowel }, "y"] } }, rule: { pattern: [{ ending: s }], follows: true }, ex: { mapping: [boy, { target: boys }] } }
        - { level: A0, point: { en: irregular }, rule: { en: "no -s: man, woman, child, person" }, ex: ["three ", { target: children }] }
        - { level: A0, point: people, rule: { en: "plural, takes a plural verb" }, ex: ["The people ", { target: are }, " nice."] }
        - { level: A0, point: { en: adjectives }, rule: { en: stay the same }, ex: ["two ", { target: red }, " cars"] }
        - { level: A1, point: { en: { alternatives: ["-o, -f", "-fe"] } }, rule: { en: [{ pattern: [some, es] }, "; ", { mapping: [{ alternatives: ["-f", "-fe"] }, ves] }] }, ex: { examples: [{ mapping: [potato, { target: potatoes }] }, { mapping: [knife, { target: knives }] }] } }
        - { level: A1, point: { en: "foot, tooth, mouse" }, rule: { en: irregular }, ex: { examples: [{ target: feet }, { target: teeth }, { target: mice }] } }
        - { level: A1, point: { en: "sheep, fish" }, rule: { en: same form }, ex: ["two ", { target: sheep }] }
        - { level: A1, point: "jeans, trousers, glasses", rule: { en: "plural only, plural verb" }, ex: ["My jeans ", { target: are }, " new."] }

sections:
  - title: { en: "Form: regular plurals" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: singular, label: { en: Singular }, features: { number: sg } }
          - { key: plural, label: { en: Plural }, features: { number: pl } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, singular: a book, plural: [two book, { ending: s }], ex: ["I have two ", { target: books }, "."] }
          - { level: A0, singular: a car, plural: [three car, { ending: s }], ex: ["There are three ", { target: cars }, " here."] }
          - { level: A0, singular: an apple, plural: [apple, { ending: s }], ex: ["I like ", { target: apples }, "."] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Most nouns add ", { term: "-s" }, " in the plural."]
          - type: rule
            level: A0
            text:
              en: ["Adjectives stay the same: ", { mapping: [["a ", { term: red }, " car"], ["two ", { term: red }, " cars"]] }, "."]
          - type: rule
            level: A0
            text:
              en: "A plural subject takes a plural verb:"
            ex: ["The books ", { target: are }, " new."]
          - type: note
            level: A0
            text:
              en: ["Uncountable nouns have no plural: see ", { link: Countable and uncountable nouns, to: en.nouns-determiners.countable-uncountable }, "."]

  - title: { en: "Spelling: -s and -es" }
    role: spelling
    content:
      - type: usage
        columns:
          - { key: ending, label: { en: Noun ending } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A0, ending: { en: most nouns }, rule: { pattern: [{ ending: s }], follows: true }, ex: { examples: [{ mapping: [book, books] }, { mapping: [day, days] }] } }
          - { level: A0, ending: "-s, -ss, -sh, -ch, -x, -z", rule: { pattern: [{ ending: es }], follows: true }, ex: { examples: [{ mapping: [bus, buses] }, { mapping: [glass, glasses] }, { mapping: [dish, dishes] }, { mapping: [watch, watches] }, { mapping: [box, boxes] }] } }
          - { level: A0, ending: { en: { pattern: [{ slot: consonant }, "y"] } }, rule: { mapping: ["y", ies] }, ex: { examples: [{ mapping: [city, cities] }, { mapping: [baby, babies] }] } }
          - { level: A0, ending: { en: { pattern: [{ slot: vowel }, "y"] } }, rule: { pattern: [{ ending: s }], follows: true }, ex: { examples: [{ mapping: [boy, boys] }, { mapping: [key, keys] }] } }
          - { level: A1, ending: { en: [{ pattern: [{ slot: consonant }, o] }, ": some nouns"] }, rule: { pattern: [{ ending: es }], follows: true }, ex: { examples: [{ mapping: [potato, potatoes] }, { mapping: [tomato, tomatoes] }] } }
          - { level: A1, ending: "-f, -fe", rule: { mapping: [ves], follows: true }, ex: { examples: [{ mapping: [leaf, leaves] }, { mapping: [knife, knives] }, { mapping: [wife, wives] }, { mapping: [half, halves] }] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Other nouns in -o add only -s: ", { mapping: [photo, photos] }, ", ", { mapping: [piano, pianos] }, ", ", { mapping: [kilo, kilos] }, "."]
          - type: rule
            level: A1
            text:
              en: ["Some nouns in -f add only -s: ", { mapping: [roof, roofs] }, ", ", { mapping: [chef, chefs] }, "."]

  - title: { en: "Pronunciation: the -s ending" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: after, label: { en: After } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A1, sound: { ipa: s }, after: { en: ["voiceless sounds ", { ipa: p t k f θ }] }, ex: { examples: [["cups ", { ipa: kʌps }], ["books ", { ipa: bʊks }], ["months ", { ipa: mʌnθs }]] } }
          - { level: A1, sound: { ipa: z }, after: { en: voiced sounds and vowels }, ex: { examples: [["dogs ", { ipa: dɒɡz }], ["pens ", { ipa: penz }], ["days ", { ipa: deɪz }]] } }
          - { level: A1, sound: { ipa: ɪz }, after: { ipa: s z ʃ tʃ dʒ }, ex: { examples: [["buses ", { ipa: ˈbʌsɪz }], ["dishes ", { ipa: ˈdɪʃɪz }], ["pages ", { ipa: ˈpeɪdʒɪz }]] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["In ", { term: houses }, " ", { ipa: ˈhaʊzɪz }, ", the s of house becomes ", { ipa: z }, "."]
          - type: note
            level: A1
            text:
              en: ["The same rule gives the sound of the verb ending: see ", { link: Present simple, to: en.tenses.simple-tenses }, "."]

  - title: { en: Irregular plurals }
    role: own
    content:
      - type: paradigm
        columns:
          - { key: singular, label: { en: Singular }, features: { number: sg } }
          - { key: plural, label: { en: Plural }, features: { number: pl } }
          - { key: ipa, label: { en: Pronunciation } }
        rows:
          - { level: A0, singular: man, plural: { target: men }, ipa: { ipa: men } }
          - { level: A0, singular: woman, plural: { target: women }, ipa: { ipa: ˈwɪmɪn } }
          - { level: A0, singular: child, plural: { target: children }, ipa: { ipa: ˈtʃɪldrən } }
          - { level: A0, singular: person, plural: { target: people }, ipa: { ipa: ˈpiːpl } }
          - { level: A1, singular: foot, plural: { target: feet }, ipa: { ipa: fiːt } }
          - { level: A1, singular: tooth, plural: { target: teeth }, ipa: { ipa: tiːθ } }
          - { level: A1, singular: mouse, plural: { target: mice }, ipa: { ipa: maɪs } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Irregular plurals take no -s: two ", { term: children }, ", three ", { term: men }, "."]
          - type: rule
            level: A0
            text:
              en: [{ term: people }, " is plural and takes a plural verb:"]
            ex: ["The people here ", { target: are }, " friendly."]

  - title: { en: Same form and plural-only nouns }
    role: own
    content:
      - type: usage
        columns:
          - { key: group, label: { en: Group } }
          - { key: nouns, label: { en: Nouns } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, group: { en: same singular and plural }, nouns: "sheep, fish", ex: ["one sheep, two ", { target: sheep }] }
          - { level: A1, group: { en: "plural only: things with two parts" }, nouns: "trousers, jeans, glasses, scissors", ex: ["My jeans ", { target: are }, " new."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Count plural-only nouns with ", { term: a pair of }, ": a pair of jeans, two pairs of glasses."]
          - type: note
            level: A1
            variety: en-US
            text:
              en: ["trousers are ", { term: pants }, "."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: three childs, right: ["three ", { target: children }], rule: { en: irregular plural } }
          - { level: A0, wrong: The people is nice., right: ["The people ", { target: are }, " nice."], rule: { en: { pattern: [people, plural verb] } } }
          - { level: A0, wrong: { examples: [two babys, two boxs] }, right: { examples: [["two ", { target: babies }], ["two ", { target: boxes }]] }, rule: { en: { examples: [{ mapping: [{ pattern: [{ slot: consonant }, "y"] }, ies] }, { mapping: ["-x", "-es"] }] } } }
          - { level: A1, wrong: two sheeps, right: ["two ", { target: sheep }], rule: { en: sheep has the same form } }
