id: en.nouns-determiners.quantifiers-some-any-much-many
lang: en
kind: grammar
tags: [quantifiers, determiners, nouns, some, any, much, many]
concepts: [quantifiers]
related: [en.nouns-determiners.countable-uncountable, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.plurals, en.pronouns.indefinite-pronouns]
status: { en: draft }

title: { en: "Quantifiers: some, any, much, many" }
summary:
  en: "Some, any, much, many, a lot of, a few and a little say how much or how many without an exact number. Some goes in affirmative sentences, and any in negatives and questions: I have **some** milk but I don't have **any** eggs."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Sentence } }
        - { key: countable, label: { en: Plural countable noun } }
        - { key: uncountable, label: { en: Uncountable noun } }
      rows:
        - { level: A1, form: { en: Affirmative }, countable: "**some** apples / **a lot of** apples", uncountable: "**some** milk / **a lot of** milk" }
        - { level: A1, form: { en: Negative }, countable: "not **any** apples / not **many** apples", uncountable: "not **any** milk / not **much** milk" }
        - { level: A1, form: { en: Question }, countable: "**any** apples? / **many** apples?", uncountable: "**any** milk? / **much** milk?" }
        - { level: A1, form: How…?, countable: "**How many** apples?", uncountable: "**How much** milk?" }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "Which nouns are countable: [Countable and uncountable nouns](id:en.nouns-determiners.countable-uncountable)."

  - title: { en: Some and any }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "affirmative: some" }, example: "There are **some** eggs in the fridge." }
          - { level: A1, use: { en: "negative: any" }, example: "We don't have **any** bread." }
          - { level: A1, use: { en: "question: any" }, example: "Is there **any** sugar?" }
          - { level: A2, use: { en: "offer: some" }, example: "Would you like **some** tea?" }
          - { level: A2, use: { en: "request: some" }, example: "Can I have **some** water?" }
          - { level: B1, use: { en: "any = it doesn't matter which" }, example: "Take **any** seat." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "somebody, anything… follow the same rules: [Indefinite pronouns](id:en.pronouns.indefinite-pronouns)."

  - title: { en: "Much, many, a lot of" }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Quantifier } }
          - { key: with, label: { en: With } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, word: many, with: { en: plural countable }, example: "There aren't **many** shops here." }
          - { level: A1, word: much, with: { en: uncountable }, example: "I don't have **much** time." }
          - { level: A1, word: a lot of / lots of, with: { en: both }, example: "She has **a lot of** friends." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Affirmative sentences take **a lot of**: I have **a lot of** friends."
          - level: A1
            text:
              en: "**lots of** means a lot of; it is informal."
          - level: A1
            text:
              en: "**How many** + plural noun; **How much** + uncountable noun."
          - level: A1
            text:
              en: "**How much** also asks the price:"
            ex: "**How much** is this jacket?"
          - level: A2
            text:
              en: "**many** also works in affirmative sentences; affirmative **much** is formal."
            ex: "**Many** people work from home."

  - title: { en: "A few, a little, few, little" }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Quantifier } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, word: { en: a few + plural noun }, example: "I have **a few** friends here." }
          - { level: A2, word: { en: a little + uncountable noun }, example: "There's **a little** milk left." }
          - { level: B1, word: { en: few + plural noun }, example: "**Few** people came." }
          - { level: B1, word: { en: little + uncountable noun }, example: "We have **little** time." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**a few / a little** = some, a small number or amount. **few / little** = not many, not much: not enough."

  - title: { en: No and none }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: no + noun, example: "There's **no** milk." }
          - { level: B1, form: { en: none (no noun after it) }, example: "How many eggs are there? — **None**." }
          - { level: B1, form: none of + the / my… + noun, example: "**None of** my friends came." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**no** + noun = **not any** + noun: There's **no** milk = There isn't **any** milk."
          - level: A2
            text:
              en: "**no** and **none** take an affirmative verb: There **is** no milk."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: There isn't some milk., right: "There isn't **any** milk.", rule: { en: negative → any } }
