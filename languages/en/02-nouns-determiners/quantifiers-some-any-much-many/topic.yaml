# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.quantifiers-some-any-much-many
lang: en
kind: grammar
levels: [A1, A2, B1]
tags: [quantifiers, determiners, nouns, some, any, much, many]
concepts: [quantifiers]
related: [en.nouns-determiners.countable-uncountable, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.plurals, en.pronouns.indefinite-pronouns]
status: { en: draft, es: draft }

title: { en: "Quantifiers: some, any, much, many", es: "Cuantificadores: some, any, much, many (quantifiers)" }
summary:
  en: Words before a noun that say how much or how many.
  es: Palabras delante del sustantivo que indican cuánto o cuántos.

sections:
  - title: { en: Overview, es: Resumen }
    level: A1
    content:
      - type: table
        columns:
          - { key: form, label: { en: Sentence, es: Frase } }
          - { key: countable, label: { en: Plural countable noun, es: Sustantivo contable en plural } }
          - { key: uncountable, label: { en: Uncountable noun, es: Sustantivo incontable } }
        rows:
          - { form: { en: Affirmative, es: Afirmativa }, countable: "**some** apples / **a lot of** apples", uncountable: "**some** milk / **a lot of** milk" }
          - { form: { en: Negative, es: Negativa }, countable: "not **any** apples / not **many** apples", uncountable: "not **any** milk / not **much** milk" }
          - { form: { en: Question, es: Pregunta }, countable: "**any** apples? / **many** apples?", uncountable: "**any** milk? / **much** milk?" }
          - { form: How…?, countable: "**How many** apples?", uncountable: "**How much** milk?" }
      - type: bullets
        items:
          - en: "Which nouns are countable: [Countable and uncountable nouns](id:en.nouns-determiners.countable-uncountable)."
            es: "Qué sustantivos son contables: [Sustantivos contables e incontables](id:en.nouns-determiners.countable-uncountable)."

  - title: { en: Some and any, es: Some y any }
    level: A1-B1
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { use: { en: "affirmative: some", es: "afirmativa: some" }, example: "There are **some** eggs in the fridge.", tr: { es: Hay huevos en la nevera. } }
          - { use: { en: "negative: any", es: "negativa: any" }, example: "We don't have **any** bread.", tr: { es: No tenemos pan. } }
          - { use: { en: "question: any", es: "pregunta: any" }, example: "Is there **any** sugar?", tr: { es: ¿Hay azúcar? } }
          - { level: A2, use: { en: "offer: some", es: "ofrecimiento: some" }, example: "Would you like **some** tea?", tr: { es: ¿Quieres té? } }
          - { level: A2, use: { en: "request: some", es: "petición: some" }, example: "Can I have **some** water?", tr: { es: ¿Me das agua? } }
          - { level: B1, use: { en: "any = it doesn't matter which", es: "any = no importa cuál" }, example: "Take **any** seat.", tr: { es: Siéntate donde quieras. } }
      - type: bullets
        items:
          - { for: [es], text: { es: "some y any a menudo no se traducen: *¿Hay azúcar?* → Is there **any** sugar?" } }
          - level: A2
            text:
              en: "somebody, anything… follow the same rules: [Indefinite pronouns](id:en.pronouns.indefinite-pronouns)."
              es: "somebody, anything… siguen las mismas reglas: [Pronombres indefinidos](id:en.pronouns.indefinite-pronouns)."

  - title: { en: "Much, many, a lot of", es: "Much, many, a lot of" }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: word, label: { en: Quantifier, es: Cuantificador } }
          - { key: with, label: { en: With, es: Con } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { word: many, with: { en: plural countable, es: contable en plural }, example: "There aren't **many** shops here.", tr: { es: No hay muchas tiendas aquí. } }
          - { word: much, with: { en: uncountable, es: incontable }, example: "I don't have **much** time.", tr: { es: No tengo mucho tiempo. } }
          - { word: a lot of / lots of, with: { en: both, es: los dos }, example: "She has **a lot of** friends.", tr: { es: Tiene muchos amigos. } }
      - type: bullets
        items:
          - en: "Affirmative sentences take **a lot of**: I have **a lot of** friends."
            es: "En afirmativa se usa **a lot of**: I have **a lot of** friends."
          - en: "**lots of** means a lot of; it is informal."
            es: "**lots of** significa lo mismo que a lot of; es informal."
          - en: "**How many** + plural noun; **How much** + uncountable noun."
            es: "**How many** + sustantivo en plural; **How much** + sustantivo incontable."
          - text:
              en: "**How much** also asks the price:"
              es: "**How much** también pregunta el precio:"
            ex: "**How much** is this jacket?"
            tr: { es: ¿Cuánto cuesta esta chaqueta? }
          - level: A2
            text:
              en: "**many** also works in affirmative sentences; affirmative **much** is formal."
              es: "**many** también va en afirmativa; **much** en afirmativa es formal."
            ex: "**Many** people work from home."
            tr: { es: Mucha gente trabaja desde casa. }

  - title: { en: "A few, a little, few, little", es: "A few, a little, few, little" }
    level: A2-B1
    content:
      - type: table
        columns:
          - { key: word, label: { en: Quantifier, es: Cuantificador } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { word: { en: a few + plural noun, es: a few + sustantivo en plural }, example: "I have **a few** friends here.", tr: { es: Tengo algunos amigos aquí. } }
          - { word: { en: a little + uncountable noun, es: a little + sustantivo incontable }, example: "There's **a little** milk left.", tr: { es: Queda un poco de leche. } }
          - { level: B1, word: { en: few + plural noun, es: few + sustantivo en plural }, example: "**Few** people came.", tr: { es: Vino poca gente. } }
          - { level: B1, word: { en: little + uncountable noun, es: little + sustantivo incontable }, example: "We have **little** time.", tr: { es: Tenemos poco tiempo. } }
      - type: bullets
        items:
          - level: B1
            text:
              en: "**a few / a little** = some, a small number or amount. **few / little** = not many, not much: not enough."
              es: "**a few / a little** = algunos, un poco. **few / little** = pocos, poco: no suficiente."

  - title: { en: No and none, es: No y none }
    level: A2-B1
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { form: no + noun, example: "There's **no** milk.", tr: { es: No hay leche. } }
          - { level: B1, form: { en: none (no noun after it), es: none (sin sustantivo detrás) }, example: "How many eggs are there? — **None**.", tr: { es: ¿Cuántos huevos hay? — Ninguno. } }
          - { level: B1, form: none of + the / my… + noun, example: "**None of** my friends came.", tr: { es: No vino ninguno de mis amigos. } }
      - type: bullets
        items:
          - en: "**no** + noun = **not any** + noun: There's **no** milk = There isn't **any** milk."
            es: "**no** + sustantivo = **not any** + sustantivo: There's **no** milk = There isn't **any** milk."
          - en: "**no** and **none** take an affirmative verb: There **is** no milk."
            es: "**no** y **none** van con el verbo en afirmativa: There **is** no milk."

  - title: { en: Typical errors, es: Errores típicos }
    level: A1-B1
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: There isn't some milk., right: "There isn't **any** milk.", rule: { en: negative → any, es: negativa → any } }
          - { for: [es], wrong: I don't have no money., right: "I don't have **any** money. / I have **no** money.", rule: { es: una sola negación } }
          - { for: [es], wrong: How much apples?, right: "**How many** apples?", rule: { es: how many + plural } }
          - { for: [es], wrong: many money, right: "**much** money / **a lot of** money", rule: { es: money es incontable } }
          - { for: [es], wrong: I have much friends., right: "I have **a lot of** friends.", rule: { es: "afirmativa: a lot of" } }
          - { for: [es], wrong: a little friends, right: "**a few** friends", rule: { es: a few + plural } }

essentials:
  - level: A1
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: form, label: { en: Sentence, es: Frase } }
              - { key: countable, label: { en: Plural countable, es: Contable en plural } }
              - { key: uncountable, label: { en: Uncountable, es: Incontable } }
            rows:
              - { form: +, countable: "**some** / **a lot of** apples", uncountable: "**some** / **a lot of** milk" }
              - { form: −, countable: "not **any** / not **many** apples", uncountable: "not **any** / not **much** milk" }
              - { form: "?", countable: "**any** / **many** apples?", uncountable: "**any** / **much** milk?" }
              - { form: How…?, countable: "**How many** apples?", uncountable: "**How much** milk?" }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - { en: "**some** in affirmatives; **any** in negatives and questions.", es: "**some** en afirmativa; **any** en negativa y pregunta." }
              - { en: "**many** + plural, **much** + uncountable: in negatives and questions.", es: "**many** + plural, **much** + incontable: en negativa y pregunta." }
              - { en: "Affirmative: **a lot of** with both: a lot of friends / time.", es: "Afirmativa: **a lot of** con los dos: a lot of friends / time." }
              - { for: [es], text: { es: "some y any a menudo no se traducen: *¿Hay azúcar?* → Is there **any** sugar?" } }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { wrong: There isn't some milk., right: "There isn't **any** milk." }
              - { for: [es], wrong: I don't have no money., right: "I don't have **any** money." }
              - { for: [es], wrong: How much apples?, right: "**How many** apples?" }
              - { for: [es], wrong: I have much friends., right: "I have **a lot of** friends." }
  - level: A2
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: { en: Offers and requests, es: Ofrecimientos y peticiones }, rule: { en: some in the question, es: some en la pregunta }, example: "Would you like **some** tea?" }
          - { point: a few / a little, rule: { en: "a few + plural · a little + uncountable", es: "a few + plural · a little + incontable" }, example: "**a few** friends / **a little** milk" }
          - { point: no, rule: { en: "no + noun = not any; affirmative verb", es: "no + sustantivo = not any; verbo en afirmativa" }, example: "There's **no** milk." }
  - level: B1
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: few / little, rule: { en: "not much, not enough", es: "poco, no suficiente" }, example: "**Few** people came." }
          - { point: any, rule: { en: "affirmative: it doesn't matter which", es: "afirmativa: no importa cuál" }, example: "Take **any** seat." }
          - { point: none, rule: { en: "no noun after it, or none of + the / my…", es: "sin sustantivo, o none of + the / my…" }, example: "**None of** my friends came." }

reminders:
  - level: A1
    items:
      - en: "Negative → **any**: I don't have **any** money."
        es: "Una sola negación: I don't have **any** money / I have **no** money."
      - { en: "**How many** + plural · **How much** + uncountable.", es: "**How many** + plural · **How much** + incontable." }
  - level: A2
    items:
      - { en: "**a few** friends · **a little** milk.", es: "**a few** friends · **a little** milk." }
  - level: B1
    items:
      - { en: "**a few** = some · **few** = not enough.", es: "**a few** = algunos · **few** = pocos, no suficientes." }
