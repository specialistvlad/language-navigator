# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.demonstratives-this-that
lang: en
kind: grammar
tags: [demonstratives, determiners, pronouns]
concepts: [demonstratives]
related: [en.nouns-determiners.plurals, en.nouns-determiners.articles-a-an-the, en.verbs.to-be, en.pronouns.personal-pronouns]
status: { en: draft }

title: { en: "This, That, These, Those" }
summary:
  lead: { en: "This and these point to things near you; that and those point to things far away, in the singular and the plural." }
  rule: { en: "These and those go with plural nouns and are:" }
  ex: { examples: [[{ target: These }, " are my keys."], [{ target: Those }, " shoes ", { target: are }, " nice."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: where, label: { en: Distance } }
        - { key: singular, label: { en: Singular }, features: { number: sg } }
        - { key: plural, label: { en: Plural }, features: { number: pl } }
      rows:
        - { level: A0, features: { deixis: prox }, where: { en: "near: here" }, singular: [{ target: this }, " book"], plural: [{ target: these }, " books"] }
        - { level: A0, features: { deixis: dist }, where: { en: "far: there" }, singular: [{ target: that }, " book"], plural: [{ target: those }, " books"] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["The four words never change for masculine or feminine: ", { term: this }, " man, ", { term: this }, " woman."]

  - title: { en: "Form: before a noun or alone" }
    role: form
    content:
      - type: usage
        columns:
          - { key: form, label: { en: Form } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, form: { en: { pattern: [{ slot: singular noun }], follows: true } }, ex: [{ target: This }, " bag is new."] }
          - { level: A0, form: { en: { pattern: [{ slot: plural noun }], follows: true } }, ex: [{ target: Those }, " shoes are nice."] }
          - { level: A0, form: { en: alone }, ex: { examples: [[{ target: This }, " is my bag."], [{ target: Those }, " are my shoes."]] } }
          - { level: A1, form: { pattern: [one], follows: true }, ex: ["I like ", { target: that one }, "."] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ pattern: [{ alternatives: [this, that] }, { slot: singular noun }, { term: is }] }, "; ", { pattern: [{ alternatives: [these, those] }, { slot: plural noun }, { term: are }] }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: one }, " replaces a singular noun already known: this one, that one."]

  - title: { en: "Pronunciation: this and these" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Sound } }
          - { key: vowel, label: { en: Vowel } }
        rows:
          - { level: A0, word: this, ipa: { ipa: ðɪs }, vowel: { en: ["short ", { ipa: ɪ }] } }
          - { level: A0, word: these, ipa: { ipa: ðiːz }, vowel: { en: ["long ", { ipa: iː }] } }
          - { level: A0, word: that, ipa: { ipa: ðæt }, vowel: { ipa: æ } }
          - { level: A0, word: those, ipa: { ipa: ðəʊz }, vowel: { ipa: əʊ } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["All four start with ", { ipa: ð }, ", the voiced th."]
          - type: rule
            level: A0
            text:
              en: [{ term: these }, " and ", { term: those }, " end in ", { ipa: z }, "; ", { term: this }, " ends in ", { ipa: s }, "."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, use: { en: Introducing people }, ex: [{ target: This is }, " Ana. She's my sister."] }
          - { level: A0, use: { en: ["On the phone: ", { alternatives: [you, the other person] }] }, ex: ["Hi, ", { target: this is }, " Tom. Is ", { target: that }, " Ana? ", { variant: ["Is ", { target: this }, " Ana?"], variety: en-US }] }
          - { level: A1, use: { en: ["Time: ", { alternatives: [now, then] }] }, ex: { examples: [[{ target: this }, " morning"], [{ target: that }, " day"]] } }
          - { level: A1, use: { en: Something just said or done }, ex: { examples: [[{ target: That's }, " great!"], [{ target: That's }, " right."]] } }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: this books, right: [{ target: these }, " books"], rule: { en: { takes: [plural noun, { alternatives: [these, those] }] } } }
          - { level: A0, wrong: These is my keys., right: ["These ", { target: are }, " my keys."], rule: { en: { pattern: [{ alternatives: [these, those] }, are] } } }
