# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.demonstratives-this-that
lang: en
kind: grammar
tags: [demonstratives, determiners, pronouns]
concepts: [demonstratives]
related: [en.nouns-determiners.plurals, en.nouns-determiners.articles-a-an-the, en.verbs.to-be, en.pronouns.personal-pronouns]
status: { en: draft }

title: { en: "This, That, These, Those" }
summary:
  en: "This and these point to things near you; that and those point to things far away, in the singular and the plural. These and those go with plural nouns and are: **These** are my keys. **Those** shoes **are** nice."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: where, label: { en: Distance } }
        - { key: singular, label: { en: Singular } }
        - { key: plural, label: { en: Plural } }
      rows:
        - { level: A0, where: { en: "near: here" }, singular: "**this** book", plural: "**these** books" }
        - { level: A0, where: { en: "far: there" }, singular: "**that** book", plural: "**those** books" }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A0
            text:
              en: "The four words never change for masculine or feminine: **this** man, **this** woman."

  - title: { en: "Form: before a noun or alone" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, form: { en: + singular noun }, example: "**This** bag is new." }
          - { level: A0, form: { en: + plural noun }, example: "**Those** shoes are nice." }
          - { level: A0, form: { en: alone }, example: "**This** is my bag. / **Those** are my shoes." }
          - { level: A1, form: "+ one", example: "I like **that one**." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "this / that + singular noun + **is**; these / those + plural noun + **are**."
          - level: A1
            text:
              en: "**one** replaces a singular noun already known: this one, that one."

  - title: { en: "Pronunciation: this and these" }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Sound } }
          - { key: vowel, label: { en: Vowel } }
        rows:
          - { level: A0, word: this, ipa: /ðɪs/, vowel: { en: short /ɪ/ } }
          - { level: A0, word: these, ipa: /ðiːz/, vowel: { en: long /iː/ } }
          - { level: A0, word: that, ipa: /ðæt/, vowel: /æ/ }
          - { level: A0, word: those, ipa: /ðəʊz/, vowel: /əʊ/ }
      - type: bullets
        items:
          - level: A0
            text:
              en: "All four start with /ð/, the voiced th."
          - level: A0
            text:
              en: "**these** and **those** end in /z/; **this** ends in /s/."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, use: { en: Introducing people }, example: "**This is** Ana. She's my sister." }
          - { level: A0, use: { en: "On the phone: you / the other person" }, example: "Hi, **this is** Tom. Is **that** Ana? (US: Is **this** Ana?)" }
          - { level: A1, use: { en: "Time: now / then" }, example: "**this** morning / **that** day" }
          - { level: A1, use: { en: Something just said or done }, example: "**That's** great! / **That's** right." }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A0, wrong: this books, right: "**these** books", rule: { en: "plural noun → these / those" } }
          - { level: A0, wrong: These is my keys., right: "These **are** my keys.", rule: { en: "these / those + are" } }
