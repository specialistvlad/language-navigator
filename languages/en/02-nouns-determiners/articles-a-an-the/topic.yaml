# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.articles-a-an-the
lang: en
kind: grammar
levels: [A1, A2, B1]
tags: [articles, determiners, nouns]
concepts: [articles]
related: [en.nouns-determiners.countable-uncountable, en.nouns-determiners.plurals, en.nouns-determiners.quantifiers-some-any-much-many, en.nouns-determiners.demonstratives-this-that, en.nouns-determiners.possessive-s]
status: { en: draft, es: draft }

title: { en: "Articles: a, an, the", es: "Artículos: a, an, the" }
summary:
  en: "When to use a, an, the, and no article. A learner needs articles in almost every sentence with a noun. The page starts with an overview, then covers the form (a or an), the pronunciation, the use of a and an, the use of the, and the use of no article, and ends with typical errors. A and an introduce one thing, the points to a thing both people know, and no article is used for general ideas. Choose a or an by the sound that follows: an apple, a university. At A2 and B1 it adds the finer uses of the and no article."
  es: "Cuándo se usa a, an, the y cuándo no se usa artículo. Los artículos aparecen en casi todas las frases con un sustantivo. La página empieza con un resumen y trata después la forma (a o an), la pronunciación, el uso de a y an, el uso de the y el uso sin artículo, y termina con los errores típicos. A y an presentan una cosa, the señala algo que los dos interlocutores conocen, y no se usa artículo para las ideas generales. A o an depende del sonido siguiente: an apple, a university. En A2 y B1 añade los usos más finos de the y de la ausencia de artículo. Contraste con el español: el inglés no lleva artículo en ideas generales (I like dogs, Life is hard) y sí lleva a delante de profesiones (She's a doctor)."

sections:
  - title: { en: Overview, es: Resumen }
    level: A1
    content:
      - type: table
        columns:
          - { key: article, label: { en: Article, es: Artículo } }
          - { key: meaning, label: { en: Meaning, es: Significado } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { article: a / an, meaning: { en: "one, any one", es: "uno, uno cualquiera" }, example: "I need **a** pen.", tr: { es: "Necesito un bolígrafo." } }
          - { article: the, meaning: { en: "the one we both know", es: "el que los dos conocemos" }, example: "Pass me **the** pen.", tr: { es: "Pásame el bolígrafo." } }
          - { article: "—", meaning: { en: "things in general", es: "cosas en general" }, example: "**Pens** are cheap.", tr: { es: "Los bolígrafos son baratos." } }
      - type: bullets
        items:
          - en: "a / an go only with singular countable nouns. See [Countable and uncountable](id:en.nouns-determiners.countable-uncountable)."
            es: "a / an van solo con sustantivos contables en singular. Ver [Contables e incontables](id:en.nouns-determiners.countable-uncountable)."
          - en: "**the** goes with all nouns: singular, plural and uncountable."
            es: "**the** va con todos los sustantivos: singulares, plurales e incontables."
          - { for: [es], text: { es: "a / an = *un, una*. the = *el, la, los, las*: no cambia con el género ni el número." } }

  - title: { en: "Form: a or an", es: "Forma: a o an" }
    level: A1
    content:
      - type: table
        columns:
          - { key: before, label: { en: Next word starts with, es: La palabra siguiente empieza con } }
          - { key: article, label: { en: Article, es: Artículo } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { before: { en: a consonant sound, es: un sonido consonante }, article: a, example: "**a** book / **a** big apple", tr: { es: "un libro / una manzana grande" } }
          - { before: { en: a vowel sound, es: un sonido vocal }, article: an, example: "**an** apple / **an** old book", tr: { es: "una manzana / un libro viejo" } }
      - type: bullets
        items:
          - en: "The first sound decides, not the letter: **an** hour /ˈaʊə/, **a** university /juːnɪˈvɜːsəti/."
            es: "Decide el primer sonido, no la letra: **an** hour /ˈaʊə/, **a** university /juːnɪˈvɜːsəti/."
          - en: "The article goes before the adjective, so the adjective decides: **an** old car, **a** new car."
            es: "El artículo va delante del adjetivo, así que decide el adjetivo: **an** old car, **a** new car."

  - title: { en: "Pronunciation: a, an, the", es: "Pronunciación: a, an, the" }
    level: A1
    content:
      - type: table
        columns:
          - { key: word, label: { en: Word, es: Palabra } }
          - { key: before, label: { en: Before, es: Delante de } }
          - { key: sound, label: { en: Sound, es: Sonido } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { word: a, before: { en: consonant sound, es: sonido consonante }, sound: /ə/, example: a book /ə ˈbʊk/ }
          - { word: an, before: { en: vowel sound, es: sonido vocal }, sound: /ən/, example: an egg /ən ˈeɡ/ }
          - { word: the, before: { en: consonant sound, es: sonido consonante }, sound: /ðə/, example: the book /ðə ˈbʊk/ }
          - { word: the, before: { en: vowel sound, es: sonido vocal }, sound: /ði/, example: the egg /ði ˈeɡ/ }
      - type: bullets
        items:
          - en: "Articles are weak and unstressed: the stress falls on the noun."
            es: "Los artículos son débiles y sin acento: el acento cae en el sustantivo."

  - title: { en: "Use: a / an", es: "Uso: a / an" }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: "one thing, any one", es: "una cosa, una cualquiera" }, example: "I have **a** car.", tr: { es: "Tengo coche." } }
          - { level: A1, use: { en: "first mention; then the", es: "primera mención; después the" }, example: "There's **a** cat. **The** cat is black.", tr: { es: "Hay un gato. El gato es negro." } }
          - { level: A1, use: { en: "jobs", es: "profesiones" }, example: "She's **a** doctor.", tr: { es: "Es médica." } }
          - { level: A1, use: { en: "what something is", es: "qué es algo" }, example: "It's **an** orange.", tr: { es: "Es una naranja." } }
          - { level: A2, use: { en: "rate: per", es: "proporción: por" }, example: "twice **a** week / £3 **a** kilo", tr: { es: "dos veces por semana / 3 libras el kilo" } }
          - { level: A2, use: { en: "exclamations with what", es: "exclamaciones con what" }, example: "What **a** nice day!", tr: { es: "¡Qué día tan bonito!" } }

  - title: { en: "Use: the", es: "Uso: the" }
    level: A1-B1
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: "we both know which", es: "los dos sabemos cuál" }, example: "Close **the** door, please.", tr: { es: "Cierra la puerta, por favor." } }
          - { level: A1, use: { en: "the only one", es: "el único" }, example: "**the** sun / **the** world", tr: { es: "el sol / el mundo" } }
          - { level: A1, use: { en: "superlatives and ordinals", es: "superlativos y ordinales" }, example: "**the** best / **the** first time", tr: { es: "el mejor / la primera vez" } }
          - { level: A2, use: { en: "musical instruments", es: "instrumentos musicales" }, example: "She plays **the** piano. (US: often *plays piano*)", tr: { es: "Toca el piano." } }
          - { level: A2, use: { en: "rivers, seas, oceans, mountain ranges", es: "ríos, mares, océanos, cordilleras" }, example: "**the** Thames / **the** Atlantic / **the** Alps", tr: { es: "el Támesis / el Atlántico / los Alpes" } }
          - { level: A2, use: { en: "countries with Kingdom, States, Republic or a plural name", es: "países con Kingdom, States, Republic o nombre en plural" }, example: "**the** UK / **the** USA / **the** Netherlands", tr: { es: "el Reino Unido / EE. UU. / los Países Bajos" } }
          - { level: B1, use: { en: "the + adjective: a group of people", es: "the + adjetivo: un grupo de personas" }, example: "**the** rich / **the** young", tr: { es: "los ricos / los jóvenes" } }

  - title: { en: "Use: no article", es: "Uso: sin artículo" }
    level: A1-B1
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: "plural nouns in general", es: "sustantivos plurales en general" }, example: "I like **dogs**.", tr: { es: "Me gustan los perros." } }
          - { level: A1, use: { en: "uncountable nouns in general", es: "sustantivos incontables en general" }, example: "**Life** is hard. / I love **music**.", tr: { es: "La vida es dura. / Me encanta la música." } }
          - { level: A1, use: { en: "meals", es: "comidas del día" }, example: "We have **lunch** at two.", tr: { es: "Comemos a las dos." } }
          - { level: A1, use: { en: "languages, school subjects, sports", es: "idiomas, asignaturas, deportes" }, example: "I speak **Spanish**. / I play **football**.", tr: { es: "Hablo español. / Juego al fútbol." } }
          - { level: A1, use: { en: "names, most countries and cities", es: "nombres, la mayoría de países y ciudades" }, example: "**Mr Smith** lives in **London**.", tr: { es: "El señor Smith vive en Londres." } }
          - { level: A2, use: { en: "home, work, school, bed", es: "home, work, school, bed" }, example: "go **home** / at **work** / go to **bed**", tr: { es: "ir a casa / en el trabajo / ir a la cama" } }
          - { level: A2, use: { en: "transport after by", es: "transporte detrás de by" }, example: "by **bus** / by **train**", tr: { es: "en autobús / en tren" } }
          - { level: B1, use: { en: "hospital, prison, church, university for their main purpose", es: "hospital, prison, church, university por su función principal" }, example: "He's in **hospital**. (US: in **the** hospital)", tr: { es: "Está ingresado en el hospital." } }
      - type: bullets
        items:
          - { for: [es], text: { es: "Para hablar en general, el español usa artículo y el inglés no: *Me gustan los perros* → I like **dogs**." } }
          - level: B1
            text:
              en: "For the building itself, use the:"
              es: "Para el edificio en sí, se usa the:"
            ex: "I went to **the** hospital to visit him."
            tr: { es: "Fui al hospital a visitarlo." }

  - title: { en: Typical errors, es: Errores típicos }
    level: A1-B1
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: a apple, right: "**an** apple", rule: { en: an before a vowel sound, es: an delante de sonido vocal } }
          - { wrong: an university, right: "**a** university", rule: { en: "university starts with /j/", es: "university empieza por /j/" } }
          - { for: [es], wrong: She is doctor., right: "She's **a** doctor.", rule: { es: "profesiones: a / an" } }
          - { for: [es], wrong: The life is hard., right: "**Life** is hard.", rule: { es: "en general: sin artículo" } }
          - { for: [es], wrong: I like the dogs., right: "I like **dogs**.", rule: { es: "en general: plural sin artículo" } }
          - { for: [es], wrong: I play the football., right: "I play **football**.", rule: { es: "deportes: sin artículo" } }
          - { for: [es], wrong: The Mr Smith is here., right: "**Mr Smith** is here.", rule: { es: "nombres y títulos: sin artículo" } }
          - { for: [es], wrong: I go to the home., right: "I go **home**.", rule: { es: "go home: sin to y sin the" } }
          - { for: [en], wrong: I live in the Spain., right: "I live in **Spain**.", rule: { en: "most countries: no article" } }

essentials:
  - level: A1
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: article, label: { en: Article, es: Artículo } }
              - { key: before, label: { en: Before, es: Delante de } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { article: a /ə/, before: { en: consonant sound, es: sonido consonante }, example: "**a** book / **a** university" }
              - { article: an /ən/, before: { en: vowel sound, es: sonido vocal }, example: "**an** apple / **an** hour" }
              - { article: the, before: { en: any noun, es: cualquier sustantivo }, example: "**the** book / **the** books / **the** water" }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - { en: "a / an: singular countable nouns only.", es: "a / an: solo con contables en singular." }
              - { en: "The first sound decides: **an** hour, **a** university.", es: "Decide el primer sonido: **an** hour, **a** university." }
              - { en: "First mention a / an, then the: There's **a** cat. **The** cat is black.", es: "Primera mención a / an, después the: There's **a** cat. **The** cat is black." }
              - { en: "General plural or uncountable: no article: I like **dogs**.", es: "Plural o incontable en general: sin artículo: I like **dogs**." }
      - title: { en: Use, es: Uso }
        content:
          - type: table
            columns:
              - { key: use, label: { en: Use, es: Uso } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { use: { en: "a / an: one, any one, jobs", es: "a / an: uno, uno cualquiera, profesiones" }, example: "She's **a** doctor.", tr: { es: "Es médica." } }
              - { use: { en: "the: known, the only one, superlatives", es: "the: conocido, único, superlativos" }, example: "**the** sun / **the** best", tr: { es: "el sol / el mejor" } }
              - { use: { en: "no article: general, meals, languages, sports, names", es: "sin artículo: en general, comidas, idiomas, deportes, nombres" }, example: "I play **football**.", tr: { es: "Juego al fútbol." } }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { wrong: a apple, right: "**an** apple" }
              - { for: [es], wrong: She is doctor., right: "She's **a** doctor." }
              - { for: [es], wrong: The life is hard., right: "**Life** is hard." }
              - { for: [es], wrong: I like the dogs., right: "I like **dogs**." }
  - level: A2
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: { en: Rate, es: Proporción }, rule: { en: "a / an = per", es: "a / an = por" }, example: "twice **a** week" }
          - { point: { en: Instruments, es: Instrumentos }, rule: the, example: "play **the** piano" }
          - { point: { en: Geography, es: Geografía }, rule: { en: "the + rivers, seas, mountain ranges, the UK / USA", es: "the + ríos, mares, cordilleras, the UK / USA" }, example: "**the** Thames / **the** Alps" }
          - { point: { en: Places, es: Lugares }, rule: { en: "no article: home, work, school, bed", es: "sin artículo: home, work, school, bed" }, example: "go **home** / at **work**" }
          - { point: { en: Transport, es: Transporte }, rule: { en: "by + no article", es: "by + sin artículo" }, example: "by **bus**" }
  - level: B1
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: { en: Groups, es: Grupos }, rule: { en: "the + adjective = a group of people", es: "the + adjetivo = un grupo de personas" }, example: "**the** rich" }
          - { point: { en: Purpose, es: Función }, rule: { en: "no article: hospital, prison, church, university for their purpose", es: "sin artículo: hospital, prison, church, university por su función" }, example: "He's in **hospital**." }
          - { point: { en: Building, es: Edificio }, rule: { en: "the: the building itself", es: "the: el edificio en sí" }, example: "I went to **the** hospital to visit him." }

reminders:
  - level: A1
    items:
      - { en: "General plural or uncountable: no article: **Life** is hard. I like **dogs**.", es: "En general, sin artículo: **Life** is hard. I like **dogs**." }
      - { en: "Jobs take a / an: She's **a** doctor.", es: "Profesiones con a / an: She's **a** doctor." }
  - level: A2
    items:
      - { en: "go **home**: no to, no the.", es: "go **home**: sin to y sin the." }
