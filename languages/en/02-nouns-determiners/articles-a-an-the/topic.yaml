# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.articles-a-an-the
lang: en
kind: grammar
tags: [articles, determiners, nouns]
concepts: [articles]
related: [en.nouns-determiners.countable-uncountable, en.nouns-determiners.plurals, en.nouns-determiners.quantifiers-some-any-much-many, en.nouns-determiners.demonstratives-this-that, en.nouns-determiners.possessive-s]
status: { en: draft }

title: { en: "Articles: a, an, the" }
summary:
  lead: { en: "A and an for one thing, the for a thing both people know, and no article for things in general." }
  rule: { en: [The first sound decides a or an (, { term: an }, " hour, ", { term: a }, " university), and general plurals and uncountable nouns take no article:"] }
  ex: ["I like ", { target: dogs }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A1, point: { en: Form }, rule: { en: [{ term: a }, " before a consonant sound, ", { term: an }, " before a vowel sound"] }, ex: { examples: [[{ target: a }, " book"], [{ target: an }, " apple"]] } }
        - { level: A1, point: { alternatives: [a, an] }, rule: { en: "one thing, a job, or a first mention" }, ex: ["She's ", { target: a }, " doctor."] }
        - { level: A1, point: the, rule: { en: "a thing we both know, or already mentioned" }, ex: ["There's a cat. ", { target: The }, " cat is black."] }
        - { level: A1, point: the, rule: { en: "the only one; superlatives and ordinals" }, ex: { examples: [[{ target: the }, " sun"], [{ target: the }, " best"], [{ target: the }, " first time"]] } }
        - { level: A2, point: the, rule: { en: "rivers, seas, oceans, mountain ranges" }, ex: { examples: [[{ target: the }, " Thames"], [{ target: the }, " Atlantic"], [{ target: the }, " Alps"]] } }
        - { level: A2, point: the, rule: { en: "countries with a plural name, Kingdom or States" }, ex: { examples: [[{ target: the }, " UK"], [{ target: the }, " USA"], [{ target: the }, " Netherlands"]] } }
        - { level: B1, point: the, rule: { en: [{ pattern: [the, { slot: adjective }] }, " means a group of people"] }, ex: { examples: [[{ target: the }, " rich"], [{ target: the }, " young"]] } }
        - { level: A1, point: { en: No article }, rule: { en: "plural and uncountable nouns in general; meals; names" }, ex: { examples: [["I like ", { target: dogs }, "."], ["We have ", { target: lunch }, " at two."]] } }
        - { level: A2, point: { en: No article }, rule: { en: "home, work, school, bed; transport after by" }, ex: { examples: [["go ", { target: home }], ["at ", { target: work }], ["by ", { target: bus }]] } }
        - { level: B1, point: { en: No article }, rule: { en: ["hospital, prison, church for their purpose; ", { term: the }, " for the building"] }, ex: ["He's in ", { target: hospital }, "."] }
        - { level: A1, point: { en: Trap }, rule: { en: "the first sound decides, not the letter" }, ex: { examples: [[{ target: a }, " university"], [{ target: an }, " hour"]] } }
        - { level: A1, point: { en: Trap }, rule: { en: "most countries take no article" }, ex: ["I live in ", { target: Spain }, "."] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: [{ alternatives: [a, an] }, " go only with singular countable nouns. See ", { link: Countable and uncountable, to: en.nouns-determiners.countable-uncountable }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: the }, " goes with all nouns: singular, plural and uncountable."]

  - title: { en: "Form: a or an" }
    role: form
    content:
      - type: usage
        columns:
          - { key: before, label: { en: Next word starts with } }
          - { key: article, label: { en: Article } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, before: { en: a consonant sound }, article: a, ex: { examples: [[{ target: a }, " book"], [{ target: a }, " big apple"]] } }
          - { level: A1, before: { en: a vowel sound }, article: an, ex: { examples: [[{ target: an }, " apple"], [{ target: an }, " old book"]] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The first sound decides, not the letter: ", { term: an }, " hour ", { ipa: ˈaʊə }, ", ", { term: a }, " university ", { ipa: juːnɪˈvɜːsəti }, "."]
          - type: rule
            level: A1
            text:
              en: ["The article goes before the adjective, so the adjective decides: ", { term: an }, " old car, ", { term: a }, " new car."]

  - title: { en: "Pronunciation: a, an, the" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word } }
          - { key: before, label: { en: Before } }
          - { key: sound, label: { en: Sound } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, word: a, before: { en: consonant sound }, sound: { ipa: ə }, ex: ["a book ", { ipa: ə ˈbʊk }] }
          - { level: A1, word: an, before: { en: vowel sound }, sound: { ipa: ən }, ex: ["an egg ", { ipa: ən ˈeɡ }] }
          - { level: A1, word: the, before: { en: consonant sound }, sound: { ipa: ðə }, ex: ["the book ", { ipa: ðə ˈbʊk }] }
          - { level: A1, word: the, before: { en: vowel sound }, sound: { ipa: ði }, ex: ["the egg ", { ipa: ði ˈeɡ }] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Articles are weak and unstressed: the stress falls on the noun."

  - title: { en: ["Use: ", { alternatives: [a, an] }] }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "one thing, any one" }, ex: ["I have ", { target: a }, " car."] }
          - { level: A1, use: { en: first mention; then the }, ex: ["There's ", { target: a }, " cat. ", { target: The }, " cat is black."] }
          - { level: A1, use: { en: jobs }, ex: ["She's ", { target: a }, " doctor."] }
          - { level: A1, use: { en: what something is }, ex: ["It's ", { target: an }, " orange."] }
          - { level: A2, use: { en: "rate: per" }, ex: { examples: [["twice ", { target: a }, " week"], ["£3 ", { target: a }, " kilo"]] } }
          - { level: A2, use: { en: exclamations with what }, ex: ["What ", { target: a }, " nice day!"] }

  - title: { en: "Use: the" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: we both know which }, ex: ["Close ", { target: the }, " door, please."] }
          - { level: A1, use: { en: the only one }, ex: { examples: [[{ target: the }, " sun"], [{ target: the }, " world"]] } }
          - { level: A1, use: { en: superlatives and ordinals }, ex: { examples: [[{ target: the }, " best"], [{ target: the }, " first time"]] } }
          - { level: A2, use: { en: musical instruments }, ex: ["She plays ", { target: the }, " piano. ", { variant: ["often ", { term: plays piano }], variety: en-US }] }
          - { level: A2, use: { en: "rivers, seas, oceans, mountain ranges" }, ex: { examples: [[{ target: the }, " Thames"], [{ target: the }, " Atlantic"], [{ target: the }, " Alps"]] } }
          - { level: A2, use: { en: "countries with Kingdom, States, Republic or a plural name" }, ex: { examples: [[{ target: the }, " UK"], [{ target: the }, " USA"], [{ target: the }, " Netherlands"]] } }
          - { level: B1, use: { en: [{ pattern: [the, { slot: adjective }] }, ": a group of people"] }, ex: { examples: [[{ target: the }, " rich"], [{ target: the }, " young"]] } }

  - title: { en: "Use: no article" }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: plural nouns in general }, ex: ["I like ", { target: dogs }, "."] }
          - { level: A1, use: { en: uncountable nouns in general }, ex: { examples: [[{ target: Life }, " is hard."], ["I love ", { target: music }, "."]] } }
          - { level: A1, use: { en: meals }, ex: ["We have ", { target: lunch }, " at two."] }
          - { level: A1, use: { en: "languages, school subjects, sports" }, ex: { examples: [["I speak ", { target: Spanish }, "."], ["I play ", { target: football }, "."]] } }
          - { level: A1, use: { en: "names, most countries and cities" }, ex: [{ target: Mr Smith }, " lives in ", { target: London }, "."] }
          - { level: A2, use: { en: "home, work, school, bed" }, ex: { examples: [["go ", { target: home }], ["at ", { target: work }], ["go to ", { target: bed }]] } }
          - { level: A2, use: { en: transport after by }, ex: { examples: [["by ", { target: bus }], ["by ", { target: train }]] } }
          - { level: B1, use: { en: "hospital, prison, church, university for their main purpose" }, ex: ["He's in ", { target: hospital }, ". ", { variant: ["in ", { target: the }, " hospital"], variety: en-US }] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "For the building itself, use the:"
            ex: ["I went to ", { target: the }, " hospital to visit him."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: a apple, right: [{ target: an }, " apple"], rule: { en: an before a vowel sound } }
          - { level: A1, wrong: an university, right: [{ target: a }, " university"], rule: { en: ["university starts with ", { ipa: j }] } }
          - { level: A1, wrong: I live in the Spain., right: ["I live in ", { target: Spain }, "."], rule: { en: "most countries: no article" } }
