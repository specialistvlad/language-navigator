# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.possessive-s
lang: en
kind: grammar
levels: [A1]
tags: [nouns, possession, apostrophe]
concepts: [possession]
related: [en.nouns-determiners.plurals, en.pronouns.personal-pronouns, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.demonstratives-this-that]
status: { en: draft, es: draft }

title: { en: "Possessive 's", es: "El posesivo 's" }
summary:
  en: "Noun + 's shows who something belongs to: Ana's car. A learner needs it to talk about people's things, family and relationships. The page covers the form ('s and ' after a plural -s), the pronunciation of 's, the use, and a comparison of 's and of. It ends with typical errors. The owner comes first and the thing second: Ana's car. After a plural noun ending in -s, add only the apostrophe: my parents' house. Whose asks who owns something, and Who's means Who is."
  es: "Sustantivo + 's indica de quién es algo: Ana's car. Sirve para hablar de las cosas de las personas, de la familia y de las relaciones. La página trata la forma ('s y ' detrás de un plural en -s), la pronunciación de 's, el uso y una comparación entre 's y of, y termina con los errores típicos. Primero va el poseedor y después la cosa: Ana's car. Detrás de un plural que acaba en -s solo se añade el apóstrofo: my parents' house. Contraste con el español: el español usa la estructura «el coche de Ana» y el inglés pone el poseedor delante, así que the car of Ana es un error. Whose pregunta de quién es algo; Who's significa Who is."

sections:
  - title: { en: "Form: 's and '", es: "Forma: 's y '" }
    level: A1
    content:
      - type: table
        columns:
          - { key: owner, label: { en: Owner, es: Poseedor } }
          - { key: form, label: { en: Add, es: Se añade } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { owner: { en: singular noun, es: sustantivo singular }, form: "'s", example: "**Ana's** car", tr: { es: el coche de Ana } }
          - { owner: { en: plural ending in -s, es: plural acabado en -s }, form: "'", example: "my **parents**' house", tr: { es: la casa de mis padres } }
          - { owner: { en: "irregular plural: children, men, women, people", es: "plural irregular: children, men, women, people" }, form: "'s", example: "the **children's** room", tr: { es: la habitación de los niños } }
          - { owner: { en: name ending in -s, es: nombre acabado en -s }, form: "'s / '", example: "**James's** / **James**' bike", tr: { es: la bici de James } }
          - { owner: { en: two owners of one thing, es: dos poseedores de una cosa }, form: { en: "'s on the last name", es: "'s en el último nombre" }, example: "Tom and **Ana's** flat", tr: { es: el piso de Tom y Ana } }
      - type: bullets
        items:
          - en: "The owner comes first, then the thing: **my sister's** phone."
            es: "Primero va el poseedor y después la cosa: *el móvil de mi hermana* → **my sister's** phone."
          - en: "The thing after 's takes no article: Ana's **car**."
            es: "La cosa que va detrás de 's no lleva artículo: Ana's **car**."
          - en: "'s also shortens is and has: **Ana's** tired = Ana is tired."
            es: "'s también es la forma corta de is y has: **Ana's** tired = Ana is tired."

  - title: { en: "Pronunciation: 's", es: "Pronunciación: 's" }
    level: A1
    content:
      - type: table
        columns:
          - { key: sound, label: { en: Sound, es: Sonido } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { sound: /s/, example: "Mark's /mɑːks/" }
          - { sound: /z/, example: "Ana's /ˈænəz/" }
          - { sound: /ɪz/, example: "James's /ˈdʒeɪmzɪz/" }
      - type: bullets
        items:
          - en: "'s follows the sound rules of the plural -s. See [Plurals](id:en.nouns-determiners.plurals)."
            es: "'s sigue las reglas de sonido de la -s del plural. Ver [El plural](id:en.nouns-determiners.plurals)."
          - en: "' after a plural -s adds no sound: parents' /ˈpeərənts/."
            es: "' detrás de la -s del plural no añade sonido: parents' /ˈpeərənts/."

  - title: { en: Use, es: Uso }
    level: A1
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { use: { en: People, es: Personas }, example: "my **brother's** job", tr: { es: el trabajo de mi hermano } }
          - { use: { en: Animals, es: Animales }, example: "the **dog's** bed", tr: { es: la cama del perro } }
          - { use: { en: "Someone's home or shop, without the noun", es: "La casa o la tienda de alguien, sin el sustantivo" }, example: "at my **mum's** / at the **doctor's**", tr: { es: en casa de mi madre / en el médico } }
          - { use: { en: "Answer to Whose…?", es: "Respuesta a Whose…?" }, example: "Whose bag is this? — It's **Ana's**.", tr: { es: ¿De quién es esta bolsa? — Es de Ana. } }
      - type: bullets
        items:
          - en: "Ask about the owner with **Whose** + noun: **Whose** bag is this?"
            es: "Para preguntar por el dueño: **Whose** + sustantivo: **Whose** bag is this?"
          - en: "my, your, his… and mine, yours, his…: see [Personal pronouns](id:en.pronouns.personal-pronouns)."
            es: "my, your, his… y mine, yours, his…: ver [Pronombres personales](id:en.pronouns.personal-pronouns)."

  - title: { en: "Compare: 's and of", es: "Comparación: 's y of" }
    level: A1
    content:
      - type: table
        columns:
          - { key: s, label: "'s" }
          - { key: of, label: of }
        rows:
          - { s: { en: people and animals, es: personas y animales }, of: { en: things and places, es: cosas y lugares } }
          - { s: { ex: "my **friend's** name", tr: { es: el nombre de mi amigo } }, of: { ex: "the name **of** the street", tr: { es: el nombre de la calle } } }
          - { s: { ex: "the **cat's** food", tr: { es: la comida del gato } }, of: { ex: "the end **of** the film", tr: { es: el final de la película } } }

  - title: { en: Typical errors, es: Errores típicos }
    level: A1
    content:
      - type: errors
        audience: true
        rows:
          - { for: [es], wrong: the car of Ana, right: "**Ana's** car", rule: { es: "persona + 's + cosa" } }
          - { for: [es], wrong: the house of my parents, right: "my **parents**' house", rule: { es: "persona + 's / ' + cosa" } }
          - { for: [es], wrong: the Ana's car, right: "**Ana's** car", rule: { es: "nombre + 's, sin the" } }
          - { for: [es], wrong: Ana car, right: "**Ana's** car", rule: { es: "el poseedor lleva 's" } }
          - { wrong: my parents's house, right: "my **parents**' house", rule: { en: "plural in -s → + '", es: "plural en -s → + '" } }
          - { wrong: the childrens' room, right: "the **children's** room", rule: { en: "irregular plural → + 's", es: "plural irregular → + 's" } }
          - { wrong: Who's bag is this?, right: "**Whose** bag is this?", rule: { en: "who's = who is", es: "who's = who is" } }

essentials:
  - level: A1
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: owner, label: { en: Owner, es: Poseedor } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { owner: { en: "singular / irregular plural + 's", es: "singular / plural irregular + 's" }, example: "Ana's car / the children's room" }
              - { owner: { en: "plural in -s + '", es: "plural en -s + '" }, example: "my parents' house" }
              - { owner: { en: "two owners: 's on the last", es: "dos poseedores: 's en el último" }, example: "Tom and Ana's flat" }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - { en: "Owner + 's + thing, no article: Ana's car.", es: "Poseedor + 's + cosa, sin artículo: Ana's car." }
              - { en: "'s for people and animals; of for things: the end of the film.", es: "'s para personas y animales; of para cosas: the end of the film." }
              - { en: "Whose + noun asks about the owner: Whose bag is this?", es: "Whose + sustantivo pregunta por el dueño: Whose bag is this?" }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { for: [es], wrong: the car of Ana, right: "**Ana's** car" }
              - { wrong: my parents's house, right: "my **parents**' house" }
              - { wrong: Who's bag is this?, right: "**Whose** bag is this?" }

reminders:
  - level: A1
    items:
      - { en: "Plural in -s + ': my **parents**' house.", es: "Plural en -s + ': my **parents**' house." }
      - { en: "**Whose** bag? ≠ **Who's** (= who is) there?", es: "**Whose** bag? ≠ **Who's** (= who is) there?" }
      - { for: [es], text: { es: "*El coche de Ana* → **Ana's** car." } }
