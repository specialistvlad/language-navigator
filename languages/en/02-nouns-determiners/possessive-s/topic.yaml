# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.nouns-determiners.possessive-s
lang: en
kind: grammar
tags: [nouns, possession, apostrophe]
concepts: [possession]
related: [en.nouns-determiners.plurals, en.pronouns.personal-pronouns, en.nouns-determiners.articles-a-an-the, en.nouns-determiners.demonstratives-this-that]
status: { en: draft }

title: { en: "Possessive 's" }
summary:
  en: "Noun + 's shows who something belongs to, and ' alone follows a plural in -s. The owner comes first and the thing after it takes no article: **Ana's** car, my **parents'** house, the **children's** room."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A1, point: { en: singular noun }, rule: "+ 's", example: "**Ana's** car" }
        - { level: A1, point: { en: plural in -s }, rule: "+ '", example: "my **parents**' house" }
        - { level: A1, point: { en: irregular plural }, rule: "+ 's", example: "the **children's** room" }
        - { level: A1, point: { en: two owners }, rule: { en: "'s on the last name" }, example: "Tom and **Ana's** flat" }
        - { level: A1, point: { en: word order }, rule: { en: "owner first, thing after, no article" }, example: "**my sister's** phone" }
        - { level: A1, point: { en: "'s or of" }, rule: { en: "'s for people and animals, of for things" }, example: "the end **of** the film" }
        - { level: A1, point: Whose, rule: { en: "asks about the owner" }, example: "**Whose** bag is this?" }
        - { level: A1, point: "Who's", rule: { en: "= who is, not the owner" }, example: "**Whose** bag? ≠ **Who's** there?" }

sections:
  - title: { en: "Form: 's and '" }
    content:
      - type: table
        columns:
          - { key: owner, label: { en: Owner } }
          - { key: form, label: { en: Add } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, owner: { en: singular noun }, form: "'s", example: "**Ana's** car" }
          - { level: A1, owner: { en: plural ending in -s }, form: "'", example: "my **parents**' house" }
          - { level: A1, owner: { en: "irregular plural: children, men, women, people" }, form: "'s", example: "the **children's** room" }
          - { level: A1, owner: { en: name ending in -s }, form: "'s / '", example: "**James's** / **James**' bike" }
          - { level: A1, owner: { en: two owners of one thing }, form: { en: "'s on the last name" }, example: "Tom and **Ana's** flat" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "The owner comes first, then the thing: **my sister's** phone."
          - level: A1
            text:
              en: "The thing after 's takes no article: Ana's **car**."
          - level: A1
            text:
              en: "'s also shortens is and has: **Ana's** tired = Ana is tired."

  - title: { en: "Pronunciation: 's" }
    content:
      - type: table
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, sound: /s/, example: "Mark's /mɑːks/" }
          - { level: A1, sound: /z/, example: "Ana's /ˈænəz/" }
          - { level: A1, sound: /ɪz/, example: "James's /ˈdʒeɪmzɪz/" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "'s follows the sound rules of the plural -s. See [Plurals](id:en.nouns-determiners.plurals)."
          - level: A1
            text:
              en: "' after a plural -s adds no sound: parents' /ˈpeərənts/."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: People }, example: "my **brother's** job" }
          - { level: A1, use: { en: Animals }, example: "the **dog's** bed" }
          - { level: A1, use: { en: "Someone's home or shop, without the noun" }, example: "at my **mum's** / at the **doctor's**" }
          - { level: A1, use: { en: "Answer to Whose…?" }, example: "Whose bag is this? — It's **Ana's**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Ask about the owner with **Whose** + noun: **Whose** bag is this?"
          - level: A1
            text:
              en: "my, your, his… and mine, yours, his…: see [Personal pronouns](id:en.pronouns.personal-pronouns)."

  - title: { en: "Compare: 's and of" }
    content:
      - type: table
        columns:
          - { key: s, label: "'s" }
          - { key: of, label: of }
        rows:
          - { level: A1, s: { en: people and animals }, of: { en: things and places } }
          - { level: A1, s: { ex: "my **friend's** name" }, of: { ex: "the name **of** the street" } }
          - { level: A1, s: { ex: "the **cat's** food" }, of: { ex: "the end **of** the film" } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: my parents's house, right: "my **parents**' house", rule: { en: "plural in -s → + '" } }
          - { level: A1, wrong: the childrens' room, right: "the **children's** room", rule: { en: "irregular plural → + 's" } }
          - { level: A1, wrong: Who's bag is this?, right: "**Whose** bag is this?", rule: { en: "who's = who is" } }
