# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.foundations.days-months-dates
lang: en
kind: foundations
tags: [days, months, dates, years]
concepts: [dates]
related: [en.foundations.numbers, en.foundations.telling-time, en.prepositions.time-in-on-at]
status: { en: draft }

title: { en: "Days, Months and Dates" }
summary:
  en: "The days of the week, the months, and how to say and write dates and years. Days and months always start with a capital letter, and dates are said with ordinals: on **Monday**, the **third** of **July**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A0, point: { en: Capitals }, rule: { en: "days and months start with a capital letter" }, example: "**M**onday, **J**une" }
        - { level: A0, point: Wednesday, rule: { en: "the first d is silent: /ˈwenzdeɪ/" }, example: "Wednesday" }
        - { level: A0, point: { en: Weekend }, rule: { en: "Saturday and Sunday are the weekend; the other days are weekdays" }, example: "**the weekend**" }
        - { level: A0, point: { en: Day of the month }, rule: { en: "say the day as an ordinal: 5 May" }, example: "the **fifth** of May" }
        - { level: A0, point: { en: Date order }, rule: { en: "British: day, month, year, so 04/07/2026 is 4 July; US: month, day, year, so April 7" }, example: "04/07/2026" }
        - { level: A0, point: { en: Asking the date }, rule: { en: "ask What's the date today? and answer with the ordinal" }, example: "It's the **tenth** of October." }
        - { level: A0, point: { en: Years }, rule: { en: "most years in two pairs of digits: 1999; 1900 and 1905 as shown" }, example: "**nineteen** ninety-nine / nineteen **hundred** / nineteen **oh** five" }
        - { level: A0, point: { en: After 2000 }, rule: { en: "2000–2009: two thousand (and) + unit; from 2010 both forms are common" }, example: "two thousand **and** eight / **twenty** twenty-six" }

sections:
  - title: { en: Days of the week }
    content:
      - type: table
        columns:
          - { key: day, label: { en: Day } }
          - { key: ipa, label: { en: Pronunciation } }
          - { key: short, label: { en: Short } }
        rows:
          - { level: A0, day: { ex: Monday }, ipa: /ˈmʌndeɪ/, short: Mon }
          - { level: A0, day: { ex: Tuesday }, ipa: /ˈtjuːzdeɪ/, short: Tue }
          - { level: A0, day: { ex: Wednesday }, ipa: /ˈwenzdeɪ/, short: Wed }
          - { level: A0, day: { ex: Thursday }, ipa: /ˈθɜːzdeɪ/, short: Thu }
          - { level: A0, day: { ex: Friday }, ipa: /ˈfraɪdeɪ/, short: Fri }
          - { level: A0, day: { ex: Saturday }, ipa: /ˈsætədeɪ/, short: Sat }
          - { level: A0, day: { ex: Sunday }, ipa: /ˈsʌndeɪ/, short: Sun }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Days and months always start with a capital letter: **M**onday, **J**une."
          - level: A0
            text:
              en: "Wednesday has a silent first d: /ˈwenzdeɪ/."
          - level: A0
            text: { en: "Saturday and Sunday are **the weekend**; the other days are **weekdays**." }

  - title: { en: Months }
    content:
      - type: table
        columns:
          - { key: month, label: { en: Month } }
          - { key: ipa, label: { en: Pronunciation } }
          - { key: short, label: { en: Short } }
        rows:
          - { level: A0, month: { ex: January }, ipa: /ˈdʒænjuəri/, short: Jan }
          - { level: A0, month: { ex: February }, ipa: /ˈfebruəri/, short: Feb }
          - { level: A0, month: { ex: March }, ipa: /mɑːtʃ/, short: Mar }
          - { level: A0, month: { ex: April }, ipa: /ˈeɪprəl/, short: Apr }
          - { level: A0, month: { ex: May }, ipa: /meɪ/, short: May }
          - { level: A0, month: { ex: June }, ipa: /dʒuːn/, short: Jun }
          - { level: A0, month: { ex: July }, ipa: /dʒuˈlaɪ/, short: Jul }
          - { level: A0, month: { ex: August }, ipa: /ˈɔːɡəst/, short: Aug }
          - { level: A0, month: { ex: September }, ipa: /sepˈtembə/, short: Sep }
          - { level: A0, month: { ex: October }, ipa: /ɒkˈtəʊbə/, short: Oct }
          - { level: A0, month: { ex: November }, ipa: /nəʊˈvembə/, short: Nov }
          - { level: A0, month: { ex: December }, ipa: /dɪˈsembə/, short: Dec }

  - title: { en: Dates }
    content:
      - type: table
        columns:
          - { key: written, label: { en: Written } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A0, written: "5 May · 5/5", said: "the **fifth** of May" }
          - { level: A0, written: "1 June · 1/6", said: "the **first** of June" }
          - { level: A0, written: "22 March · 22/3", said: "the **twenty-second** of March" }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Say the day as an ordinal number: the **third** of July. Ordinals: [Numbers](id:en.foundations.numbers)."
          - level: A0
            text:
              en: "British order: day, month, year. 04/07/2026 is 4 July."
          - level: A0
            text:
              en: "US: month, day, year. 04/07/2026 is April 7; say *April seventh*."
          - level: A0
            text: { en: "Ask the date with **What's the date today?**" }
            ex: "It's the **tenth** of October."

  - title: { en: Years }
    content:
      - type: table
        columns:
          - { key: year, label: { en: Year } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A0, year: "1999", said: "**nineteen** ninety-nine" }
          - { level: A0, year: "1900", said: "nineteen **hundred**" }
          - { level: A0, year: "1905", said: "nineteen **oh** five" }
          - { level: A0, year: "2000", said: "two thousand" }
          - { level: A0, year: "2008", said: "two thousand **and** eight" }
          - { level: A0, year: "2026", said: "**twenty** twenty-six / two thousand and twenty-six" }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Say most years in two pairs of digits: 19 | 99 → nineteen ninety-nine."
          - level: A0
            text:
              en: "2000–2009: two thousand (and) + unit. From 2010, both forms are common."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A0, wrong: Wednesday /ˈwednzdeɪ/, right: "Wednesday **/ˈwenzdeɪ/**", rule: { en: "the first d is silent" } }
          - { level: A0, wrong: the five of May, right: "the **fifth** of May", rule: { en: "days are ordinals" } }
