# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.foundations.days-months-dates
lang: en
kind: foundations
tags: [days, months, dates, years]
concepts: [dates]
related: [en.foundations.numbers, en.foundations.telling-time, en.prepositions.time-in-on-at]
status: { en: draft }

title: { en: "Days, Months and Dates" }
summary:
  lead: { en: "The days of the week, the months, and how to say and write dates and years." }
  rule: { en: "Days and months always start with a capital letter, and dates are said with ordinals:" }
  ex: { examples: [["on ", { target: { weekday: Monday, value: 1 } }], [{ date: ["the ", { target: third }, " of ", { target: July }], value: "--07-03" }, "."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A0, point: { en: Capitals }, rule: { en: days and months start with a capital letter }, ex: [{ letter: M }, "onday, ", { letter: J }, une] }
        - { level: A0, point: { weekday: Wednesday, value: 3 }, rule: { en: ["the first d is silent: ", { ipa: ˈwenzdeɪ }] }, ex: { weekday: Wednesday, value: 3 } }
        - { level: A0, point: { en: Weekend }, rule: { en: Saturday and Sunday are the weekend; the other days are weekdays }, ex: { target: the weekend } }
        - { level: A0, point: { en: Day of the month }, rule: { en: "say the day as an ordinal: 5 May" }, ex: { date: ["the ", { target: fifth }, " of ", May], value: "--05-05" } }
        - { level: A0, point: { en: Date order }, rule: { en: ["British: day, month, year, so 04/07/2026 is 4 July; ", { variant: "month, day, year, so April 7", variety: en-US }] }, ex: ["04/07/", { date: "2026", value: "2026" }] }
        - { level: A0, point: { en: Asking the date }, rule: { en: ask What's the date today? and answer with the ordinal }, ex: ["It's ", { date: ["the ", { target: tenth }, " of ", October], value: "--10-10" }, "."] }
        - { level: A0, point: { en: Years }, rule: { en: "most years in two pairs of digits: 1999; 1900 and 1905 as shown" }, ex: { examples: [[{ target: nineteen }, " ninety-nine"], ["nineteen ", { target: hundred }], ["nineteen ", { target: oh }, " five"]] } }
        - { level: A0, point: { en: After 2000 }, rule: { en: ["2000–2009: two thousand ", { pattern: [{ optional: and }, { slot: unit }] }, ; from 2010 both forms are common] }, ex: { examples: [["two thousand ", { target: and }, " eight"], [{ target: twenty }, " twenty-six"]] } }

sections:
  - title: { en: Days of the week }
    role: own
    content:
      - type: inventory
        set: days
        columns:
          - { key: day, label: { en: Day } }
          - { key: ipa, label: { en: Pronunciation } }
          - { key: short, label: { en: Short } }
        rows:
          - { level: A0, value: 1, day: Monday, ipa: { ipa: ˈmʌndeɪ }, short: Mon }
          - { level: A0, value: 2, day: Tuesday, ipa: { ipa: ˈtjuːzdeɪ }, short: Tue }
          - { level: A0, value: 3, day: Wednesday, ipa: { ipa: ˈwenzdeɪ }, short: Wed }
          - { level: A0, value: 4, day: Thursday, ipa: { ipa: ˈθɜːzdeɪ }, short: Thu }
          - { level: A0, value: 5, day: Friday, ipa: { ipa: ˈfraɪdeɪ }, short: Fri }
          - { level: A0, value: 6, day: Saturday, ipa: { ipa: ˈsætədeɪ }, short: Sat }
          - { level: A0, value: 7, day: Sunday, ipa: { ipa: ˈsʌndeɪ }, short: Sun }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: "Days and months always start with a capital letter:"
            ex: [{ letter: M }, "onday, ", { letter: J }, une.]
          - type: rule
            level: A0
            text:
              en: ["Wednesday has a silent first d: ", { ipa: ˈwenzdeɪ }, "."]
          - type: rule
            level: A0
            text:
              en: ["Saturday and Sunday are ", { term: the weekend }, "; the other days are ", { term: weekdays }, "."]

  - title: { en: Months }
    role: own
    content:
      - type: inventory
        set: months
        columns:
          - { key: month, label: { en: Month } }
          - { key: ipa, label: { en: Pronunciation } }
          - { key: short, label: { en: Short } }
        rows:
          - { level: A0, value: "--01", month: January, ipa: { ipa: ˈdʒænjuəri }, short: Jan }
          - { level: A0, value: "--02", month: February, ipa: { ipa: ˈfebruəri }, short: Feb }
          - { level: A0, value: "--03", month: March, ipa: { ipa: mɑːtʃ }, short: Mar }
          - { level: A0, value: "--04", month: April, ipa: { ipa: ˈeɪprəl }, short: Apr }
          - { level: A0, value: "--05", month: May, ipa: { ipa: meɪ }, short: May }
          - { level: A0, value: "--06", month: June, ipa: { ipa: dʒuːn }, short: Jun }
          - { level: A0, value: "--07", month: July, ipa: { ipa: dʒuˈlaɪ }, short: Jul }
          - { level: A0, value: "--08", month: August, ipa: { ipa: ˈɔːɡəst }, short: Aug }
          - { level: A0, value: "--09", month: September, ipa: { ipa: sepˈtembə }, short: Sep }
          - { level: A0, value: "--10", month: October, ipa: { ipa: ɒkˈtəʊbə }, short: Oct }
          - { level: A0, value: "--11", month: November, ipa: { ipa: nəʊˈvembə }, short: Nov }
          - { level: A0, value: "--12", month: December, ipa: { ipa: dɪˈsembə }, short: Dec }

  - title: { en: Dates }
    role: own
    content:
      - type: inventory
        set: dates
        columns:
          - { key: written, label: { en: Written } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A0, value: "--05-05", written: { examples: ["5 May", "5/5"] }, said: ["the ", { target: fifth }, " of May"] }
          - { level: A0, value: "--06-01", written: { examples: ["1 June", "1/6"] }, said: ["the ", { target: first }, " of June"] }
          - { level: A0, value: "--03-22", written: { examples: ["22 March", "22/3"] }, said: ["the ", { target: twenty-second }, " of March"] }
      - type: list
        items:
          - type: note
            level: A0
            text:
              en: ["Say the day as an ordinal number: the ", { term: third }, " of July. Ordinals: ", { link: Numbers, to: en.foundations.numbers }, "."]
          - type: rule
            level: A0
            text:
              en: "British order: day, month, year. 04/07/2026 is 4 July."
          - type: note
            level: A0
            variety: en-US
            text:
              en: ["month, day, year. 04/07/2026 is April 7; say ", { date: April seventh, value: "--04-07" }, "."]
          - type: rule
            level: A0
            text:
              en: ["Ask the date with ", { term: What's the date today? }]
            ex: ["It's ", { date: ["the ", { target: tenth }, " of ", October], value: "--10-10" }, "."]

  - title: { en: Years }
    role: own
    content:
      - type: inventory
        set: years
        columns:
          - { key: year, label: { en: Year } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A0, value: "1999", year: "1999", said: [{ target: nineteen }, " ninety-nine"] }
          - { level: A0, value: "1900", year: "1900", said: ["nineteen ", { target: hundred }] }
          - { level: A0, value: "1905", year: "1905", said: ["nineteen ", { target: oh }, " five"] }
          - { level: A0, value: "2000", year: "2000", said: two thousand }
          - { level: A0, value: "2008", year: "2008", said: ["two thousand ", { target: and }, " eight"] }
          - { level: A0, value: "2026", year: "2026", said: { alternatives: [[{ target: twenty }, " twenty-six"], two thousand and twenty-six] } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Say most years in two pairs of digits: ", { mapping: [{ date: { examples: ["19", "99"] }, value: "1999" }, nineteen ninety-nine] }, "."]
          - type: rule
            level: A0
            text:
              en: ["2000–2009: two thousand ", { pattern: [{ optional: and }, { slot: unit }] }, ". From 2010, both forms are common."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: [{ weekday: Wednesday, value: 3 }, " ", { ipa: ˈwednzdeɪ }], right: [{ weekday: Wednesday, value: 3 }, " ", { target: { ipa: ˈwenzdeɪ } }], rule: { en: the first d is silent } }
          - { level: A0, wrong: ["the five of ", { date: May, value: "--05" }], right: { date: ["the ", { target: fifth }, " of ", May], value: "--05-05" }, rule: { en: days are ordinals } }
