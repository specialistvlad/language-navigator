id: en.foundations.telling-time
lang: en
kind: foundations
tags: [time, clock, hours]
concepts: [telling-time]
related: [en.foundations.numbers, en.foundations.days-months-dates, en.prepositions.time-in-on-at]
status: { en: draft }

title: { en: Telling the Time }
summary:
  en: "How to ask the time and say it in numbers, and with past and to. Say the hour first, then the minutes: 7:05 is **seven oh five**, and o'clock follows only a full hour: **seven o'clock**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A0, point: { en: Asking }, rule: { en: "ask What time is it? and answer with It's + the time" }, example: "**It's** seven thirty." }
        - { level: A0, point: { en: Numbers }, rule: { en: "say the hour, then the minutes; 1–9 minutes take oh" }, example: "7:05 → seven **oh** five" }
        - { level: A0, point: o'clock, rule: { en: "o'clock goes only with full hours" }, example: "seven **o'clock**" }
        - { level: A1, point: past, rule: { en: "minutes 1–30: past the hour" }, example: "(a) **quarter past** three" }
        - { level: A1, point: to, rule: { en: "minutes 31–59: to the next hour; say the minutes first" }, example: "twenty **to** four" }
        - { level: A1, point: minutes, rule: { en: "minutes that are not 5, 10, 15… add minutes" }, example: "three **minutes** past six" }
        - { level: A1, point: a.m. / p.m., rule: { en: "a.m. is midnight to midday; p.m. is midday to midnight" }, example: "seven **a.m.** / three **p.m.**" }
        - { level: A1, point: { en: 24 hours }, rule: { en: "timetables use the 24-hour clock" }, example: "19:30 → nineteen thirty" }
        - { level: A1, point: US, rule: { en: "after for past, of for to" }, example: "a quarter **after** three" }

sections:
  - title: { en: The time in numbers }
    content:
      - type: text
        level: A0
        text:
          en: "Ask **What time is it?** or **What's the time?** Answer with **It's** + the time."
        ex: "It's seven thirty."
      - type: table
        columns:
          - { key: time, label: { en: Time } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A0, time: "7:00", said: "seven **o'clock**" }
          - { level: A0, time: "7:05", said: "seven **oh** five" }
          - { level: A0, time: "7:15", said: "seven fifteen" }
          - { level: A0, time: "7:30", said: "seven thirty" }
          - { level: A0, time: "7:45", said: "seven forty-five" }
          - { level: A0, time: "7:50", said: "seven fifty" }
      - type: bullets
        items:
          - level: A0
            text:
              en: "Say the hour, then the minutes. 1–9 minutes take *oh*: 7:05 → seven **oh** five."
          - level: A0
            text:
              en: "**o'clock** /əˈklɒk/ goes only with full hours: seven o'clock."

  - title: { en: Past and to }
    content:
      - type: table
        columns:
          - { key: time, label: { en: Time } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A1, time: "3:05", said: "five **past** three" }
          - { level: A1, time: "3:15", said: "(a) **quarter past** three" }
          - { level: A1, time: "3:20", said: "twenty **past** three" }
          - { level: A1, time: "3:30", said: "**half past** three" }
          - { level: A1, time: "3:40", said: "twenty **to** four" }
          - { level: A1, time: "3:45", said: "(a) **quarter to** four" }
          - { level: A1, time: "3:55", said: "five **to** four" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Minutes 1–30: **past** the hour. Minutes 31–59: **to** the next hour."
          - level: A1
            text:
              en: "Say the minutes first, then the hour: twenty **to** four."
          - level: A1
            text:
              en: "Minutes that are not 5, 10, 15… add *minutes*: three **minutes** past six."
          - level: A1
            text:
              en: "US: *after* for past, *of* for to: a quarter **after** three, ten **of** four."

  - title: { en: Parts of the day }
    content:
      - type: table
        columns:
          - { key: time, label: { en: Time } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A1, time: "07:00", said: "seven **a.m.** / seven in the **morning**" }
          - { level: A1, time: "12:00", said: "**midday** / twelve **noon**" }
          - { level: A1, time: "15:00", said: "three **p.m.** / three in the **afternoon**" }
          - { level: A1, time: "20:00", said: "eight p.m. / eight in the **evening**" }
          - { level: A1, time: "23:00", said: "eleven p.m. / eleven at **night**" }
          - { level: A1, time: "00:00", said: "**midnight**" }
      - type: bullets
        items:
          - level: A1
            text:
              en: "**a.m.** = from midnight to midday; **p.m.** = from midday to midnight."
          - level: A1
            text:
              en: "In speech, the 12-hour clock is usual. Timetables use 24 hours: 19:30 = *nineteen thirty*."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A0, wrong: seven o'clock fifteen, right: "seven **fifteen**", rule: { en: "o'clock only with full hours" } }
