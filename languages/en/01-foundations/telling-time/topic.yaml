# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.foundations.telling-time
lang: en
kind: foundations
tags: [time, clock, hours]
concepts: [telling-time]
related: [en.foundations.numbers, en.foundations.days-months-dates, en.prepositions.time-in-on-at]
status: { en: draft }

title: { en: Telling the Time }
summary:
  lead: { en: "How to ask the time and say it in numbers, and with past and to." }
  rule: { en: ["Say the hour first, then the minutes: 7:05 is ", { term: seven oh five }, ", and o'clock follows only a full hour:"] }
  ex: [{ target: seven o'clock }, "."]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A0, point: { en: Asking }, rule: { en: ["answer with ", { pattern: [It's, { slot: the time }] }] }, ex: { exchange: [What time is it?, { target: It's seven thirty. }] } }
        - { level: A0, point: { en: Numbers }, rule: { en: ["say the hour, then the minutes; 1–9 minutes take ", { term: oh }] }, ex: { mapping: [{ time: "7:05", value: "07:05" }, ["seven ", { target: oh }, " five"]] } }
        - { level: A0, point: o'clock, rule: { en: ["a full hour takes ", { term: o'clock }] }, ex: ["seven ", { target: o'clock }] }
        - { level: A1, point: past, rule: { en: "minutes 1–30: past the hour" }, ex: { examples: [["five ", { target: past }, " three"], [{ optional: a }, " ", { target: quarter past }, " three"], [{ target: half past }, " three"]] } }
        - { level: A1, point: to, rule: { en: "minutes 31–59: to the next hour; say the minutes first" }, ex: { examples: [["twenty ", { target: to }, " four"], [{ optional: a }, " ", { target: quarter to }, " four"]] } }
        - { level: A1, point: minutes, rule: { en: ["minutes that are not 5, 10, 15… add ", { term: minutes }] }, ex: ["three ", { target: minutes }, " past six"] }
        - { level: A1, point: { alternatives: [a.m., p.m.] }, rule: { en: [{ term: a.m. }, " is midnight to midday; ", { term: p.m. }, " is midday to midnight"] }, ex: { examples: [["seven ", { target: a.m. }], ["three ", { target: p.m. }]] } }
        - { level: A1, point: { en: Parts of the day }, rule: { en: add the part of the day after the time }, ex: { examples: [["seven in the ", { target: morning }], ["three in the ", { target: afternoon }], ["eight in the ", { target: evening }], ["eleven at ", { target: night }]] } }
        - { level: A1, point: { en: "24 hours" }, rule: { en: "speech uses 12 hours; timetables use the 24-hour clock" }, ex: { mapping: [{ time: "19:30", value: "19:30" }, { target: nineteen thirty }] } }
        - { level: A1, point: US, rule: { en: ["use ", { term: after }, " for ", { term: past }, " and ", { term: of }, " for ", { term: to }] }, ex: { examples: [["a quarter ", { target: after }, " three"], ["ten ", { target: of }, " four"]] }, variety: en-US }
        - { level: A0, point: { en: Trap }, rule: { en: ["minutes replace ", { term: o'clock }] }, ex: ["seven ", { target: fifteen }] }

sections:
  - title: { en: The time in numbers }
    role: own
    content:
      - type: prose
        level: A0
        text:
          en: ["Ask ", { term: What time is it? }, " or ", { term: What's the time? }, " Answer with ", { pattern: [{ term: It's }, { slot: the time }] }, "."]
        ex: It's seven thirty.
      - type: inventory
        set: times
        columns:
          - { key: time, label: { en: Time } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A0, value: "07:00", time: "7:00", said: ["seven ", { target: o'clock }] }
          - { level: A0, value: "07:05", time: "7:05", said: ["seven ", { target: oh }, " five"] }
          - { level: A0, value: "07:15", time: "7:15", said: seven fifteen }
          - { level: A0, value: "07:30", time: "7:30", said: seven thirty }
          - { level: A0, value: "07:45", time: "7:45", said: seven forty-five }
          - { level: A0, value: "07:50", time: "7:50", said: seven fifty }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Say the hour, then the minutes. 1–9 minutes take ", { term: oh }, ": ", { mapping: ["7:05", ["seven ", { term: oh }, " five"]] }, "."]
          - type: rule
            level: A0
            text:
              en: [{ term: o'clock }, " ", { ipa: əˈklɒk }, " goes only with full hours: seven o'clock."]

  - title: { en: Past and to }
    role: own
    content:
      - type: inventory
        set: times
        columns:
          - { key: time, label: { en: Time } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A1, value: "03:05", time: "3:05", said: ["five ", { target: past }, " three"] }
          - { level: A1, value: "03:15", time: "3:15", said: [{ optional: a }, " ", { target: quarter past }, " three"] }
          - { level: A1, value: "03:20", time: "3:20", said: ["twenty ", { target: past }, " three"] }
          - { level: A1, value: "03:30", time: "3:30", said: [{ target: half past }, " three"] }
          - { level: A1, value: "03:40", time: "3:40", said: ["twenty ", { target: to }, " four"] }
          - { level: A1, value: "03:45", time: "3:45", said: [{ optional: a }, " ", { target: quarter to }, " four"] }
          - { level: A1, value: "03:55", time: "3:55", said: ["five ", { target: to }, " four"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Minutes 1–30: ", { term: past }, " the hour. Minutes 31–59: ", { term: to }, " the next hour."]
          - type: rule
            level: A1
            text:
              en: ["Say the minutes first, then the hour: twenty ", { term: to }, " four."]
          - type: rule
            level: A1
            text:
              en: ["Minutes that are not 5, 10, 15… add ", { term: minutes }, ": three ", { term: minutes }, " past six."]
          - type: note
            level: A1
            variety: en-US
            text:
              en: [{ term: after }, " for past, ", { term: of }, " for to: a quarter ", { term: after }, " three, ten ", { term: of }, " four."]

  - title: { en: Parts of the day }
    role: own
    content:
      - type: inventory
        set: times
        columns:
          - { key: time, label: { en: Time } }
          - { key: said, label: { en: Said } }
        rows:
          - { level: A1, value: "07:00", time: "07:00", said: { alternatives: [["seven ", { target: a.m. }], ["seven in the ", { target: morning }]] } }
          - { level: A1, value: "12:00", time: "12:00", said: { alternatives: [{ target: midday }, ["twelve ", { target: noon }]] } }
          - { level: A1, value: "15:00", time: "15:00", said: { alternatives: [["three ", { target: p.m. }], ["three in the ", { target: afternoon }]] } }
          - { level: A1, value: "20:00", time: "20:00", said: { alternatives: [eight p.m., ["eight in the ", { target: evening }]] } }
          - { level: A1, value: "23:00", time: "23:00", said: { alternatives: [eleven p.m., ["eleven at ", { target: night }]] } }
          - { level: A1, value: "00:00", time: "00:00", said: { target: midnight } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: a.m. }, " = from midnight to midday; ", { term: p.m. }, " = from midday to midnight."]
          - type: rule
            level: A1
            text:
              en: ["In speech, the 12-hour clock is usual. Timetables use 24 hours: 19:30 = ", { time: nineteen thirty, value: "19:30" }, "."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: seven o'clock fifteen, right: ["seven ", { target: fifteen }], rule: { en: o'clock only with full hours } }
