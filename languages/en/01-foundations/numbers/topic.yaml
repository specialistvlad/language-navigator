# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.foundations.numbers
lang: en
kind: foundations
tags: [numbers, counting, ordinals]
concepts: [numbers]
related: [en.foundations.pronunciation-ipa, en.foundations.days-months-dates, en.foundations.telling-time]
status: { en: draft }

title: { en: Numbers }
summary:
  lead: { en: "Numbers from 0 to a million, and the ordinals first, second, third." }
  rule: { en: "Numbers in -teen stress the end and numbers in -ty the start:" }
  ex: [thir, { stress: teen }, " is 13, ", { stress: thir }, ty is 30.]

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A0, point: "-teen", rule: { en: "13–19 add -teen and stress it; 13, 15 and 18 change their first part" }, ex: [thir, { stress: teen }, " ", { ipa: θɜːˈtiːn }, ", ", { letter: fif }, "teen, ", { letter: eigh }, teen] }
        - { level: A0, point: "-ty", rule: { en: tens end in -ty and the stress is on the first part; forty has no u }, ex: [{ stress: thir }, "ty ", { ipa: ˈθɜːti }, ", ", { stress: for }, ty] }
        - { level: A0, point: { en: "21–99" }, rule: { en: { pattern: [ten, { slot: hyphen }, { slot: unit }] } }, ex: "twenty-one, forty-five" }
        - { level: A0, point: and, rule: { en: [and comes after hundred (, { variant: three hundred five, variety: en-US }, ")"] }, ex: ["two hundred ", { target: and }, " fifty"] }
        - { level: A0, point: "hundred, thousand, million", rule: { en: stay singular after a number }, ex: ["two ", { target: hundred }, ", five ", { target: million }] }
        - { level: A0, point: { en: Comma and point }, rule: { en: a comma separates thousands; a point separates decimals }, ex: { examples: ["1,500", ["2.5 ", { gloss: { en: { numeral: ["two ", { target: point }, " five"], value: 2.5 } } }]] } }
        - { level: A0, point: { en: Phone numbers }, rule: { en: say each digit; 0 is oh; two equal digits are double }, ex: { mapping: ["077", oh double seven] } }
        - { level: A0, point: { en: Ordinals }, rule: { en: "first, second, third; from 4 add -th" }, ex: [four, { ending: th }, ", six", { ending: th }] }
        - { level: A0, point: { en: Ordinal spelling }, rule: { en: "five, nine, twelve and twenty change their spelling" }, ex: [fi, { letter: f }, "th, nin", { ending: th }, ", twel", { letter: f }, "th, twent", { letter: ie }, th] }
        - { level: A0, point: { en: Short ordinals }, rule: { en: { pattern: [{ slot: number }, the last two letters of the word] } }, ex: ["1", { ending: st }, ", 2", { ending: nd }, ", 3", { ending: rd }, ", 4", { ending: th }] }
        - { level: A0, point: { en: Compound ordinals }, rule: { en: only the last word changes }, ex: [twenty-, { target: first }, ", a hundred and ", { target: second }] }

sections:
  - title: { en: "0 to 12" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number } }
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Pronunciation } }
        rows:
          - { level: A0, value: 0, number: "0", word: zero, ipa: { ipa: ˈzɪərəʊ } }
          - { level: A0, value: 1, number: "1", word: one, ipa: { ipa: wʌn } }
          - { level: A0, value: 2, number: "2", word: two, ipa: { ipa: tuː } }
          - { level: A0, value: 3, number: "3", word: three, ipa: { ipa: θriː } }
          - { level: A0, value: 4, number: "4", word: four, ipa: { ipa: fɔː } }
          - { level: A0, value: 5, number: "5", word: five, ipa: { ipa: faɪv } }
          - { level: A0, value: 6, number: "6", word: six, ipa: { ipa: sɪks } }
          - { level: A0, value: 7, number: "7", word: seven, ipa: { ipa: ˈsevn } }
          - { level: A0, value: 8, number: "8", word: eight, ipa: { ipa: eɪt } }
          - { level: A0, value: 9, number: "9", word: nine, ipa: { ipa: naɪn } }
          - { level: A0, value: 10, number: "10", word: ten, ipa: { ipa: ten } }
          - { level: A0, value: 11, number: "11", word: eleven, ipa: { ipa: ɪˈlevn } }
          - { level: A0, value: 12, number: "12", word: twelve, ipa: { ipa: twelv } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["In phone numbers, say each digit. 0 is ", { term: oh }, " ", { ipa: əʊ }, "; two equal digits are ", { term: double }, ": ", { mapping: ["077", { numeral: oh double seven, value: "077" }] }, "."]

  - title: { en: "13 to 19" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number } }
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Pronunciation } }
        rows:
          - { level: A0, value: 13, number: "13", word: [{ letter: thir }, teen], ipa: { ipa: θɜːˈtiːn } }
          - { level: A0, value: 14, number: "14", word: fourteen, ipa: { ipa: fɔːˈtiːn } }
          - { level: A0, value: 15, number: "15", word: [{ letter: fif }, teen], ipa: { ipa: fɪfˈtiːn } }
          - { level: A0, value: 16, number: "16", word: sixteen, ipa: { ipa: sɪksˈtiːn } }
          - { level: A0, value: 17, number: "17", word: seventeen, ipa: { ipa: sevnˈtiːn } }
          - { level: A0, value: 18, number: "18", word: [{ letter: eigh }, teen], ipa: { ipa: eɪˈtiːn } }
          - { level: A0, value: 19, number: "19", word: nineteen, ipa: { ipa: naɪnˈtiːn } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["13–19 add ", { term: "-teen" }, "; 13, 15 and 18 change their first part: ", { stress: thir }, "teen, ", { stress: fif }, "teen, ", { stress: eigh }, teen.]

  - title: { en: "20 to 90" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number } }
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Pronunciation } }
        rows:
          - { level: A0, value: 20, number: "20", word: twenty, ipa: { ipa: ˈtwenti } }
          - { level: A0, value: 30, number: "30", word: [{ letter: thir }, ty], ipa: { ipa: ˈθɜːti } }
          - { level: A0, value: 40, number: "40", word: [{ letter: for }, ty], ipa: { ipa: ˈfɔːti } }
          - { level: A0, value: 50, number: "50", word: [{ letter: fif }, ty], ipa: { ipa: ˈfɪfti } }
          - { level: A0, value: 60, number: "60", word: sixty, ipa: { ipa: ˈsɪksti } }
          - { level: A0, value: 70, number: "70", word: seventy, ipa: { ipa: ˈsevnti } }
          - { level: A0, value: 80, number: "80", word: [{ letter: eigh }, ty], ipa: { ipa: ˈeɪti } }
          - { level: A0, value: 90, number: "90", word: ninety, ipa: { ipa: ˈnaɪnti } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["Tens end in ", { term: "-ty" }, ". ", { pattern: [Ten, { slot: hyphen }, { slot: unit }] }, ": twenty-one, forty-five, ninety-nine."]
          - type: rule
            level: A0
            text:
              en: ["-teen is stressed; -ty is not: thir", { stress: teen }, " ", { ipa: θɜːˈtiːn }, " ≠ ", { stress: thir }, "ty ", { ipa: ˈθɜːti }, "."]

  - title: { en: "Hundreds, thousands, millions" }
    role: own
    content:
      - type: inventory
        set: numbers
        columns:
          - { key: number, label: { en: Number } }
          - { key: words, label: { en: Words } }
        rows:
          - { level: A0, value: 100, number: "100", words: [{ alternatives: [a, one] }, "  ", { target: hundred }] }
          - { level: A0, value: 105, number: "105", words: ["a hundred ", { target: and }, " five"] }
          - { level: A0, value: 250, number: "250", words: ["two hundred ", { target: and }, " fifty"] }
          - { level: A0, value: 1000, number: "1,000", words: [{ alternatives: [a, one] }, "  ", { target: thousand }] }
          - { level: A0, value: 1250, number: "1,250", words: ["one thousand two hundred ", { target: and }, " fifty"] }
          - { level: A0, value: 10000, number: "10,000", words: ten thousand }
          - { level: A0, value: 1000000, number: "1,000,000", words: [{ alternatives: [a, one] }, "  ", { target: million }] }
          - { level: A0, value: 2.5, number: "2.5", words: ["two ", { target: point }, " five"] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: and }, " comes after hundred: three hundred ", { term: and }, " five (", { variant: three hundred five, variety: en-US }, ")."]
          - type: rule
            level: A0
            text:
              en: ["After a number, hundred, thousand and million stay singular: two ", { term: hundred }, ", five ", { term: million }, "."]
          - type: rule
            level: A0
            text:
              en: "A comma separates thousands; a point separates decimals: 1,500 · 2.5."

  - title: { en: Ordinal numbers }
    role: own
    content:
      - type: inventory
        set: ordinals
        columns:
          - { key: number, label: { en: Number } }
          - { key: word, label: { en: Ordinal } }
          - { key: ipa, label: { en: Pronunciation } }
        rows:
          - { level: A0, value: 1, number: "1st", word: [fir, { ending: st }], ipa: { ipa: fɜːst } }
          - { level: A0, value: 2, number: "2nd", word: [seco, { ending: nd }], ipa: { ipa: ˈsekənd } }
          - { level: A0, value: 3, number: "3rd", word: [thi, { ending: rd }], ipa: { ipa: θɜːd } }
          - { level: A0, value: 4, number: "4th", word: [four, { ending: th }], ipa: { ipa: fɔːθ } }
          - { level: A0, value: 5, number: "5th", word: [fif, { ending: th }], ipa: { ipa: fɪfθ } }
          - { level: A0, value: 6, number: "6th", word: [six, { ending: th }], ipa: { ipa: sɪksθ } }
          - { level: A0, value: 7, number: "7th", word: [seven, { ending: th }], ipa: { ipa: ˈsevnθ } }
          - { level: A0, value: 8, number: "8th", word: [eigh, { ending: th }], ipa: { ipa: eɪtθ } }
          - { level: A0, value: 9, number: "9th", word: [nin, { ending: th }], ipa: { ipa: naɪnθ } }
          - { level: A0, value: 10, number: "10th", word: [ten, { ending: th }], ipa: { ipa: tenθ } }
          - { level: A0, value: 12, number: "12th", word: [twelf, { ending: th }], ipa: { ipa: twelfθ } }
          - { level: A0, value: 20, number: "20th", word: [twentie, { ending: th }], ipa: { ipa: ˈtwentiəθ } }
          - { level: A0, value: 100, number: "100th", word: [hundred, { ending: th }], ipa: { ipa: ˈhʌndrədθ } }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: ["1, 2 and 3 have their own words. From 4, add ", { term: "-th" }, "."]
          - type: rule
            level: A0
            text:
              en: ["Spelling changes: ", { mapping: [five, [fi, { letter: f }, th]] }, ", ", { mapping: [nine, [nin, { ending: th }]] }, ", ", { mapping: [twelve, [twel, { letter: f }, th]] }, ", ", { mapping: [twenty, [twent, { letter: ie }, th]] }, "."]
          - type: rule
            level: A0
            text:
              en: ["Written short: ", { pattern: [{ slot: number }, the last] }, " two letters of the word: 1", { ending: st }, ", 2", { ending: nd }, ", 3", { ending: rd }, ", 4", { ending: th }, "."]
          - type: rule
            level: A0
            text:
              en: ["In compound numbers, only the last word changes: twenty-", { term: first }, ", a hundred and ", { term: second }, "."]
          - type: rule
            level: A0
            text:
              en: "Ordinals give the order of things: floors, places, dates."
            ex: ["My flat is on the ", { target: second }, " floor."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: ["thirteen ", { ipa: ˈθɜːtiːn }], right: ["thirteen ", { ipa: θɜːˈtiːn }], rule: { en: "-teen is stressed" } }
          - { level: A0, wrong: fourty, right: { target: forty }, rule: { en: forty has no u } }
          - { level: A0, wrong: { examples: ["1th", "2th", "3th"] }, right: { examples: [["1", { ending: st }], ["2", { ending: nd }], ["3", { ending: rd }]] }, rule: { en: last two letters of the word } }
          - { level: A0, wrong: { examples: [nineth, twelveth] }, right: { examples: [{ target: ninth }, { target: twelfth }] }, rule: { en: the spelling changes } }
