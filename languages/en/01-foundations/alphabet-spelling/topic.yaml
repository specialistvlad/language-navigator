id: en.foundations.alphabet-spelling
lang: en
kind: foundations
tags: [alphabet, letters]
concepts: [alphabet]
related: [en.foundations.pronunciation-ipa, en.foundations.numbers, en.nouns-determiners.articles-a-an-the]
status: { en: draft }

title: { en: The Alphabet }
summary:
  en: "The 26 letters of the English alphabet and their names, used to spell words aloud. A letter's name differs from its sound in a word: **A** is said /eɪ/, but **a**pple starts with /æ/."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A0, point: { en: Letters }, rule: { en: "26 letters; vowels a, e, i, o, u; the other 21 are consonants; y works as both" }, example: "**y**es / m**y**" }
        - { level: A0, point: { en: Vowel names }, rule: { en: "A /eɪ/, E /iː/, I /aɪ/, O /əʊ/, U /juː/" }, example: "**e**gg / **i**ce" }
        - { level: A0, point: { en: G and J }, rule: { en: "G /dʒiː/, J /dʒeɪ/" }, example: "**g**irl / **j**ob" }
        - { level: A0, point: { en: W and Z }, rule: { en: "W is *double U* /ˈdʌbəljuː/; Z is /zed/" }, example: "**w**ater / **z**oo" }
        - { level: A0, point: { en: Name and sound }, rule: { en: "a letter's name and its sound in a word can differ: A is /eɪ/" }, example: "**a**pple /æ/" }
        - { level: A0, point: US, rule: { en: "Z is /ziː/ and R is /ɑːr/" }, example: "Z /ziː/" }

sections:
  - title: { en: The alphabet }
    content:
      - type: text
        level: A0
        text:
          en: "26 letters. Vowels: **a, e, i, o, u**. The other 21 are consonants; **y** works as both (*yes*, *my*)."
      - type: table
        columns:
          - { key: letter, label: { en: Letter } }
          - { key: name, label: { en: Name } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, letter: A a, name: /eɪ/, example: { ex: "**a**pple" } }
          - { level: A0, letter: B b, name: /biː/, example: { ex: "**b**ook" } }
          - { level: A0, letter: C c, name: /siː/, example: { ex: "**c**at" } }
          - { level: A0, letter: D d, name: /diː/, example: { ex: "**d**og" } }
          - { level: A0, letter: E e, name: /iː/, example: { ex: "**e**gg" } }
          - { level: A0, letter: F f, name: /ef/, example: { ex: "**f**ish" } }
          - { level: A0, letter: G g, name: /dʒiː/, example: { ex: "**g**irl" } }
          - { level: A0, letter: H h, name: /eɪtʃ/, example: { ex: "**h**ouse" } }
          - { level: A0, letter: I i, name: /aɪ/, example: { ex: "**i**ce" } }
          - { level: A0, letter: J j, name: /dʒeɪ/, example: { ex: "**j**ob" } }
          - { level: A0, letter: K k, name: /keɪ/, example: { ex: "**k**ey" } }
          - { level: A0, letter: L l, name: /el/, example: { ex: "**l**emon" } }
          - { level: A0, letter: M m, name: /em/, example: { ex: "**m**ilk" } }
          - { level: A0, letter: N n, name: /en/, example: { ex: "**n**ame" } }
          - { level: A0, letter: O o, name: /əʊ/, example: { ex: "**o**range" } }
          - { level: A0, letter: P p, name: /piː/, example: { ex: "**p**en" } }
          - { level: A0, letter: Q q, name: /kjuː/, example: { ex: "**q**ueen" } }
          - { level: A0, letter: R r, name: /ɑː/, example: { ex: "**r**ed" } }
          - { level: A0, letter: S s, name: /es/, example: { ex: "**s**un" } }
          - { level: A0, letter: T t, name: /tiː/, example: { ex: "**t**ea" } }
          - { level: A0, letter: U u, name: /juː/, example: { ex: "**u**mbrella" } }
          - { level: A0, letter: V v, name: /viː/, example: { ex: "**v**an" } }
          - { level: A0, letter: W w, name: /ˈdʌbəljuː/, example: { ex: "**w**ater" } }
          - { level: A0, letter: X x, name: /eks/, example: { ex: "bo**x**" } }
          - { level: A0, letter: Y y, name: /waɪ/, example: { ex: "**y**es" } }
          - { level: A0, letter: Z z, name: /zed/, example: { ex: "**z**oo" } }
      - type: bullets
        items:
          - level: A0
            text:
              en: "A letter's name and its sound in a word can differ: A is /eɪ/, but **a**pple starts with /æ/."
          - level: A0
            text:
              en: "US: Z is /ziː/ (*zee*) and R is /ɑːr/."
