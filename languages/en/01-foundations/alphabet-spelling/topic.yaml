id: en.foundations.alphabet-spelling
lang: en
kind: foundations
levels: [A0]
tags: [alphabet, letters]
concepts: [alphabet]
related: [en.foundations.pronunciation-ipa, en.foundations.numbers, en.nouns-determiners.articles-a-an-the]
status: { en: draft, es: draft }

title: { en: The Alphabet, es: El alfabeto (alphabet) }
summary:
  en: The 26 letters and their names.
  es: Las 26 letras y sus nombres.

sections:
  - title: { en: The alphabet, es: El alfabeto }
    level: A0
    content:
      - type: text
        text:
          en: "26 letters. Vowels: **a, e, i, o, u**. The other 21 are consonants; **y** works as both (*yes*, *my*)."
          es: "26 letras. Vocales: **a, e, i, o, u**. Las otras 21 son consonantes; **y** funciona como las dos (*yes*, *my*)."
      - type: table
        columns:
          - { key: letter, label: { en: Letter, es: Letra } }
          - { key: name, label: { en: Name, es: Nombre } }
          - { key: like, label: { es: Suena como }, for: [es] }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { letter: A a, name: /eɪ/, like: { es: «ei» }, example: { ex: "**a**pple", tr: { es: manzana } } }
          - { letter: B b, name: /biː/, like: { es: «bi» }, example: { ex: "**b**ook", tr: { es: libro } } }
          - { letter: C c, name: /siː/, like: { es: «si» }, example: { ex: "**c**at", tr: { es: gato } } }
          - { letter: D d, name: /diː/, like: { es: «di» }, example: { ex: "**d**og", tr: { es: perro } } }
          - { letter: E e, name: /iː/, like: { es: «i» }, example: { ex: "**e**gg", tr: { es: huevo } } }
          - { letter: F f, name: /ef/, like: { es: «ef» }, example: { ex: "**f**ish", tr: { es: pez } } }
          - { letter: G g, name: /dʒiː/, like: { es: «yi» }, example: { ex: "**g**irl", tr: { es: chica } } }
          - { letter: H h, name: /eɪtʃ/, like: { es: «eich» }, example: { ex: "**h**ouse", tr: { es: casa } } }
          - { letter: I i, name: /aɪ/, like: { es: «ai» }, example: { ex: "**i**ce", tr: { es: hielo } } }
          - { letter: J j, name: /dʒeɪ/, like: { es: «yei» }, example: { ex: "**j**ob", tr: { es: trabajo } } }
          - { letter: K k, name: /keɪ/, like: { es: «kei» }, example: { ex: "**k**ey", tr: { es: llave } } }
          - { letter: L l, name: /el/, like: { es: «el» }, example: { ex: "**l**emon", tr: { es: limón } } }
          - { letter: M m, name: /em/, like: { es: «em» }, example: { ex: "**m**ilk", tr: { es: leche } } }
          - { letter: N n, name: /en/, like: { es: «en» }, example: { ex: "**n**ame", tr: { es: nombre } } }
          - { letter: O o, name: /əʊ/, like: { es: «ou» }, example: { ex: "**o**range", tr: { es: naranja } } }
          - { letter: P p, name: /piː/, like: { es: «pi» }, example: { ex: "**p**en", tr: { es: bolígrafo } } }
          - { letter: Q q, name: /kjuː/, like: { es: «kiu» }, example: { ex: "**q**ueen", tr: { es: reina } } }
          - { letter: R r, name: /ɑː/, like: { es: «a» larga }, example: { ex: "**r**ed", tr: { es: rojo } } }
          - { letter: S s, name: /es/, like: { es: «es» }, example: { ex: "**s**un", tr: { es: sol } } }
          - { letter: T t, name: /tiː/, like: { es: «ti» }, example: { ex: "**t**ea", tr: { es: té } } }
          - { letter: U u, name: /juː/, like: { es: «iu» }, example: { ex: "**u**mbrella", tr: { es: paraguas } } }
          - { letter: V v, name: /viː/, like: { es: «vi» }, example: { ex: "**v**an", tr: { es: furgoneta } } }
          - { letter: W w, name: /ˈdʌbəljuː/, like: { es: «dábliu» }, example: { ex: "**w**ater", tr: { es: agua } } }
          - { letter: X x, name: /eks/, like: { es: «eks» }, example: { ex: "bo**x**", tr: { es: caja } } }
          - { letter: Y y, name: /waɪ/, like: { es: «uai» }, example: { ex: "**y**es", tr: { es: sí } } }
          - { letter: Z z, name: /zed/, like: { es: «sed» }, example: { ex: "**z**oo", tr: { es: zoo } } }
      - type: bullets
        items:
          - en: "A letter's name and its sound in a word can differ: A is /eɪ/, but **a**pple starts with /æ/."
            es: "El nombre de una letra y su sonido en una palabra pueden ser distintos: A se llama /eɪ/, pero **a**pple empieza con /æ/."
          - { for: [es], text: { es: "«Suena como» es una aproximación con sonidos del español. En «sed», la s es sonora: /z/." } }
          - en: "US: Z is /ziː/ (*zee*) and R is /ɑːr/."
            es: "US: Z se dice /ziː/ (*zee*) y R se dice /ɑːr/."

essentials:
  - level: A0
    parts:
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - { en: "Vowels: a, e, i, o, u. Names: A /eɪ/, E /iː/, I /aɪ/, O /əʊ/, U /juː/.", es: "Vocales: a, e, i, o, u. Nombres: A «ei», E «i», I «ai», O «ou», U «iu»." }
              - { en: "G /dʒiː/, J /dʒeɪ/, W *double U*, Z /zed/.", es: "G «yi», J «yei», W «dábliu», Z «sed» (s sonora)." }
              - { en: "A letter's name and its sound in a word can differ: A /eɪ/, **a**pple /æ/.", es: "El nombre de una letra y su sonido pueden ser distintos: A «ei», **a**pple /æ/." }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { wrong: E = /e/, right: "E = **/iː/**" }
              - { wrong: G = /dʒeɪ/ · J = /dʒiː/, right: "G = **/dʒiː/** · J = **/dʒeɪ/**" }

reminders:
  - level: A0
    items:
      - { en: "A /eɪ/, E /iː/, I /aɪ/ · G /dʒiː/, J /dʒeɪ/.", es: "A «ei», E «i», I «ai» · G «yi», J «yei»." }
