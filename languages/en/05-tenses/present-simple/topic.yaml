# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.tenses.present-simple
lang: en
kind: grammar
levels: [A1, A2]
tags: [verbs, tenses, present]
concepts: [present-tense]
related: [en.tenses.present-continuous, en.verbs.to-be, en.sentence-building.questions-negatives, en.adjectives-adverbs.adverbs-frequency-manner, en.tenses.tense-map]
status: { en: draft, es: draft }

title: { en: Present Simple, es: Presente simple }
summary:
  en: "Habits, routines, facts and permanent states. Use it to say what usually happens, what is always true and how things are. The page covers the affirmative, negative, questions and short answers with do and does, then the spelling and pronunciation of the -s ending. It goes on to the uses, signal words such as always and every day, stative verbs, and the contrast with the present continuous. At A2 it adds timetables, stative verbs and questions with who and what as the subject. The one thing to get right is the -s with he, she and it, and does in questions and negatives."
  es: "Hábitos, rutinas, hechos y estados permanentes. Sirve para decir lo que suele pasar, lo que siempre es verdad y cómo son las cosas. La página cubre la afirmativa, la negativa, las preguntas y las respuestas cortas con do y does, y después la ortografía y la pronunciación de la terminación -s. Sigue con los usos, las palabras clave como always y every day, los verbos de estado y el contraste con el presente continuo. En A2 añade los horarios, los verbos de estado y las preguntas con who y what como sujeto. Lo más importante es la -s con he, she e it, y does en preguntas y negativas. En español el verbo cambia con cada persona y el sujeto puede omitirse; en inglés el sujeto siempre aparece y solo he, she e it llevan -s."

sections:
  - title: { en: Overview, es: Resumen }
    level: A1
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: plural, label: I / you / we / they }
          - { key: third, label: he / she / it }
        rows:
          - { form: { en: Affirmative, es: Afirmativa }, plural: "I **work**.", third: "She **works**." }
          - { form: { en: Negative, es: Negativa }, plural: "I **don't work**.", third: "She **doesn't work**." }
          - { form: { en: Question, es: Pregunta }, plural: "**Do** you **work**?", third: "**Does** she **work**?" }
          - { form: { en: Short answer, es: Respuesta corta }, plural: "Yes, I **do**. / No, I **don't**.", third: "Yes, she **does**. / No, she **doesn't**." }
      - type: bullets
        items:
          - { for: [es], text: { es: "I work = *trabajo*. She works = *trabaja*." } }
          - en: "**be** has its own present forms (am / is / are). See [To be](id:en.verbs.to-be)."
            es: "**be** tiene sus propias formas de presente (am / is / are). Ver [To be](id:en.verbs.to-be)."

  - title: { en: "Form: affirmative", es: "Forma: afirmativa" }
    level: A1
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto } }
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { subject: I / you / we / they, verb: V, example: "I **live** in Madrid.", tr: { es: Vivo en Madrid. } }
          - { subject: he / she / it, verb: V-s, example: "She **lives** in Madrid.", tr: { es: Vive en Madrid. } }
          - { subject: { en: singular noun, es: sustantivo singular }, verb: V-s, example: "My brother **lives** in Madrid.", tr: { es: Mi hermano vive en Madrid. } }
          - { subject: { en: plural noun, es: sustantivo plural }, verb: V, example: "My parents **live** in Madrid.", tr: { es: Mis padres viven en Madrid. } }
      - type: bullets
        items:
          - { en: "V = base verb: work, live, eat.", es: "V = verbo en forma base: work, live, eat." }
          - en: "The verb takes **-s** with he, she, it and any singular subject."
            es: "El verbo lleva **-s** con he, she, it y con cualquier sujeto singular."
          - { for: [es], text: { es: "El sujeto siempre aparece en la frase: *Trabaja aquí.* → **She** works here." } }

  - title: { en: "Form: negative", es: "Forma: negativa" }
    level: A1
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto } }
          - { key: aux, label: { en: Auxiliary + verb, es: Auxiliar + verbo } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { subject: I / you / we / they, aux: do not / don't + V, example: "They **don't eat** meat.", tr: { es: No comen carne. } }
          - { subject: he / she / it, aux: does not / doesn't + V, example: "He **doesn't eat** meat.", tr: { es: No come carne. } }
      - type: bullets
        items:
          - { for: [es], text: { es: "El *no* español delante del verbo → **don't / doesn't** delante del verbo." } }
          - en: "After **doesn't** the verb is in the base form: He doesn't **eat**."
            es: "Después de **doesn't** el verbo va en forma base: He doesn't **eat**."
          - en: "Speech and messages use the short forms **don't** / **doesn't**."
            es: "En la conversación y en los mensajes se usan las formas cortas **don't** / **doesn't**."
          - en: "**be** and modal verbs make the negative directly: I'm **not** tired. / She **can't** swim."
            es: "**be** y los verbos modales forman la negativa directamente: I'm **not** tired. / She **can't** swim."

  - title: { en: "Form: questions", es: "Forma: preguntas" }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: aux, label: { en: Auxiliary + subject, es: Auxiliar + sujeto } }
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { aux: Do + I / you / we / they, verb: V, example: "**Do** you **speak** English?", tr: { es: ¿Hablas inglés? } }
          - { aux: Does + he / she / it, verb: V, example: "**Does** she **speak** English?", tr: { es: ¿Habla inglés? } }
      - type: text
        text:
          en: "Wh-questions: **wh-word + do / does + subject + V**"
          es: "Preguntas con palabra interrogativa: **wh-word + do / does + sujeto + V**"
      - type: table
        columns:
          - { key: word, label: { en: Wh-word, es: Palabra } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { word: What, example: "What **do** you **do**?", tr: { es: ¿A qué te dedicas? } }
          - { word: Where, example: "Where **does** he **live**?", tr: { es: ¿Dónde vive? } }
          - { word: When, example: "When **do** they **start** work?", tr: { es: ¿Cuándo empiezan a trabajar? } }
          - { word: How often, example: "How often **do** you **cook**?", tr: { es: ¿Con qué frecuencia cocinas? } }
      - type: bullets
        items:
          - en: "A question starts with **do / does**: auxiliary + subject + verb."
            es: "La pregunta empieza con **do / does**: auxiliar + sujeto + verbo."
          - en: "After **does** the verb is in the base form: Does she **speak**…?"
            es: "Después de **does** el verbo va en forma base: Does she **speak**…?"
          - level: A2
            text:
              en: "When **who** or **what** is the subject, the verb follows directly, with -s:"
              es: "Cuando **who** o **what** es el sujeto, el verbo va directamente, con -s:"
            ex: "Who **lives** here? / What **happens** next?"
            tr: { es: ¿Quién vive aquí? / ¿Qué pasa después? }

  - title: { en: "Form: short answers", es: "Forma: respuestas cortas" }
    level: A1
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question, es: Pregunta } }
          - { key: "yes", label: { en: "Yes", es: Sí } }
          - { key: "no", label: { en: "No", es: "No" } }
        rows:
          - { question: Do you like tea?, "yes": "Yes, I **do**.", "no": "No, I **don't**." }
          - { question: Does he like tea?, "yes": "Yes, he **does**.", "no": "No, he **doesn't**." }
          - { question: Do they like tea?, "yes": "Yes, they **do**.", "no": "No, they **don't**." }
      - type: bullets
        items:
          - en: "A short answer repeats the auxiliary from the question."
            es: "La respuesta corta repite el auxiliar de la pregunta: *¿Te gusta el té? — Sí.* → Yes, I **do**."

  - title: { en: "Spelling: he / she / it", es: "Ortografía: he / she / it" }
    level: A1
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Verb ending, es: Terminación } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: examples, label: { en: Examples, es: Ejemplos } }
        rows:
          - { ending: { en: most verbs, es: la mayoría de los verbos }, rule: + s, examples: work → works / read → reads }
          - { ending: "-s, -ss, -sh, -ch, -x, -z", rule: + es, examples: pass → passes / wash → washes / watch → watches / fix → fixes }
          - { ending: "-o", rule: + es, examples: go → goes / do → does }
          - { ending: { en: consonant + y, es: consonante + y }, rule: y → ies, examples: study → studies / try → tries }
          - { ending: { en: vowel + y, es: vocal + y }, rule: + s, examples: play → plays / buy → buys }
          - { ending: have, rule: irregular, examples: have → has }

  - title: { en: "Pronunciation: the -s ending", es: "Pronunciación: la terminación -s" }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: sound, label: { en: Sound, es: Sonido } }
          - { key: after, label: { en: After, es: Después de } }
          - { key: examples, label: { en: Examples, es: Ejemplos } }
        rows:
          - { sound: /s/, after: { en: voiceless sounds /p t k f/, es: sonidos sordos /p t k f/ }, examples: stops /stɒps/ / works /wɜːks/ / laughs /lɑːfs/ }
          - { sound: /z/, after: { en: voiced sounds and vowels, es: sonidos sonoros y vocales }, examples: lives /lɪvz/ / plays /pleɪz/ / goes /ɡəʊz/ }
          - { sound: /ɪz/, after: /s z ʃ tʃ dʒ/, examples: washes /ˈwɒʃɪz/ / watches /ˈwɒtʃɪz/ / uses /ˈjuːzɪz/ }
      - type: bullets
        items:
          - { for: [es], text: { es: "/z/ es una s sonora: vibra en la garganta, como el zumbido de una abeja." } }
          - en: "Three verbs change their vowel sound: does /dʌz/ / says /sez/ / has /hæz/."
            es: "Tres verbos cambian la vocal: does /dʌz/ / says /sez/ / has /hæz/."

  - title: { en: Use, es: Uso }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { level: A1, use: { en: Habits and routines, es: Hábitos y rutinas }, example: "I **get up** at 7.", tr: { es: Me levanto a las 7. } }
          - { level: A1, use: { en: Facts and general truths, es: Hechos y verdades generales }, example: "Water **boils** at 100 °C.", tr: { es: El agua hierve a 100 °C. } }
          - { level: A1, use: { en: Permanent states, es: Estados permanentes }, example: "She **lives** in London.", tr: { es: Vive en Londres. } }
          - { level: A1, use: { en: "Likes, dislikes, opinions", es: Gustos y opiniones }, example: "I **like** coffee. / I **think** so.", tr: { es: Me gusta el café. / Creo que sí. } }
          - { level: A1, use: { en: Jobs and regular activities, es: Profesiones y actividades habituales }, example: "He **teaches** maths.", tr: { es: Enseña matemáticas. } }
          - { level: A2, use: { en: Timetables and schedules (future), es: Horarios y calendarios (futuro) }, example: "The train **leaves** at 6:15.", tr: { es: El tren sale a las 6:15. } }
          - { level: A2, use: { en: Instructions and directions, es: Instrucciones y direcciones }, example: "You **turn** left at the bank.", tr: { es: Giras a la izquierda en el banco. } }

  - title: { en: Signal words, es: Palabras clave }
    level: A1
    content:
      - type: text
        text: { en: "Frequency adverbs, from most to least often:", es: "Adverbios de frecuencia, de más a menos:" }
      - type: table
        columns:
          - { key: adverb, label: { en: Adverb, es: Adverbio } }
          - { key: often, label: { en: How often, es: Frecuencia } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { adverb: always, often: 100%, example: "I **always** walk to work.", tr: { es: siempre } }
          - { adverb: usually, often: ≈ 90%, example: "She **usually** has toast.", tr: { es: normalmente } }
          - { adverb: often, often: ≈ 70%, example: "We **often** eat out.", tr: { es: a menudo } }
          - { adverb: sometimes, often: ≈ 50%, example: "They **sometimes** call me.", tr: { es: a veces } }
          - { adverb: rarely, often: ≈ 10%, example: "He **rarely** drives.", tr: { es: rara vez } }
          - { adverb: never, often: 0%, example: "I **never** drink coffee.", tr: { es: nunca } }
      - type: bullets
        items:
          - en: "Position: **before** the main verb (I **often** walk), **after** be (She **is** always late)."
            es: "Posición: **antes** del verbo principal (I **often** walk), **después** de be (She **is** always late)."
          - en: "**Sometimes** also goes at the start: **Sometimes** I work from home."
            es: "**Sometimes** también va al principio: **Sometimes** I work from home."
          - text:
              en: "**never** takes an affirmative verb:"
              es: "**never** va con el verbo en afirmativa:"
            ex: "I **never** drink coffee."
            tr: { es: Nunca bebo café. }
      - type: text
        text: { en: "Time expressions go at the end of the sentence:", es: "Expresiones de tiempo, al final de la frase:" }
      - type: table
        columns:
          - { key: expression, label: { en: Expression, es: Expresión } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { expression: every day / week / year, example: "I swim **every day**.", tr: { es: todos los días / cada semana / cada año } }
          - { expression: on Mondays, example: "She works late **on Mondays**.", tr: { es: los lunes } }
          - { expression: once / twice / three times a week, example: "We cook **twice a week**.", tr: { es: una / dos / tres veces a la semana } }
          - { expression: in the morning / afternoon / evening, example: "I study **in the evening**.", tr: { es: por la mañana / por la tarde / por la tarde-noche } }
          - { expression: at night / at the weekend, example: "He reads **at night**. (US: **on the weekend**)", tr: { es: por la noche / el fin de semana } }
      - type: bullets
        for: [es]
        items:
          - { es: "*Los lunes* → **on** Mondays: preposición on, sin artículo, con mayúscula." }

  - title: { en: Stative verbs, es: Verbos de estado }
    level: A2
    content:
      - type: text
        text:
          en: Verbs for states take the present simple, also for what is true right now.
          es: Los verbos que expresan estados van en presente simple, también para lo que es verdad en este momento.
      - type: table
        columns:
          - { key: group, label: { en: Group, es: Grupo } }
          - { key: verbs, label: { en: Verbs, es: Verbos } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { group: { en: Feelings, es: Sentimientos }, verbs: "like, love, hate, want, need, prefer", example: "I **want** a coffee." }
          - { group: { en: Thinking, es: Pensamiento }, verbs: { en: "know, think (= believe), understand, believe, remember, mean", es: "know, think (= creer), understand, believe, remember, mean" }, example: "I **understand** you." }
          - { group: { en: Possession, es: Posesión }, verbs: { en: "have (= own), own, belong", es: "have (= tener), own, belong" }, example: "This bag **belongs** to me." }
          - { group: { en: Senses, es: Sentidos }, verbs: "see, hear, smell, taste", example: "I **hear** music." }
          - { group: { en: Being, es: Estado }, verbs: "be, seem, cost, weigh", example: "It **costs** £10." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "Some of these verbs have an action meaning that takes the continuous:"
              es: "Algunos tienen también un significado de acción, que va en continuo:"
            ex: "I'**m thinking** about it. / We'**re having** lunch."
            tr: { es: Lo estoy pensando. / Estamos comiendo. }

  - title: { en: "Compare: present simple vs present continuous", es: "Comparación: present simple y present continuous" }
    level: A1-A2
    content:
      - type: table
        columns:
          - { key: simple, label: Present simple }
          - { key: continuous, label: Present continuous }
        rows:
          - { simple: { en: "habits, permanent situations", es: "hábitos, situaciones permanentes" }, continuous: { en: "now, temporary situations", es: "ahora, situaciones temporales" } }
          - { simple: { ex: "I **work** in a bank.", tr: { es: Trabajo en un banco. } }, continuous: { ex: "I'**m working** from home this week.", tr: { es: Esta semana trabajo desde casa. } } }
          - { simple: { ex: "She **plays** tennis on Sundays.", tr: { es: Juega al tenis los domingos. } }, continuous: { ex: "She'**s playing** tennis now.", tr: { es: Ahora está jugando al tenis. } } }
          - { simple: { ex: "What **do** you **do**? (= your job)", tr: { es: ¿A qué te dedicas? } }, continuous: { ex: "What **are** you **doing**? (= now)", tr: { es: ¿Qué estás haciendo? } } }
      - type: bullets
        items:
          - { for: [es], text: { es: "El presente español cubre los dos: *trabajo* = I work / I'm working." } }
          - en: "See [Present continuous](id:en.tenses.present-continuous)."
            es: "Ver [Presente continuo](id:en.tenses.present-continuous)."

  - title: { en: Typical errors, es: Errores típicos }
    level: A1-A2
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: She work here., right: "She **works** here.", rule: he / she / it → V-s }
          - { for: [es], wrong: Works in a bank., right: "**She** works in a bank.", rule: { es: el sujeto siempre aparece } }
          - { for: [es], wrong: He no works., right: "He **doesn't work**.", rule: { es: "negativa: doesn't + V" } }
          - { wrong: He doesn't works., right: "He doesn't **work**.", rule: { en: does / doesn't + base verb, es: doesn't + forma base } }
          - { for: [en], wrong: He don't know., right: "He **doesn't** know.", rule: { en: he / she / it → doesn't } }
          - { for: [en], wrong: Do she like tea?, right: "**Does** she like tea?", rule: { en: he / she / it → does } }
          - { wrong: Where you live?, right: "Where **do** you live?", rule: { en: questions need do / does, es: "pregunta: do / does + sujeto + V" } }
          - { for: [en], wrong: Does she likes tea?, right: "Does she **like** tea?", rule: { en: does + base verb } }
          - { for: [es], wrong: "Do you like tea? — Yes, I like.", right: "Yes, I **do**.", rule: { es: la respuesta corta repite el auxiliar } }
          - { wrong: I am agree., right: "I **agree**.", rule: { en: agree is a verb; it takes no be, es: "*estar de acuerdo* = agree, un solo verbo" } }
          - { for: [es], wrong: I don't never drink coffee., right: "I **never** drink coffee.", rule: { es: never + verbo en afirmativa } }
          - { for: [es], wrong: I go to the gym the Mondays., right: "I go to the gym **on Mondays**.", rule: { es: los lunes = on Mondays } }
          - { wrong: I am knowing the answer., right: "I **know** the answer.", rule: { en: stative verbs → present simple, es: verbos de estado → presente simple } }

essentials:
  - level: A1
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: form, label: { en: Form, es: Forma } }
              - { key: plural, label: I / you / we / they }
              - { key: third, label: he / she / it }
            rows:
              - { form: +, plural: "I **work**.", third: "She **works**." }
              - { form: −, plural: "I **don't work**.", third: "She **doesn't work**." }
              - { form: "?", plural: "**Do** you **work**?", third: "**Does** she **work**?" }
              - { form: { en: Short answer, es: Respuesta corta }, plural: "Yes, I do. / No, I don't.", third: "Yes, she does. / No, she doesn't." }
              - { form: { en: Wh-question, es: Con wh- }, plural: "Where **do** you **live**?", third: "Where **does** she **live**?" }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - en: "he / she / it → verb + **-s**: works / watches / studies / has."
                es: "he / she / it → verbo + **-s**. El sujeto siempre aparece: **She** works."
              - en: "do / does / don't / doesn't + **base verb**: She doesn't **work**."
                es: "do / does / don't / doesn't + **forma base**: She doesn't **work**."
              - en: "Questions: (wh-word) + do / does + subject + verb."
                es: "Pregunta: (wh-word) + do / does + sujeto + verbo."
              - en: "**be** and modals make questions and negatives directly: Are you…? / She can't…"
                es: "**be** y los modales forman preguntas y negativas directamente: Are you…? / She can't…"
              - en: "Frequency adverbs go before the main verb, after be: I **often** walk. / She is **always** late."
                es: "Adverbios de frecuencia: antes del verbo principal, después de be: I **often** walk. / She is **always** late."
      - title: { en: Use, es: Uso }
        content:
          - type: table
            columns:
              - { key: use, label: { en: Use, es: Uso } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { use: { en: "habit, routine", es: "hábito, rutina" }, example: "I **get up** at 7.", tr: { es: Me levanto a las 7. } }
              - { use: { en: fact, es: hecho }, example: "Water **boils** at 100 °C.", tr: { es: El agua hierve a 100 °C. } }
              - { use: { en: permanent state, es: estado permanente }, example: "She **lives** in London.", tr: { es: Vive en Londres. } }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { for: [en], wrong: She work here., right: "She **works** here." }
              - { for: [en], wrong: He doesn't works., right: "He doesn't **work**." }
              - { for: [es], wrong: He no works., right: "He **doesn't work**." }
              - { wrong: Where you live?, right: "Where **do** you live?" }
              - { for: [es], wrong: "Do you like tea? — Yes, I like.", right: "Yes, I **do**." }
  - level: A2
    content:
      - type: table
        columns:
          - { key: point, label: { en: Point, es: Punto } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { point: { en: -s sound, es: Sonido de -s }, rule: { en: "/s/ after /p t k f/ · /z/ after voiced sounds · /ɪz/ after /s z ʃ tʃ dʒ/", es: "/s/ tras /p t k f/ · /z/ tras sonidos sonoros · /ɪz/ tras /s z ʃ tʃ dʒ/" }, example: works / plays / watches }
          - { point: { en: Timetables, es: Horarios }, rule: { en: present simple for scheduled future, es: presente simple para el futuro programado }, example: "The train **leaves** at 6:15." }
          - { point: { en: Stative verbs, es: Verbos de estado }, rule: { en: "like, want, need, know, understand, believe, have (= own), belong, cost", es: "like, want, need, know, understand, believe, have (= tener), belong, cost" }, example: "I **know** the answer." }
          - { point: { en: Subject questions, es: Preguntas de sujeto }, rule: { en: who / what as subject + V-s, es: who / what como sujeto + V-s }, example: "Who **lives** here?" }

reminders:
  - level: A1
    items:
      - en: "he / she / it + **-s**: She **works**."
        es: "he / she / it + **-s**, con el sujeto siempre presente: **She works**."
      - en: "do / does + base verb: **Does** she **work**? / She **doesn't work**."
        es: "do / does + forma base: **Does** she **work**? / She **doesn't work**."
      - { for: [es], text: { es: "Respuesta corta con el auxiliar: Yes, I **do**." } }
  - level: A2
    items:
      - en: "Stative verbs take the present simple: I **know**. / I **want** a coffee."
        es: "Los verbos de estado van en presente simple: I **know**. / I **want** a coffee."
