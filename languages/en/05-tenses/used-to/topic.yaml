# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.tenses.used-to
lang: en
kind: grammar
tags: [verbs, tenses, past, habits]
concepts: [past-habits, past-tense]
related: [en.tenses.simple-tenses, en.tenses.continuous-tenses, en.sentence-building.questions-negatives, en.tenses.tense-map]
status: { en: draft }

title: { en: Used to }
summary:
  en: "Used to for past habits and states that are over now, such as living in Rome years ago. After did and didn't the verb is use to, without the d: **Did** you **use to** play? I **didn't use to** like fish."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: form, label: { en: Form } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A2, form: { en: Affirmative }, example: "I **used to play** football." }
        - { level: A2, form: { en: Negative }, example: "I **didn't use to play** football." }
        - { level: A2, form: { en: Question }, example: "**Did** you **use to play** football?" }
        - { level: A2, form: { en: Short answer }, example: "Yes, I **did**. / No, I **didn't**." }

sections:
  - title: { en: "Form: affirmative" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, subject: { en: all subjects }, form: used to + V, example: "She **used to live** in Rome." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The form is the same for every subject: I / he / they **used to** live here."
          - level: A2
            text:
              en: "**used to** is followed by the base verb: used to **play**."
          - level: A2
            text:
              en: "**used to** exists only in the past."

  - title: { en: "Form: negative" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, subject: { en: all subjects }, form: didn't use to + V, example: "We **didn't use to have** a car." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "After **didn't** the form is **use to**, with no -d."
          - level: A2
            text:
              en: "**never** also makes a negative: I **never used to** like fish."

  - title: { en: "Form: questions" }
    content:
      - type: table
        columns:
          - { key: aux, label: { en: Auxiliary + subject } }
          - { key: verb, label: { en: Verb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, aux: Did + subject, verb: use to + V, example: "**Did** you **use to walk** to school?" }
          - { level: A2, aux: wh-word + did + subject, verb: use to + V, example: "Where **did** you **use to live**?" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "After **Did** the form is **use to**, with no -d."
          - level: A2
            text:
              en: "A short answer repeats did: Yes, I **did**. / No, I **didn't**."

  - title: { en: "Pronunciation: used to" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: ipa, label: IPA }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: used to, ipa: "/ˈjuːst tə/", example: "I **used to** swim." }
          - { level: A2, form: use to, ipa: "/juːs tə/", example: "Did you **use to** swim?" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The **d** is silent in speech: used to sounds like *use-ta*."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: Past habits }, example: "I **used to walk** to school." }
          - { level: A2, use: { en: Past states }, example: "We **used to have** a dog." }
          - { level: A2, use: { en: Past situations that changed }, example: "There **used to be** a cinema here." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The habit or state is over now. The speaker compares past and present."

  - title: { en: Signal words }
    content:
      - type: table
        columns:
          - { key: expression, label: { en: Expression } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, expression: when I was a child / young, example: "**When I was a child**, I used to climb trees." }
          - { level: A2, expression: in those days, example: "People used to write letters **in those days**." }
          - { level: A2, expression: years ago, example: "I used to smoke **years ago**." }
          - { level: A2, expression: always / often / never, example: "He **always** used to be late." }
          - { level: A2, expression: but now, example: "I used to run, **but now** I swim." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**always**, **often** and **never** go before **used to**: He **always** used to be late."

  - title: { en: "Compare: used to vs past simple" }
    content:
      - type: table
        columns:
          - { key: used, label: Used to }
          - { key: simple, label: Past simple }
        rows:
          - { level: A2, used: { en: "past habits and states, over now" }, simple: { en: "finished actions, stated time or number" } }
          - { level: A2, used: { ex: "I **used to live** in Paris." }, simple: { ex: "I **lived** in Paris for two years." } }
          - { level: A2, used: { ex: "We **used to eat** out on Fridays." }, simple: { ex: "We **ate** out last Friday." } }
          - { level: A2, used: { ex: "**Did** you **use to** have a dog?" }, simple: { ex: "**Did** you **have** a dog last year?" } }
      - type: bullets
        items:
          - level: A2
            text:
              en: "A single event takes the past simple: I **visited** Rome in May."
          - level: A2
            text:
              en: "A habit with a time expression takes either form: I **played** football every Saturday."
          - level: A2
            text:
              en: "See [Past simple](id:en.tenses.simple-tenses)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: I use to play football., right: "I **used to** play football.", rule: { en: "affirmative → used to, with -d" } }
          - { level: A2, wrong: Did you used to play?, right: "Did you **use to** play?", rule: { en: "after did → use to" } }
          - { level: A2, wrong: I didn't used to like it., right: "I didn't **use to** like it.", rule: { en: "after didn't → use to" } }
          - { level: A2, wrong: I used to playing football., right: "I used to **play** football.", rule: { en: "used to + base verb" } }
