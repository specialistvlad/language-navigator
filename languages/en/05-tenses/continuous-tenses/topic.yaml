      columns:
        - { key: tense, label: { en: Tense, es: Tiempo }, merge: true, center: true }
        - { key: qh, group: { en: Question, es: Pregunta }, label: { en: Helper, es: Auxiliar }, merge: true, center: true }
        - { key: qs, group: { en: Question, es: Pregunta }, label: { en: Subject, es: Sujeto } }
        - { key: qv, group: { en: Question, es: Pregunta }, label: { en: Verb, es: Verbo }, merge: true, center: true }
        - { key: ss, group: { en: Statement, es: Afirmación }, label: { en: Subject, es: Sujeto } }
        - { key: sh, group: { en: Statement, es: Afirmación }, label: { en: Helper, es: Auxiliar }, merge: true, center: true }
        - { key: sv, group: { en: Statement, es: Afirmación }, label: { en: Verb, es: Verbo }, merge: true, center: true }
        - { key: ns, group: { en: Negative, es: Negativa }, label: { en: Subject, es: Sujeto } }
        - { key: nh, group: { en: Negative, es: Negativa }, label: { en: Helper, es: Auxiliar }, merge: true, center: true }
