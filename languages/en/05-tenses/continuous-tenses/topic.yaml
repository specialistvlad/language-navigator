sections:
  - title: { en: Overview }
    content:
      - type: text
        level: A1
        text:
          en: "Each continuous tense is **be** + verb + **-ing**: **will be** for the future, **am / is / are** for the present, **was / were** for the past."
      - type: bullets
        items:
          - level: A1
            text:
              en: "In questions be goes before the subject; in negatives it takes **not**: isn't, wasn't, won't be."
          - level: A1
            text:
              en: "The main verb always ends in **-ing**, in every tense and for every person."
          - level: A1
            text:
              en: "Be changes with the person in the present and past; **will be** is the same for everyone."
          - level: A1
            text:
              en: "Speech and messages use short forms: I'm, she's, they're, won't be."

  - title: { en: "The -ing form" }
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Verb ending } }
          - { key: rule, label: { en: Spelling } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A1, ending: { en: most verbs }, rule: + ing, examples: work → working / play → playing / go → going }
          - { level: A1, ending: "-e", rule: { en: drop e + ing }, examples: make → making / write → writing / come → coming }
          - { level: A1, ending: "-ee", rule: + ing, examples: see → seeing / agree → agreeing }
          - { level: A1, ending: "-ie", rule: ie → ying, examples: lie → lying / die → dying }
          - { level: A1, ending: { en: "1 vowel + 1 consonant, one syllable" }, rule: { en: double the consonant + ing }, examples: run → running / sit → sitting / swim → swimming }
          - { level: A1, ending: "-w, -x, -y", rule: { en: "+ ing, single consonant" }, examples: show → showing / fix → fixing / stay → staying }

  - title: { en: "Present continuous: form" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, subject: I, form: am / 'm + V-ing, example: "I'**m reading**." }
          - { level: A1, subject: he / she / it, form: is / 's + V-ing, example: "He'**s reading**." }
          - { level: A1, subject: you / we / they, form: are / 're + V-ing, example: "They'**re reading**." }
          - { level: A1, subject: { en: singular noun }, form: is + V-ing, example: "My sister **is reading**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A short answer repeats be; the positive answer takes the full form:"
            ex: "Are you working? — Yes, I **am**. / No, I'**m not**."
          - level: A1
            text:
              en: "A wh-word goes first: wh-word + am / is / are + subject + V-ing."
            ex: "What **are** you **doing**?"

  - title: { en: "Present continuous: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Actions happening now }, example: "I'**m cooking** dinner." }
          - { level: A1, use: { en: Temporary situations }, example: "I'**m staying** with my sister this week." }
          - { level: A1, use: { en: "Changes and trends around now" }, example: "Prices **are going** up." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Time words: now, right now, at the moment, today, this week, Look!"
            ex: "**Look!** It's snow**ing**."
          - level: A1
            text:
              en: "Plans and arrangements for the future: see [Future forms](id:en.tenses.future-forms)."

  - title: { en: "Past continuous: form" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, subject: I / he / she / it, form: was + V-ing, example: "She **was reading**." }
          - { level: A2, subject: you / we / they, form: were + V-ing, example: "We **were reading**." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "A short answer repeats was / were:"
            ex: "Were you sleeping? — Yes, I **was**. / No, I **wasn't**."
          - level: A2
            text:
              en: "A wh-word goes first: wh-word + was / were + subject + V-ing."
            ex: "What **were** you **doing** at 8?"

  - title: { en: "Past continuous: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: In progress at a past moment }, example: "At 8 o'clock I **was having** dinner." }
          - { level: A2, use: { en: Background to a story }, example: "The sun **was shining** and children **were playing**." }
          - { level: A2, use: { en: "Interrupted action (when + past simple)" }, example: "I **was cooking** when the phone **rang**." }
          - { level: A2, use: { en: "Two actions at the same time (while)" }, example: "While I **was cooking**, he **was watching** TV." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**while** comes before the long action; **when** comes before the short action that interrupts it."

  - title: { en: "Future continuous: form and use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, use: { en: "In progress at a future moment" }, example: "This time tomorrow I'**ll be flying** to Rome." }
          - { level: B1, use: { en: "Polite questions about plans" }, example: "**Will** you **be using** the car tonight?" }
      - type: bullets
        items:
          - level: B1
            text:
              en: "Time words: this time tomorrow, at 8 tonight, all day tomorrow."

  - title: { en: Stative verbs }
    content:
      - type: text
        level: A1
        text:
          en: "Verbs for states take the simple tenses, also for what is true right now."
      - type: table
        columns:
          - { key: group, label: { en: Group } }
          - { key: verbs, label: { en: Verbs } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, group: { en: Feelings }, verbs: "like, love, hate, want, need, prefer", example: { ex: "I **want** a coffee." } }
          - { level: A1, group: { en: Thinking }, verbs: { en: "know, think (= believe), understand, remember, mean" }, example: { ex: "I **understand** you." } }
          - { level: A2, group: { en: Possession }, verbs: { en: "have (= own), own, belong" }, example: { ex: "This bag **belongs** to me." } }
          - { level: A2, group: { en: "Senses, being" }, verbs: "see, hear, seem, cost", example: { ex: "It **costs** £10." } }

  - title: { en: "Compare: continuous and simple" }
    content:
      - type: table
        columns:
          - { key: continuous, label: { en: Continuous } }
          - { key: simple, label: { en: Simple } }
        rows:
          - { level: A1, continuous: { en: "in progress, temporary" }, simple: { en: "habit, fact, finished event" } }
          - { level: A1, continuous: { ex: "I'**m drinking** tea now." }, simple: { ex: "I **drink** tea every day." } }
          - { level: A1, continuous: { ex: "What **are** you **doing**? (= now)" }, simple: { ex: "What **do** you **do**? (= your job)" } }
          - { level: A2, continuous: { ex: "I **was walking** home…" }, simple: { ex: "…when I **saw** Tom." } }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Simple forms: [Simple Tenses](id:en.tenses.simple-tenses)."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: She working now., right: "She **is working** now.", rule: { en: "be is required" } }
          - { level: A1, wrong: I am work now., right: "I'm **working** now.", rule: { en: "be + V-ing" } }
          - { level: A1, wrong: What you are doing?, right: "What **are you** doing?", rule: { en: "be goes before the subject" } }
          - { level: A1, wrong: Does she working?, right: "**Is** she working?", rule: { en: "questions start with be" } }
          - { level: A1, wrong: He is runing., right: "He is **running**.", rule: { en: "one vowel + one consonant → double it" } }
          - { level: A1, wrong: I am knowing the answer., right: "I **know** the answer.", rule: { en: "stative verbs → simple tenses" } }
          - { level: A2, wrong: "When I was walking home, I was seeing an accident.", right: "…I **saw** an accident.", rule: { en: "short interrupting action → past simple" } }
          - { level: A2, wrong: We was playing., right: "We **were** playing.", rule: { en: "you / we / they → were" } }
          - { level: B1, wrong: I will flying tomorrow., right: "I **will be flying** tomorrow.", rule: { en: "will be + V-ing" } }
