        - { level: A2, tense: { en: Past, es: Pasado }, qh: "**Was**", qs: "I", qv: "work**ing**?", ss: "I", sh: "**was**", sv: "work**ing**.", ns: "I", nh: "**wasn't**", nv: "work**ing**." }
        - { level: A2, tense: { en: Past, es: Pasado }, qh: "**Were**", qs: "you", qv: "work**ing**?", ss: "You", sh: "**were**", sv: "work**ing**.", ns: "You", nh: "**weren't**", nv: "work**ing**." }
        - { level: A2, tense: { en: Past, es: Pasado }, qh: "**Was**", qs: "he", qv: "work**ing**?", ss: "He", sh: "**was**", sv: "work**ing**.", ns: "He", nh: "**wasn't**", nv: "work**ing**." }
        - { level: A2, tense: { en: Past, es: Pasado }, qh: "**Was**", qs: "she", qv: "work**ing**?", ss: "She", sh: "**was**", sv: "work**ing**.", ns: "She", nh: "**wasn't**", nv: "work**ing**." }
        - { level: A2, tense: { en: Past, es: Pasado }, qh: "**Was**", qs: "it", qv: "work**ing**?", ss: "It", sh: "**was**", sv: "work**ing**.", ns: "It", nh: "**wasn't**", nv: "work**ing**." }
        - { level: A2, tense: { en: Past, es: Pasado }, qh: "**Were**", qs: "we", qv: "work**ing**?", ss: "We", sh: "**were**", sv: "work**ing**.", ns: "We", nh: "**weren't**", nv: "work**ing**." }
