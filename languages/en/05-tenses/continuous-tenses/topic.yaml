title: { en: Continuous Tenses, es: Tiempos continuos }
summary:
  en: "Present, past and future continuous: be plus the verb with -ing for actions in progress at a moment. Every continuous form needs be before the -ing verb: She **is reading** now. **Was** she **reading**?"
  es: "Presente, pasado y futuro continuo: be más el verbo con -ing para acciones en curso en un momento. Estar + gerundio es be + verbo con -ing, y be nunca se omite: I **am reading** now. They **were playing** outside."

cheatsheet:
