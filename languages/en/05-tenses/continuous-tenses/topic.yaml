        - { level: B1, tense: { en: Future, es: Futuro }, qh: "**Will**", qs: "you", qv: "**be** work**ing**?", ss: "You", sh: "**will be**", sv: "work**ing**.", ns: "You", nh: "**won't be**", nv: "work**ing**." }
        - { level: B1, tense: { en: Future, es: Futuro }, qh: "**Will**", qs: "he", qv: "**be** work**ing**?", ss: "He", sh: "**will be**", sv: "work**ing**.", ns: "He", nh: "**won't be**", nv: "work**ing**." }
        - { level: B1, tense: { en: Future, es: Futuro }, qh: "**Will**", qs: "she", qv: "**be** work**ing**?", ss: "She", sh: "**will be**", sv: "work**ing**.", ns: "She", nh: "**won't be**", nv: "work**ing**." }
        - { level: B1, tense: { en: Future, es: Futuro }, qh: "**Will**", qs: "it", qv: "**be** work**ing**?", ss: "It", sh: "**will be**", sv: "work**ing**.", ns: "It", nh: "**won't be**", nv: "work**ing**." }
        - { level: B1, tense: { en: Future, es: Futuro }, qh: "**Will**", qs: "we", qv: "**be** work**ing**?", ss: "We", sh: "**will be**", sv: "work**ing**.", ns: "We", nh: "**won't be**", nv: "work**ing**." }
        - { level: B1, tense: { en: Future, es: Futuro }, qh: "**Will**", qs: "they", qv: "**be** work**ing**?", ss: "They", sh: "**will be**", sv: "work**ing**.", ns: "They", nh: "**won't be**", nv: "work**ing**." }
        - { tense: { en: Present, es: Presente }, qh: "**Am**", qs: "I", qv: "work**ing**?", ss: "I", sh: "**am**", sv: "work**ing**.", ns: "I", nh: "**am not**", nv: "work**ing**." }
        - { tense: { en: Present, es: Presente }, qh: "**Are**", qs: "you", qv: "work**ing**?", ss: "You", sh: "**are**", sv: "work**ing**.", ns: "You", nh: "**aren't**", nv: "work**ing**." }
        - { tense: { en: Present, es: Presente }, qh: "**Is**", qs: "he", qv: "work**ing**?", ss: "He", sh: "**is**", sv: "work**ing**.", ns: "He", nh: "**isn't**", nv: "work**ing**." }
        - { tense: { en: Present, es: Presente }, qh: "**Is**", qs: "she", qv: "work**ing**?", ss: "She", sh: "**is**", sv: "work**ing**.", ns: "She", nh: "**isn't**", nv: "work**ing**." }
        - { tense: { en: Present, es: Presente }, qh: "**Is**", qs: "it", qv: "work**ing**?", ss: "It", sh: "**is**", sv: "work**ing**.", ns: "It", nh: "**isn't**", nv: "work**ing**." }
        - { tense: { en: Present, es: Presente }, qh: "**Are**", qs: "we", qv: "work**ing**?", ss: "We", sh: "**are**", sv: "work**ing**.", ns: "We", nh: "**aren't**", nv: "work**ing**." }
