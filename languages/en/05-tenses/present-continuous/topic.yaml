# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.tenses.present-continuous
lang: en
kind: grammar
levels: [A1]
tags: [verbs, tenses, present, continuous]
concepts: [present-tense, continuous]
related: [en.tenses.present-simple, en.verbs.to-be, en.tenses.future-forms, en.sentence-building.questions-negatives, en.tenses.tense-map]
status: { en: draft, es: draft }

title: { en: Present Continuous, es: Presente continuo (present continuous) }
summary:
  en: Actions happening now, temporary situations and changes around now.
  es: Acciones que ocurren ahora, situaciones temporales y cambios en curso.

sections:
  - title: { en: Overview, es: Resumen }
    level: A1
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form, es: Forma } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { form: { en: Affirmative, es: Afirmativa }, example: "She **is working**.", tr: { es: "Está trabajando." } }
          - { form: { en: Negative, es: Negativa }, example: "She **isn't working**.", tr: { es: "No está trabajando." } }
          - { form: { en: Question, es: Pregunta }, example: "**Is** she **working**?", tr: { es: "¿Está trabajando?" } }
          - { form: { en: Short answer, es: Respuesta corta }, example: "Yes, she **is**. / No, she **isn't**.", tr: { es: "Sí. / No." } }
      - type: bullets
        items:
          - { for: [es], text: { es: "I'm working = *estoy trabajando*. El sujeto siempre aparece." } }

  - title: { en: "Form: affirmative", es: "Forma: afirmativa" }
    level: A1
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto } }
          - { key: form, label: { en: Form, es: Forma } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { subject: I, form: am + V-ing, example: "I'**m reading**.", tr: { es: "Estoy leyendo." } }
          - { subject: he / she / it, form: is + V-ing, example: "He'**s reading**.", tr: { es: "Está leyendo." } }
          - { subject: you / we / they, form: are + V-ing, example: "They'**re reading**.", tr: { es: "Están leyendo." } }
          - { subject: { en: singular noun, es: sustantivo singular }, form: is + V-ing, example: "My sister **is reading**.", tr: { es: "Mi hermana está leyendo." } }
          - { subject: { en: plural noun, es: sustantivo plural }, form: are + V-ing, example: "The children **are reading**.", tr: { es: "Los niños están leyendo." } }
      - type: bullets
        items:
          - en: "V-ing = base verb + -ing: read → reading. See Spelling below."
            es: "V-ing = verbo base + -ing: read → reading. Ver Ortografía más abajo."
          - en: "Speech and messages use the short forms **'m**, **'s**, **'re**."
            es: "En la conversación y en los mensajes se usan las formas cortas **'m**, **'s**, **'re**."
          - { for: [es], text: { es: "*Estoy leyendo* → I'm reading. Los dos verbos aparecen: be + V-ing." } }

  - title: { en: "Form: negative", es: "Forma: negativa" }
    level: A1
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject, es: Sujeto } }
          - { key: form, label: { en: Form, es: Forma } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { subject: I, form: "'m not + V-ing", example: "I'**m not sleeping**.", tr: { es: "No estoy durmiendo." } }
          - { subject: he / she / it, form: "isn't / 's not + V-ing", example: "He **isn't sleeping**.", tr: { es: "No está durmiendo." } }
          - { subject: you / we / they, form: "aren't / 're not + V-ing", example: "We **aren't sleeping**.", tr: { es: "No estamos durmiendo." } }
      - type: bullets
        items:
          - en: "**not** goes after am / is / are. The verb keeps -ing."
            es: "**not** va después de am / is / are. El verbo mantiene -ing."
          - { for: [es], text: { es: "El *no* español delante del verbo → **not** detrás de be: *No estoy durmiendo* → I'm **not** sleeping." } }

  - title: { en: "Form: questions", es: "Forma: preguntas" }
    level: A1
    content:
      - type: table
        columns:
          - { key: aux, label: { en: "Be + subject", es: "Be + sujeto" } }
          - { key: verb, label: { en: Verb, es: Verbo } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { aux: Am + I, verb: V-ing, example: "**Am** I **talking** too fast?", tr: { es: "¿Hablo demasiado rápido?" } }
          - { aux: Is + he / she / it, verb: V-ing, example: "**Is** she **working** today?", tr: { es: "¿Trabaja hoy?" } }
          - { aux: Are + you / we / they, verb: V-ing, example: "**Are** you **listening**?", tr: { es: "¿Estás escuchando?" } }
      - type: text
        text:
          en: "Wh-questions: **wh-word + am / is / are + subject + V-ing**"
          es: "Preguntas con palabra interrogativa: **wh-word + am / is / are + sujeto + V-ing**"
      - type: table
        columns:
          - { key: word, label: { en: Wh-word, es: Palabra } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { word: What, example: "What **are** you **doing**?", tr: { es: "¿Qué estás haciendo?" } }
          - { word: Where, example: "Where **is** he **going**?", tr: { es: "¿Adónde va?" } }
          - { word: Who, example: "Who **are** they **waiting** for?", tr: { es: "¿A quién están esperando?" } }
      - type: bullets
        items:
          - en: "A question starts with **am / is / are**: be + subject + V-ing."
            es: "La pregunta empieza con **am / is / are**: be + sujeto + V-ing."

  - title: { en: "Form: short answers", es: "Forma: respuestas cortas" }
    level: A1
    content:
      - type: table
        columns:
          - { key: question, label: { en: Question, es: Pregunta } }
          - { key: "yes", label: { en: "Yes", es: Sí } }
          - { key: "no", label: { en: "No", es: "No" } }
        rows:
          - { question: Are you working?, "yes": "Yes, I **am**.", "no": "No, I'**m not**." }
          - { question: Is he working?, "yes": "Yes, he **is**.", "no": "No, he **isn't**." }
          - { question: Are they working?, "yes": "Yes, they **are**.", "no": "No, they **aren't**." }
      - type: bullets
        items:
          - en: "A short answer repeats am / is / are from the question. The positive answer takes the full form."
            es: "La respuesta corta repite am / is / are de la pregunta: *¿Estás trabajando? — Sí.* → Yes, I **am**."

  - title: { en: "Spelling: -ing", es: "Ortografía: -ing" }
    level: A1
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Verb ending, es: Terminación } }
          - { key: rule, label: { en: Rule, es: Regla } }
          - { key: examples, label: { en: Examples, es: Ejemplos } }
        rows:
          - { ending: { en: most verbs, es: la mayoría de los verbos }, rule: + ing, examples: work → working / play → playing / go → going }
          - { ending: "-e", rule: { en: drop e + ing, es: quita la e + ing }, examples: make → making / write → writing / come → coming }
          - { ending: "-ee", rule: + ing, examples: see → seeing / agree → agreeing }
          - { ending: "-ie", rule: ie → ying, examples: lie → lying / die → dying / tie → tying }
          - { ending: { en: "1 vowel + 1 consonant, one syllable", es: "1 vocal + 1 consonante, una sílaba" }, rule: { en: double the consonant + ing, es: dobla la consonante + ing }, examples: run → running / sit → sitting / swim → swimming }
          - { ending: "-w, -x, -y", rule: { en: no doubling, es: no se dobla }, examples: show → showing / fix → fixing / stay → staying }

  - title: { en: Use, es: Uso }
    level: A1
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use, es: Uso } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { use: { en: Actions happening now, es: Acciones que ocurren ahora }, example: "I'**m cooking** dinner.", tr: { es: "Estoy preparando la cena." } }
          - { use: { en: Temporary situations, es: Situaciones temporales }, example: "I'**m staying** with my sister this week.", tr: { es: "Esta semana me alojo en casa de mi hermana." } }
          - { use: { en: "Changes and trends around now", es: "Cambios y tendencias actuales" }, example: "Prices **are going** up.", tr: { es: "Los precios están subiendo." } }
      - type: bullets
        items:
          - en: "Plans and arrangements for the future: see [Future forms](id:en.tenses.future-forms)."
            es: "Planes y citas acordadas para el futuro: ver [Formas de futuro (future forms)](id:en.tenses.future-forms)."
          - { for: [es], text: { es: "El español usa el presente más que el gerundio: *Llueve* = It's raining. *Salgo ahora* = I'm leaving now." } }

  - title: { en: Signal words, es: Palabras clave }
    level: A1
    content:
      - type: table
        columns:
          - { key: expression, label: { en: Expression, es: Expresión } }
          - { key: example, label: { en: Example, es: Ejemplo } }
        rows:
          - { expression: now / right now, example: "I'm eating **now**.", tr: { es: "ahora / ahora mismo" } }
          - { expression: at the moment, example: "She's working **at the moment**.", tr: { es: "en este momento" } }
          - { expression: today / tonight, example: "It's raining **today**.", tr: { es: "hoy / esta noche" } }
          - { expression: this week / this month / this year, example: "He's studying **this week**.", tr: { es: "esta semana / este mes / este año" } }
          - { expression: Look! / Listen!, example: "**Look!** It's snowing.", tr: { es: "¡Mira! / ¡Escucha!" } }
      - type: bullets
        items:
          - en: "Time expressions go at the end of the sentence, or at the start."
            es: "Las expresiones de tiempo van al final de la frase, o al principio."

  - title: { en: Stative verbs, es: Verbos de estado }
    level: A1
    content:
      - type: bullets
        items:
          - text:
              en: "Verbs for feelings, thinking and possession take the present simple, also for now:"
              es: "Los verbos de sentimientos, pensamiento y posesión van en presente simple, también para ahora:"
            ex: "I **want** a coffee. / She **knows** the answer."
            tr: { es: "Quiero un café. / Sabe la respuesta." }
          - en: "The full list is in [Present simple](id:en.tenses.present-simple)."
            es: "La lista completa está en [Presente simple (present simple)](id:en.tenses.present-simple)."

  - title: { en: "Compare: present continuous vs present simple", es: "Comparación: present continuous y present simple" }
    level: A1
    content:
      - type: table
        columns:
          - { key: continuous, label: Present continuous }
          - { key: simple, label: Present simple }
        rows:
          - { continuous: { en: "now, temporary situations", es: "ahora, situaciones temporales" }, simple: { en: "habits, permanent situations", es: "hábitos, situaciones permanentes" } }
          - { continuous: { ex: "I'**m drinking** tea now.", tr: { es: "Ahora estoy tomando té." } }, simple: { ex: "I **drink** tea every day.", tr: { es: "Tomo té todos los días." } } }
          - { continuous: { ex: "He'**s living** in Leeds this year.", tr: { es: "Este año vive en Leeds." } }, simple: { ex: "He **lives** in Leeds.", tr: { es: "Vive en Leeds." } } }
          - { continuous: { ex: "What **are** you **doing**? (= now)", tr: { es: "¿Qué estás haciendo?" } }, simple: { ex: "What **do** you **do**? (= your job)", tr: { es: "¿A qué te dedicas?" } } }
      - type: bullets
        items:
          - { for: [es], text: { es: "El presente español cubre los dos: *trabajo* = I work / I'm working." } }
          - en: "See [Present simple](id:en.tenses.present-simple)."
            es: "Ver [Presente simple (present simple)](id:en.tenses.present-simple)."

  - title: { en: Typical errors, es: Errores típicos }
    level: A1
    content:
      - type: errors
        audience: true
        rows:
          - { wrong: She working now., right: "She **is working** now.", rule: { en: "be is required: am / is / are + V-ing", es: "be es obligatorio: am / is / are + V-ing" } }
          - { wrong: I am work now., right: "I'm **working** now.", rule: { en: "be + V-ing", es: "be + V-ing" } }
          - { for: [es], wrong: Be quiet! The baby sleeps., right: "Be quiet! The baby **is sleeping**.", rule: { es: "acción en curso ahora → present continuous" } }
          - { for: [es], wrong: I no am working., right: "I'**m not** working.", rule: { es: "negativa: be + not + V-ing" } }
          - { wrong: What you are doing?, right: "What **are you** doing?", rule: { en: "be goes before the subject", es: "be va antes del sujeto: wh-word + be + sujeto + V-ing" } }
          - { for: [en], wrong: Does she working?, right: "**Is** she working?", rule: { en: "questions start with am / is / are" } }
          - { for: [en], wrong: He is runing., right: "He is **running**.", rule: { en: "one vowel + one consonant → double the consonant" } }
          - { for: [en], wrong: She is makeing tea., right: "She is **making** tea.", rule: { en: "drop -e before -ing" } }
          - { for: [es], wrong: "Are you working? — Yes, I'm.", right: "Yes, I **am**.", rule: { es: "la respuesta corta afirmativa usa la forma completa" } }
          - { wrong: I am knowing the answer., right: "I **know** the answer.", rule: { en: "stative verbs → present simple", es: "verbos de estado → presente simple" } }
          - { wrong: Water is boiling at 100 °C., right: "Water **boils** at 100 °C.", rule: { en: "habits → present simple", es: "hábitos → presente simple" } }

essentials:
  - level: A1
    parts:
      - title: { en: Form, es: Forma }
        content:
          - type: table
            columns:
              - { key: form, label: { en: Form, es: Forma } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { form: +, example: "I'**m working**. / She **is working**. / They **are working**." }
              - { form: −, example: "I'**m not working**. / She **isn't working**." }
              - { form: "?", example: "**Is** she **working**? / What **are** you **doing**?" }
              - { form: { en: Short answer, es: Respuesta corta }, example: "Yes, I **am**. / No, she **isn't**." }
      - title: { en: Key rules, es: Reglas clave }
        content:
          - type: bullets
            items:
              - en: "am / is / are + **V-ing**. The subject and be always appear."
                es: "am / is / are + **V-ing**. El sujeto y be siempre aparecen."
              - en: "Spelling: make → making, run → running, lie → lying."
                es: "Ortografía: make → making, run → running, lie → lying."
              - en: "Questions and negatives use be: **Is** she working? / She **isn't** working."
                es: "Preguntas y negativas usan be: **Is** she working? / She **isn't** working."
              - en: "Stative verbs take the present simple: I **know**. / I **want** a coffee."
                es: "Los verbos de estado van en presente simple: I **know**. / I **want** a coffee."
      - title: { en: Use, es: Uso }
        content:
          - type: table
            columns:
              - { key: use, label: { en: Use, es: Uso } }
              - { key: example, label: { en: Example, es: Ejemplo } }
            rows:
              - { use: { en: "now (now, at the moment)", es: "ahora (now, at the moment)" }, example: "I'**m cooking** dinner.", tr: { es: "Estoy preparando la cena." } }
              - { use: { en: "temporary (this week)", es: "temporal (this week)" }, example: "I'**m staying** with my sister.", tr: { es: "Me alojo en casa de mi hermana." } }
              - { use: { en: "changes (trends)", es: "cambios (tendencias)" }, example: "Prices **are going** up.", tr: { es: "Los precios están subiendo." } }
      - title: { en: Top errors, es: Errores principales }
        content:
          - type: errors
            rows:
              - { wrong: She working now., right: "She **is working** now." }
              - { for: [es], wrong: Be quiet! The baby sleeps., right: "Be quiet! The baby **is sleeping**." }
              - { wrong: What you are doing?, right: "What **are you** doing?" }
              - { wrong: I am knowing the answer., right: "I **know** the answer." }

reminders:
  - level: A1
    items:
      - en: "am / is / are + V-ing: She **is working**."
        es: "am / is / are + V-ing: She **is working**."
      - en: "Stative verbs take the present simple: I **know**."
        es: "Los verbos de estado van en presente simple: I **know**."
      - { for: [es], text: { es: "Ahora = present continuous: Now I'**m working**." } }
