sections:
  - title: { en: Overview }
    content:
      - type: text
        level: A2
        text:
          en: "Each perfect tense is **have** + past participle: **have / has** for the present, **had** for the past."
      - type: bullets
        items:
          - level: A2
            text:
              en: "In questions the helper goes before the subject; in negatives it takes **not**: haven't, hasn't, hadn't."
          - level: A2
            text:
              en: "The main verb is always the past participle: worked, seen, gone."
          - level: A2
            text:
              en: "**has** goes with he, she, it; **had** is the same for everyone."
          - level: A2
            text:
              en: "Short forms: I've, she's (= she has), I'd (= I had)."

  - title: { en: The past participle }
    content:
      - type: table
        columns:
          - { key: type, label: { en: Type } }
          - { key: rule, label: { en: Rule } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A2, type: { en: regular verbs }, rule: "V + -ed", examples: work → worked / live → lived / study → studied }
          - { level: A2, type: { en: "irregular, same as past simple" }, rule: { en: "participle = past simple form" }, examples: have → had / buy → bought / meet → met }
          - { level: A2, type: { en: "irregular, own form" }, rule: { en: "learn each one" }, examples: see → seen / write → written / eat → eaten / do → done }
          - { level: A2, type: "go, be", rule: { en: "go has two participles" }, examples: go → gone / been · be → been }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The -ed spelling is the same as in the past simple: see [Simple Tenses](id:en.tenses.simple-tenses)."
          - level: A2
            text:
              en: "All irregular forms: [Irregular verbs table](id:en.verbs.irregular-verbs-table)."

  - title: { en: "Present perfect: form" }
    content:
      - type: bullets
        items:
          - level: A2
            text:
              en: "A short answer repeats have / has:"
            ex: "Have you met Tom? — Yes, I **have**. / No, I **haven't**."
          - level: A2
            text:
              en: "**ever**, **never**, **just** and **already** go between have / has and the participle:"
            ex: "I'**ve never** seen snow. / He'**s just** left."
          - level: A2
            text:
              en: "**yet** goes at the end, in negatives and questions:"
            ex: "I haven't finished **yet**. / Have you finished **yet**?"
          - level: B1
            text:
              en: "**How long** asks about the length of a state up to now:"
            ex: "How long **have** you **lived** here?"

  - title: { en: "Present perfect: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Life experience, no time given" }, example: "I'**ve been** to Paris twice." }
          - { level: A2, use: { en: "Recent news" }, example: "I'**ve just seen** Anna." }
          - { level: A2, use: { en: "Result visible now" }, example: "I'**ve lost** my keys." }
          - { level: A2, use: { en: "Unfinished time (today, this week)" }, example: "I'**ve had** three coffees today." }
          - { level: B1, use: { en: "A state from the past up to now (for, since)" }, example: "She'**s lived** here since 2019." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**been** = went and came back; **gone** = went and is still there:"
            ex: "She'**s been** to Spain. / She'**s gone** to Spain."
          - level: B1
            text:
              en: "**for** takes a length of time; **since** takes a starting point:"
            ex: "I've known her **for** ten years / **since** 2015."

  - title: { en: "Past perfect: form" }
    content:
      - type: bullets
        items:
          - level: B1
            text:
              en: "A short answer repeats had:"
            ex: "Had they left? — Yes, they **had**. / No, they **hadn't**."
          - level: B1
            text:
              en: "**already**, **just** and **never** go between had and the participle:"
            ex: "I'**d never** flown before."

  - title: { en: "Past perfect: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: B1, use: { en: "An action before another past action" }, example: "When I got home, she **had** already **cooked**." }
          - { level: B1, use: { en: "An action before a past time" }, example: "By 8 o'clock he **had left**." }
          - { level: B1, use: { en: "The reason for a past situation" }, example: "He was tired. He **had worked** all night." }
      - type: bullets
        items:
          - level: B1
            text:
              en: "Time words: when, after, before, by the time, already."
          - level: B1
            text:
              en: "The story itself takes the past simple; the past perfect looks back from it."

  - title: { en: "Compare: present perfect and past simple" }
    content:
      - type: table
        columns:
          - { key: perfect, label: Present perfect }
          - { key: simple, label: { en: Past simple } }
        rows:
          - { level: A2, perfect: { en: "past event, time open or unfinished" }, simple: { en: "finished time, stated or known" } }
          - { level: A2, perfect: { ex: "I'**ve seen** that film." }, simple: { ex: "I **saw** it last night." } }
          - { level: A2, perfect: "ever, never, just, already, yet", simple: "yesterday, last week, ago" }
      - type: bullets
        items:
          - level: A2
            text:
              en: "A finished-time word (yesterday, last week, ago) takes the past simple."
          - level: A2
            text:
              en: "US: the past simple is common with just, already and yet: I **just ate**."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: I have seen him yesterday., right: "I **saw** him yesterday.", rule: { en: "finished time → past simple" } }
          - { level: B1, wrong: I live here since 2010., right: "I **have lived** here since 2010.", rule: { en: "since / for + state up to now → present perfect" } }
          - { level: A2, wrong: She has went home., right: "She has **gone** home.", rule: { en: "have / has + past participle" } }
          - { level: A2, wrong: She have lost her keys., right: "She **has** lost her keys.", rule: { en: "he / she / it → has" } }
          - { level: A2, wrong: I have gone to Paris twice., right: "I have **been** to Paris twice.", rule: { en: "a visit and return → been" } }
          - { level: B1, wrong: "When I arrived, the film has already started.", right: "When I arrived, the film **had** already **started**.", rule: { en: "earlier past action → had + participle" } }
          - { level: B1, wrong: Had you saw him?, right: "Had you **seen** him?", rule: { en: "after had use the past participle" } }
