# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.tenses.perfect-tenses
lang: en
kind: grammar
tags: [verbs, tenses, perfect, present perfect, past perfect]
concepts: [present-perfect, past-perfect]
related: [en.tenses.tense-map, en.tenses.simple-tenses, en.tenses.continuous-tenses, en.verbs.irregular-verbs-table, en.sentence-building.questions-negatives]
status: { en: draft }

title: { en: Perfect Tenses }
summary:
  lead: { en: "Present perfect and past perfect: have, has or had plus the past participle for an earlier event seen from a later point." }
  rule: { en: "A finished time such as yesterday or ago takes the past simple:" }
  ex: { examples: [["I ", { target: saw }, " her yesterday."], ["I ", { target: have seen }, " her today."]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: tense, label: { en: Tense } }
        - { key: qh, slot: aux, features: { interrogativity: int, polarity: pos } }
        - { key: qs, slot: subj, features: { interrogativity: int, polarity: pos } }
        - { key: qv, slot: verb, features: { interrogativity: int, polarity: pos } }
        - { key: ss, slot: subj, features: { interrogativity: decl, polarity: pos } }
        - { key: sh, slot: aux, features: { interrogativity: decl, polarity: pos } }
        - { key: sv, slot: verb, features: { interrogativity: decl, polarity: pos } }
        - { key: ns, slot: subj, features: { interrogativity: decl, polarity: neg } }
        - { key: nh, slot: aux, features: { interrogativity: decl, polarity: neg } }
        - { key: nv, slot: verb, features: { interrogativity: decl, polarity: neg } }
      rows:
        - { level: A2, features: { tense: prs, aspect: prf, person: 1, number: sg }, tense: { en: Present perfect }, qh: { aux: Have }, qs: I, qv: [work, { ending: ed }, "?"], ss: I, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: I, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 2 }, tense: { en: Present perfect }, qh: { aux: Have }, qs: you, qv: [work, { ending: ed }, "?"], ss: You, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: You, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: sg, gender: masc }, tense: { en: Present perfect }, qh: { aux: Has }, qs: he, qv: [work, { ending: ed }, "?"], ss: He, sh: { aux: has }, sv: [work, { ending: ed }, "."], ns: He, nh: { aux: hasn't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: sg, gender: fem }, tense: { en: Present perfect }, qh: { aux: Has }, qs: she, qv: [work, { ending: ed }, "?"], ss: She, sh: { aux: has }, sv: [work, { ending: ed }, "."], ns: She, nh: { aux: hasn't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: sg, gender: neut }, tense: { en: Present perfect }, qh: { aux: Has }, qs: it, qv: [work, { ending: ed }, "?"], ss: It, sh: { aux: has }, sv: [work, { ending: ed }, "."], ns: It, nh: { aux: hasn't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 1, number: pl }, tense: { en: Present perfect }, qh: { aux: Have }, qs: we, qv: [work, { ending: ed }, "?"], ss: We, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: We, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: A2, features: { tense: prs, aspect: prf, person: 3, number: pl }, tense: { en: Present perfect }, qh: { aux: Have }, qs: they, qv: [work, { ending: ed }, "?"], ss: They, sh: { aux: have }, sv: [work, { ending: ed }, "."], ns: They, nh: { aux: haven't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 1, number: sg }, tense: { en: Past perfect }, qh: { aux: Had }, qs: I, qv: [work, { ending: ed }, "?"], ss: I, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: I, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 2 }, tense: { en: Past perfect }, qh: { aux: Had }, qs: you, qv: [work, { ending: ed }, "?"], ss: You, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: You, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: sg, gender: masc }, tense: { en: Past perfect }, qh: { aux: Had }, qs: he, qv: [work, { ending: ed }, "?"], ss: He, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: He, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: sg, gender: fem }, tense: { en: Past perfect }, qh: { aux: Had }, qs: she, qv: [work, { ending: ed }, "?"], ss: She, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: She, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: sg, gender: neut }, tense: { en: Past perfect }, qh: { aux: Had }, qs: it, qv: [work, { ending: ed }, "?"], ss: It, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: It, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 1, number: pl }, tense: { en: Past perfect }, qh: { aux: Had }, qs: we, qv: [work, { ending: ed }, "?"], ss: We, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: We, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }
        - { level: B1, features: { tense: pst, aspect: prf, person: 3, number: pl }, tense: { en: Past perfect }, qh: { aux: Had }, qs: they, qv: [work, { ending: ed }, "?"], ss: They, sh: { aux: had }, sv: [work, { ending: ed }, "."], ns: They, nh: { aux: hadn't }, nv: [work, { ending: ed }, "."] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: prose
        level: A2
        text:
          en: ["Each perfect tense is ", { pattern: [{ term: have }, { slot: past participle }] }, ": ", { alternatives: [{ term: have }, { term: has }] }, " for the present, ", { term: had }, " for the past."]
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["In questions the helper goes before the subject; in negatives it takes ", { term: not }, ": haven't, hasn't, hadn't."]
          - type: rule
            level: A2
            text:
              en: "The main verb is always the past participle: worked, seen, gone."
          - type: rule
            level: A2
            text:
              en: [{ term: has }, " goes with he, she, it; ", { term: had }, " is the same for everyone."]
          - type: rule
            level: A2
            text:
              en: "Short forms: I've, she's (= she has), I'd (= I had)."

  - title: { en: The past participle }
    role: form
    content:
      - type: usage
        columns:
          - { key: type, label: { en: Type } }
          - { key: rule, label: { en: Rule } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A2, type: { en: regular verbs }, rule: { pattern: [{ slot: V }, "-ed"] }, ex: { examples: [{ mapping: [work, worked] }, { mapping: [live, lived] }, { mapping: [study, studied] }] } }
          - { level: A2, type: { en: "irregular, same as past simple" }, rule: { en: participle = past simple form }, ex: { examples: [{ mapping: [have, had] }, { mapping: [buy, bought] }, { mapping: [meet, met] }] } }
          - { level: A2, type: { en: "irregular, own form" }, rule: { en: learn each one }, ex: { examples: [{ mapping: [see, seen] }, { mapping: [write, written] }, { mapping: [eat, eaten] }, { mapping: [do, done] }] } }
          - { level: A2, type: "go, be", rule: { en: go has two participles }, ex: { examples: [{ mapping: [go, { examples: [gone, been] }] }, { mapping: [be, been] }] } }
      - type: list
        items:
          - type: note
            level: A2
            text:
              en: ["The -ed spelling is the same as in the past simple: see ", { link: Simple Tenses, to: en.tenses.simple-tenses }, "."]
          - type: note
            level: A2
            text:
              en: ["All irregular forms: ", { link: Irregular verbs table, to: en.verbs.irregular-verbs-table }, "."]

  - title: { en: "Present perfect: form" }
    role: form
    features: { tense: prs, aspect: prf }
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["A short answer repeats ", { alternatives: [have, has] }, ":"]
            ex: { exchange: [Have you met Tom?, { alternatives: [["Yes, I ", { target: have }, "."], ["No, I ", { target: haven't }, "."]] }] }
          - type: rule
            level: A2
            text:
              en: [{ term: ever }, ", ", { term: never }, ", ", { term: just }, " and ", { term: already }, " go between ", { alternatives: [have, has] }, " and the participle:"]
            ex: { examples: [[I', { target: ve never }, " seen snow."], [He', { target: s just }, " left."]] }
          - type: rule
            level: A2
            text:
              en: [{ term: yet }, " goes at the end, in negatives and questions:"]
            ex: { examples: [["I haven't finished ", { target: yet }, "."], ["Have you finished ", { target: yet }, "?"]] }
          - type: rule
            level: B1
            text:
              en: [{ term: How long }, " asks about the length of a state up to now:"]
            ex: ["How long ", { target: have }, " you ", { target: lived }, " here?"]

  - title: { en: "Present perfect: use" }
    role: use
    features: { tense: prs, aspect: prf }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "Life experience, no time given" }, ex: [I', { target: ve been }, " to Paris twice."] }
          - { level: A2, use: { en: Recent news }, ex: [I', { target: ve just seen }, " Anna."] }
          - { level: A2, use: { en: Result visible now }, ex: [I', { target: ve lost }, " my keys."] }
          - { level: A2, use: { en: "Unfinished time (today, this week)" }, ex: [I', { target: ve had }, " three coffees today."] }
          - { level: B1, use: { en: "A state from the past up to now (for, since)" }, ex: [She', { target: s lived }, " here since ", { date: "2019", value: "2019" }, "."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: been }, " = went and came back; ", { term: gone }, " = went and is still there:"]
            ex: { examples: [[She', { target: s been }, " to Spain."], [She', { target: s gone }, " to Spain."]] }
          - type: rule
            level: B1
            text:
              en: [{ term: for }, " takes a length of time; ", { term: since }, " takes a starting point:"]
            ex: ["I've known her ", { alternatives: [[{ target: for }, " ten years"], [{ target: since }, " ", { date: "2015", value: "2015" }]] }, "."]

  - title: { en: "Past perfect: form" }
    role: form
    features: { tense: pst, aspect: prf }
    content:
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "A short answer repeats had:"
            ex: { exchange: [Had they left?, { alternatives: [["Yes, they ", { target: had }, "."], ["No, they ", { target: hadn't }, "."]] }] }
          - type: rule
            level: B1
            text:
              en: [{ term: already }, ", ", { term: just }, " and ", { term: never }, " go between had and the participle:"]
            ex: [I', { target: d never }, " flown before."]

  - title: { en: "Past perfect: use" }
    role: use
    features: { tense: pst, aspect: prf }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: B1, use: { en: An action before another past action }, ex: ["When I got home, she ", { target: had }, " already ", { target: cooked }, "."] }
          - { level: B1, use: { en: An action before a past time }, ex: ["By 8 o'clock he ", { target: had left }, "."] }
          - { level: B1, use: { en: The reason for a past situation }, ex: ["He was tired. He ", { target: had worked }, " all night."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: "Time words: when, after, before, by the time, already."
          - type: rule
            level: B1
            text:
              en: The story itself takes the past simple; the past perfect looks back from it.

  - title: { en: "Compare: present perfect and past simple" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: perfect, label: Present perfect, features: { tense: prs, aspect: prf } }
          - { key: simple, label: { en: Past simple }, features: { tense: pst } }
        rows:
          - { level: A2, perfect: { en: "past event, time open or unfinished" }, simple: { en: "finished time, stated or known" } }
          - { level: A2, perfect: [I', { target: ve seen }, " that film."], simple: ["I ", { target: saw }, " it last night."] }
          - { level: A2, perfect: "ever, never, just, already, yet", simple: "yesterday, last week, ago" }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "A finished-time word (yesterday, last week, ago) takes the past simple."
          - type: note
            level: A2
            variety: en-US
            text:
              en: "the past simple is common with just, already and yet:"
            ex: ["I ", { target: just ate }, "."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: I have seen him yesterday., right: ["I ", { target: saw }, " him yesterday."], rule: { en: { takes: [finished time, past simple] } } }
          - { level: B1, wrong: ["I live here since ", { date: "2010", value: "2010" }, "."], right: ["I ", { target: have lived }, " here since ", { date: "2010", value: "2010" }, "."], rule: { en: { mapping: [{ pattern: [{ alternatives: [since, for] }, state up to now] }, present perfect] } } }
          - { level: A2, wrong: She has went home., right: ["She has ", { target: gone }, " home."], rule: { en: { pattern: [{ alternatives: [have, has] }, { slot: past participle }] } } }
          - { level: A2, wrong: She have lost her keys., right: ["She ", { target: has }, " lost her keys."], rule: { en: { takes: [{ alternatives: [he, she, it] }, has] } } }
          - { level: A2, wrong: I have gone to Paris twice., right: ["I have ", { target: been }, " to Paris twice."], rule: { en: { takes: [a visit and return, been] } } }
          - { level: B1, wrong: "When I arrived, the film has already started.", right: ["When I arrived, the film ", { target: had }, " already ", { target: started }, "."], rule: { en: { takes: [earlier past action, { pattern: [had, participle] }] } } }
          - { level: B1, wrong: Had you saw him?, right: ["Had you ", { target: seen }, " him?"], rule: { en: after had use the past participle } }
