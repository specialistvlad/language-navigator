# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.tenses.simple-tenses
lang: en
kind: grammar
tags: [verbs, tenses, simple, present, past, future]
concepts: [present-tense, past-tense, future]
related: [en.tenses.tense-map, en.verbs.to-be, en.verbs.irregular-verbs-table, en.tenses.future-forms, en.tenses.used-to, en.sentence-building.questions-negatives, en.adjectives-adverbs.adverbs-frequency-manner]
status: { en: draft }

title: { en: Simple Tenses }
summary:
  lead: { en: "Past, present and future simple: do or does, did and will make questions and negatives, and the main verb stays in its base form." }
  rule: { en: "Once a helper appears, the main verb loses -s and -ed:" }
  ex: { examples: [["She ", { target: doesn't like }, " tea."], [{ target: Did }, " he ", { target: go }, "?"]] }

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: tense, label: { en: Tense } }
        - { key: qh, slot: aux, features: { interrogativity: int, polarity: pos } }
        - { key: qs, slot: subj, features: { interrogativity: int, polarity: pos } }
        - { key: qv, slot: verb, features: { interrogativity: int, polarity: pos } }
        - { key: ss, slot: subj, features: { interrogativity: decl, polarity: pos } }
        - { key: sh, slot: aux, features: { interrogativity: decl, polarity: pos } }
        - { key: sv, slot: verb, features: { interrogativity: decl, polarity: pos } }
        - { key: ns, slot: subj, features: { interrogativity: decl, polarity: neg } }
        - { key: nh, slot: aux, features: { interrogativity: decl, polarity: neg } }
        - { key: nv, slot: verb, features: { interrogativity: decl, polarity: neg } }
      rows:
        - { level: A2, features: { tense: fut, person: 1, number: sg }, tense: { en: Future }, qh: { aux: Will }, qs: I, qv: work?, ss: I, sh: { aux: will }, sv: work., ns: I, nh: { aux: won't }, nv: work. }
        - { level: A2, features: { tense: fut, person: 2 }, tense: { en: Future }, qh: { aux: Will }, qs: you, qv: work?, ss: You, sh: { aux: will }, sv: work., ns: You, nh: { aux: won't }, nv: work. }
        - { level: A2, features: { tense: fut, person: 3, number: sg, gender: masc }, tense: { en: Future }, qh: { aux: Will }, qs: he, qv: work?, ss: He, sh: { aux: will }, sv: work., ns: He, nh: { aux: won't }, nv: work. }
        - { level: A2, features: { tense: fut, person: 3, number: sg, gender: fem }, tense: { en: Future }, qh: { aux: Will }, qs: she, qv: work?, ss: She, sh: { aux: will }, sv: work., ns: She, nh: { aux: won't }, nv: work. }
        - { level: A2, features: { tense: fut, person: 3, number: sg, gender: neut }, tense: { en: Future }, qh: { aux: Will }, qs: it, qv: work?, ss: It, sh: { aux: will }, sv: work., ns: It, nh: { aux: won't }, nv: work. }
        - { level: A2, features: { tense: fut, person: 1, number: pl }, tense: { en: Future }, qh: { aux: Will }, qs: we, qv: work?, ss: We, sh: { aux: will }, sv: work., ns: We, nh: { aux: won't }, nv: work. }
        - { level: A2, features: { tense: fut, person: 3, number: pl }, tense: { en: Future }, qh: { aux: Will }, qs: they, qv: work?, ss: They, sh: { aux: will }, sv: work., ns: They, nh: { aux: won't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 1, number: sg }, tense: { en: Present }, qh: { aux: Do }, qs: I, qv: work?, ss: I, sv: work., ns: I, nh: { aux: don't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 2 }, tense: { en: Present }, qh: { aux: Do }, qs: you, qv: work?, ss: You, sv: work., ns: You, nh: { aux: don't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 3, number: sg, gender: masc }, tense: { en: Present }, qh: { aux: Does }, qs: he, qv: work?, ss: He, sv: [work, { ending: s }, "."], ns: He, nh: { aux: doesn't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 3, number: sg, gender: fem }, tense: { en: Present }, qh: { aux: Does }, qs: she, qv: work?, ss: She, sv: [work, { ending: s }, "."], ns: She, nh: { aux: doesn't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 3, number: sg, gender: neut }, tense: { en: Present }, qh: { aux: Does }, qs: it, qv: work?, ss: It, sv: [work, { ending: s }, "."], ns: It, nh: { aux: doesn't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 1, number: pl }, tense: { en: Present }, qh: { aux: Do }, qs: we, qv: work?, ss: We, sv: work., ns: We, nh: { aux: don't }, nv: work. }
        - { level: A1, features: { tense: prs, person: 3, number: pl }, tense: { en: Present }, qh: { aux: Do }, qs: they, qv: work?, ss: They, sv: work., ns: They, nh: { aux: don't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 1, number: sg }, tense: { en: Past }, qh: { aux: Did }, qs: I, qv: work?, ss: I, sv: [work, { ending: ed }, "."], ns: I, nh: { aux: didn't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 2 }, tense: { en: Past }, qh: { aux: Did }, qs: you, qv: work?, ss: You, sv: [work, { ending: ed }, "."], ns: You, nh: { aux: didn't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 3, number: sg, gender: masc }, tense: { en: Past }, qh: { aux: Did }, qs: he, qv: work?, ss: He, sv: [work, { ending: ed }, "."], ns: He, nh: { aux: didn't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 3, number: sg, gender: fem }, tense: { en: Past }, qh: { aux: Did }, qs: she, qv: work?, ss: She, sv: [work, { ending: ed }, "."], ns: She, nh: { aux: didn't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 3, number: sg, gender: neut }, tense: { en: Past }, qh: { aux: Did }, qs: it, qv: work?, ss: It, sv: [work, { ending: ed }, "."], ns: It, nh: { aux: didn't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 1, number: pl }, tense: { en: Past }, qh: { aux: Did }, qs: we, qv: work?, ss: We, sv: [work, { ending: ed }, "."], ns: We, nh: { aux: didn't }, nv: work. }
        - { level: A1, features: { tense: pst, person: 3, number: pl }, tense: { en: Past }, qh: { aux: Did }, qs: they, qv: work?, ss: They, sv: [work, { ending: ed }, "."], ns: They, nh: { aux: didn't }, nv: work. }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: prose
        level: A1
        text:
          en: ["Each simple tense has a helper verb: ", { term: will }, " for the future, ", { alternatives: [{ term: do }, { term: does }] }, " for the present, ", { term: did }, " for the past."]
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["In questions the helper goes before the subject; in negatives it takes ", { term: not }, ": don't, doesn't, didn't, won't."]
          - type: rule
            level: A1
            text:
              en: "After every helper the main verb is in the base form:"
            ex: { examples: [["Does she ", { target: work }, "?"], ["She didn't ", { target: work }, "."]] }
          - type: rule
            level: A1
            text:
              en: ["Present and past statements have no helper: the verb itself takes ", { term: "-s" }, " (he, she, it) or ", { term: "-ed" }, "."]
          - type: rule
            level: A1
            text:
              en: [{ term: will }, " and ", { term: did }, " are the same for every person; only the present changes with he, she, it."]
          - type: note
            level: A1
            text:
              en: [{ term: be }, " has its own forms: ", { alternatives: [am, is, are] }, ", ", { alternatives: [was, were] }, ". See ", { link: To be, to: en.verbs.to-be }, "."]

  - title: { en: "Present simple: form" }
    role: form
    features: { tense: prs }
    content:
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: verb, label: { en: Verb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, features: [{ person: 1, number: sg }, { person: 2 }, { person: 1, number: pl }, { person: 3, number: pl }], subject: { alternatives: [I, you, we, they] }, verb: V, ex: ["I ", { target: live }, " in Madrid."] }
          - { level: A1, features: { person: 3, number: sg }, subject: { alternatives: [he, she, it] }, verb: V-s, ex: ["She ", { target: lives }, " in Madrid."] }
          - { level: A1, features: { person: 3, number: sg }, subject: { en: singular noun }, verb: V-s, ex: ["My brother ", { target: lives }, " in Madrid."] }
          - { level: A1, features: { person: 3, number: pl }, subject: { en: plural noun }, verb: V, ex: ["My parents ", { target: live }, " in Madrid."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A short answer repeats the helper:"
            ex: { exchange: [Do you like tea?, { alternatives: [["Yes, I ", { target: do }, "."], ["No, I ", { target: don't }, "."]] }] }
          - type: rule
            level: A1
            text:
              en: ["A wh-word goes first: ", { pattern: [{ slot: wh-word }, { alternatives: [do, does] }, { slot: subject }, { slot: verb }] }, "."]
            ex: ["Where ", { target: does }, " he ", { target: live }, "?"]
          - type: rule
            level: A2
            text:
              en: ["When ", { term: who }, " or ", { term: what }, " is the subject, the verb follows directly, with -s:"]
            ex: ["Who ", { target: lives }, " here?"]
          - type: note
            level: A1
            text:
              en: ["More question patterns: ", { link: Questions and negatives, to: en.sentence-building.questions-negatives }, "."]

  - title: { en: "Present simple: the -s ending" }
    role: own
    features: { tense: prs }
    content:
      - type: usage
        columns:
          - { key: ending, label: { en: Verb ending } }
          - { key: rule, label: { en: Spelling } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A1, ending: { en: most verbs }, rule: { pattern: [{ ending: s }], follows: true }, ex: { examples: [{ mapping: [work, works] }, { mapping: [read, reads] }] } }
          - { level: A1, ending: "-s, -ss, -sh, -ch, -x, -z", rule: { pattern: [{ ending: es }], follows: true }, ex: { examples: [{ mapping: [pass, passes] }, { mapping: [wash, washes] }, { mapping: [watch, watches] }, { mapping: [fix, fixes] }] } }
          - { level: A1, ending: "-o", rule: { pattern: [{ ending: es }], follows: true }, ex: { examples: [{ mapping: [go, goes] }, { mapping: [do, does] }] } }
          - { level: A1, ending: { en: { pattern: [{ slot: consonant }, "y"] } }, rule: { mapping: ["y", ies] }, ex: { examples: [{ mapping: [study, studies] }, { mapping: [try, tries] }] } }
          - { level: A1, ending: { en: { pattern: [{ slot: vowel }, "y"] } }, rule: { pattern: [{ ending: s }], follows: true }, ex: { examples: [{ mapping: [play, plays] }, { mapping: [buy, buys] }] } }
          - { level: A1, ending: have, rule: { en: own form }, ex: { mapping: [have, has] } }
      - type: usage
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: after, label: { en: After } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A2, sound: { ipa: s }, after: { en: ["voiceless sounds ", { ipa: p t k f θ }] }, ex: { examples: [["stops ", { ipa: stɒps }], ["works ", { ipa: wɜːks }], ["laughs ", { ipa: lɑːfs }]] } }
          - { level: A2, sound: { ipa: z }, after: { en: voiced sounds and vowels }, ex: { examples: [["lives ", { ipa: lɪvz }], ["plays ", { ipa: pleɪz }], ["goes ", { ipa: ɡəʊz }]] } }
          - { level: A2, sound: { ipa: ɪz }, after: { ipa: s z ʃ tʃ dʒ }, ex: { examples: [["washes ", { ipa: ˈwɒʃɪz }], ["watches ", { ipa: ˈwɒtʃɪz }], ["uses ", { ipa: ˈjuːzɪz }]] } }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Three verbs change their vowel sound: does ", { ipa: dʌz }, ", says ", { ipa: sez }, ", has ", { ipa: hæz }, "."]

  - title: { en: "Present simple: use" }
    role: use
    features: { tense: prs }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Habits and routines }, ex: ["I ", { target: get up }, " at 7."] }
          - { level: A1, use: { en: Facts and general truths }, ex: ["Water ", { target: boils }, " at 100 °C."] }
          - { level: A1, use: { en: Permanent states }, ex: ["She ", { target: lives }, " in London."] }
          - { level: A1, use: { en: "Likes, dislikes, opinions" }, ex: { examples: [["I ", { target: like }, " coffee."], ["I ", { target: think }, " so."]] } }
          - { level: A1, use: { en: Jobs and regular activities }, ex: ["He ", { target: teaches }, " maths."] }
          - { level: A2, use: { en: Timetables and schedules (future) }, ex: ["The train ", { target: leaves }, " at ", { time: "6:15", value: "06:15" }, "."] }
          - { level: A2, use: { en: Instructions and directions }, ex: ["You ", { target: turn }, " left at the bank."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Frequency adverbs go before the main verb and after be:"
            ex: { examples: [["I ", { target: often }, " walk to work."], ["She is ", { target: always }, " late."]] }
          - type: rule
            level: A1
            text:
              en: "Time expressions go at the end:"
            ex: { examples: [["I swim ", { target: every day }, "."], ["She works late ", { target: ["on ", { weekday: Mondays, value: 1 }] }, "."]] }
          - type: rule
            level: A2
            text:
              en: "Verbs for states take the present simple, also for now:"
            ex: { examples: [["I ", { target: know }, " the answer."], ["I ", { target: want }, " a coffee."]] }
          - type: note
            level: A1
            text:
              en: ["All frequency adverbs: ", { link: Adverbs of frequency and manner, to: en.adjectives-adverbs.adverbs-frequency-manner }, "."]

  - title: { en: "Past simple: form" }
    role: form
    features: { tense: pst }
    content:
      - type: list
        items:
          - type: note
            level: A1
            text:
              en: [{ term: be }, " has its own past, with no helper: ", { alternatives: [was, were] }, ". See ", { link: To be, to: en.verbs.to-be }, "."]
            ex: { examples: [["I ", { target: was }, " at home."], [{ target: Were }, " you there?"]] }
      - type: prose
        level: A1
        text:
          en: "Every other verb has one past form for every person:"
      - type: usage
        columns:
          - { key: type, label: { en: Verb type } }
          - { key: form, label: { en: Form } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, type: { en: regular }, form: V-ed, ex: ["I ", { target: watched }, " TV."] }
          - { level: A1, type: { en: irregular }, form: { en: own form }, ex: ["I ", { target: saw }, " a film."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "A short answer repeats the helper:"
            ex: { exchange: [Did you like it?, { alternatives: [["Yes, I ", { target: did }, "."], ["No, I ", { target: didn't }, "."]] }] }
          - type: rule
            level: A1
            text:
              en: ["A wh-word goes first: ", { pattern: [{ slot: wh-word }, did, { slot: subject }, { slot: verb }] }, "."]
            ex: ["Where ", { target: did }, " they ", { target: go }, "?"]
          - type: rule
            level: A2
            text:
              en: ["When ", { term: who }, " or ", { term: what }, " is the subject, the verb is in the past directly:"]
            ex: { examples: [["Who ", { target: called }, " you?"], ["What ", { target: happened }, "?"]] }

  - title: { en: "Past simple: the -ed ending" }
    role: own
    features: { tense: pst }
    content:
      - type: usage
        columns:
          - { key: ending, label: { en: Verb ending } }
          - { key: rule, label: { en: Spelling } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A1, ending: { en: most verbs }, rule: { pattern: [{ ending: ed }], follows: true }, ex: { examples: [{ mapping: [work, worked] }, { mapping: [watch, watched] }, { mapping: [visit, visited] }] } }
          - { level: A1, ending: "-e", rule: { pattern: [{ ending: d }], follows: true }, ex: { examples: [{ mapping: [live, lived] }, { mapping: [like, liked] }, { mapping: [arrive, arrived] }] } }
          - { level: A1, ending: { en: { pattern: [{ slot: consonant }, "y"] } }, rule: { mapping: ["y", ied] }, ex: { examples: [{ mapping: [study, studied] }, { mapping: [try, tried] }] } }
          - { level: A1, ending: { en: { pattern: [{ slot: vowel }, "y"] } }, rule: { pattern: [{ ending: ed }], follows: true }, ex: { examples: [{ mapping: [play, played] }, { mapping: [stay, stayed] }] } }
          - { level: A1, ending: { en: { pattern: ["1 vowel", "1 consonant, one syllable"] } }, rule: { en: { pattern: [double the consonant, ed] } }, ex: { examples: [{ mapping: [stop, stopped] }, { mapping: [plan, planned] }] } }
      - type: usage
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: after, label: { en: After } }
          - { key: ex, label: { en: Examples } }
        rows:
          - { level: A2, sound: { ipa: t }, after: { en: ["voiceless sounds ", { ipa: p k f s ʃ tʃ θ }] }, ex: { examples: [["stopped ", { ipa: stɒpt }], ["worked ", { ipa: wɜːkt }], ["watched ", { ipa: wɒtʃt }]] } }
          - { level: A2, sound: { ipa: d }, after: { en: voiced sounds and vowels }, ex: { examples: [["lived ", { ipa: lɪvd }], ["played ", { ipa: pleɪd }], ["opened ", { ipa: ˈəʊpənd }]] } }
          - { level: A2, sound: { ipa: ɪd }, after: { ipa: t d }, ex: { examples: [["wanted ", { ipa: ˈwɒntɪd }], ["needed ", { ipa: ˈniːdɪd }], ["visited ", { ipa: ˈvɪzɪtɪd }]] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["The ending adds a syllable only after ", { ipa: t }, " and ", { ipa: d }, ": wanted has two syllables, worked has one."]

  - title: { en: "Past simple: irregular verbs" }
    role: own
    features: { tense: pst }
    content:
      - type: paradigm
        columns:
          - { key: base, label: { en: Base verb }, features: { verbform: inf } }
          - { key: past, label: { en: Past simple }, features: { tense: pst } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, base: go, past: went, ex: ["We ", { target: went }, " home."] }
          - { level: A1, base: have, past: had, ex: ["I ", { target: had }, " lunch."] }
          - { level: A1, base: do, past: did, ex: ["She ", { target: did }, " her homework."] }
          - { level: A1, base: see, past: saw, ex: ["I ", { target: saw }, " Tom."] }
          - { level: A1, base: get, past: got, ex: ["He ", { target: got }, " a letter."] }
          - { level: A1, base: make, past: made, ex: ["They ", { target: made }, " a cake."] }
          - { level: A1, base: take, past: took, ex: ["I ", { target: took }, " a taxi."] }
          - { level: A1, base: come, past: came, ex: ["She ", { target: came }, " late."] }
          - { level: A1, base: eat, past: ate, ex: ["We ", { target: ate }, " pizza."] }
          - { level: A1, base: buy, past: bought, ex: ["I ", { target: bought }, " a coat."] }
          - { level: A1, base: say, past: said, ex: ["He ", { target: said }, " hello."] }
          - { level: A1, base: write, past: wrote, ex: ["I ", { target: wrote }, " an email."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["The irregular form is only for statements; questions and negatives take ", { pattern: [did, { slot: base verb }] }, ":"]
            ex: ["Did you ", { target: go }, "?"]
          - type: note
            level: A1
            text:
              en: ["More verbs: ", { link: Irregular verbs table, to: en.verbs.irregular-verbs-table }, "."]

  - title: { en: "Past simple: use" }
    role: use
    features: { tense: pst }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Finished actions at a stated past time }, ex: ["I ", { target: visited }, " Paris last year."] }
          - { level: A1, use: { en: Past states }, ex: ["She ", { target: was }, " ill on ", { weekday: Monday, value: 1 }, "."] }
          - { level: A1, use: { en: Sequences of events }, ex: ["I ", { target: got up }, ", ", { target: had }, " a shower and ", { target: left }, "."] }
          - { level: A2, use: { en: Past habits that are over }, ex: ["When I was a child, I ", { target: played }, " outside every day."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: ["Time words: yesterday, last week, in 2020, two years ago. ", { term: ago }, " comes after the period:"]
            ex: ["She left two days ", { target: ago }, "."]
          - type: note
            level: A2
            text:
              en: ["Past habits also take ", { term: used to }, ": see ", { link: Used to, to: en.tenses.used-to }, "."]

  - title: { en: "Future simple: form" }
    role: form
    features: { tense: fut }
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: structure, label: { en: Structure } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, features: { polarity: pos, interrogativity: decl }, form: "+", structure: { pattern: [{ alternatives: [will, "'ll"] }, { slot: V }] }, ex: [I', { target: ll help }, " you."] }
          - { level: A2, features: { polarity: neg, interrogativity: decl }, form: "−", structure: { pattern: [{ alternatives: [will not, won't] }, { slot: V }] }, ex: ["He ", { target: won't come }, "."] }
          - { level: A2, features: { polarity: pos, interrogativity: int }, form: "?", structure: { pattern: [will, { slot: subject }, { slot: V }] }, ex: [{ target: Will }, " she ", { target: come }, "?"] }
          - { level: A2, features: { interrogativity: decl, polarity: [pos, neg] }, form: { en: Short answer }, structure: { alternatives: ["Yes, I will.", "No, I won't."] }, ex: { exchange: [[{ target: Will }, " you call?"], ["Yes, I ", { target: will }, "."]] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Speech and messages use ", { term: "'ll" }, " and ", { term: won't }, ": 'll is ", { ipa: l }, " after a vowel, ", { ipa: əl }, " after a consonant; won't is ", { ipa: wəʊnt }, "."]

  - title: { en: "Future simple: use" }
    role: use
    features: { tense: fut }
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, use: { en: Decision at the moment of speaking }, ex: [It's cold. I', { target: ll close }, " the window."] }
          - { level: A2, use: { en: Offers }, ex: [I', { target: ll carry }, " your bag."] }
          - { level: A2, use: { en: Promises }, ex: ["I ", { target: won't tell }, " anyone."] }
          - { level: A2, use: { en: Opinions and predictions (I think) }, ex: [I think she', { target: ll win }, "."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: probably }, " goes after will and before won't:"]
            ex: { examples: [["It will ", { target: probably }, " rain."], ["It ", { target: probably }, " won't rain."]] }
          - type: note
            level: A2
            text:
              en: ["Plans and arrangements take going to or the present continuous: see ", { link: Future forms, to: en.tenses.future-forms }, "."]

  - title: { en: "Compare: past, present and future" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: past, label: { en: Past simple }, features: { tense: pst } }
          - { key: present, label: { en: Present simple }, features: { tense: prs } }
          - { key: future, label: { en: Future simple }, features: { tense: fut } }
        rows:
          - { level: A2, past: did, present: { alternatives: [do, does] }, future: will }
          - { level: A2, past: "yesterday, last week, ago", present: ["every day, usually, on ", { weekday: Mondays, value: 1 }], future: "tomorrow, next week, soon" }
          - { level: A2, past: ["I ", { target: worked }, " yesterday."], present: ["I ", { target: work }, " every day."], future: [I', { target: ll work }, " tomorrow."] }
          - { level: A2, past: [{ target: Did }, " she ", { target: call }, "?"], present: [{ target: Does }, " she ", { target: call }, "?"], future: [{ target: Will }, " she ", { target: call }, "?"] }
          - { level: A2, past: ["He ", { target: didn't }, " come."], present: ["He ", { target: doesn't }, " come."], future: ["He ", { target: won't }, " come."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: She work here., right: ["She ", { target: works }, " here."], rule: { en: { takes: [{ alternatives: [he, she, it] }, V-s] } } }
          - { level: A1, wrong: He doesn't works., right: ["He doesn't ", { target: work }, "."], rule: { en: { pattern: [{ slot: helper }, { slot: base verb }] } } }
          - { level: A1, wrong: Where you live?, right: ["Where ", { target: do }, " you live?"], rule: { en: questions need a helper } }
          - { level: A1, wrong: Did you went there?, right: ["Did you ", { target: go }, " there?"], rule: { en: { pattern: [did, { slot: base verb }] } } }
          - { level: A1, wrong: She didn't called., right: ["She didn't ", { target: call }, "."], rule: { en: { pattern: [didn't, { slot: base verb }] } } }
          - { level: A1, wrong: I goed home., right: ["I ", { target: went }, " home."], rule: { en: { mapping: [go, went (irregular verb)] } } }
          - { level: A1, wrong: Did he was late?, right: [{ target: Was }, " he late?"], rule: { en: be makes questions by itself } }
          - { level: A2, wrong: He will goes., right: ["He will ", { target: go }, "."], rule: { en: { pattern: [will, { slot: base verb }] } } }
          - { level: A2, wrong: Do you will come?, right: [{ target: Will }, " you come?"], rule: { en: will makes questions by itself } }
