status: { en: draft }

title: { en: Simple Tenses }
summary:
  en: "Past, present and future simple: do or does, did and will make questions and negatives, and the main verb stays in its base form. Once a helper appears, the main verb loses -s and -ed: She **doesn't like** tea. **Did** he **go**?"

cheatsheet:
  content:
    - type: table
      columns:
        - { key: tense, label: { en: Tense }, merge: true, center: true }
        - { key: qh, group: { en: Question }, label: { en: Helper }, merge: true, center: true }
        - { key: qs, group: { en: Question }, label: { en: Subject } }
        - { key: qv, group: { en: Question }, label: { en: Verb }, merge: true, center: true }
        - { key: ss, group: { en: Statement }, label: { en: Subject } }
        - { key: sh, group: { en: Statement }, label: { en: Helper }, merge: true, center: true }
        - { key: sv, group: { en: Statement }, label: { en: Verb }, merge: true, center: true }
        - { key: ns, group: { en: Negative }, label: { en: Subject } }
        - { key: nh, group: { en: Negative }, label: { en: Helper }, merge: true, center: true }
        - { key: nv, group: { en: Negative }, label: { en: Verb }, merge: true, center: true }
      rows:
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "I", qv: "work?", ss: "I", sh: "**will**", sv: "work.", ns: "I", nh: "**won't**", nv: "work." }
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "you", qv: "work?", ss: "You", sh: "**will**", sv: "work.", ns: "You", nh: "**won't**", nv: "work." }
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "he", qv: "work?", ss: "He", sh: "**will**", sv: "work.", ns: "He", nh: "**won't**", nv: "work." }
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "she", qv: "work?", ss: "She", sh: "**will**", sv: "work.", ns: "She", nh: "**won't**", nv: "work." }
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "it", qv: "work?", ss: "It", sh: "**will**", sv: "work.", ns: "It", nh: "**won't**", nv: "work." }
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "we", qv: "work?", ss: "We", sh: "**will**", sv: "work.", ns: "We", nh: "**won't**", nv: "work." }
        - { level: A2, tense: { en: Future }, qh: "**Will**", qs: "they", qv: "work?", ss: "They", sh: "**will**", sv: "work.", ns: "They", nh: "**won't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Do**", qs: "I", qv: "work?", ss: "I", sv: "work.", ns: "I", nh: "**don't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Do**", qs: "you", qv: "work?", ss: "You", sv: "work.", ns: "You", nh: "**don't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Does**", qs: "he", qv: "work?", ss: "He", sv: "work**s**.", ns: "He", nh: "**doesn't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Does**", qs: "she", qv: "work?", ss: "She", sv: "work**s**.", ns: "She", nh: "**doesn't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Does**", qs: "it", qv: "work?", ss: "It", sv: "work**s**.", ns: "It", nh: "**doesn't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Do**", qs: "we", qv: "work?", ss: "We", sv: "work.", ns: "We", nh: "**don't**", nv: "work." }
        - { level: A1, tense: { en: Present }, qh: "**Do**", qs: "they", qv: "work?", ss: "They", sv: "work.", ns: "They", nh: "**don't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "I", qv: "work?", ss: "I", sv: "work**ed**.", ns: "I", nh: "**didn't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "you", qv: "work?", ss: "You", sv: "work**ed**.", ns: "You", nh: "**didn't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "he", qv: "work?", ss: "He", sv: "work**ed**.", ns: "He", nh: "**didn't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "she", qv: "work?", ss: "She", sv: "work**ed**.", ns: "She", nh: "**didn't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "it", qv: "work?", ss: "It", sv: "work**ed**.", ns: "It", nh: "**didn't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "we", qv: "work?", ss: "We", sv: "work**ed**.", ns: "We", nh: "**didn't**", nv: "work." }
        - { level: A1, tense: { en: Past }, qh: "**Did**", qs: "they", qv: "work?", ss: "They", sv: "work**ed**.", ns: "They", nh: "**didn't**", nv: "work." }

sections:
  - title: { en: Overview }
    content:
      - type: text
        level: A1
        text:
          en: "Each simple tense has a helper verb: **will** for the future, **do / does** for the present, **did** for the past."
      - type: bullets
        items:
          - level: A1
            text:
              en: "In questions the helper goes before the subject; in negatives it takes **not**: don't, doesn't, didn't, won't."
          - level: A1
            text:
              en: "After every helper the main verb is in the base form: Does she **work**? / She didn't **work**."
          - level: A1
            text:
              en: "Present and past statements have no helper: the verb itself takes **-s** (he, she, it) or **-ed**."
          - level: A1
            text:
              en: "**will** and **did** are the same for every person; only the present changes with he, she, it."
          - level: A1
            text:
              en: "**be** has its own forms: am / is / are, was / were. See [To be](id:en.verbs.to-be)."

  - title: { en: "Present simple: form" }
    content:
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: verb, label: { en: Verb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, subject: I / you / we / they, verb: V, example: "I **live** in Madrid." }
          - { level: A1, subject: he / she / it, verb: V-s, example: "She **lives** in Madrid." }
          - { level: A1, subject: { en: singular noun }, verb: V-s, example: "My brother **lives** in Madrid." }
          - { level: A1, subject: { en: plural noun }, verb: V, example: "My parents **live** in Madrid." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A short answer repeats the helper:"
            ex: "Do you like tea? — Yes, I **do**. / No, I **don't**."
          - level: A1
            text:
              en: "A wh-word goes first: wh-word + do / does + subject + verb."
            ex: "Where **does** he **live**?"
          - level: A2
            text:
              en: "When **who** or **what** is the subject, the verb follows directly, with -s:"
            ex: "Who **lives** here?"
          - level: A1
            text:
              en: "More question patterns: [Questions and negatives](id:en.sentence-building.questions-negatives)."

  - title: { en: "Present simple: the -s ending" }
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Verb ending } }
          - { key: rule, label: { en: Spelling } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A1, ending: { en: most verbs }, rule: + s, examples: work → works / read → reads }
          - { level: A1, ending: "-s, -ss, -sh, -ch, -x, -z", rule: + es, examples: pass → passes / wash → washes / watch → watches / fix → fixes }
          - { level: A1, ending: "-o", rule: + es, examples: go → goes / do → does }
          - { level: A1, ending: { en: consonant + y }, rule: y → ies, examples: study → studies / try → tries }
          - { level: A1, ending: { en: vowel + y }, rule: + s, examples: play → plays / buy → buys }
          - { level: A1, ending: have, rule: { en: own form }, examples: have → has }
      - type: table
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: after, label: { en: After } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A2, sound: /s/, after: { en: "voiceless sounds /p t k f θ/" }, examples: stops /stɒps/ / works /wɜːks/ / laughs /lɑːfs/ }
          - { level: A2, sound: /z/, after: { en: voiced sounds and vowels }, examples: lives /lɪvz/ / plays /pleɪz/ / goes /ɡəʊz/ }
          - { level: A2, sound: /ɪz/, after: /s z ʃ tʃ dʒ/, examples: washes /ˈwɒʃɪz/ / watches /ˈwɒtʃɪz/ / uses /ˈjuːzɪz/ }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Three verbs change their vowel sound: does /dʌz/, says /sez/, has /hæz/."

  - title: { en: "Present simple: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Habits and routines }, example: "I **get up** at 7." }
          - { level: A1, use: { en: Facts and general truths }, example: "Water **boils** at 100 °C." }
          - { level: A1, use: { en: Permanent states }, example: "She **lives** in London." }
          - { level: A1, use: { en: "Likes, dislikes, opinions" }, example: "I **like** coffee. / I **think** so." }
          - { level: A1, use: { en: Jobs and regular activities }, example: "He **teaches** maths." }
          - { level: A2, use: { en: "Timetables and schedules (future)" }, example: "The train **leaves** at 6:15." }
          - { level: A2, use: { en: Instructions and directions }, example: "You **turn** left at the bank." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Frequency adverbs go before the main verb and after be:"
            ex: "I **often** walk to work. / She is **always** late."
          - level: A1
            text:
              en: "Time expressions go at the end:"
            ex: "I swim **every day**. / She works late **on Mondays**."
          - level: A2
            text:
              en: "Verbs for states take the present simple, also for now:"
            ex: "I **know** the answer. / I **want** a coffee."
          - level: A1
            text:
              en: "All frequency adverbs: [Adverbs of frequency and manner](id:en.adjectives-adverbs.adverbs-frequency-manner)."

  - title: { en: "Past simple: form" }
    content:
      - type: bullets
        items:
          - level: A1
            text:
              en: "**be** has its own past, with no helper: was / were. See [To be](id:en.verbs.to-be)."
            ex: "I **was** at home. / **Were** you there?"
      - type: text
        level: A1
        text:
          en: "Every other verb has one past form for every person:"
      - type: table
        columns:
          - { key: type, label: { en: Verb type } }
          - { key: form, label: { en: Form } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, type: { en: regular }, form: V-ed, example: "I **watched** TV." }
          - { level: A1, type: { en: irregular }, form: { en: own form }, example: "I **saw** a film." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "A short answer repeats the helper:"
            ex: "Did you like it? — Yes, I **did**. / No, I **didn't**."
          - level: A1
            text:
              en: "A wh-word goes first: wh-word + did + subject + verb."
            ex: "Where **did** they **go**?"
          - level: A2
            text:
              en: "When **who** or **what** is the subject, the verb is in the past directly:"
            ex: "Who **called** you? / What **happened**?"

  - title: { en: "Past simple: the -ed ending" }
    content:
      - type: table
        columns:
          - { key: ending, label: { en: Verb ending } }
          - { key: rule, label: { en: Spelling } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A1, ending: { en: most verbs }, rule: + ed, examples: work → worked / watch → watched / visit → visited }
          - { level: A1, ending: "-e", rule: + d, examples: live → lived / like → liked / arrive → arrived }
          - { level: A1, ending: { en: consonant + y }, rule: y → ied, examples: study → studied / try → tried }
          - { level: A1, ending: { en: vowel + y }, rule: + ed, examples: play → played / stay → stayed }
          - { level: A1, ending: { en: "1 vowel + 1 consonant, one syllable" }, rule: { en: double the consonant + ed }, examples: stop → stopped / plan → planned }
      - type: table
        columns:
          - { key: sound, label: { en: Sound } }
          - { key: after, label: { en: After } }
          - { key: examples, label: { en: Examples } }
        rows:
          - { level: A2, sound: /t/, after: { en: "voiceless sounds /p k f s ʃ tʃ θ/" }, examples: stopped /stɒpt/ / worked /wɜːkt/ / watched /wɒtʃt/ }
          - { level: A2, sound: /d/, after: { en: voiced sounds and vowels }, examples: lived /lɪvd/ / played /pleɪd/ / opened /ˈəʊpənd/ }
          - { level: A2, sound: /ɪd/, after: /t d/, examples: wanted /ˈwɒntɪd/ / needed /ˈniːdɪd/ / visited /ˈvɪzɪtɪd/ }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The ending adds a syllable only after /t/ and /d/: wanted has two syllables, worked has one."

  - title: { en: "Past simple: irregular verbs" }
    content:
      - type: table
        columns:
          - { key: base, label: { en: Base verb } }
          - { key: past, label: { en: Past simple } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, base: go, past: went, example: "We **went** home." }
          - { level: A1, base: have, past: had, example: "I **had** lunch." }
          - { level: A1, base: do, past: did, example: "She **did** her homework." }
          - { level: A1, base: see, past: saw, example: "I **saw** Tom." }
          - { level: A1, base: get, past: got, example: "He **got** a letter." }
          - { level: A1, base: make, past: made, example: "They **made** a cake." }
          - { level: A1, base: take, past: took, example: "I **took** a taxi." }
          - { level: A1, base: come, past: came, example: "She **came** late." }
          - { level: A1, base: eat, past: ate, example: "We **ate** pizza." }
          - { level: A1, base: buy, past: bought, example: "I **bought** a coat." }
          - { level: A1, base: say, past: said, example: "He **said** hello." }
          - { level: A1, base: write, past: wrote, example: "I **wrote** an email." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "The irregular form is only for statements; questions and negatives take did + base verb: Did you **go**?"
          - level: A1
            text:
              en: "More verbs: [Irregular verbs table](id:en.verbs.irregular-verbs-table)."

  - title: { en: "Past simple: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, use: { en: Finished actions at a stated past time }, example: "I **visited** Paris last year." }
          - { level: A1, use: { en: Past states }, example: "She **was** ill on Monday." }
          - { level: A1, use: { en: Sequences of events }, example: "I **got up**, **had** a shower and **left**." }
          - { level: A2, use: { en: Past habits that are over }, example: "When I was a child, I **played** outside every day." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Time words: yesterday, last week, in 2020, two years ago. **ago** comes after the period:"
            ex: "She left two days **ago**."
          - level: A2
            text:
              en: "Past habits also take *used to*: see [Used to](id:en.tenses.used-to)."

  - title: { en: "Future simple: form" }
    content:
      - type: table
        columns:
          - { key: form, label: { en: Form } }
          - { key: structure, label: { en: Structure } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, form: +, structure: "will / 'll + V", example: "I'**ll help** you." }
          - { level: A2, form: −, structure: "will not / won't + V", example: "He **won't come**." }
          - { level: A2, form: "?", structure: "will + subject + V", example: "**Will** she **come**?" }
          - { level: A2, form: { en: Short answer }, structure: "Yes, I will. / No, I won't.", example: "**Will** you call? — Yes, I **will**." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "Speech and messages use **'ll** and **won't**: 'll is /l/ after a vowel, /əl/ after a consonant; won't is /wəʊnt/."

  - title: { en: "Future simple: use" }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: Decision at the moment of speaking }, example: "It's cold. I'**ll close** the window." }
          - { level: A2, use: { en: Offers }, example: "I'**ll carry** your bag." }
          - { level: A2, use: { en: Promises }, example: "I **won't tell** anyone." }
          - { level: A2, use: { en: "Opinions and predictions (I think)" }, example: "I think she'**ll win**." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "**probably** goes after will and before won't:"
            ex: "It will **probably** rain. / It **probably** won't rain."
          - level: A2
            text:
              en: "Plans and arrangements take going to or the present continuous: see [Future forms](id:en.tenses.future-forms)."

  - title: { en: "Compare: past, present and future" }
    content:
      - type: table
        columns:
          - { key: past, label: { en: Past simple } }
          - { key: present, label: { en: Present simple } }
          - { key: future, label: { en: Future simple } }
        rows:
          - { level: A2, past: "did", present: "do / does", future: "will" }
          - { level: A2, past: "yesterday, last week, ago", present: "every day, usually, on Mondays", future: "tomorrow, next week, soon" }
          - { level: A2, past: { ex: "I **worked** yesterday." }, present: { ex: "I **work** every day." }, future: { ex: "I'**ll work** tomorrow." } }
          - { level: A2, past: { ex: "**Did** she **call**?" }, present: { ex: "**Does** she **call**?" }, future: { ex: "**Will** she **call**?" } }
          - { level: A2, past: { ex: "He **didn't** come." }, present: { ex: "He **doesn't** come." }, future: { ex: "He **won't** come." } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A1, wrong: She work here., right: "She **works** here.", rule: { en: "he / she / it → V-s" } }
          - { level: A1, wrong: He doesn't works., right: "He doesn't **work**.", rule: { en: "helper + base verb" } }
          - { level: A1, wrong: Where you live?, right: "Where **do** you live?", rule: { en: "questions need a helper" } }
          - { level: A1, wrong: Did you went there?, right: "Did you **go** there?", rule: { en: "did + base verb" } }
          - { level: A1, wrong: She didn't called., right: "She didn't **call**.", rule: { en: "didn't + base verb" } }
          - { level: A1, wrong: I goed home., right: "I **went** home.", rule: { en: "go → went (irregular verb)" } }
          - { level: A1, wrong: Did he was late?, right: "**Was** he late?", rule: { en: "be makes questions by itself" } }
          - { level: A2, wrong: He will goes., right: "He will **go**.", rule: { en: "will + base verb" } }
          - { level: A2, wrong: Do you will come?, right: "**Will** you come?", rule: { en: "will makes questions by itself" } }
