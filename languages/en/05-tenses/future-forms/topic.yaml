# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.tenses.future-forms
lang: en
kind: grammar
tags: [verbs, tenses, future]
concepts: [future]
related: [en.tenses.continuous-tenses, en.tenses.simple-tenses, en.tenses.tense-map, en.sentence-building.conditionals-0-1-2]
status: { en: draft }

title: { en: Future Forms }
summary:
  lead: { en: "Plans, arrangements, decisions, offers and predictions with going to, the present continuous, will and the present simple." }
  rule: { en: "A plan made before speaking takes going to, a decision made while speaking takes will:" }
  ex: { examples: [[{ target: I'm going to }, " visit Ana."], [{ target: I'll }, " open the door."]] }

cheatsheet:
  content:
    - type: usage
      columns:
        - { key: point, label: { en: Point } }
        - { key: rule, label: { en: Rule } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A1, point: { pattern: [[{ alternatives: [am, is, are] }, " going to"], { slot: V }] }, rule: { en: "plans and intentions; predictions with evidence" }, ex: { examples: [[We', { target: re going to }, " visit Granada."], [Look at those clouds. It', { target: s going to }, " rain."]] } }
        - { level: A1, point: { pattern: [{ alternatives: [am, is, are] }, { slot: V-ing }] }, rule: { en: "present continuous: a fixed arrangement, with a future time" }, ex: [I', { target: m seeing }, " the dentist on ", { weekday: Friday, value: 5 }, "."] }
        - { level: A2, point: { pattern: [{ alternatives: [will, "'ll", "won't"] }, { slot: V }] }, rule: { en: "decisions now, offers, promises, opinions (I think)" }, ex: { examples: [[It's cold. I', { target: ll close }, " the window."], [I think she', { target: ll win }, "."]] } }
        - { level: A2, point: { alternatives: [V, V-s] }, rule: { en: "present simple: timetables" }, ex: ["The train ", { target: leaves }, " at ", { time: "6:15", value: "06:15" }, "."] }
        - { level: B1, point: { en: Prediction }, rule: { en: "opinion or guess (I think): will; evidence now: going to" }, ex: { examples: [[I think it', { target: ll }, " be a good year."], [Watch out! You', { target: re going to }, " fall."]] } }
        - { level: B1, point: { en: Arrangement or intention }, rule: { en: "fixed arrangement: present continuous; intention: going to" }, ex: { examples: [[I', { target: m meeting }, " Sam at 8."], [I', { target: m going to }, " learn Italian."]] } }
        - { level: A1, point: { en: Trap }, rule: { en: plans take going to }, ex: [I', { target: m going to buy }, " a car tomorrow."] }
        - { level: A2, point: { en: Trap }, rule: { en: will makes questions by itself }, ex: [{ target: Will }, " you come?"] }

sections:
  - title: { en: "Form: be going to" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: structure, label: { en: Structure } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, features: { polarity: pos, interrogativity: decl }, form: { en: Affirmative }, structure: { pattern: [{ alternatives: [am, is, are] }, going to, { slot: V }] }, ex: ["She ", { target: is going to }, " study."] }
          - { level: A1, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, structure: { pattern: [{ alternatives: [am, is, are] }, not, going to, { slot: V }] }, ex: ["We ", { target: aren't going to }, " wait."] }
          - { level: A1, features: { polarity: pos, interrogativity: int }, form: { en: Question }, structure: { pattern: [{ alternatives: [Am, Is, Are] }, { slot: subject }, going to, [{ slot: V }, "?"]] }, ex: [{ target: Are }, " you ", { target: going to }, " cook?"] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: going to }, " stays the same for every person; only ", { term: be }, " changes."]
          - type: rule
            level: A1
            text:
              en: ["After ", { term: to }, " the verb is in the base form:"]
            ex: ["I'm going to ", { target: eat }, "."]

  - title: { en: "Form: will" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: form, label: { en: Form } }
          - { key: structure, label: { en: Structure } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, features: { polarity: pos, interrogativity: decl }, form: { en: Affirmative }, structure: { pattern: [{ alternatives: [will, "'ll"] }, { slot: V }] }, ex: [I', { target: ll help }, " you."] }
          - { level: A2, features: { polarity: neg, interrogativity: decl }, form: { en: Negative }, structure: { pattern: [{ alternatives: [will not, won't] }, { slot: V }] }, ex: ["He ", { target: won't come }, "."] }
          - { level: A2, features: { polarity: pos, interrogativity: int }, form: { en: Question }, structure: { pattern: [Will, { slot: subject }, [{ slot: V }, "?"]] }, ex: [{ target: Will }, " you ", { target: call }, " me?"] }
          - { level: A2, features: { interrogativity: decl, polarity: [pos, neg] }, form: { en: Short answer }, structure: { alternatives: ["Yes, I will.", "No, I won't."] }, ex: { exchange: [[{ target: Will }, " she come?"], ["Yes, she ", { target: will }, "."]] } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: [{ term: will }, " is the same for every person and takes the base verb: she ", { term: will go }, "."]
          - type: rule
            level: A2
            text:
              en: ["Speech uses ", { term: "'ll" }, " (I'll, she'll) and ", { term: won't }, "."]

  - title: { en: "Pronunciation: gonna and 'll" }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: written, label: { en: Written } }
          - { key: sound, label: { en: Sound } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, written: going to, sound: { mapping: [{ ipa: ˈɡəʊɪŋ tə }, ["informal ", { ipa: ˈɡɒnə }]] }, ex: ["I'm ", { target: going to }, " call him."] }
          - { level: A2, written: "'ll", sound: [{ ipa: əl }, " after a consonant, ", { ipa: l }, " after a vowel"], ex: [She', { target: ll }, " call you."] }
          - { level: A2, written: won't, sound: { ipa: wəʊnt }, ex: ["It ", { target: won't }, " rain."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: gonna }, " is informal speech; writing and exams use ", { term: going to }, "."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, use: { en: "going to: plans and intentions" }, ex: [We', { target: re going to }, " visit Granada."] }
          - { level: A1, use: { en: "going to: prediction with evidence" }, ex: [Look at those clouds. It', { target: s going to }, " rain."] }
          - { level: A1, use: { en: "present continuous: fixed arrangements" }, ex: [I', { target: m seeing }, " the dentist on ", { weekday: Friday, value: 5 }, "."] }
          - { level: A2, use: { en: "will: decision at the moment of speaking" }, ex: [It's cold. I', { target: ll close }, " the window."] }
          - { level: A2, use: { en: "will: offers" }, ex: [I', { target: ll carry }, " your bag."] }
          - { level: A2, use: { en: "will: promises" }, ex: ["I ", { target: won't tell }, " anyone."] }
          - { level: A2, use: { en: "will: opinions and predictions (I think)" }, ex: [I think she', { target: ll }, " win."] }
          - { level: A2, use: { en: "present simple: timetables" }, ex: ["The train ", { target: leaves }, " at ", { time: "6:15", value: "06:15" }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: The present continuous needs a future time and a plan with a fixed person or place.
          - type: note
            level: A1
            text:
              en: ["See ", { link: Present continuous, to: en.tenses.continuous-tenses }, " and ", { link: Present simple, to: en.tenses.simple-tenses }, "."]

  - title: { en: Signal words }
    role: signals
    content:
      - type: usage
        columns:
          - { key: expression, label: { en: Expression } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, expression: { alternatives: [tomorrow, tonight] }, ex: ["We're ", { target: going to }, " cook ", { signal: tonight }, "."] }
          - { level: A1, expression: { alternatives: [next week, month, year] }, ex: ["I'm travelling ", { signal: next week }, "."] }
          - { level: A1, expression: { alternatives: [["on ", { weekday: Friday, value: 5 }], at the weekend] }, ex: ["She's leaving ", { signal: ["on ", { weekday: Friday, value: 5 }] }, "."] }
          - { level: A2, expression: { alternatives: [in two days, in a minute] }, ex: ["I'll call you ", { signal: in a minute }, "."] }
          - { level: A2, expression: { alternatives: [soon, later] }, ex: ["He'll be here ", { signal: soon }, "."] }
          - { level: A2, expression: { alternatives: [I think, probably] }, ex: ["It'll ", { signal: probably }, " rain."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: [{ term: probably }, " goes after ", { term: will }, " and before ", { term: won't }, ":"]
            ex: { examples: [["It will ", { target: probably }, " rain."], ["It ", { target: probably }, " won't rain."]] }

  - title: { en: "Compare: will and going to" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: will, label: will }
          - { key: going, label: going to }
        rows:
          - { level: A2, will: { en: decision made now }, going: { en: plan made before } }
          - { level: A2, will: [The phone is ringing. I', { target: ll answer }, " it."], going: [I', { target: m going to call }, " Tom tonight. I decided yesterday."] }
          - { level: B1, will: { en: opinion or guess (I think) }, going: { en: evidence now } }
          - { level: B1, will: [I think it', { target: ll }, " be a good year."], going: [Watch out! You', { target: re going to }, " fall."] }
      - type: list
        items:
          - type: rule
            level: B1
            text:
              en: ["A fixed arrangement takes the present continuous; an intention takes ", { term: going to }, ":"]
            ex: { examples: [[I', { target: m meeting }, " Sam at 8."], [I', { target: m going to }, " learn Italian."]] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A1, wrong: I buy a car tomorrow., right: [I', { target: m going to buy }, " a car tomorrow."], rule: { en: plans take going to } }
          - { level: A1, wrong: I'm going to to travel., right: ["I'm going to ", { target: travel }, "."], rule: { en: { pattern: [going to, { slot: base verb }] } } }
          - { level: A1, wrong: She is going to goes., right: ["She is going to ", { target: go }, "."], rule: { en: { pattern: [going to, { slot: base verb }] } } }
          - { level: A2, wrong: He will goes., right: ["He will ", { target: go }, "."], rule: { en: { pattern: [will, { slot: base verb }] } } }
          - { level: A2, wrong: Do you will come?, right: [{ target: Will }, " you come?"], rule: { en: will makes questions by itself } }
