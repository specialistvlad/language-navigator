# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.personal-pronouns
lang: en
kind: grammar
tags: [pronouns, subject, object, possessives]
concepts: [pronouns, possession]
related: [en.verbs.to-be, en.nouns-determiners.possessive-s, en.nouns-determiners.demonstratives-this-that, en.pronouns.indefinite-pronouns]
status: { en: draft }

title: { en: Personal Pronouns }
summary:
  lead: { en: "Subject, object and possessive forms of the personal pronouns: I, me, my, mine." }
  rule: { en: "English always states the subject, even with weather and time:" }
  ex: [{ target: It }, " is cold."]

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: subject, label: { en: Subject }, features: { case: nom } }
        - { key: object, label: { en: Object }, features: { case: acc } }
        - { key: det, label: { en: { pattern: [Possessive, { slot: noun }] } }, features: { case: gen, wordclass: det } }
        - { key: alone, label: { en: Possessive alone }, features: { case: gen, wordclass: pro } }
      rows:
        - { level: A1, features: { person: 1, number: sg }, subject: I, object: me, det: my, alone: mine }
        - { level: A1, features: { person: 2 }, subject: you, object: you, det: your, alone: yours }
        - { level: A1, features: { person: 3, number: sg, gender: masc }, subject: he, object: him, det: his, alone: his }
        - { level: A1, features: { person: 3, number: sg, gender: fem }, subject: she, object: her, det: her, alone: hers }
        - { level: A1, features: { person: 3, number: sg, gender: neut }, subject: it, object: it, det: its }
        - { level: A1, features: { person: 1, number: pl }, subject: we, object: us, det: our, alone: ours }
        - { level: A1, features: { person: 3, number: pl }, subject: they, object: them, det: their, alone: theirs }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: prose
        level: A1
        text:
          en: "Subject before the verb, object after it, possessive before a noun or alone:"
        ex: [{ target: We }, " like ", { target: them }, ". ", { target: Their }, " house is next to ", { target: ours }, "."]

  - title: { en: "Form: subject pronouns" }
    role: form
    content:
      - type: paradigm
        columns:
          - { key: pronoun, label: { en: Pronoun } }
          - { key: refers, label: { en: Refers to } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, features: { person: 1, number: sg }, pronoun: I, refers: { en: the speaker }, ex: [{ target: I }, "'m Tom."] }
          - { level: A0, features: { person: 2 }, pronoun: you, refers: { en: the listener or listeners }, ex: [{ target: You }, "'re late."] }
          - { level: A0, features: { person: 3, number: sg, gender: masc }, pronoun: he, refers: { en: a man or a boy }, ex: [{ target: He }, "'s my brother."] }
          - { level: A0, features: { person: 3, number: sg, gender: fem }, pronoun: she, refers: { en: a woman or a girl }, ex: [{ target: She }, "'s a teacher."] }
          - { level: A0, features: { person: 3, number: sg, gender: neut }, pronoun: it, refers: { en: a thing or an animal }, ex: [{ target: It }, "'s new."] }
          - { level: A0, features: { person: 1, number: pl }, pronoun: we, refers: { en: the speaker and others }, ex: [{ target: We }, "'re from Spain."] }
          - { level: A0, features: { person: 3, number: pl }, pronoun: they, refers: { en: people or things }, ex: [{ target: They }, "'re here."] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: I }, " is always a capital letter:"]
            ex: ["Tom and ", { target: I }, "."]
          - type: rule
            level: A0
            text:
              en: [{ term: you }, " is one word for one or many people, friends or strangers."]
          - type: rule
            level: A0
            text:
              en: [{ term: we }, " and ", { term: they }, " have no gender: ", { term: they }, " = men, women or things."]
          - type: rule
            level: A0
            text:
              en: ["Pets often take ", { term: he }, " or ", { term: she }, ":"]
            ex: ["Max is our dog. ", { target: He }, "'s two."]

  - title: { en: "Form: object pronouns" }
    role: form
    content:
      - type: prose
        level: A1
        text:
          en: The object pronoun goes after the verb or after a preposition.
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject }, features: { case: nom } }
          - { key: object, label: { en: Object }, features: { case: acc } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, subject: I, object: me, ex: ["Can you help ", { target: me }, "?"] }
          - { level: A1, features: { person: 2 }, subject: you, object: you, ex: ["I love ", { target: you }, "."] }
          - { level: A1, features: { person: 3, number: sg, gender: masc }, subject: he, object: him, ex: ["I know ", { target: him }, "."] }
          - { level: A1, features: { person: 3, number: sg, gender: fem }, subject: she, object: her, ex: ["Call ", { target: her }, " later."] }
          - { level: A1, features: { person: 3, number: sg, gender: neut }, subject: it, object: it, ex: ["I like ", { target: it }, "."] }
          - { level: A1, features: { person: 1, number: pl }, subject: we, object: us, ex: ["Come with ", { target: us }, "."] }
          - { level: A1, features: { person: 3, number: pl }, subject: they, object: them, ex: ["I see ", { target: them }, " every day."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "Short answers and answers with be take the object form:"
            ex: { exchange: [Who's there?, { alternatives: [["It's ", { target: me }, "."], [{ target: Me }, " too."]] }] }

  - title: { en: "Form: my, your, his…" }
    role: form
    content:
      - type: prose
        level: A0
        text:
          en: "my, your, his… go before a noun and show the owner."
      - type: paradigm
        columns:
          - { key: subject, label: { en: Subject }, features: { case: nom } }
          - { key: possessive, label: { en: Possessive }, features: { case: gen, wordclass: det } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, features: { person: 1, number: sg }, subject: I, possessive: my, ex: [{ target: My }, " name is Tom."] }
          - { level: A0, features: { person: 2 }, subject: you, possessive: your, ex: ["What's ", { target: your }, " name?"] }
          - { level: A0, features: { person: 3, number: sg, gender: masc }, subject: he, possessive: his, ex: [{ target: His }, " car is red."] }
          - { level: A0, features: { person: 3, number: sg, gender: fem }, subject: she, possessive: her, ex: [{ target: Her }, " car is blue."] }
          - { level: A0, features: { person: 3, number: sg, gender: neut }, subject: it, possessive: its, ex: ["The dog is in ", { target: its }, " bed."] }
          - { level: A0, features: { person: 1, number: pl }, subject: we, possessive: our, ex: [{ target: Our }, " flat is small."] }
          - { level: A0, features: { person: 3, number: pl }, subject: they, possessive: their, ex: [{ target: Their }, " children are at school."] }
      - type: list
        items:
          - type: rule
            level: A0
            text:
              en: [{ term: his }, " or ", { term: her }, " depends on the owner:"]
            ex: ["Tom and ", { target: his }, " sister, Ana and ", { target: her }, " brother."]
          - type: rule
            level: A0
            text:
              en: ["The possessive never changes for the thing: ", { term: my }, " book, ", { term: my }, " books."]
          - type: rule
            level: A0
            text:
              en: ["No article before it: ", { term: my }, " car."]
          - type: rule
            level: A0
            text:
              en: [{ term: its }, " has no apostrophe; ", { term: it's }, " = it is."]
          - type: rule
            level: A1
            text:
              en: "Body parts and clothes take a possessive:"
            ex: { examples: [["I wash ", { target: my }, " hands."], ["Take off ", { target: your }, " coat."]] }

  - title: { en: "Form: mine, yours, his…" }
    role: form
    content:
      - type: prose
        level: A1
        text:
          en: "mine, yours, his… stand alone, without a noun."
      - type: paradigm
        columns:
          - { key: possessive, label: { en: { pattern: [{ slot: noun }], follows: true } }, features: { case: gen, wordclass: det } }
          - { key: alone, label: { en: Alone }, features: { case: gen, wordclass: pro } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A1, features: { person: 1, number: sg }, possessive: my, alone: mine, ex: ["This bag is ", { target: mine }, "."] }
          - { level: A1, features: { person: 2 }, possessive: your, alone: yours, ex: ["Is this ", { target: yours }, "?"] }
          - { level: A1, features: { person: 3, number: sg, gender: masc }, possessive: his, alone: his, ex: ["The red car is ", { target: his }, "."] }
          - { level: A1, features: { person: 3, number: sg, gender: fem }, possessive: her, alone: hers, ex: ["The blue one is ", { target: hers }, "."] }
          - { level: A1, features: { person: 1, number: pl }, possessive: our, alone: ours, ex: ["This table is ", { target: ours }, "."] }
          - { level: A1, features: { person: 3, number: pl }, possessive: their, alone: theirs, ex: ["The house is ", { target: theirs }, "."] }
      - type: list
        items:
          - type: rule
            level: A1
            text:
              en: "No noun after it and no article before it:"
            ex: ["It's ", { target: mine }, "."]
          - type: rule
            level: A1
            text:
              en: "No apostrophe: yours, hers, ours, theirs."
          - type: rule
            level: A1
            text:
              en: [{ term: a friend of mine }, " = one of my friends:"]
            ex: ["Ana is ", { target: a friend of mine }, "."]

  - title: { en: "It for weather, time and distance" }
    role: own
    content:
      - type: prose
        level: A0
        text:
          en: ["Weather, time and distance have no real subject. ", { term: it }, " fills the place."]
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A0, use: { en: Weather }, ex: [{ target: It }, "'s cold today."] }
          - { level: A0, use: { en: Time }, ex: [{ target: It }, "'s five o'clock."] }
          - { level: A0, use: { en: Days and dates }, ex: [{ target: It }, "'s ", { weekday: Monday, value: 1 }, "."] }
          - { level: A1, use: { en: Distance }, ex: [{ target: It }, "'s two kilometres to the station."] }
          - { level: A1, use: { en: { pattern: [it, be, { slot: adjective }, to, { slot: V }] } }, ex: [{ target: It }, "'s easy to cook pasta."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A0, wrong: The dog wants it's food., right: ["The dog wants ", { target: its }, " food."], rule: { en: its = possessive; it's = it is } }
          - { level: A1, wrong: I know he., right: ["I know ", { target: him }, "."], rule: { en: "after the verb: object form" } }
          - { level: A1, wrong: The bag is my., right: ["The bag is ", { target: mine }, "."], rule: { en: { takes: [no noun after it, mine] } } }
          - { level: A1, wrong: Is this your's?, right: ["Is this ", { target: yours }, "?"], rule: { en: no apostrophe } }
