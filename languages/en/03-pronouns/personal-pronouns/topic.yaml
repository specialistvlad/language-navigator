# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.personal-pronouns
lang: en
kind: grammar
tags: [pronouns, subject, object, possessives]
concepts: [pronouns, possession]
related: [en.verbs.to-be, en.nouns-determiners.possessive-s, en.nouns-determiners.demonstratives-this-that, en.pronouns.indefinite-pronouns]
status: { en: draft }

title: { en: Personal Pronouns }
summary:
  en: "Subject, object and possessive forms of the personal pronouns: I, me, my, mine. English always states the subject, even with weather and time: **It** is cold."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: subject, label: { en: Subject } }
        - { key: object, label: { en: Object } }
        - { key: det, label: { en: Possessive + noun } }
        - { key: alone, label: { en: Possessive alone } }
      rows:
        - { level: A1, subject: I, object: me, det: my, alone: mine }
        - { level: A1, subject: you, object: you, det: your, alone: yours }
        - { level: A1, subject: he, object: him, det: his, alone: his }
        - { level: A1, subject: she, object: her, det: her, alone: hers }
        - { level: A1, subject: it, object: it, det: its, alone: "—" }
        - { level: A1, subject: we, object: us, det: our, alone: ours }
        - { level: A1, subject: they, object: them, det: their, alone: theirs }

sections:
  - title: { en: Overview }
    content:
      - type: text
        level: A1
        text:
          en: "Subject before the verb, object after it, possessive before a noun or alone:"
        ex: "**We** like **them**. **Their** house is next to **ours**."

  - title: { en: "Form: subject pronouns" }
    content:
      - type: table
        columns:
          - { key: pronoun, label: { en: Pronoun } }
          - { key: refers, label: { en: Refers to } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, pronoun: I, refers: { en: the speaker }, example: "**I**'m Tom." }
          - { level: A0, pronoun: you, refers: { en: the listener or listeners }, example: "**You**'re late." }
          - { level: A0, pronoun: he, refers: { en: a man or a boy }, example: "**He**'s my brother." }
          - { level: A0, pronoun: she, refers: { en: a woman or a girl }, example: "**She**'s a teacher." }
          - { level: A0, pronoun: it, refers: { en: a thing or an animal }, example: "**It**'s new." }
          - { level: A0, pronoun: we, refers: { en: the speaker and others }, example: "**We**'re from Spain." }
          - { level: A0, pronoun: they, refers: { en: people or things }, example: "**They**'re here." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "**I** is always a capital letter: Tom and **I**."
          - level: A0
            text:
              en: "**you** is one word for one or many people, friends or strangers."
          - level: A0
            text:
              en: "**we** and **they** have no gender: **they** = men, women or things."
          - level: A0
            text:
              en: "Pets often take **he** or **she**: Max is our dog. **He**'s two."

  - title: { en: "Form: object pronouns" }
    content:
      - type: text
        level: A1
        text:
          en: "The object pronoun goes after the verb or after a preposition."
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: object, label: { en: Object } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, subject: I, object: me, example: "Can you help **me**?" }
          - { level: A1, subject: you, object: you, example: "I love **you**." }
          - { level: A1, subject: he, object: him, example: "I know **him**." }
          - { level: A1, subject: she, object: her, example: "Call **her** later." }
          - { level: A1, subject: it, object: it, example: "I like **it**." }
          - { level: A1, subject: we, object: us, example: "Come with **us**." }
          - { level: A1, subject: they, object: them, example: "I see **them** every day." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "Short answers and answers with be take the object form: Who's there? — It's **me**. / **Me** too."

  - title: { en: "Form: my, your, his…" }
    content:
      - type: text
        level: A0
        text:
          en: "my, your, his… go before a noun and show the owner."
      - type: table
        columns:
          - { key: subject, label: { en: Subject } }
          - { key: possessive, label: { en: Possessive } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, subject: I, possessive: my, example: "**My** name is Tom." }
          - { level: A0, subject: you, possessive: your, example: "What's **your** name?" }
          - { level: A0, subject: he, possessive: his, example: "**His** car is red." }
          - { level: A0, subject: she, possessive: her, example: "**Her** car is blue." }
          - { level: A0, subject: it, possessive: its, example: "The dog is in **its** bed." }
          - { level: A0, subject: we, possessive: our, example: "**Our** flat is small." }
          - { level: A0, subject: they, possessive: their, example: "**Their** children are at school." }
      - type: bullets
        items:
          - level: A0
            text:
              en: "**his** or **her** depends on the owner: Tom and **his** sister, Ana and **her** brother."
          - level: A0
            text:
              en: "The possessive never changes for the thing: **my** book, **my** books."
          - level: A0
            text:
              en: "No article before it: **my** car."
          - level: A0
            text:
              en: "**its** has no apostrophe; **it's** = it is."
          - level: A1
            text:
              en: "Body parts and clothes take a possessive:"
            ex: "I wash **my** hands. / Take off **your** coat."

  - title: { en: "Form: mine, yours, his…" }
    content:
      - type: text
        level: A1
        text:
          en: "mine, yours, his… stand alone, without a noun."
      - type: table
        columns:
          - { key: possessive, label: { en: + noun } }
          - { key: alone, label: { en: Alone } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A1, possessive: my, alone: mine, example: "This bag is **mine**." }
          - { level: A1, possessive: your, alone: yours, example: "Is this **yours**?" }
          - { level: A1, possessive: his, alone: his, example: "The red car is **his**." }
          - { level: A1, possessive: her, alone: hers, example: "The blue one is **hers**." }
          - { level: A1, possessive: our, alone: ours, example: "This table is **ours**." }
          - { level: A1, possessive: their, alone: theirs, example: "The house is **theirs**." }
      - type: bullets
        items:
          - level: A1
            text:
              en: "No noun after it and no article before it: It's **mine**."
          - level: A1
            text:
              en: "No apostrophe: yours, hers, ours, theirs."
          - level: A1
            text:
              en: "**a friend of mine** = one of my friends:"
            ex: "Ana is **a friend of mine**."

  - title: { en: "It for weather, time and distance" }
    content:
      - type: text
        level: A0
        text:
          en: "Weather, time and distance have no real subject. **it** fills the place."
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A0, use: { en: Weather }, example: "**It**'s cold today." }
          - { level: A0, use: { en: Time }, example: "**It**'s five o'clock." }
          - { level: A0, use: { en: Days and dates }, example: "**It**'s Monday." }
          - { level: A1, use: { en: Distance }, example: "**It**'s two kilometres to the station." }
          - { level: A1, use: { en: "it + be + adjective + to + V" }, example: "**It**'s easy to cook pasta." }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A0, wrong: The dog wants it's food., right: "The dog wants **its** food.", rule: { en: "its = possessive; it's = it is" } }
          - { level: A1, wrong: I know he., right: "I know **him**.", rule: { en: "after the verb: object form" } }
          - { level: A1, wrong: The bag is my., right: "The bag is **mine**.", rule: { en: "no noun after it → mine" } }
          - { level: A1, wrong: Is this your's?, right: "Is this **yours**?", rule: { en: "no apostrophe" } }
