# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.reflexive-pronouns
lang: en
kind: grammar
tags: [pronouns, reflexive, myself, each other]
concepts: [reflexive, pronouns]
related: [en.pronouns.personal-pronouns, en.pronouns.indefinite-pronouns, en.verbs.phrasal-verbs-core, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Reflexive Pronouns }
summary:
  lead: { en: "Reflexive pronouns (myself, yourself, themselves) show that the subject and the object are the same person." }
  rule: { en: "Routine verbs such as get up and get dressed take no reflexive:" }
  ex: ["I ", { target: get up }, ", I ", { target: get dressed }, "."]

cheatsheet:
  content:
    - type: paradigm
      columns:
        - { key: subject, label: { en: Subject } }
        - { key: reflexive, label: { en: Reflexive } }
        - { key: ex, label: { en: Example } }
      rows:
        - { level: A2, features: { person: 1, number: sg }, subject: I, reflexive: myself, ex: ["I cut ", { target: myself }, "."] }
        - { level: A2, features: { person: 2 }, subject: you, reflexive: { alternatives: [yourself, yourselves] }, ex: { examples: [["Help ", { target: yourself }, "."], ["Help ", { target: yourselves }, "."]] } }
        - { level: A2, features: { person: 3, number: sg, gender: masc }, subject: he, reflexive: himself, ex: ["He hurt ", { target: himself }, "."] }
        - { level: A2, features: { person: 3, number: sg, gender: fem }, subject: she, reflexive: herself, ex: ["She taught ", { target: herself }, " French."] }
        - { level: A2, features: { person: 3, number: sg, gender: neut }, subject: it, reflexive: itself, ex: ["The door closes by ", { target: itself }, "."] }
        - { level: A2, features: { person: 1, number: pl }, subject: we, reflexive: ourselves, ex: ["We enjoyed ", { target: ourselves }, "."] }
        - { level: A2, features: { person: 3, number: pl }, subject: they, reflexive: themselves, ex: ["They looked at ", { target: themselves }, " in the mirror."] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["Singular forms end in ", { term: "-self" }, "; plural forms end in ", { term: "-selves" }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: you }, " has two forms: ", { term: yourself }, " for one person, ", { term: yourselves }, " for several."]
          - type: rule
            level: A2
            text:
              en: ["The stress falls on -self: myself ", { ipa: maɪˈself }, ", themselves ", { ipa: ðəmˈselvz }, "."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, use: { en: object = subject }, ex: ["I burnt ", { target: myself }, " in the kitchen."] }
          - { level: A2, use: { en: "after a preposition, same person" }, ex: ["She talks to ", { target: herself }, "."] }
          - { level: A2, use: { en: "emphasis: that person and nobody else" }, ex: ["I made the cake ", { target: myself }, "."] }
          - { level: A2, use: { en: { pattern: [by, "reflexive = alone, without help"] } }, ex: ["He lives ", { target: by himself }, "."] }
          - { level: A2, use: { en: fixed expressions }, ex: { examples: [["Enjoy ", { target: yourselves }, "!"], ["Make ", { target: yourself }, " at home."]] } }

  - title: { en: "Everyday routines: the verb alone" }
    role: own
    content:
      - type: prose
        level: A2
        text:
          en: "These everyday verbs take no reflexive pronoun:"
      - type: usage
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, verb: { alternatives: [get up, wake up] }, ex: ["I ", { target: get up }, " at seven."] }
          - { level: A2, verb: have a shower, ex: ["He ", { target: has a shower }, " every morning."] }
          - { level: A2, verb: get dressed, ex: ["I ", { target: get dressed }, " quickly."] }
          - { level: A2, verb: sit down, ex: ["Please ", { target: sit down }, "."] }
          - { level: A2, verb: feel, ex: ["I ", { target: feel }, " tired."] }
          - { level: A2, verb: relax, ex: ["We ", { target: relax }, " at the weekend."] }
          - { level: A2, verb: remember, ex: ["I ", { target: remember }, " her."] }
          - { level: A2, verb: meet, ex: ["We ", { target: met }, " in ", { date: "2019", value: "2019" }, "."] }
          - { level: A2, verb: worry, ex: ["Don't ", { target: worry }, "."] }

  - title: { en: "Compare: themselves and each other" }
    role: compare
    content:
      - type: comparison
        columns:
          - { key: self, label: themselves }
          - { key: other, label: each other }
        rows:
          - { level: A2, self: { en: { takes: [each person, the same person] } }, other: { en: { takes: [each person, the other person] } } }
          - { level: A2, self: ["They looked at ", { target: themselves }, " in the mirror."], other: ["They looked at ", { target: each other }, "."] }
          - { level: A2, self: ["We blamed ", { target: ourselves }, "."], other: ["We blamed ", { target: each other }, "."] }

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: He hurt hisself., right: ["He hurt ", { target: himself }, "."], rule: { en: { pattern: [him, self] } } }
          - { level: A2, wrong: They enjoyed theirselves., right: ["They enjoyed ", { target: themselves }, "."], rule: { en: { pattern: [them, selves] } } }
          - { level: A2, wrong: "Help yourself, children!", right: ["Help ", { target: yourselves }, ", children!"], rule: { en: { takes: [several people, yourselves] } } }
