# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.reflexive-pronouns
lang: en
kind: grammar
tags: [pronouns, reflexive, myself, each other]
concepts: [reflexive, pronouns]
related: [en.pronouns.personal-pronouns, en.pronouns.indefinite-pronouns, en.verbs.phrasal-verbs-core, en.tenses.simple-tenses]
status: { en: draft }

title: { en: Reflexive Pronouns }
summary:
  en: "Reflexive pronouns (myself, yourself, themselves) show that the subject and the object are the same person. Routine verbs such as get up and get dressed take no reflexive: I **get up**, I **get dressed**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: subject, label: { en: Subject } }
        - { key: reflexive, label: { en: Reflexive } }
        - { key: example, label: { en: Example } }
      rows:
        - { level: A2, subject: I, reflexive: myself, example: "I cut **myself**." }
        - { level: A2, subject: you, reflexive: yourself / yourselves, example: "Help **yourself**. / Help **yourselves**." }
        - { level: A2, subject: he, reflexive: himself, example: "He hurt **himself**." }
        - { level: A2, subject: she, reflexive: herself, example: "She taught **herself** French." }
        - { level: A2, subject: it, reflexive: itself, example: "The door closes by **itself**." }
        - { level: A2, subject: we, reflexive: ourselves, example: "We enjoyed **ourselves**." }
        - { level: A2, subject: they, reflexive: themselves, example: "They looked at **themselves** in the mirror." }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A2
            text:
              en: "Singular forms end in **-self**; plural forms end in **-selves**."
          - level: A2
            text:
              en: "**you** has two forms: **yourself** for one person, **yourselves** for several."
          - level: A2
            text:
              en: "The stress falls on -self: myself /maɪˈself/, themselves /ðəmˈselvz/."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "object = subject" }, example: "I burnt **myself** in the kitchen." }
          - { level: A2, use: { en: "after a preposition, same person" }, example: "She talks to **herself**." }
          - { level: A2, use: { en: "emphasis: that person and nobody else" }, example: "I made the cake **myself**." }
          - { level: A2, use: { en: "by + reflexive = alone, without help" }, example: "He lives **by himself**." }
          - { level: A2, use: { en: "fixed expressions" }, example: "Enjoy **yourselves**! / Make **yourself** at home." }

  - title: { en: "Everyday routines: the verb alone" }
    content:
      - type: text
        level: A2
        text:
          en: "These everyday verbs take no reflexive pronoun:"
      - type: table
        columns:
          - { key: verb, label: { en: Verb } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, verb: get up / wake up, example: "I **get up** at seven." }
          - { level: A2, verb: have a shower, example: "He **has a shower** every morning." }
          - { level: A2, verb: get dressed, example: "I **get dressed** quickly." }
          - { level: A2, verb: sit down, example: "Please **sit down**." }
          - { level: A2, verb: feel, example: "I **feel** tired." }
          - { level: A2, verb: relax, example: "We **relax** at the weekend." }
          - { level: A2, verb: remember, example: "I **remember** her." }
          - { level: A2, verb: meet, example: "We **met** in 2019." }
          - { level: A2, verb: worry, example: "Don't **worry**." }

  - title: { en: "Compare: themselves and each other" }
    content:
      - type: table
        columns:
          - { key: self, label: themselves }
          - { key: other, label: each other }
        rows:
          - { level: A2, self: { en: "each person → the same person" }, other: { en: "each person → the other person" } }
          - { level: A2, self: { ex: "They looked at **themselves** in the mirror." }, other: { ex: "They looked at **each other**." } }
          - { level: A2, self: { ex: "We blamed **ourselves**." }, other: { ex: "We blamed **each other**." } }

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: He hurt hisself., right: "He hurt **himself**.", rule: { en: "him + self" } }
          - { level: A2, wrong: They enjoyed theirselves., right: "They enjoyed **themselves**.", rule: { en: "them + selves" } }
          - { level: A2, wrong: "Help yourself, children!", right: "Help **yourselves**, children!", rule: { en: "several people → yourselves" } }
