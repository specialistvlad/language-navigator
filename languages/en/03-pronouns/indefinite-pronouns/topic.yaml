# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.indefinite-pronouns
lang: en
kind: grammar
tags: [pronouns, indefinite, some, any, "no", every]
concepts: [indefinite-pronouns]
related: [en.nouns-determiners.quantifiers-some-any-much-many, en.pronouns.personal-pronouns]
status: { en: draft }

title: { en: Indefinite Pronouns }
summary:
  lead: { en: "Somebody, anything, nowhere and everyone name unknown or general people, things and places, in four families: some-, any-, no- and every-." }
  rule: { en: "English uses one negative word per clause:" }
  ex: { examples: [["I don't know ", { target: anything }], ["or I know ", { target: nothing }, "."]] }

cheatsheet:
  content:
    - type: comparison
      columns:
        - { key: start, label: { en: Start } }
        - { key: people, label: { en: People } }
        - { key: things, label: { en: Things } }
        - { key: places, label: { en: Places } }
      rows:
        - { level: A2, start: some-, people: { examples: [[{ target: some }, body], [{ target: some }, one]] }, things: [{ target: some }, thing], places: [{ target: some }, where] }
        - { level: A2, start: any-, people: { examples: [[{ target: any }, body], [{ target: any }, one]] }, things: [{ target: any }, thing], places: [{ target: any }, where] }
        - { level: A2, start: no-, people: { examples: [[{ target: "no" }, body], [{ target: "no" }, " one"]] }, things: [{ target: "no" }, thing], places: [{ target: "no" }, where] }
        - { level: A2, start: every-, people: { examples: [[{ target: every }, body], [{ target: every }, one]] }, things: [{ target: every }, thing], places: [{ target: every }, where] }

sections:
  - title: { en: Overview }
    role: overview
    content:
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: "-body and -one mean the same: somebody = someone."
          - type: rule
            level: A2
            text:
              en: [{ term: no one }, " is two words; the others are one word."]
          - type: note
            level: A2
            text:
              en: ["some-, any- and no- follow the rules of some, any and no: see ", { link: Quantifiers, to: en.nouns-determiners.quantifiers-some-any-much-many }, "."]

  - title: { en: "Form: verb and word order" }
    role: form
    content:
      - type: prose
        level: A2
        text:
          en: Indefinite pronouns take a singular verb.
      - type: usage
        columns:
          - { key: pronoun, label: { en: Pronoun } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, pronoun: everybody, ex: [{ target: Everybody is }, " here."] }
          - { level: A2, pronoun: somebody, ex: [{ target: Somebody wants }, " to see you."] }
          - { level: A2, pronoun: nothing, ex: [{ target: Nothing is }, " open on ", { weekday: Sundays, value: 7 }, "."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["To refer back to somebody, everyone…, use ", { alternatives: [{ term: they }, { term: them }, { term: their }] }, ":"]
            ex: ["Somebody left ", { target: their }, " bag."]
          - type: rule
            level: A2
            text:
              en: ["Adjectives and ", { term: else }, " go after: something ", { term: new }, ", somebody ", { term: else }, "."]

  - title: { en: Pronunciation }
    role: pronunciation
    content:
      - type: usage
        columns:
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Sound } }
        rows:
          - { level: A2, word: somebody, ipa: { ipa: ˈsʌmbədi } }
          - { level: A2, word: someone, ipa: { ipa: ˈsʌmwʌn } }
          - { level: A2, word: anything, ipa: { ipa: ˈeniθɪŋ } }
          - { level: A2, word: nobody, ipa: { ipa: ˈnəʊbədi } }
          - { level: A2, word: nothing, ipa: { ipa: ˈnʌθɪŋ } }
          - { level: A2, word: everywhere, ipa: { ipa: ˈevriweə } }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: The stress falls on the first syllable.
          - type: rule
            level: A2
            text:
              en: [{ term: any }, " is ", { ipa: ˈeni }, ", with the vowel of ", { term: bed }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: nothing }, " has ", { ipa: ʌ }, ", like ", { term: some }, "; ", { term: nobody }, " has ", { ipa: əʊ }, ", like ", { term: "no" }, "."]
          - type: rule
            level: A2
            text:
              en: [{ term: every }, " has two syllables: ", { ipa: ˈevri }, "."]

  - title: { en: Use }
    role: use
    content:
      - type: usage
        columns:
          - { key: use, label: { en: Use } }
          - { key: ex, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "affirmative: some-" }, ex: ["I saw ", { target: somebody }, " in the garden."] }
          - { level: A2, use: { en: "negative: not … any-" }, ex: ["I didn't see ", { target: anybody }, "."] }
          - { level: A2, use: { en: "question: any-" }, ex: ["Did ", { target: anyone }, " call?"] }
          - { level: A2, use: { en: "offer or request: some-" }, ex: ["Would you like ", { target: something }, " to drink?"] }
          - { level: A2, use: { en: { pattern: [no-, affirmative verb] } }, ex: ["I saw ", { target: nothing }, "."] }
          - { level: A2, use: { en: "one-word answer: no-" }, ex: { exchange: [What did you buy?, [{ target: Nothing }, "."]] } }
          - { level: A2, use: { en: every- = all }, ex: [{ target: Everything }, " is ready."] }
      - type: list
        items:
          - type: rule
            level: A2
            text:
              en: ["One negative word only: ", { term: ["not ", { gap: true }, " anybody"] }, " or ", { term: nobody }, "."]
          - type: rule
            level: A2
            text:
              en: ["A negative subject is ", { term: no- }, ", with an affirmative verb:"]
            ex: [{ target: Nobody }, " came."]

  - title: { en: Typical errors }
    role: errors
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Anybody came., right: [{ target: Nobody }, " came."], rule: { en: { takes: [negative subject, nobody] } } }
          - { level: A2, wrong: Everybody are here., right: ["Everybody ", { target: is }, " here."], rule: { en: singular verb } }
