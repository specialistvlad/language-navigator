# yaml-language-server: $schema=../../../schema/topic.schema.json
id: en.pronouns.indefinite-pronouns
lang: en
kind: grammar
tags: [pronouns, indefinite, some, any, no, every]
concepts: [indefinite-pronouns]
related: [en.nouns-determiners.quantifiers-some-any-much-many, en.pronouns.personal-pronouns]
status: { en: draft }

title: { en: Indefinite Pronouns }
summary:
  en: "Somebody, anything, nowhere and everyone name unknown or general people, things and places, in four families: some-, any-, no- and every-. English uses one negative word per clause: I don't know **anything**, or I know **nothing**."

cheatsheet:
  content:
    - type: table
      columns:
        - { key: start, label: { en: Start } }
        - { key: people, label: { en: People } }
        - { key: things, label: { en: Things } }
        - { key: places, label: { en: Places } }
      rows:
        - level: A2
          start: some-
          people: { ex: "**some**body / **some**one" }
          things: { ex: "**some**thing" }
          places: { ex: "**some**where" }
        - level: A2
          start: any-
          people: { ex: "**any**body / **any**one" }
          things: { ex: "**any**thing" }
          places: { ex: "**any**where" }
        - level: A2
          start: no-
          people: { ex: "**no**body / **no** one" }
          things: { ex: "**no**thing" }
          places: { ex: "**no**where" }
        - level: A2
          start: every-
          people: { ex: "**every**body / **every**one" }
          things: { ex: "**every**thing" }
          places: { ex: "**every**where" }

sections:
  - title: { en: Overview }
    content:
      - type: bullets
        items:
          - level: A2
            text:
              en: "-body and -one mean the same: somebody = someone."
          - level: A2
            text:
              en: "**no one** is two words; the others are one word."
          - level: A2
            text:
              en: "some-, any- and no- follow the rules of some, any and no: see [Quantifiers](id:en.nouns-determiners.quantifiers-some-any-much-many)."

  - title: { en: "Form: verb and word order" }
    content:
      - type: text
        level: A2
        text:
          en: "Indefinite pronouns take a singular verb."
      - type: table
        columns:
          - { key: pronoun, label: { en: Pronoun } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, pronoun: everybody, example: "**Everybody is** here." }
          - { level: A2, pronoun: somebody, example: "**Somebody wants** to see you." }
          - { level: A2, pronoun: nothing, example: "**Nothing is** open on Sundays." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "To refer back to somebody, everyone…, use **they / them / their**: Somebody left **their** bag."
          - level: A2
            text:
              en: "Adjectives and **else** go after: something **new**, somebody **else**."

  - title: { en: Pronunciation }
    content:
      - type: table
        columns:
          - { key: word, label: { en: Word } }
          - { key: ipa, label: { en: Sound } }
        rows:
          - { level: A2, word: somebody, ipa: /ˈsʌmbədi/ }
          - { level: A2, word: someone, ipa: /ˈsʌmwʌn/ }
          - { level: A2, word: anything, ipa: /ˈeniθɪŋ/ }
          - { level: A2, word: nobody, ipa: /ˈnəʊbədi/ }
          - { level: A2, word: nothing, ipa: /ˈnʌθɪŋ/ }
          - { level: A2, word: everywhere, ipa: /ˈevriweə/ }
      - type: bullets
        items:
          - level: A2
            text:
              en: "The stress falls on the first syllable."
          - level: A2
            text:
              en: "**any** is /ˈeni/, with the vowel of *bed*."
          - level: A2
            text:
              en: "**nothing** has /ʌ/, like *some*; **nobody** has /əʊ/, like *no*."
          - level: A2
            text:
              en: "**every** has two syllables: /ˈevri/."

  - title: { en: Use }
    content:
      - type: table
        columns:
          - { key: use, label: { en: Use } }
          - { key: example, label: { en: Example } }
        rows:
          - { level: A2, use: { en: "affirmative: some-" }, example: "I saw **somebody** in the garden." }
          - { level: A2, use: { en: "negative: not … any-" }, example: "I didn't see **anybody**." }
          - { level: A2, use: { en: "question: any-" }, example: "Did **anyone** call?" }
          - { level: A2, use: { en: "offer or request: some-" }, example: "Would you like **something** to drink?" }
          - { level: A2, use: { en: "no- + affirmative verb" }, example: "I saw **nothing**." }
          - { level: A2, use: { en: "one-word answer: no-" }, example: "What did you buy? — **Nothing**." }
          - { level: A2, use: { en: "every- = all" }, example: "**Everything** is ready." }
      - type: bullets
        items:
          - level: A2
            text:
              en: "One negative word only: **not … anybody** or **nobody**."
          - level: A2
            text:
              en: "A negative subject is **no-**, with an affirmative verb:"
            ex: "**Nobody** came."

  - title: { en: Typical errors }
    content:
      - type: errors
        rows:
          - { level: A2, wrong: Anybody came., right: "**Nobody** came.", rule: { en: "negative subject → nobody" } }
          - { level: A2, wrong: Everybody are here., right: "Everybody **is** here.", rule: { en: "singular verb" } }
