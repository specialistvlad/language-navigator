# yaml-language-server: $schema=schema/curriculum.schema.json
# Every planned topic of every language being learned, in study order.

languages:
  - code: en
    enabled: true
    slug: english
    name: { en: English }
    sections:
      - dir: 01-foundations
        title: { en: Foundations }
        topics:
          - { slug: alphabet-spelling }
          - { slug: pronunciation-ipa, title: { en: "Sounds and IPA" } }
          - { slug: numbers, title: { en: "Numbers" } }
          - { slug: days-months-dates }
          - { slug: telling-time }
      - dir: 02-nouns-determiners
        title: { en: Nouns and determiners }
        topics:
          - { slug: articles-a-an-the, title: { en: "Articles: a, an, the" } }
          - { slug: plurals }
          - { slug: countable-uncountable }
          - { slug: quantifiers-some-any-much-many }
          - { slug: demonstratives-this-that }
          - { slug: possessive-s }
      - dir: 03-pronouns
        title: { en: Pronouns }
        topics:
          - { slug: personal-pronouns }
          - { slug: indefinite-pronouns }
          - { slug: reflexive-pronouns }
      - dir: 04-verbs
        title: { en: Verbs }
        topics:
          - { slug: to-be, title: { en: "To be" } }
          - { slug: have-have-got }
          - { slug: there-is-are }
          - { slug: imperative }
          - { slug: irregular-verbs-table }
          - { slug: phrasal-verbs-core }
          - { slug: gerund-vs-infinitive }
      - dir: 05-tenses
        title: { en: Tenses }
        topics:
          - { slug: tense-map, title: { en: "Tense map" } }
          - { slug: simple-tenses, title: { en: "Simple Tenses" } }
          - { slug: continuous-tenses, title: { en: "Continuous Tenses" } }
          - { slug: perfect-tenses, title: { en: "Perfect Tenses" } }
          - { slug: future-forms }
          - { slug: used-to }
      - dir: 06-modals
        title: { en: Modal verbs }
        topics:
          - { slug: can-could }
          - { slug: must-have-to }
          - { slug: should }
          - { slug: may-might }
          - { slug: would }
      - dir: 07-sentence-building
        title: { en: Sentence building }
        topics:
          - { slug: word-order }
          - { slug: questions-negatives, title: { en: "Questions and negatives" } }
          - { slug: conjunctions-linkers }
          - { slug: conditionals-0-1-2 }
          - { slug: relative-clauses }
          - { slug: passive-voice }
          - { slug: reported-speech }
          - { slug: question-tags }
      - dir: 08-adjectives-adverbs
        title: { en: Adjectives and adverbs }
        topics:
          - { slug: adjective-order }
          - { slug: comparatives-superlatives }
          - { slug: adverbs-frequency-manner, title: { en: "Adverbs of frequency and manner" } }
          - { slug: too-enough-so-such }
      - dir: 09-prepositions
        title: { en: Prepositions }
        topics:
          - { slug: time-in-on-at }
          - { slug: place-movement }
